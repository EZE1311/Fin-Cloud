const fmt=(n,d=0)=>{if(n==null||isNaN(n))return"—";return new Intl.NumberFormat("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n)};
const fU=n=>{if(n==null||isNaN(n))return"—";const abs=Math.abs(n);const d=abs<0.01?6:abs<1?4:2;return`USD ${fmt(n,d)}`;};

/* ── SVG Charts ──────────────────────────── */
/* 3D Pie with labels near slices + leader lines */
function Pie3D({data,width=460,height=320}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0)return null;
  const cx=width/2,cy=140,rx=110,ry=60,depth=16;
  let cum=0;
  const slices=data.map(d=>{const pct=d.value/total;const s0=cum;cum+=pct;return{...d,pct,s0,s1:cum};});

  function ep(angle,eCy,r1,r2){return[cx+(r1||rx)*Math.cos(angle),eCy+(r2||ry)*Math.sin(angle)]}
  function slicePath(s0,s1,eCy){
    const a0=s0*2*Math.PI-Math.PI/2,a1=s1*2*Math.PI-Math.PI/2;
    const large=s1-s0>.5?1:0;
    const[x0,y0]=ep(a0,eCy);const[x1,y1]=ep(a1,eCy);
    return`M ${cx} ${eCy} L ${x0} ${y0} A ${rx} ${ry} 0 ${large} 1 ${x1} ${y1} Z`;
  }
  function sidePath(s0,s1){
    const a0=s0*2*Math.PI-Math.PI/2,a1=s1*2*Math.PI-Math.PI/2;
    const steps=Math.max(2,Math.ceil((a1-a0)/(Math.PI/20)));
    let d="";
    for(let i=0;i<=steps;i++){const a=a0+(a1-a0)*(i/steps);const[x,y]=ep(a,cy);d+=(i===0?"M":"L")+` ${x} ${y}`;}
    for(let i=steps;i>=0;i--){const a=a0+(a1-a0)*(i/steps);const[x,y]=ep(a,cy+depth);d+=`L ${x} ${y}`;}
    return d+"Z";
  }
  const sides=slices.filter(s=>{const a0=s.s0*2*Math.PI-Math.PI/2,a1=s.s1*2*Math.PI-Math.PI/2;return a1>0&&a0<Math.PI;}).map(s=>{
    const a0=Math.max(s.s0*2*Math.PI-Math.PI/2,0);const a1=Math.min(s.s1*2*Math.PI-Math.PI/2,Math.PI);
    return{...s,sa0:a0,sa1:a1};
  });

  /* Label positions — near each slice with leader line + collision avoidance */
  const rawLabels=slices.filter(s=>s.pct>=.02).map(s=>{
    const midAngle=(s.s0+s.s1)/2*2*Math.PI-Math.PI/2;
    const[ix,iy]=ep(midAngle,cy,rx*0.72,ry*0.72);
    const[ox,oy]=ep(midAngle,cy,rx+28,ry+28);
    const anchor=ox<cx?"end":"start";
    const lx=ox<cx?ox-4:ox+4;
    return{...s,ix,iy,ox,oy,lx,ly:oy,anchor,midAngle};
  });
  /* Push apart labels that overlap vertically (min 18px gap) */
  const labels=[...rawLabels].sort((a,b)=>a.ly-b.ly);
  for(let i=1;i<labels.length;i++){
    const prev=labels[i-1],cur=labels[i];
    if(Math.abs(cur.ly-prev.ly)<18&&Math.abs(cur.lx-prev.lx)<60){
      const mid=(prev.ly+cur.ly)/2;
      prev.ly=mid-9;prev.oy=mid-9;
      cur.ly=mid+9;cur.oy=mid+9;
    }
  }

  return <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{display:"block",margin:"0 auto"}}>
    {sides.map((s,i)=><path key={"s"+i} d={sidePath(s.sa0/(2*Math.PI)+.25,s.sa1/(2*Math.PI)+.25)} fill={s.color} opacity={.5}/>)}
    {slices.map((s,i)=><path key={"b"+i} d={slicePath(s.s0,s.s1,cy+depth)} fill={s.color} opacity={.25}/>)}
    {slices.map((s,i)=><path key={"t"+i} d={slicePath(s.s0,s.s1,cy)} fill={s.color} stroke="#0f1117" strokeWidth={.5}/>)}
    {/* Leader lines + labels */}
    {labels.map((l,i)=><g key={"l"+i}>
      <line x1={l.ix} y1={l.iy} x2={l.ox} y2={l.oy} stroke={l.color} strokeWidth={1} opacity={.6}/>
      <circle cx={l.ox} cy={l.oy} r={2} fill={l.color}/>
      <text x={l.lx} y={l.ly-6} textAnchor={l.anchor} fill="#e2e8f0" fontSize="11" fontWeight="700">{l.name}</text>
      <text x={l.lx} y={l.ly+7} textAnchor={l.anchor} fill="#94a3b8" fontSize="10" fontWeight="500">{(l.pct*100).toFixed(1)}%</text>
    </g>)}
  </svg>;
}

function HBarChart({data,height:h2=220}){
  const max=Math.max(...data.map(d=>d.value));
  const total=data.reduce((s,d)=>s+d.value,0);
  const barH=Math.min(28,h2/data.length-6);
  return(
    <svg width="100%" height={h2} viewBox={`0 0 440 ${h2}`} preserveAspectRatio="xMidYMid meet">
      {data.map((d,i)=>{
        const y=i*(barH+6)+4;const w=max>0?(d.value/max)*230:0;const pct=total>0?(d.value/total*100).toFixed(1):0;
        return <g key={i}>
          <text x={105} y={y+barH/2+4} textAnchor="end" fill="#e2e8f0" fontSize="12" fontWeight="600">{d.name}</text>
          <rect x={110} y={y} width={w} height={barH} rx={3} fill={d.color} opacity={.85}/>
          <text x={115+w} y={y+barH/2+4} fill="#94a3b8" fontSize="11" fontWeight="600">{pct}% · ${(d.value/1000).toFixed(0)}k</text>
        </g>;
      })}
    </svg>
  );
}

const SC_AUTO_COLORS=["#0ea5e9","#d946ef","#f43f5e","#14b8a6","#fb923c","#a3e635","#818cf8","#fbbf24","#2dd4bf","#c084fc"];

/* Traducciones de sector Yahoo → español */
const SECTOR_MAP={"Technology":"Tecnología","Energy":"Energía","Healthcare":"Salud","Financial Services":"Finanzas","Consumer Cyclical":"Consumo","Consumer Defensive":"Consumo","Communication Services":"Comunicación","Industrials":"Industrial","Basic Materials":"Materiales","Real Estate":"Real Estate","Utilities":"Servicios Públicos"};

/* Buscar sector + nombre de empresa de Yahoo Finance */
async function fetchProfileYahoo(symbol){
  const usaSym=d912Sym(symbol,D912_USA_ALIAS);
  /* Intentar múltiples variantes del símbolo: original, alias USA, y con sufijo .BA (BYMA) */
  const candidates=[usaSym];
  if(usaSym===symbol.toUpperCase()&&!usaSym.includes("."))candidates.push(usaSym+".BA");
  for(const sym of candidates){
    const url=`https://query1.finance.yahoo.com/v10/finance/quoteSummary/${encodeURIComponent(sym)}?modules=assetProfile,price`;
    try{
      let r;
      try{r=await fetch(url);}catch(e){r=await fetch(PROXY+encodeURIComponent(url));}
      if(!r||!r.ok)continue;
      const data=await r.json();
      const res=data?.quoteSummary?.result?.[0];
      if(!res)continue;
      const profile=res?.assetProfile;
      const price=res?.price;
      const sector=profile?.sector?SECTOR_MAP[profile.sector]||profile.sector:null;
      const name=price?.shortName||price?.longName||null;
      const country=profile?.country||null;
      if(sector||name)return{sector,name,country};
    }catch(e){}
  }
  return{sector:null,name:null,country:null};
}

/* Construir metadata para un ticker basándose en data912 membership + Yahoo sector */
function inferMeta(ticker,broker,mercado,d912Info){
  const tu=ticker.toUpperCase();
  /* Tipo y país desde data912 */
  let tipo="Acción",pais="USA";
  if(d912Info){
    if(d912Info.isBond){tipo="Bono";pais="Argentina";}
    else if(d912Info.isCedear){tipo="CEDEAR";pais=broker==="BM"?"Argentina":"USA";}
    else if(d912Info.isArgStock){tipo="Acción";pais="Argentina";}
    else if(d912Info.isUsaStock){tipo="Acción";pais="USA";}
  } else {
    /* Fallback por broker/mercado + Yahoo country */
    const cache=loadMetaCache();
    const yahooCountry=(cache[tu]?.country||"").toLowerCase();
    if(mercado==="BYMA"){
      pais="Argentina";
      /* Si Yahoo dice que es de Argentina → acción local, sino → CEDEAR */
      tipo=(yahooCountry.includes("argentin"))?"Acción":"CEDEAR";
    }
    else{pais="USA";tipo="Acción";}
  }
  return{tipo,pais};
}

/* ── Comisiones Bull Market — Active Trader Plus ── */
/* Calcula comisión total (broker + derecho mercado + IVA si aplica) sobre un monto */
function calcComision(monto, broker, tipo){
  if(broker!=="BM") return 0; /* CS u otros brokers USA: sin comisión */
  const IVA=1.21;
  /* Bonos, Letras, ONs → exentos de IVA */
  const exento=tipo==="Bono"||tipo==="Letra"||tipo==="ON";
  let comBroker, derechoMercado;
  if(tipo==="Bono"||tipo==="ON"){
    comBroker=0.0010; derechoMercado=0.0001; /* 0.10% + 0.01% */
  } else if(tipo==="Letra"){
    comBroker=0.0010; derechoMercado=0.00001; /* 0.10% + 0.001% */
  } else {
    /* Acciones, CEDEARs */
    comBroker=0.0010; derechoMercado=0.0008; /* 0.10% + 0.08% */
  }
  const subtotal=monto*(comBroker+derechoMercado);
  return exento?subtotal:subtotal*IVA;
}

/* ── Caución calculation (shared by Caucion tab + Resumen) ── */
const CAUCION_DER_MERCADO_DIARIO=0.00045/90;
const CAUCION_GTO_GTIA_DIARIO=0.00045/90;
const CAUCION_IVA=0.21;
const CAUCION_COM_TOMADORA_MENSUAL=0.005;
const CAUCION_COM_COLOCADORA_MENSUAL=0.00083;

function calcCaucion(m,tna,d,esColocadora){
  if(m<=0||d<=0)return null;
  const tasaDecimal=tna/100;
  const tasa=tasaDecimal*d/365;
  const interes=m*tasa;
  const montoFuturo=m+interes;
  const comMensual=esColocadora?CAUCION_COM_COLOCADORA_MENSUAL:CAUCION_COM_TOMADORA_MENSUAL;
  const comision=montoFuturo*comMensual*d/30;
  const derMercado=montoFuturo*CAUCION_DER_MERCADO_DIARIO*d;
  const gtoGtia=esColocadora?0:montoFuturo*CAUCION_GTO_GTIA_DIARIO*d;
  const gastos=comision+derMercado+gtoGtia;
  const iva=gastos*CAUCION_IVA;
  const totalGastos=gastos+iva;
  const hoy=new Date();const venc=new Date(hoy);venc.setDate(venc.getDate()+d);
  const fmtDate=dt=>`${String(dt.getDate()).padStart(2,"0")}/${String(dt.getMonth()+1).padStart(2,"0")}/${dt.getFullYear()}`;
  if(esColocadora){
    const montoCobrar=montoFuturo-totalGastos;
    const ganNeta=montoCobrar-m;
    const tasaNeta=m>0?(ganNeta/m)*(365/d)*100:0;
    const tePeriodo=m>0?(ganNeta/m)*100:0;
    return{monto:m,tna,dias:d,tasa:tasa*100,interes,montoFuturo,comision,derMercado,gtoGtia,gastos,iva,totalGastos,montoCobrar,ganNeta,tasaNeta,tePeriodo,fechaOp:fmtDate(hoy),fechaVenc:fmtDate(venc)};
  }else{
    const montoPagar=montoFuturo+totalGastos;
    const cft=m>0?(montoPagar-m)/m*(365/d)*100:0;
    const tePeriodo=m>0?((montoPagar-m)/m)*100:0;
    return{monto:m,tna,dias:d,tasa:tasa*100,interes,montoFuturo,comision,derMercado,gtoGtia,gastos,iva,totalGastos,montoPagar,costoNeto:-totalGastos,cft,tePeriodo,fechaOp:fmtDate(hoy),fechaVenc:fmtDate(venc)};
  }
}

/* Sector seed eliminado — sectores se obtienen dinámicamente via refreshMetaCache (Yahoo Finance) */
/* Si un ticker no tiene sector en cache, se muestra "Sin clasificar" hasta que Yahoo responda */

/* Actualizar cache de metadata con sectores y nombres (async, no bloquea render) */
async function refreshMetaCache(tickers,priceData){
  const cache=loadMetaCache();
  let updated=false;
  const promises=tickers.filter(t=>!cache[t]||!cache[t].sector).map(async t=>{
    const{sector,name,country}=await fetchProfileYahoo(t);
    if(sector||name){
      cache[t]={...cache[t]};
      if(sector)cache[t].sector=sector;
      if(name)cache[t].name=name;
      if(country)cache[t].country=country;
      updated=true;
    }
  });
  await Promise.allSettled(promises);
  if(updated)saveMetaCache(cache);
  return cache;
}

/* Calcula posiciones abiertas a partir de operaciones */
function calcPositions(ops){
  const map={};
  ops.forEach(op=>{
    const t=op.ticker;
    if(!map[t]) map[t]={ticker:t,cantCompra:0,costoTotal:0,cantVenta:0,mercado:op.mercado,broker:op.broker,moneda:op.moneda};
    /* Normalizar precio a USD para operaciones ARS */
    const precioUSD=op.moneda==="ARS"&&op.ccl>0?op.precio/op.ccl:op.precio;
    if(op.tipo==="COMPRA"){
      map[t].cantCompra+=op.cantidad;
      map[t].costoTotal+=op.cantidad*precioUSD;
    }else{
      map[t].cantVenta+=op.cantidad;
    }
  });
  return Object.values(map).filter(p=>(p.cantCompra-p.cantVenta)>0).map(p=>{
    const cantidad=p.cantCompra-p.cantVenta;
    const ppc=p.cantCompra>0?p.costoTotal/p.cantCompra:0;
    return{ticker:p.ticker,cantidad,ppc,mercado:p.mercado,broker:p.broker,moneda:p.moneda};
  });
}

/* Enriquece posiciones con metadata dinámica (tipo, país, sector) */
function applyMeta(positions,prices,metaCache){
  return positions.map(p=>{
    const cached=metaCache[p.ticker]||{};
    const d912=prices[p.ticker]?.d912||null;
    const inferred=inferMeta(p.ticker,p.broker,p.mercado,d912);
    return{...p,sector:cached.sector||"Sin clasificar",pais:cached.pais||inferred.pais,tipo:cached.tipo||inferred.tipo};
  });
}

/* data912.com — API gratuita de cotizaciones del mercado argentino (misma fuente que google-sheets-argento) */
/* Endpoints: /live/arg_stocks (acciones AR), /live/arg_cedears (CEDEARs), /live/usa_stocks (acciones USA) */
/* Campos: symbol, c (precio), pct_change (var%), v (volumen), px_bid, px_ask, q_bid, q_ask, q_op */
const DATA912_BASE="https://data912.com/live";

/* Excepciones: ticker interno → símbolo distinto en data912 USA (solo cuando difieren) */
const D912_USA_ALIAS={YPFD:"YPF"};
/* Resolver símbolo: usa el alias si existe, sino el ticker tal cual */
const d912Sym=(ticker,aliases={})=>aliases[ticker.toUpperCase()]||ticker.toUpperCase();

/* Proxy CORS para APIs que no permiten fetch directo del browser */
const PROXY="https://api.allorigins.win/raw?url=";

async function fetchMacroReal(){
  try{
    /* Dólares desde DolarAPI */
    const dolarRes=await fetch("https://dolarapi.com/v1/dolares");
    const dolares=await dolarRes.json();
    const findD=(casa)=>{const d=dolares.find(x=>x.casa===casa);return d?d.venta:0;};
    const oficial=findD("oficial");
    const mep=findD("bolsa");
    const ccl=findD("contadoconliqui");
    const blue=findD("blue");
    const tarjeta=findD("tarjeta");

    /* Riesgo país desde ArgentinaDatos */
    let riesgoPais=617;
    try{
      const rpRes=await fetch("https://api.argentinadatos.com/v1/finanzas/indices/riesgo-pais/ultimo");
      const rpData=await rpRes.json();
      riesgoPais=rpData.valor||rpData.value||617;
    }catch(e){}

    /* UVA desde ArgentinaDatos */
    let uva=1858.61;
    let uvaVar30d=0;
    try{
      const uvaRes=await fetch("https://api.argentinadatos.com/v1/finanzas/indices/uva");
      const uvaData=await uvaRes.json();
      if(Array.isArray(uvaData)&&uvaData.length>0){
        uva=uvaData[uvaData.length-1].valor||uva;
        /* Calcular variación 30 días */
        if(uvaData.length>=30){
          const uva30ago=uvaData[uvaData.length-31]?.valor||uvaData[uvaData.length-30]?.valor;
          if(uva30ago&&uva30ago>0) uvaVar30d=((uva-uva30ago)/uva30ago*100);
        }
      }
    }catch(e){}

    /* Inflación mensual desde ArgentinaDatos */
    let inflacion=0;
    try{
      const infRes=await fetch("https://api.argentinadatos.com/v1/finanzas/indices/inflacion");
      const infData=await infRes.json();
      if(Array.isArray(infData)&&infData.length>0) inflacion=infData[infData.length-1].valor||inflacion;
    }catch(e){}

    /* ── BCRA API — Tasa Política Monetaria, Inflación Interanual, Reservas ── */
    const BCRA_BASE="https://api.bcra.gob.ar/estadisticas/v3.0/monetarias";
    const hoy=new Date();
    const hace60=new Date(hoy);hace60.setDate(hoy.getDate()-60);
    const fmtD=(d)=>d.toISOString().split("T")[0];
    const bcraFetch=async(idVar)=>{
      try{
        const url=BCRA_BASE+"/"+idVar+"?desde="+fmtD(hace60)+"&hasta="+fmtD(hoy)+"&limit=100";
        /* Intentar directo primero, si falla CORS usar proxy */
        let r;
        try{r=await fetch(url);}catch(e){r=await fetch(PROXY+encodeURIComponent(url));}
        const j=await r.json();
        const arr=j.results||j.data||j;
        if(Array.isArray(arr)&&arr.length>0){const last=arr[arr.length-1];return last.v??last.valor??last.value??null;}
      }catch(e){}
      return null;
    };

    /* BCRA: Tasa PM (6), Inflación IA (28), Reservas (1) — en paralelo */
    let tasa=0,inflacionIA=0,reservas=0;
    try{
      const [vTasa,vIA,vRes]=await Promise.allSettled([bcraFetch(6),bcraFetch(28),bcraFetch(1)]);
      if(vTasa.status==="fulfilled"&&vTasa.value) tasa=vTasa.value;
      if(vIA.status==="fulfilled"&&vIA.value) inflacionIA=vIA.value;
      if(vRes.status==="fulfilled"&&vRes.value) reservas=Math.round(vRes.value);
    }catch(e){}

    /* Índices de mercado: S&P 500 y Merval (para contexto de movimientos) */
    let sp500Chg=0,mervalChg=0;
    try{
      const idxUrl=PROXY+encodeURIComponent("https://query1.finance.yahoo.com/v7/finance/quote?symbols=%5EGSPC,%5EMERV&fields=regularMarketChangePercent");
      const idxRes=await fetch(idxUrl);const idxData=await idxRes.json();
      (idxData.quoteResponse?.result||[]).forEach(q=>{
        if(q.symbol==="^GSPC")sp500Chg=q.regularMarketChangePercent||0;
        if(q.symbol==="^MERV")mervalChg=q.regularMarketChangePercent||0;
      });
    }catch(e){}

    return{dolarOficial:oficial||0,dolarMEP:mep||0,dolarCCL:ccl||0,dolarBlue:blue||0,dolarTarjeta:tarjeta||0,riesgoPais,inflacion,inflacionIA,tasa,uva,uvaVar30d,reservas,sp500Chg,mervalChg};
  }catch(e){
    console.warn("Macro API fallback:",e);
    return MACRO_FALLBACK;
  }
}

async function fetchPricesReal(tickers){
  try{
    /* Fetch data912 endpoints en paralelo: CEDEARs ARS + acciones ARG + acciones USA */
    const fetchD912=async(endpoint)=>{
      try{
        let r;
        try{r=await fetch(DATA912_BASE+"/"+endpoint);}catch(e){r=await fetch(PROXY+encodeURIComponent(DATA912_BASE+"/"+endpoint));}
        return await r.json();
      }catch(e){return[];}
    };
    const [cedears,argStocks,argBonds,usaStocks]=await Promise.all([
      fetchD912("arg_cedears"),
      fetchD912("arg_stocks"),
      fetchD912("arg_bonds"),
      fetchD912("usa_stocks")
    ]);

    /* Indexar por symbol para búsqueda rápida */
    const idxCedears={};cedears.forEach(x=>{if(x.symbol)idxCedears[x.symbol.toUpperCase()]=x;});
    const idxArg={};argStocks.forEach(x=>{if(x.symbol)idxArg[x.symbol.toUpperCase()]=x;});
    const idxBonds={};argBonds.forEach(x=>{if(x.symbol)idxBonds[x.symbol.toUpperCase()]=x;});
    const idxUsa={};usaStocks.forEach(x=>{if(x.symbol)idxUsa[x.symbol.toUpperCase()]=x;});

    const prices={};
    tickers.forEach(t=>{
      const tu=t.toUpperCase();
      /* Buscar dinámicamente en todos los endpoints de data912 */
      const inCedears=idxCedears[tu]||null;
      const inArg=idxArg[tu]||null;
      const inBonds=idxBonds[tu]||null;
      const usaSym=d912Sym(tu,D912_USA_ALIAS);
      const inUsa=idxUsa[usaSym]||idxUsa[tu]||null;

      /* Precio ARS: CEDEARs → acciones arg → bonos arg */
      const arsData=inCedears||inArg||inBonds;
      /* Precio USD: usa_stocks */
      const usdData=inUsa;

      const priceARS=arsData?arsData.c:null;
      const changeARS=arsData?arsData.pct_change:null;
      const priceUSD=usdData?usdData.c:null;
      const changeUSD=usdData?usdData.pct_change:null;

      if(priceARS||priceUSD){
        prices[t]={
          price:priceUSD||0,
          change:changeUSD||0,
          prev:priceUSD?(priceUSD/(1+(changeUSD||0)/100)):0,
          priceARS:priceARS||null,
          changeARS:changeARS??null,
          d912:{isCedear:!!inCedears,isArgStock:!!inArg,isBond:!!inBonds,isUsaStock:!!inUsa}
        };
      }
    });

    /* Yahoo Finance fallback para tickers no encontrados en data912 */
    const missing=tickers.filter(t=>!prices[t]);
    if(missing.length>0){
      try{
        const syms=missing.map(t=>d912Sym(t,D912_USA_ALIAS)).join(",");
        const yfUrl=PROXY+encodeURIComponent(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${syms}&fields=regularMarketPrice,regularMarketChangePercent,regularMarketPreviousClose`);
        const yfRes=await fetch(yfUrl);const yfData=await yfRes.json();
        (yfData.quoteResponse?.result||[]).forEach(q=>{
          const ticker=missing.find(t=>d912Sym(t,D912_USA_ALIAS)===q.symbol)||q.symbol;
          if(q.regularMarketPrice){
            /* Determinar si es acción arg basado en exchange/currency */
            const isArg=q.exchange==="BUE"||q.currency==="ARS"||(q.market||"").includes("ar_market");
            prices[ticker]={price:isArg?0:q.regularMarketPrice,change:isArg?0:(q.regularMarketChangePercent||0),prev:isArg?0:(q.regularMarketPreviousClose||0),priceARS:isArg?q.regularMarketPrice:null,changeARS:isArg?(q.regularMarketChangePercent||0):null,d912:{isCedear:false,isArgStock:isArg,isBond:false,isUsaStock:!isArg}};
          }
        });
      }catch(e){}
    }
    return prices;
  }catch(e){
    console.warn("data912 API fallback:",e);
    return null;
  }
}

/* ── KEYWORDS para detección de tickers en noticias ── */
/* 100% dinámico — genera keywords desde metaCache (nombre empresa via Yahoo) + alias conocidos */
function getTickerKW(ticker){
  const tu=ticker.toUpperCase();
  const kws=[tu];
  /* Alias USA (d912) */
  const alias=d912Sym(tu,D912_USA_ALIAS);
  if(alias!==tu)kws.push(alias);
  /* Nombre de empresa desde metaCache (populado por refreshMetaCache vía Yahoo Finance) */
  const cache=loadMetaCache();
  if(cache[tu]?.name){
    const name=cache[tu].name.toUpperCase();
    kws.push(name);
    /* Agregar primera palabra del nombre si es significativa (>3 chars) para match parcial */
    const firstWord=name.split(/[\s,\.]+/)[0];
    if(firstWord.length>3&&firstWord!==tu&&!kws.includes(firstWord))kws.push(firstWord);
  }
  /* Bonos AR — agregar keywords genéricos si parece bono */
  if(/^(AL|GD|AE|BA)\d{2}/.test(tu))kws.push("BONO SOBERANO","BONOS ARGENTINOS","DEUDA ARGENTINA");
  return kws;
}

/* Noticias — Bloomberg-style deep search across global + local portals */
async function fetchNewsReal(tickers){
  try{
    const R2J="https://api.rss2json.com/v1/api.json?rss_url=";
    const allNews=[];
    const seen=new Set();
    const posWords=["SUBE","CRECE","POSITIV","RÉCORD","AVANZ","GANA","SUPERA","BEAT","SURGE","RALLY","GAIN","PROFIT","RECORD","EXPAND","RISE","SOAR","UPGRADE"];
    const negWords=["BAJA","CAE","NEGATIV","PIERDE","CAÍDA","RECORT","PRESIÓN","LOSS","DROP","FALL","CUT","DECLINE","WARN","RISK","SLUMP","DOWN","CRASH","DOWNGRADE"];

    const addItem=(ticker,item,source)=>{
      /* Dedup: normalizar título (sin puntuación, espacios extra) para detectar duplicados */
      const norm=item.title.replace(/[^a-zA-Z0-9\s]/g,"").replace(/\s+/g," ").trim().toUpperCase().slice(0,60);
      if(seen.has(norm))return;seen.add(norm);
      const text=(item.title+" "+(item.description||"")).toUpperCase();
      let sentiment="neutral";
      if(posWords.some(w=>text.includes(w)))sentiment="positive";
      if(negWords.some(w=>text.includes(w)))sentiment=sentiment==="positive"?"positive":"negative";
      allNews.push({
        id:`${ticker}-${norm.slice(0,30)}-${allNews.length}`,ticker,title:item.title,source,
        sentiment,summary:item.description?item.description.replace(/<[^>]*>/g,"").slice(0,250):"",
        link:item.link,pubDate:item.pubDate
      });
    };

    /* ── 1) Feeds POR TICKER — noticias específicas de cada activo ── */
    const tickerFeeds=[];
    tickers.forEach(tk=>{
      const sym=d912Sym(tk,D912_USA_ALIAS);
      /* Yahoo Finance por ticker */
      tickerFeeds.push({tk,url:`https://feeds.finance.yahoo.com/rss/2.0/headline?s=${sym}&region=US&lang=en-US`,source:"Yahoo Finance"});
      /* Google News por ticker (busca nombre empresa o ticker) */
      const kws=getTickerKW(tk);
      const q=encodeURIComponent(kws[0]||tk);
      tickerFeeds.push({tk,url:`https://news.google.com/rss/search?q=${q}+stock&hl=en-US&gl=US&ceid=US:en`,source:"Google News"});
    });

    const tickerResults=await Promise.allSettled(tickerFeeds.map(async f=>{
      const res=await fetch(R2J+encodeURIComponent(f.url));
      return{...f,data:await res.json()};
    }));
    tickerResults.forEach(r=>{
      if(r.status!=="fulfilled"||!r.value.data?.items)return;
      const{tk,source,data}=r.value;
      data.items.slice(0,5).forEach(item=>addItem(tk,item,source));
    });

    /* ── 2) Feeds ARGENTINOS generales — para bonos, CEDEARs arg, mercado local ── */
    const argFeeds=[
      {url:"https://www.ambito.com/rss/economia.xml",source:"Ámbito"},
      {url:"https://www.cronista.com/files/rss/news.xml",source:"Cronista"},
      {url:"https://www.iprofesional.com/rss/finanzas",source:"iProfesional"},
    ];
    const argResults=await Promise.allSettled(argFeeds.map(async f=>{
      const res=await fetch(R2J+encodeURIComponent(f.url));
      return{...f,data:await res.json()};
    }));
    argResults.forEach(r=>{
      if(r.status!=="fulfilled"||!r.value.data?.items)return;
      const{source,data}=r.value;
      data.items.forEach(item=>{
        const text=(item.title+" "+(item.description||"")).toUpperCase();
        let matched=null;
        for(const tk of tickers){
          const kws=getTickerKW(tk);
          if(kws.some(kw=>{const esc=kw.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return new RegExp("\\b"+esc+"\\b").test(text);})){matched=tk;break;}
        }
        if(matched)addItem(matched,item,source);
      });
    });

    /* ── 3) Si no hay nada, noticias generales de mercado ── */
    if(allNews.length===0){
      const genFeeds=[{url:"https://feeds.reuters.com/reuters/businessNews",source:"Reuters"},{url:"https://www.cnbc.com/id/100003114/device/rss/rss.html",source:"CNBC"}];
      const genResults=await Promise.allSettled(genFeeds.map(async f=>{
        const res=await fetch(R2J+encodeURIComponent(f.url));
        return{...f,data:await res.json()};
      }));
      genResults.forEach(r=>{
        if(r.status!=="fulfilled"||!r.value.data?.items)return;
        r.value.data.items.slice(0,5).forEach(item=>addItem("MERCADO",item,r.value.source));
      });
    }

    allNews.sort((a,b)=>new Date(b.pubDate||0)-new Date(a.pubDate||0));
    return allNews.length>0?allNews.slice(0,40):null;
  }catch(e){
    console.warn("News fetch error:",e);
    return null;
  }
}

function timeAgo(dateStr){
  if(!dateStr)return"";
  const d=new Date(dateStr);const now=new Date();const mins=Math.floor((now-d)/60000);
  if(mins<1)return"ahora";if(mins<60)return`${mins} min`;
  const hrs=Math.floor(mins/60);if(hrs<24)return`${hrs} hs`;
  return`${Math.floor(hrs/24)} días`;
}

/* IOL error state — visible to UI */
window._iolLastError=null;

/* ── CORS proxy helpers ── */
const CORS_PROXIES=[
  url=>"https://corsproxy.io/?url="+encodeURIComponent(url),
  url=>"https://api.allorigins.win/raw?url="+encodeURIComponent(url),
];
/* Smart fetch: intenta directo, si CORS falla reintenta con proxy */
async function iolFetch(url,opts={}){
  /* Intento directo */
  try{
    const res=await fetch(url,opts);
    return res;
  }catch(e){
    console.log("[IOL] Directo falló (CORS), probando proxies...",e.message);
  }
  /* Intentar con cada proxy */
  for(const mkProxy of CORS_PROXIES){
    const proxyUrl=mkProxy(url);
    try{
      console.log("[IOL] Proxy →",proxyUrl.substring(0,80)+"...");
      const res=await fetch(proxyUrl,{
        ...opts,
        headers:{...(opts.headers||{}),"x-requested-with":"XMLHttpRequest"}
      });
      if(res.ok||res.status===400||res.status===401){
        console.log("[IOL] Proxy OK, status:",res.status);
        return res;
      }
    }catch(e2){
      console.log("[IOL] Proxy falló:",e2.message);
    }
  }
  return null;
}

async function iolGetToken(){
  const creds=loadLS("iol_creds",null);
  if(!creds||!creds.user||!creds.pass){
    window._iolLastError="Sin credenciales configuradas";
    return null;
  }
  /* Check cached token */
  const cached=loadLS("iol_token",null);
  if(cached&&cached.access_token&&cached.expires_at>Date.now()+60000){
    return cached.access_token;
  }
  const tokenUrl="https://api.invertironline.com/token";
  /* Try refresh token first */
  if(cached&&cached.refresh_token){
    console.log("[IOL] Refreshing token...");
    const res=await iolFetch(tokenUrl,{
      method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:`grant_type=refresh_token&refresh_token=${encodeURIComponent(cached.refresh_token)}`
    });
    if(res&&res.ok){
      try{
        const d=await res.json();
        const tokenData={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||900)*1000};
        saveLS("iol_token",tokenData);
        console.log("[IOL] Token refreshed OK");
        window._iolLastError=null;
        return d.access_token;
      }catch(e){console.log("[IOL] Error parsing refresh response")}
    }
  }
  /* Fresh login */
  console.log("[IOL] Fresh login...");
  const res=await iolFetch(tokenUrl,{
    method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:`username=${encodeURIComponent(creds.user)}&password=${encodeURIComponent(creds.pass)}&grant_type=password`
  });
  if(!res){
    window._iolLastError="No se pudo conectar a IOL (CORS + proxies fallaron)";
    return null;
  }
  if(!res.ok){
    let errDetail="";try{errDetail=await res.text()}catch(x){}
    console.error("[IOL] Login failed:",res.status,errDetail);
    window._iolLastError=res.status===400||res.status===401
      ?"Credenciales inválidas o API no activada"
      :`Error ${res.status}`;
    return null;
  }
  try{
    const d=await res.json();
    const tokenData={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||900)*1000};
    saveLS("iol_token",tokenData);
    console.log("[IOL] Login OK, token válido por",d.expires_in,"s");
    window._iolLastError=null;
    return d.access_token;
  }catch(e){
    window._iolLastError="Error parseando respuesta de login";
    return null;
  }
}

async function iolFetchCaucionRate(){
  const token=await iolGetToken();
  if(!token){
    console.log("[IOL] No token, abortando fetch de caución");
    return null;
  }
  const base="https://api.invertironline.com/api/v2";
  const hdrs={"Authorization":"Bearer "+token};

  /* Helper: intenta un endpoint vía iolFetch (con fallback proxy) */
  async function tryEndpoint(url,label){
    console.log("[IOL]",label,"→",url);
    const res=await iolFetch(url,{headers:hdrs});
    if(!res){console.log("[IOL]",label,"→ sin respuesta");return null;}
    console.log("[IOL]",label,"status:",res.status);
    if(!res.ok){
      let body="";try{body=await res.text()}catch(x){}
      console.log("[IOL]",label,"error:",body.substring(0,200));
      return null;
    }
    try{
      const d=await res.json();
      console.log("[IOL]",label,"OK:",JSON.stringify(d).substring(0,500));
      return d;
    }catch(e){
      console.log("[IOL]",label,"JSON parse error");
      return null;
    }
  }

  /* ── Helper: classify titulo by moneda and plazo ── */
  function classifyTitulo(t,forceMoneda){
    const s=((t.simbolo||"")+" "+(t.descripcion||"")).toLowerCase();
    const isDollar=forceMoneda==="USD"||s.includes("dólar")||s.includes("dolar")||s.includes("usd")||s.includes("dollar");
    const moneda=isDollar?"USD":(forceMoneda||"ARS");
    /* Parse plazo: T0=1, T1=2, T2=3 or number from text/fields */
    let plazo=null;
    const rawPlazo=t.plazo||t.dias||t.duracion||null;
    if(typeof rawPlazo==="number"&&rawPlazo>0)plazo=rawPlazo;
    else if(typeof rawPlazo==="string"){
      const tMatch=rawPlazo.match(/^T(\d+)$/i);
      if(tMatch)plazo=parseInt(tMatch[1])+1; /* T0=1day, T1=2days */
      else{const n=parseInt(rawPlazo);if(n>0)plazo=n;}
    }
    if(!plazo){
      if(s.match(/30\s*d/i))plazo=30;
      else if(s.match(/7\s*d/i))plazo=7;
      else if(s.match(/1\s*d/i))plazo=1;
    }
    const tna=t.ultimoPrecio||t.puntas?.precioCompra||0;
    return{moneda,plazo,tna,sym:t.simbolo};
  }

  /* ── Helper: assign classified titulos to result slots ── */
  function assignRates(classified,result){
    for(const c of classified){
      if(c.tna<=0)continue;
      if(c.moneda==="ARS"&&c.plazo!=null&&c.plazo<=7&&result.pesos1d==null)result.pesos1d=c.tna;
      if(c.moneda==="ARS"&&c.plazo!=null&&c.plazo>=28&&c.plazo<=35&&result.pesos30d==null)result.pesos30d=c.tna;
      if(c.moneda==="USD"&&c.plazo!=null&&c.plazo<=7&&result.usd1d==null)result.usd1d=c.tna;
      if(c.moneda==="USD"&&c.plazo!=null&&c.plazo>=28&&c.plazo<=35&&result.usd30d==null)result.usd30d=c.tna;
    }
    /* Fallback: if exactly 1 ARS with no plazo, assume 1D */
    const arsNoplazo=classified.filter(c=>c.moneda==="ARS"&&c.tna>0&&c.plazo==null);
    if(result.pesos1d==null&&arsNoplazo.length===1)result.pesos1d=arsNoplazo[0].tna;
    const usdNoplazo=classified.filter(c=>c.moneda==="USD"&&c.tna>0&&c.plazo==null);
    if(result.usd1d==null&&usdNoplazo.length===1)result.usd1d=usdNoplazo[0].tna;
  }

  /* ── Helper: fetch and classify a panel ── */
  async function fetchPanel(panel,label,forceMoneda){
    const d=await tryEndpoint(base+"/Cotizaciones/cauciones/argentina/"+panel,label);
    if(!d)return[];
    const titulos=d.titulos||d;
    if(!Array.isArray(titulos)||titulos.length===0)return[];
    console.log("[IOL] "+label+" ("+titulos.length+"):",JSON.stringify(titulos.map(t=>({s:t.simbolo,d:t.descripcion,p:t.ultimoPrecio,plazo:t.plazo}))));
    const classified=titulos.map(t=>classifyTitulo(t,forceMoneda));
    console.log("[IOL] Clasificadas:",classified.map(c=>c.sym+"|"+c.moneda+"|"+c.plazo+"d|"+c.tna+"%").join(" · "));
    return classified;
  }

  const result={pesos1d:null,pesos30d:null,usd1d:null,usd30d:null};

  /* ── Fetch panel "Todos" — the only panel IOL reliably supports ── */
  const allClassified=await fetchPanel("Todos","Cauciones Todos",null);
  assignRates(allClassified,result);

  /* ── Save all rates ── */
  console.log("[IOL] Resultado final:",JSON.stringify(result));
  if(result.pesos1d!=null||result.usd1d!=null){
    saveLS("iol_caucion",{...result,ts:Date.now(),src:"cotizaciones"});
    return result;
  }

  /* ── Fallback: Test — portafolio (verificar que el token funciona) ── */
  const dTest=await tryEndpoint(base+"/portafolio/argentina","Test portafolio");
  if(dTest){
    console.log("[IOL] Token OK pero no se encontró caución. Portafolio:",JSON.stringify(dTest).substring(0,500));
    window._iolLastError="Token OK pero sin datos de caución en los endpoints";
  }else{
    window._iolLastError=window._iolLastError||"No se pudo conectar a IOL";
  }

  return null;
}

    <div style={{fontSize:11,color:"#64748b",marginBottom:6,textTransform:"uppercase",letterSpacing:".05em"}}>{label}</div>
    <div className="stat-val" style={{fontSize:22,fontWeight:700,color,fontVariantNumeric:"tabular-nums"}}>{value}</div>
    {sub&&<div style={{fontSize:12,color:typeof sub==="string"&&sub.startsWith("+")?"#34d399":typeof sub==="string"&&sub.startsWith("-")?"#f87171":"#94a3b8",marginTop:4,fontWeight:500}}>{sub}</div>}
  </div>;
}
function Btn({children,onClick,variant="primary",style:s={}}){
  const bg=variant==="primary"?"#2563eb":variant==="success"?"#059669":"#334155";
  return <button onClick={onClick} style={{background:bg,border:"none",color:variant==="ghost"?"#94a3b8":"#fff",borderRadius:6,padding:"8px 16px",fontSize:13,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:6,...s}}>{children}</button>;
}
function Badge({text,color="#60a5fa",bg="#252d3d"}){
  return <span style={{background:bg,borderRadius:4,padding:"2px 8px",fontSize:11,fontWeight:600,color}}>{text}</span>;
}

/* ── RESUMEN ─────────────────────────────── */
function Resumen({enriched,total,invertido,pl,rend,macro,ops,trigAlerts,prices,casa,setCasa,casaActual,hipoteca,setHipoteca,deudaUSD,patrimonioNeto,caucion,setCaucion,caucionUSD,portfolioLiquido,portfolioTotal,dailyPL,news,portfolioNeto,totalComVenta}){
  const casaNeta=casaActual.valor-deudaUSD;
  const byAsset=useMemo(()=>{
    const items=enriched.map((p,i)=>({name:p.ticker,value:p.montoActual,color:COLORS[i%COLORS.length]}));
    if(casaNeta>0) items.push({name:"Casa",value:casaNeta,color:"#a78bfa"});
    return items.sort((a,b)=>b.value-a.value);
  },[enriched,casaNeta]);
  const bySector=useMemo(()=>{
    const m={};enriched.forEach(p=>{m[p.sector]=(m[p.sector]||0)+p.montoActual});
    if(casaNeta>0) m["Real Estate"]=(m["Real Estate"]||0)+casaNeta;
    return Object.entries(m).map(([name,value])=>({name,value,color:sectorColor(name)})).sort((a,b)=>b.value-a.value);
  },[enriched,casaNeta]);
  const byCountry=useMemo(()=>{
    let usa=0,arg=0;
    enriched.forEach(p=>{if(p.broker==="CS")usa+=p.montoActual;else arg+=p.montoActual;});
    return[{name:"USA (CS)",value:usa,flag:"usa"},{name:"Argentina (BM)",value:arg,flag:"arg"}].filter(d=>d.value>0);
  },[enriched]);
  /* Portfolio sort */
  const [sortBy,setSortBy]=useState("montoActual");
  const [sortDir,setSortDir]=useState("desc");
  const sorted=useMemo(()=>[...enriched].sort((a,b)=>sortDir==="desc"?b[sortBy]-a[sortBy]:a[sortBy]-b[sortBy]),[enriched,sortBy,sortDir]);
  const toggle=c=>{if(sortBy===c)setSortDir(d=>d==="desc"?"asc":"desc");else{setSortBy(c);setSortDir("desc")}};

  const inputSt={background:"#1e293b",border:"1px solid #334155",borderRadius:6,padding:"6px 10px",color:"#e2e8f0",fontSize:13,width:110,fontVariantNumeric:"tabular-nums"};
  const deudaARS=hipoteca.uvas*macro.uva;

  /* News state — Bloomberg-style feed */
  const tickers=enriched.map(p=>p.ticker);
  const relevantNews=news.filter(n=>tickers.includes(n.ticker)||n.ticker==="MACRO").slice(0,15);

  return <div style={{display:"flex",flexDirection:"column",gap:20}}>
    {/* ── KPIs — todos en una fila ── */}
    <div className="grid-4" style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:14}}>
      <Stat label="Patrimonio Neto" value={fU(patrimonioNeto)} sub="Port + Casa - Hipoteca - Caución" color="#a78bfa"/>
      <div style={{background:"#1a1f2e",border:"1px solid #252d3d",borderRadius:10,padding:"16px 18px",animation:"fadeIn .3s ease"}}>
        <div style={{fontSize:11,color:"#64748b",marginBottom:6,textTransform:"uppercase",letterSpacing:".05em"}}>Portfolio Total</div>
        <div className="stat-val" style={{fontSize:22,fontWeight:700,color:"#f1f5f9",fontVariantNumeric:"tabular-nums"}}>{fU(portfolioTotal)}</div>
        <div style={{display:"flex",gap:8,marginTop:4,fontSize:12,fontWeight:500}}>
          <span style={{color:pl>=0?"#34d399":"#f87171"}}>P&L: {pl>=0?"+":""}{fU(pl)} ({rend>=0?"+":""}{fmt(rend,2)}%)</span>
        </div>
        <div style={{display:"flex",gap:8,marginTop:2,fontSize:11,fontWeight:500}}>
          <span style={{color:dailyPL.pct>=0?"#34d399":"#f87171"}}>Hoy: {dailyPL.pct>=0?"+":""}{fmt(dailyPL.pct,2)}%</span>
          <span style={{color:dailyPL.monto>=0?"#34d399":"#f87171"}}>({dailyPL.monto>=0?"+":""}USD {fmt(Math.abs(dailyPL.monto),2)})</span>
        </div>
      </div>
      <Stat label="Portfolio Líquido" value={fU(portfolioLiquido)} sub={caucionUSD>0?`Caución: ${fU(caucionUSD)}`:"Sin caución"} color="#60a5fa"/>
      {(()=>{const bCCL=macro.dolarOficial>0?(macro.dolarCCL-macro.dolarOficial)/macro.dolarOficial:0;const portAR=portfolioNeto*(1+bCCL);return <div style={{background:"#1a1f2e",border:"1px solid #252d3d",borderRadius:10,padding:"16px 18px",animation:"fadeIn .3s ease"}}>
        <div style={{fontSize:11,color:"#64748b",marginBottom:6,textTransform:"uppercase",letterSpacing:".05em"}}>Portfolio Líq. Argentina <span style={{fontSize:9,color:"#475569"}}>(neto com.)</span></div>
        <div className="stat-val" style={{fontSize:22,fontWeight:700,color:"#60a5fa",fontVariantNumeric:"tabular-nums"}}>{fU(portAR)}</div>
        <div style={{fontSize:10,color:"#fbbf24",marginTop:4}}>Com. venta: -{fU(totalComVenta)}</div>
      </div>;})()}
      <div style={{background:"#1a1f2e",border:"1px solid #252d3d",borderRadius:10,padding:"16px 18px",animation:"fadeIn .3s ease"}}>
        <div style={{fontSize:11,color:"#64748b",marginBottom:6,textTransform:"uppercase",letterSpacing:".05em"}}>Caución Tomada</div>
        <div style={{display:"flex",alignItems:"center",gap:4}}>
          <span style={{fontSize:11,color:"#f87171"}}>$</span>
          <input type="text" value={caucion.montoARS?caucion.montoARS.toLocaleString("es-AR"):""} onChange={e=>{const raw=e.target.value.replace(/[^\d]/g,"");setCaucion({...caucion,montoARS:raw?parseInt(raw,10):0});}} style={{background:"#111827",border:"1px solid #334155",borderRadius:6,padding:"4px 8px",color:"#f87171",fontSize:18,fontWeight:700,width:"100%",fontVariantNumeric:"tabular-nums",outline:"none"}} placeholder="0"/>
        </div>
        <div style={{fontSize:12,color:"#f87171",marginTop:4}}>≈ {fU(caucionUSD)} <span style={{color:"#475569"}}>(MEP ${fmt(macro.dolarMEP)})</span></div>
      </div>
    </div>
    {/* ── Caución metrics strip ── */}
    {(()=>{
      const tnaRes=caucion.tna||21;
      const c30=caucion.montoARS>0&&tnaRes>0?calcCaucion(caucion.montoARS,tnaRes,30,false):null;
      if(!c30)return null;
      return <div style={{display:"flex",gap:20,justifyContent:"flex-end",marginTop:-2,padding:"0 4px"}}>
        <span style={{fontSize:11,color:"#94a3b8"}}>C.F.T. <span style={{fontWeight:700,color:"#fbbf24"}}>{c30.cft!=null?c30.cft.toFixed(2)+"%":"—"}</span></span>
        <span style={{fontSize:11,color:"#94a3b8"}}>T.E. 30d <span style={{fontWeight:700,color:"#f87171"}}>{c30.tePeriodo!=null?c30.tePeriodo.toFixed(2)+"%":"—"}</span></span>
        <span style={{fontSize:11,color:"#94a3b8"}}>Costo 30d <span style={{fontWeight:700,color:"#f87171"}}>$ {new Intl.NumberFormat("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0}).format(c30.totalGastos)}</span></span>
      </div>;
    })()}

    {/* ── Tabla Portfolio ── */}
    <Card title="Posiciones del Portfolio">
      <div className="table-wrap" style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:800}}>
          <thead><tr>
            {[{c:"ticker",l:"Ticker",a:"left"},{c:"cantidad",l:"Cant"},{c:"ppc",l:"PPC"},{c:"precioActual",l:"Precio"},{c:"variacion",l:"Var%"},{c:"montoInvertido",l:"Invertido"},{c:"montoActual",l:"Actual"},{c:"pl",l:"P&L"},{c:"rendimiento",l:"Rend%"}].map(h=>
              <th key={h.c} onClick={()=>toggle(h.c)} style={{padding:"8px 6px",textAlign:h.a||"right",fontSize:11,fontWeight:600,color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",cursor:"pointer",userSelect:"none",whiteSpace:"nowrap",borderBottom:"1px solid #252d3d",background:"#151a27"}}>{h.l}{sortBy===h.c?(sortDir==="desc"?" ↓":" ↑"):""}</th>
            )}
          </tr></thead>
          <tbody>{sorted.map(p=><tr key={p.ticker} style={{borderBottom:"1px solid #1e293b"}}>
            <td style={{padding:"8px 6px"}}><div style={{fontWeight:700,fontSize:13}}>{p.ticker}</div><div style={{fontSize:10,color:"#64748b"}}>{p.mercado}·{p.broker}</div></td>
            <td style={{padding:"8px 6px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:12}}>{fmt(p.cantidad)}</td>
            <td style={{padding:"8px 6px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:12}}>{fU(p.ppc)}</td>
            <td style={{padding:"8px 6px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:12,fontWeight:600}}>{fU(p.precioActual)}</td>
            <td style={{padding:"8px 6px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:12,fontWeight:600,color:p.variacion>=0?"#34d399":"#f87171"}}><div>{fP(p.variacion)}</div><div style={{fontSize:10,fontWeight:500}}>{(()=>{const dm=p.montoActual*(p.variacion/100);return(dm>=0?"+":"")+fU(dm);})()}</div></td>
            <td style={{padding:"8px 6px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:12}}>{fU(p.montoInvertido)}</td>
            <td style={{padding:"8px 6px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:12,fontWeight:600}}>{fU(p.montoActual)}</td>
            <td style={{padding:"8px 6px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:12,fontWeight:600,color:p.pl>=0?"#34d399":"#f87171"}}>{fU(p.pl)}</td>
            <td style={{padding:"8px 6px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:12,fontWeight:600,color:p.rendimiento>=0?"#34d399":"#f87171"}}>{fP(p.rendimiento)}</td>
          </tr>)}</tbody>
          <tfoot><tr style={{borderTop:"2px solid #2563eb"}}>
            <td colSpan={4} style={{padding:10,fontWeight:700,fontSize:13}}>TOTAL</td>
            <td style={{padding:10,textAlign:"right",fontWeight:700,fontVariantNumeric:"tabular-nums",fontSize:12,color:dailyPL.pct>=0?"#34d399":"#f87171"}}><div>{dailyPL.pct>=0?"+":""}{fmt(dailyPL.pct,2)}%</div><div style={{fontSize:10}}>{dailyPL.monto>=0?"+":""}{fU(dailyPL.monto)}</div></td>
            <td style={{padding:10,textAlign:"right",fontWeight:700,fontVariantNumeric:"tabular-nums",fontSize:12}}>{fU(invertido)}</td>
            <td style={{padding:10,textAlign:"right",fontWeight:700,fontVariantNumeric:"tabular-nums",fontSize:12}}>{fU(total)}</td>
            <td style={{padding:10,textAlign:"right",fontWeight:700,fontVariantNumeric:"tabular-nums",fontSize:12,color:pl>=0?"#34d399":"#f87171"}}>{fU(pl)}</td>
            <td style={{padding:10,textAlign:"right",fontWeight:700,fontVariantNumeric:"tabular-nums",fontSize:12,color:rend>=0?"#34d399":"#f87171"}}>{fP(rend)}</td>
          </tr></tfoot>
        </table>
      </div>
    </Card>

    {/* ── Gráficos distribución ── */}
    <div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <Card title="Composición por Activo"><Pie3D data={byAsset} width={360} height={240}/></Card>
      <Card title="Distribución por Sector">
        <HBarChart data={bySector} height={Math.max(180,bySector.length*34)}/>
        <div style={{borderTop:"1px solid #252d3d",marginTop:14,paddingTop:14}}>
          <div style={{fontSize:11,color:"#64748b",textTransform:"uppercase",letterSpacing:".05em",marginBottom:10,fontWeight:600}}>Capital por País</div>
          {(()=>{
            const max=Math.max(...byCountry.map(d=>d.value));
            const total=byCountry.reduce((s,d)=>s+d.value,0);
            const barH=24;
            return <svg width="100%" height={byCountry.length*(barH+10)+4} viewBox={`0 0 440 ${byCountry.length*(barH+10)+4}`} preserveAspectRatio="xMidYMid meet">
              <defs>
                <pattern id="flag-usa" patternUnits="userSpaceOnUse" width="48" height={barH}>
                  {[...Array(7)].map((_,i)=><rect key={i} x={0} y={i*(barH/13)*2} width={48} height={barH/13} fill={i%2===0?"#B22234":"#fff"}/>)}
                  {[...Array(6)].map((_,i)=><rect key={i+7} x={0} y={(i*2+1)*(barH/13)} width={48} height={barH/13} fill={i%2===0?"#fff":"#B22234"}/>)}
                  <rect x={0} y={0} width={19} height={barH*7/13} fill="#3C3B6E"/>
                  {[0,1,2,3,4].map(r=>[0,1,2,3,4,5].map((c,ci)=><circle key={`s${r}${ci}`} cx={1.6+c*3} cy={1.2+r*(barH*7/13/5)} r={.6} fill="#fff"/>))}
                </pattern>
                <pattern id="flag-arg" patternUnits="userSpaceOnUse" width="48" height={barH}>
                  <rect x={0} y={0} width={48} height={barH/3} fill="#74ACDF"/>
                  <rect x={0} y={barH/3} width={48} height={barH/3} fill="#fff"/>
                  <rect x={0} y={barH*2/3} width={48} height={barH/3} fill="#74ACDF"/>
                  <circle cx={24} cy={barH/2} r={2.5} fill="#F6B40E" stroke="#85340A" strokeWidth={.3}/>
                </pattern>
              </defs>
              {byCountry.map((d,i)=>{
                const y=i*(barH+10)+4;const w=max>0?(d.value/max)*220:0;const pct=total>0?(d.value/total*100).toFixed(1):0;
                return <g key={i}>
                  <text x={105} y={y+barH/2+4} textAnchor="end" fill="#e2e8f0" fontSize="12" fontWeight="600">{d.name}</text>
                  <rect x={110} y={y} width={w} height={barH} rx={3} fill={`url(#flag-${d.flag})`}/>
                  <rect x={110} y={y} width={w} height={barH} rx={3} fill="rgba(0,0,0,0.15)"/>
                  <text x={115+w} y={y+barH/2+4} fill="#e2e8f0" fontSize="11" fontWeight="600">{pct}% · ${(d.value/1000).toFixed(0)}k</text>
                </g>;
              })}
            </svg>;
          })()}
        </div>
      </Card>
    </div>

    {/* ── Movers + News Feed (Bloomberg-style) ── */}
    <div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      {(()=>{
        /* Evolución histórica del portfolio — datos hardcoded + año actual dinámico */
        const hist=[
          {year:2023,capital:152951,pl:21924,rend:16.73},
          {year:2024,capital:429639,pl:276688,rend:180.90},
          {year:2025,capital:371436,pl:-58203,rend:-13.55},
        ];
        const curYear=new Date().getFullYear();
        const prevYearCap=hist.length>0?hist[hist.length-1].capital:0;
        const curPL=patrimonioNeto-prevYearCap;
        const curRend=prevYearCap>0?((patrimonioNeto-prevYearCap)/prevYearCap*100):0;
        const curEntry={year:curYear,capital:patrimonioNeto,pl:curPL,rend:curRend};
        /* Auto-snapshot: si estamos en enero y el año anterior no está en hist, guardarlo */
        const all=[...hist,curEntry];
        /* CAGR — retorno anualizado compuesto */
        const compFactor=all.reduce((acc,d)=>acc*(1+d.rend/100),1);
        const startOfFirstYear=new Date(all[0].year,0,1);
        const now=new Date();
        const nYears=(now-startOfFirstYear)/(365.25*24*60*60*1000);
        const cagr=nYears>0?(Math.pow(compFactor,1/nYears)-1)*100:0;
        const maxCap=Math.max(...all.map(d=>d.capital));
        const barW=260;
        return <Card title="Evolución del Portfolio" right={<span style={{fontSize:10,color:"#475569",fontWeight:400}}>Cierre anual en USD</span>}>
          {/* Gráfico de barras */}
          <svg width="100%" height={all.length*44+10} viewBox={`0 0 440 ${all.length*44+10}`} preserveAspectRatio="xMidYMid meet">
            {all.map((d,i)=>{
              const y=i*44+5;const w=maxCap>0?(d.capital/maxCap)*barW:0;
              const isNeg=d.rend<0;const isCur=d.year===curYear;
              return <g key={d.year}>
                <text x={40} y={y+18} textAnchor="end" fill={isCur?"#60a5fa":"#e2e8f0"} fontSize="13" fontWeight="700">{d.year}</text>
                <rect x={48} y={y} width={w} height={28} rx={4} fill={isCur?"#2563eb":isNeg?"#dc2626":"#059669"} opacity={isCur?.9:.7}/>
                <text x={54+w} y={y+12} fill="#e2e8f0" fontSize="11" fontWeight="600">{fU(d.capital)}</text>
                <text x={54+w} y={y+24} fill={d.pl>=0?"#34d399":"#f87171"} fontSize="10" fontWeight="500">{d.pl>=0?"+":""}{fU(d.pl)} ({d.rend>=0?"+":""}{d.rend.toFixed(1)}%)</text>
              </g>;
            })}
          </svg>
          {/* Tabla resumen */}
          <table style={{width:"100%",borderCollapse:"collapse",marginTop:12,borderTop:"1px solid #252d3d"}}>
            <thead><tr>
              {["Año","Capital","P&L","Rend%"].map(h=><th key={h} style={{padding:"8px 6px",fontSize:10,fontWeight:600,color:"#64748b",textTransform:"uppercase",textAlign:h==="Año"?"left":"right",borderBottom:"1px solid #252d3d"}}>{h}</th>)}
            </tr></thead>
            <tbody>{all.map(d=>{
              const isCur=d.year===curYear;
              return <tr key={d.year} style={{borderBottom:"1px solid #1e293b",background:isCur?"#1e293b44":"transparent"}}>
                <td style={{padding:"6px",fontSize:12,fontWeight:isCur?700:500,color:isCur?"#60a5fa":"#e2e8f0"}}>{d.year}{isCur?" *":""}</td>
                <td style={{padding:"6px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums",fontWeight:600}}>{fU(d.capital)}</td>
                <td style={{padding:"6px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums",fontWeight:600,color:d.pl>=0?"#34d399":"#f87171"}}>{d.pl>=0?"+":""}{fU(d.pl)}</td>
                <td style={{padding:"6px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums",fontWeight:600,color:d.rend>=0?"#34d399":"#f87171"}}>{d.rend>=0?"+":""}{d.rend.toFixed(2)}%</td>
              </tr>;
            })}</tbody>
            <tfoot><tr style={{borderTop:"2px solid #334155"}}>
              <td style={{padding:"8px 6px",fontSize:12,fontWeight:700,color:"#94a3b8"}}>CAGR</td>
              <td colSpan={2} style={{padding:"8px 6px",textAlign:"right",fontSize:10,color:"#64748b"}}>Retorno anualizado</td>
              <td style={{padding:"8px 6px",textAlign:"right",fontSize:13,fontVariantNumeric:"tabular-nums",fontWeight:700,color:cagr>=0?"#34d399":"#f87171"}}>{cagr>=0?"+":""}{cagr.toFixed(2)}%</td>
            </tr></tfoot>
          </table>
          <div style={{fontSize:9,color:"#475569",marginTop:6,fontStyle:"italic"}}>* {curYear} en curso · CAGR = retorno anualizado compuesto desde {all[0].year}</div>
        </Card>;
      })()}
      <Card title="Noticias Relevantes" right={<span style={{fontSize:10,color:"#475569",fontWeight:400}}>LIVE FEED</span>}>
        <div style={{display:"flex",flexDirection:"column",gap:0}}>
          {relevantNews.map((n,i)=><div key={n.id}>
            <div style={{display:"flex",alignItems:"flex-start",gap:10,padding:"8px 0",borderBottom:i<relevantNews.length-1?"1px solid #1e293b":"none",transition:"background .15s"}} onMouseEnter={e=>e.currentTarget.style.background="#252d3d33"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              <span style={{fontSize:10,color:"#475569",whiteSpace:"nowrap",marginTop:2,minWidth:42,fontVariantNumeric:"tabular-nums"}}>{n.pubDate?timeAgo(n.pubDate):n.time}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                  <span style={{fontSize:10,fontWeight:700,color:n.sentiment==="positive"?"#34d399":"#f87171",letterSpacing:".03em"}}>{n.ticker}</span>
                  <span style={{fontSize:10,color:"#475569"}}>· {n.source}</span>
                </div>
                <a href={n.link||`https://www.google.com/search?q=${encodeURIComponent(n.title)}&tbm=nws`} target="_blank" rel="noopener" style={{fontSize:12,fontWeight:500,color:"#cbd5e1",lineHeight:1.4,display:"block",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",textDecoration:"none",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.color="#60a5fa"} onMouseLeave={e=>e.currentTarget.style.color="#cbd5e1"}>{n.title}</a>
              </div>
            </div>
          </div>)}
        </div>
      </Card>
    </div>

    {/* ── Inmobiliario (al final) ── */}
    <div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <Card title="🏠 Valuación Casa">
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
            <label style={{fontSize:12,color:"#94a3b8"}}>Precio compra USD <input type="number" value={casa.precioCompra} onChange={e=>setCasa(c=>({...c,precioCompra:+e.target.value}))} style={inputSt}/></label>
            <label style={{fontSize:12,color:"#94a3b8"}}>Años <input type="number" value={casa.anios} min={0} onChange={e=>setCasa(c=>({...c,anios:+e.target.value}))} style={{...inputSt,width:60}}/></label>

/* ── OPERACIONES ─────────────────────────── */
function Operaciones({ops,setOps,macro,enriched}){
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState({ticker:"",tipo:"COMPRA",cantidad:"",precio:"",mercado:"BYMA",broker:"BM",moneda:"ARS",fecha:"",ccl:""});
  const [filter,setFilter]=useState("");
  const [confirmDel,setConfirmDel]=useState(null);
  const emptyForm={ticker:"",tipo:"COMPRA",cantidad:"",precio:"",mercado:"BYMA",broker:"BM",moneda:"ARS",fecha:"",ccl:""};
  const montoUSD=(op)=>{
    if(op.moneda==="USD") return op.cantidad*op.precio;
    if(op.ccl&&op.ccl>0) return (op.cantidad*op.precio)/op.ccl;
    return null;
  };
  const startEdit=(op)=>{
    setEditId(op.id);
    setForm({ticker:op.ticker,tipo:op.tipo,cantidad:String(op.cantidad),precio:String(op.precio),mercado:op.mercado,broker:op.broker,moneda:op.moneda,fecha:op.fecha,ccl:op.ccl?String(op.ccl):""});
    setShowForm(true);
  };
  const deleteOp=(id)=>{
    setOps(ops.filter(o=>o.id!==id));
    setConfirmDel(null);
  };
  const submit=e=>{
    e.preventDefault();if(!form.ticker||!form.cantidad||!form.precio)return;
    const isARS=form.moneda==="ARS";
    const cclVal=isARS?(form.ccl?parseFloat(form.ccl):macro.dolarCCL):null;
    const opData={ticker:form.ticker.toUpperCase(),tipo:form.tipo,cantidad:parseFloat(form.cantidad),precio:parseFloat(form.precio),mercado:form.mercado,broker:form.broker,moneda:form.moneda,fecha:form.fecha||today(),ccl:cclVal};
    if(editId){
      setOps(ops.map(o=>o.id===editId?{...o,...opData}:o));
      setEditId(null);
    }else{
      setOps([...ops,{id:Date.now(),...opData}]);
    }
    setForm(emptyForm);setShowForm(false);
  };
  const cancelForm=()=>{setShowForm(false);setEditId(null);setForm(emptyForm);};
  const fl=filter?ops.filter(o=>o.ticker.toLowerCase().includes(filter.toLowerCase())):ops;

  return <div style={{display:"flex",flexDirection:"column",gap:18}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <input placeholder="Filtrar por ticker..." value={filter} onChange={e=>setFilter(e.target.value)} style={{width:200}}/>
        <span style={{fontSize:12,color:"#64748b"}}>{fl.length} ops</span>
      </div>
      <Btn onClick={()=>{setEditId(null);setForm(emptyForm);setShowForm(!showForm)}}>+ Nueva Operación</Btn>
    </div>
    {showForm&&<Card title={editId?"Modificar Operación":"Registrar Operación"}>
      <form onSubmit={submit} className="form-grid" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Ticker</label><input value={form.ticker} onChange={e=>setForm({...form,ticker:e.target.value.toUpperCase()})} placeholder="AAPL" required style={{width:"100%"}}/></div>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Tipo</label><select value={form.tipo} onChange={e=>setForm({...form,tipo:e.target.value})} style={{width:"100%"}}><option value="COMPRA">COMPRA</option><option value="VENTA">VENTA</option></select></div>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Cantidad</label><input type="number" value={form.cantidad} onChange={e=>setForm({...form,cantidad:e.target.value})} required style={{width:"100%"}}/></div>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Precio</label><input type="number" step="0.0001" value={form.precio} onChange={e=>setForm({...form,precio:e.target.value})} required style={{width:"100%"}}/></div>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Broker</label><select value={form.broker} onChange={e=>{const b=e.target.value;setForm({...form,broker:b,mercado:b==="CS"?"NYSE":"BYMA",moneda:b==="CS"?"USD":"ARS"})}} style={{width:"100%"}}><option value="BM">Bull Market (BYMA/ARS)</option><option value="CS">Charles Schwab (USA/USD)</option></select></div>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Mercado</label><div style={{padding:"8px 12px",background:"#111827",borderRadius:6,fontSize:13,color:"#94a3b8"}}>{form.broker==="CS"?"NYSE":"BYMA"} · {form.broker==="CS"?"USD":"ARS"}</div></div>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Fecha</label><input value={form.fecha} onChange={e=>setForm({...form,fecha:e.target.value})} placeholder="DD-MM-AA" style={{width:"100%"}}/></div>
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          {(form.moneda==="ARS")&&<div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>CCL {!editId&&<span style={{color:"#60a5fa"}}>(auto: ${fmt(macro.dolarCCL)})</span>}</label><input type="number" step="0.01" value={form.ccl} onChange={e=>setForm({...form,ccl:e.target.value})} placeholder={String(macro.dolarCCL)} style={{width:"100%"}}/></div>}
          <div style={{display:"flex",alignItems:"flex-end",gap:8,flex:1,marginTop:4}}><Btn variant="success" onClick={submit} style={{flex:1}}>{editId?"Actualizar":"Guardar"}</Btn><Btn variant="ghost" onClick={cancelForm}>✕</Btn></div>
        </div>
      </form>
    </Card>}
    {confirmDel&&<div style={{background:"#7f1d1d22",border:"1px solid #dc262644",borderRadius:10,padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
      <span style={{fontSize:13,color:"#fca5a5"}}>¿Eliminar la operación de <strong>{ops.find(o=>o.id===confirmDel)?.ticker}</strong> del {ops.find(o=>o.id===confirmDel)?.fecha}?</span>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>deleteOp(confirmDel)} style={{background:"#dc2626",border:"none",color:"#fff",borderRadius:6,padding:"6px 16px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Sí, eliminar</button>
        <button onClick={()=>setConfirmDel(null)} style={{background:"#334155",border:"none",color:"#94a3b8",borderRadius:6,padding:"6px 16px",fontSize:12,cursor:"pointer"}}>Cancelar</button>
      </div>
    </div>}
    <Card>
      <div className="table-wrap" style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:950}}>
          <thead><tr>{["Fecha","Ticker","Tipo","Cantidad","Precio","CCL","Monto ARS","Monto USD","Comisión","Broker",""].map(h2=><th key={h2} style={{padding:"10px 8px",textAlign:["Fecha","Ticker","Tipo",""].includes(h2)?"left":"right",fontSize:11,fontWeight:600,color:"#64748b",textTransform:"uppercase",borderBottom:"1px solid #252d3d",background:"#151a27"}}>{h2}</th>)}</tr></thead>
          <tbody>{[...fl].reverse().map(op=>{const usd=montoUSD(op);const ep=enriched&&enriched.find(e=>e.ticker===op.ticker);const tipoActivo=ep?ep.tipo:"Acción";const com=usd!=null?calcComision(usd,op.broker,tipoActivo):0;return <tr key={op.id} style={{borderBottom:"1px solid #1e293b",background:editId===op.id?"#2563eb11":"transparent"}} onMouseEnter={e=>{if(editId!==op.id)e.currentTarget.style.background="#252d3d33"}} onMouseLeave={e=>{if(editId!==op.id)e.currentTarget.style.background=editId===op.id?"#2563eb11":"transparent"}}>
            <td style={{padding:"10px 8px",fontSize:13}}>{op.fecha}</td>
            <td style={{padding:"10px 8px",fontWeight:700,fontSize:14}}>{op.ticker}</td>
            <td style={{padding:"10px 8px"}}><Badge text={op.tipo} color={op.tipo==="COMPRA"?"#34d399":"#f87171"} bg={op.tipo==="COMPRA"?"#065f4622":"#7f1d1d22"}/></td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{fmt(op.cantidad)}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{op.moneda==="USD"?fU(op.precio):`$${fmt(op.precio)}`}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:12,color:op.ccl?"#60a5fa":"#334155"}}>{op.ccl?`$${fmt(op.ccl,2)}`:"—"}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{op.moneda==="ARS"?`$${fmt(op.cantidad*op.precio)}`:"—"}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontWeight:600,color:"#f1f5f9"}}>{usd!=null?fU(usd):"—"}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:12,color:com>0?"#fbbf24":"#475569"}}>{com>0?fU(com):"—"}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontSize:12,color:"#94a3b8"}}>{op.broker}</td>
            <td style={{padding:"10px 8px",whiteSpace:"nowrap"}}>
              <button onClick={()=>startEdit(op)} title="Editar" style={{background:"none",border:"none",cursor:"pointer",padding:"4px 6px",fontSize:14,opacity:.5,transition:"opacity .15s"}} onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=.5}>✏️</button>
              <button onClick={()=>setConfirmDel(op.id)} title="Eliminar" style={{background:"none",border:"none",cursor:"pointer",padding:"4px 6px",fontSize:14,opacity:.5,transition:"opacity .15s"}} onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=.5}>🗑</button>
            </td>
          </tr>})}</tbody>
        </table>
      </div>
    </Card>

    {/* ── Simulador de Comisiones ── */}
    {enriched&&enriched.length>0&&<Card title="Comisiones Estimadas" right={<span style={{fontSize:10,color:"#475569"}}>Bull Market · Active Trader Plus</span>}>
      {(()=>{
        const totComCompra=enriched.reduce((s,p)=>s+p.comCompra,0);
        const totComVenta=enriched.reduce((s,p)=>s+p.comVenta,0);
        const totCom=totComCompra+totComVenta;
        const totActual=enriched.reduce((s,p)=>s+p.montoActual,0);
        const pctCost=totActual>0?(totCom/totActual*100):0;
        return<div>
          {/* Resumen */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14,marginBottom:16}}>
            <div style={{background:"#111827",borderRadius:8,padding:"12px 14px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",marginBottom:4}}>Comisión Compra</div>
              <div style={{fontSize:18,fontWeight:700,color:"#fbbf24",fontVariantNumeric:"tabular-nums"}}>{fU(totComCompra)}</div>
              <div style={{fontSize:10,color:"#475569"}}>ya pagada</div>
            </div>
            <div style={{background:"#111827",borderRadius:8,padding:"12px 14px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",marginBottom:4}}>Comisión Venta</div>
              <div style={{fontSize:18,fontWeight:700,color:"#fbbf24",fontVariantNumeric:"tabular-nums"}}>{fU(totComVenta)}</div>
              <div style={{fontSize:10,color:"#475569"}}>estimada a valor actual</div>
            </div>
            <div style={{background:"#111827",borderRadius:8,padding:"12px 14px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",marginBottom:4}}>Costo Total</div>
              <div style={{fontSize:18,fontWeight:700,color:"#f87171",fontVariantNumeric:"tabular-nums"}}>{fU(totCom)}</div>
              <div style={{fontSize:10,color:"#475569"}}>{fmt(pctCost,3)}% del portfolio</div>
            </div>
          </div>
          {/* Detalle por posición */}
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr>
              {["Ticker","Tipo","Broker","Compra","Venta","Total","IVA"].map(h=><th key={h} style={{padding:"6px 8px",textAlign:h==="Ticker"||h==="Tipo"||h==="Broker"?"left":"right",fontSize:10,fontWeight:600,color:"#64748b",textTransform:"uppercase",borderBottom:"1px solid #252d3d"}}>{h}</th>)}
            </tr></thead>
            <tbody>{enriched.map(p=>{
              const exento=p.tipo==="Bono"||p.tipo==="Letra"||p.tipo==="ON";
              return<tr key={p.ticker} style={{borderBottom:"1px solid #1e293b"}}>
                <td style={{padding:"6px 8px",fontWeight:700,fontSize:12}}>{p.ticker}</td>
                <td style={{padding:"6px 8px",fontSize:11,color:"#94a3b8"}}>{p.tipo}</td>
                <td style={{padding:"6px 8px",fontSize:11,color:"#94a3b8"}}>{p.broker}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums",color:p.comCompra>0?"#fbbf24":"#475569"}}>{fU(p.comCompra)}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums",color:p.comVenta>0?"#fbbf24":"#475569"}}>{fU(p.comVenta)}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums",fontWeight:600,color:p.comTotal>0?"#f87171":"#475569"}}>{fU(p.comTotal)}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontSize:10,color:exento?"#34d399":"#fbbf24"}}>{exento?"Exento":"21%"}</td>
              </tr>;
            })}</tbody>
            <tfoot><tr style={{borderTop:"2px solid #334155"}}>
              <td colSpan={3} style={{padding:"8px",fontWeight:700,fontSize:12}}>TOTAL</td>
              <td style={{padding:"8px",textAlign:"right",fontWeight:700,fontSize:12,color:"#fbbf24"}}>{fU(totComCompra)}</td>
              <td style={{padding:"8px",textAlign:"right",fontWeight:700,fontSize:12,color:"#fbbf24"}}>{fU(totComVenta)}</td>
              <td style={{padding:"8px",textAlign:"right",fontWeight:700,fontSize:12,color:"#f87171"}}>{fU(totCom)}</td>

/* ── CALCULADORA CAUCIÓN ──────────────────── */
function Caucion({caucion:caucionState,setCaucion:setCaucionState,iolStatus,fetchCaucionRate}){

  const fPct=(n,d=2)=>n==null||isNaN(n)?"—":`${n.toFixed(d)} %`;

  const [monto,setMonto]=useState("66521399");
  const [diasTom,setDiasTom]=useState("4");
  const [tnaCol,setTnaCol]=useState("22");
  const [diasCol,setDiasCol]=useState("3");
  const [showIOLConfig,setShowIOLConfig]=useState(false);
  const [iolUser,setIolUser]=useState(()=>{const c=loadLS("iol_creds",null);return c?c.user:""});
  const [iolPass,setIolPass]=useState(()=>{const c=loadLS("iol_creds",null);return c?c.pass:""});

  /* TNA Tomadora is shared with Resumen via caucion state */
  const tnaTom=caucionState.tna||21;
  const setTnaTom=v=>setCaucionState({...caucionState,tna:parseFloat(v)||0});

  const tom=calcCaucion(parseFloat(monto)||0,tnaTom,parseInt(diasTom)||0,false);
  const col=calcCaucion(parseFloat(monto)||0,parseFloat(tnaCol)||0,parseInt(diasCol)||0,true);

  const inputSt={background:"#111827",border:"1px solid #334155",borderRadius:6,padding:"8px 12px",color:"#e2e8f0",fontSize:15,fontWeight:600,width:"100%",fontVariantNumeric:"tabular-nums"};
  const labelSt={fontSize:11,color:"#64748b",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:".04em"};
  const rowSt={display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #1e293b"};
  const valSt={fontVariantNumeric:"tabular-nums",fontWeight:600,fontSize:13};

  function CaucionPanel({title,color,bg,data,esColocadora}){
    if(!data)return<div style={{background:"#1a1f2e",borderRadius:10,padding:20,flex:1,border:"1px solid #252d3d"}}><div style={{color:"#475569",textAlign:"center",padding:40}}>Ingresá los valores para calcular</div></div>;
    return<div style={{background:"#1a1f2e",borderRadius:10,padding:0,flex:1,border:`1px solid ${color}33`,overflow:"hidden"}}>

      </div>

        {/* Datos de la operación */}
