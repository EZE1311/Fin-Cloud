/* ── SVG Charts ──────────────────────────── */
function DonutChart({data,size=200,thickness=32}){
  const total=data.reduce((s,d)=>s+d.value,0);
  const cx=size/2,cy=size/2,r=(size-thickness)/2;
  let cum=0;
  const arcs=data.map((d,i)=>{
    const pct=d.value/total;const startAngle=cum*2*Math.PI-Math.PI/2;cum+=pct;const endAngle=cum*2*Math.PI-Math.PI/2;
    const large=pct>.5?1:0;
    const x1=cx+r*Math.cos(startAngle),y1=cy+r*Math.sin(startAngle);
    const x2=cx+r*Math.cos(endAngle),y2=cy+r*Math.sin(endAngle);
    const mid=(startAngle+endAngle)/2;
    const lx=cx+(r+20)*Math.cos(mid),ly=cy+(r+20)*Math.sin(mid);
    return{path:`M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`,color:d.color,name:d.name,pct,lx,ly};
  });
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:"block",margin:"0 auto"}}>
      {arcs.map((a,i)=><path key={i} d={a.path} fill="none" stroke={a.color} strokeWidth={thickness} strokeLinecap="butt"/>)}
      {arcs.filter(a=>a.pct>.05).map((a,i)=><text key={i} x={a.lx} y={a.ly} textAnchor="middle" dominantBaseline="middle" fill="#94a3b8" fontSize="10" fontWeight="500">{a.name} {(a.pct*100).toFixed(0)}%</text>)}
      <text x={cx} y={cy-6} textAnchor="middle" fill="#f1f5f9" fontSize="14" fontWeight="700">{fU(total).replace("USD ","$")}</text>
      <text x={cx} y={cy+12} textAnchor="middle" fill="#64748b" fontSize="10">Total</text>
    </svg>
  );
}

function HBarChart({data,height:h2=220}){
  const max=Math.max(...data.map(d=>d.value));
  const barH=Math.min(28,h2/data.length-6);
  return(
    <svg width="100%" height={h2} viewBox={`0 0 400 ${h2}`} preserveAspectRatio="xMidYMid meet">
      {data.map((d,i)=>{
        const y=i*(barH+6)+4;const w=max>0?(d.value/max)*260:0;
        return <g key={i}>
          <text x={125} y={y+barH/2+4} textAnchor="end" fill="#94a3b8" fontSize="11">{d.name}</text>
          <rect x={130} y={y} width={w} height={barH} rx={3} fill={d.color} opacity={.85}/>
          <text x={135+w} y={y+barH/2+4} fill="#64748b" fontSize="10">${(d.value/1000).toFixed(0)}k</text>
        </g>;
      })}
    </svg>
  );
}

/* Calcula posiciones abiertas a partir de operaciones */
function calcPositions(ops){
  const map={};
  ops.forEach(op=>{
    const t=op.ticker;
    if(!map[t]) map[t]={ticker:t,cantCompra:0,costoTotal:0,cantVenta:0,mercado:op.mercado,broker:op.broker,moneda:op.moneda};
    /* Normalizar precio a USD para operaciones ARS */
    const precioUSD=op.moneda==="ARS"&&op.ccl>0?op.precio/op.ccl:op.precio;
    if(op.tipo==="COMPRA"){
      map[t].cantCompra+=op.cantidad;
      map[t].costoTotal+=op.cantidad*precioUSD;
    }else{
      map[t].cantVenta+=op.cantidad;
    }
  });
  return Object.values(map).filter(p=>(p.cantCompra-p.cantVenta)>0).map(p=>{
    const cantidad=p.cantCompra-p.cantVenta;
    const ppc=p.cantCompra>0?p.costoTotal/p.cantCompra:0;
    const meta=TICKER_META[p.ticker]||{sector:"Sin clasificar",pais:p.mercado==="NYSE"?"USA":"Argentina",tipo:p.mercado==="NYSE"?"Acción":"CEDEAR"};
    return{ticker:p.ticker,cantidad,ppc,mercado:p.mercado,broker:p.broker,moneda:p.moneda,...meta};
  });
}

function Card({title,children,style:s={},right=null}){

function Stat({label,value,sub,color="#60a5fa"}){
  return <div style={{background:"#1a1f2e",border:"1px solid #252d3d",borderRadius:10,padding:"16px 18px",animation:"fadeIn .3s ease"}}>

}

            <td style={{padding:"8px 6px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:12,fontWeight:600,color:p.rendimiento>=0?"#34d399":"#f87171"}}>{fP(p.rendimiento)}</td>
          </tr>)}</tbody>
          <tfoot><tr style={{borderTop:"2px solid #2563eb"}}>
            <td colSpan={5} style={{padding:10,fontWeight:700,fontSize:13}}>TOTAL</td>
            <td style={{padding:10,textAlign:"right",fontWeight:700,fontVariantNumeric:"tabular-nums",fontSize:12}}>{fU(invertido)}</td>
            <td style={{padding:10,textAlign:"right",fontWeight:700,fontVariantNumeric:"tabular-nums",fontSize:12}}>{fU(total)}</td>
            <td style={{padding:10,textAlign:"right",fontWeight:700,fontVariantNumeric:"tabular-nums",fontSize:12,color:pl>=0?"#34d399":"#f87171"}}>{fU(pl)}</td>
            <td style={{padding:10,textAlign:"right",fontWeight:700,fontVariantNumeric:"tabular-nums",fontSize:12,color:rend>=0?"#34d399":"#f87171"}}>{fP(rend)}</td>
          </tr></tfoot>
        </table>
      </div>
    </Card>

    {/* ── Gráficos distribución ── */}
    <div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <Card title="Composición por Activo"><DonutChart data={byAsset} size={210} thickness={30}/></Card>
      <Card title="Distribución por Sector"><HBarChart data={bySector} height={Math.max(180,bySector.length*34)}/></Card>
    </div>

    {/* ── Movers + News Feed (Bloomberg-style) ── */}
    <div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <Card title="Mayores Movimientos Hoy">
        {movers.map((p,i)=><div key={p.ticker} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:i<movers.length-1?"1px solid #252d3d":"none"}}>
          <div><div style={{fontWeight:600,fontSize:14}}>{p.ticker}</div><div style={{fontSize:11,color:"#64748b"}}>{p.sector} · {p.mercado}</div></div>
          <div style={{textAlign:"right"}}><div style={{fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{fU(p.precioActual)}</div><div style={{fontSize:12,fontWeight:500,color:p.variacion>=0?"#34d399":"#f87171"}}>{fP(p.variacion)}</div></div>
        </div>)}
      </Card>
      <Card title="Noticias Relevantes" right={<span style={{fontSize:10,color:"#475569",fontWeight:400}}>LIVE FEED</span>}>
        <div style={{display:"flex",flexDirection:"column",gap:0}}>
          {relevantNews.map((n,i)=><div key={n.id}>
            <div onClick={()=>setExpandedNews(expandedNews===n.id?null:n.id)} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"8px 0",borderBottom:i<relevantNews.length-1?"1px solid #1e293b":"none",cursor:"pointer",transition:"background .15s"}} onMouseEnter={e=>e.currentTarget.style.background="#252d3d33"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              <span style={{fontSize:10,color:"#475569",whiteSpace:"nowrap",marginTop:2,minWidth:42,fontVariantNumeric:"tabular-nums"}}>{n.time}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                  <span style={{fontSize:10,fontWeight:700,color:n.sentiment==="positive"?"#34d399":"#f87171",letterSpacing:".03em"}}>{n.ticker}</span>
                  <span style={{fontSize:10,color:"#475569"}}>· {n.source}</span>
                </div>
                <div style={{fontSize:12,fontWeight:500,color:"#cbd5e1",lineHeight:1.4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:expandedNews===n.id?"normal":"nowrap"}}>{n.title}</div>
                {expandedNews===n.id&&<div style={{fontSize:11,color:"#94a3b8",marginTop:6,lineHeight:1.5,paddingBottom:4}}>{n.summary}</div>}
              </div>
              <span style={{fontSize:10,color:"#475569",marginTop:3,flexShrink:0}}>{expandedNews===n.id?"▲":"▼"}</span>
            </div>
          </div>)}
        </div>
      </Card>
    </div>

    {/* ── Inmobiliario (al final) ── */}
    <div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <Card title="🏠 Valuación Casa">
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
            <label style={{fontSize:12,color:"#94a3b8"}}>Precio compra USD <input type="number" value={casa.precioCompra} onChange={e=>setCasa(c=>({...c,precioCompra:+e.target.value}))} style={inputSt}/></label>
            <label style={{fontSize:12,color:"#94a3b8"}}>Años <input type="number" value={casa.anios} min={0} onChange={e=>setCasa(c=>({...c,anios:+e.target.value}))} style={{...inputSt,width:60}}/></label>
            <label style={{fontSize:12,color:"#94a3b8"}}>Tasa anual % <input type="number" value={casa.tasaAnual} step={0.5} onChange={e=>setCasa(c=>({...c,tasaAnual:+e.target.value}))} style={{...inputSt,width:70}}/></label>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
            <div style={{background:"#111827",borderRadius:8,padding:"10px 12px",border:"1px solid #1e293b"}}>
              <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",marginBottom:3}}>Valor Actual</div>
              <div style={{fontSize:16,fontWeight:700,color:"#e2e8f0"}}>{fU(casaActual.valor)}</div>
            </div>
            <div style={{background:"#111827",borderRadius:8,padding:"10px 12px",border:"1px solid #1e293b"}}>
              <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",marginBottom:3}}>P&L</div>
              <div style={{fontSize:16,fontWeight:700,color:casaActual.pl>=0?"#34d399":"#f87171"}}>{fU(casaActual.pl)}</div>
            </div>
            <div style={{background:"#111827",borderRadius:8,padding:"10px 12px",border:"1px solid #1e293b"}}>
              <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",marginBottom:3}}>Rend</div>
              <div style={{fontSize:16,fontWeight:700,color:casaActual.rend>=0?"#34d399":"#f87171"}}>{fP(casaActual.rend)}</div>
            </div>
          </div>
        </div>
      </Card>
      <Card title="🏦 Hipoteca BBVA (UVAs)">
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
            <label style={{fontSize:12,color:"#94a3b8"}}>Cant. UVAs <input type="number" value={hipoteca.uvas} onChange={e=>setHipoteca(h=>({...h,uvas:+e.target.value}))} style={{...inputSt,width:120}}/></label>
            <label style={{fontSize:12,color:"#94a3b8"}}>Cotiz. UVA $ <input type="number" value={hipoteca.cotizacionUVA} step={0.01} onChange={e=>setHipoteca(h=>({...h,cotizacionUVA:+e.target.value}))} style={{...inputSt,width:110}}/></label>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
            <div style={{background:"#111827",borderRadius:8,padding:"10px 12px",border:"1px solid #1e293b"}}>
              <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",marginBottom:3}}>Deuda ARS</div>
              <div style={{fontSize:16,fontWeight:700,color:"#fbbf24"}}>${fmt(deudaARS)}</div>
            </div>
            <div style={{background:"#111827",borderRadius:8,padding:"10px 12px",border:"1px solid #1e293b"}}>
              <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",marginBottom:3}}>Deuda USD (MEP)</div>
              <div style={{fontSize:16,fontWeight:700,color:"#f87171"}}>{fU(deudaUSD)}</div>
            </div>
            <div style={{background:"#111827",borderRadius:8,padding:"10px 12px",border:"1px solid #1e293b"}}>
              <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",marginBottom:3}}>MEP usado</div>
              <div style={{fontSize:16,fontWeight:700,color:"#e2e8f0"}}>${fmt(macro.dolarMEP)}</div>
            </div>
          </div>
        </div>
      </Card>
    </div>
  </div>;
}

/* ── OPERACIONES ─────────────────────────── */
function Operaciones({ops,setOps,macro}){
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState({ticker:"",tipo:"COMPRA",cantidad:"",precio:"",mercado:"BYMA",broker:"BM",moneda:"ARS",fecha:"",ccl:""});
  const [filter,setFilter]=useState("");
  const [confirmDel,setConfirmDel]=useState(null);
  const emptyForm={ticker:"",tipo:"COMPRA",cantidad:"",precio:"",mercado:"BYMA",broker:"BM",moneda:"ARS",fecha:"",ccl:""};
  const montoUSD=(op)=>{
    if(op.moneda==="USD") return op.cantidad*op.precio;
    if(op.ccl&&op.ccl>0) return (op.cantidad*op.precio)/op.ccl;
    return null;
  };
  const startEdit=(op)=>{
    setEditId(op.id);
    setForm({ticker:op.ticker,tipo:op.tipo,cantidad:String(op.cantidad),precio:String(op.precio),mercado:op.mercado,broker:op.broker,moneda:op.moneda,fecha:op.fecha,ccl:op.ccl?String(op.ccl):""});
    setShowForm(true);
  };
  const deleteOp=(id)=>{
    setOps(ops.filter(o=>o.id!==id));
    setConfirmDel(null);
  };
  const submit=e=>{
    e.preventDefault();if(!form.ticker||!form.cantidad||!form.precio)return;
    const isARS=form.moneda==="ARS";
    const cclVal=isARS?(form.ccl?parseFloat(form.ccl):macro.dolarCCL):null;
    const opData={ticker:form.ticker.toUpperCase(),tipo:form.tipo,cantidad:parseFloat(form.cantidad),precio:parseFloat(form.precio),mercado:form.mercado,broker:form.broker,moneda:form.moneda,fecha:form.fecha||today(),ccl:cclVal};
    if(editId){
      setOps(ops.map(o=>o.id===editId?{...o,...opData}:o));
      setEditId(null);
    }else{
      setOps([...ops,{id:Date.now(),...opData}]);
    }
    setForm(emptyForm);setShowForm(false);
  };
  const cancelForm=()=>{setShowForm(false);setEditId(null);setForm(emptyForm);};
  const fl=filter?ops.filter(o=>o.ticker.toLowerCase().includes(filter.toLowerCase())):ops;

  return <div style={{display:"flex",flexDirection:"column",gap:18}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <input placeholder="Filtrar por ticker..." value={filter} onChange={e=>setFilter(e.target.value)} style={{width:200}}/>
        <span style={{fontSize:12,color:"#64748b"}}>{fl.length} ops</span>
      </div>
      <Btn onClick={()=>{setEditId(null);setForm(emptyForm);setShowForm(!showForm)}}>+ Nueva Operación</Btn>
    </div>
    {showForm&&<Card title={editId?"Modificar Operación":"Registrar Operación"}>
      <form onSubmit={submit} className="form-grid" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Ticker</label><input value={form.ticker} onChange={e=>setForm({...form,ticker:e.target.value.toUpperCase()})} placeholder="AAPL" required style={{width:"100%"}}/></div>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Tipo</label><select value={form.tipo} onChange={e=>setForm({...form,tipo:e.target.value})} style={{width:"100%"}}><option value="COMPRA">COMPRA</option><option value="VENTA">VENTA</option></select></div>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Cantidad</label><input type="number" value={form.cantidad} onChange={e=>setForm({...form,cantidad:e.target.value})} required style={{width:"100%"}}/></div>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Precio</label><input type="number" step="0.0001" value={form.precio} onChange={e=>setForm({...form,precio:e.target.value})} required style={{width:"100%"}}/></div>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Mercado</label><select value={form.mercado} onChange={e=>setForm({...form,mercado:e.target.value,moneda:e.target.value==="NYSE"||e.target.value==="NASDAQ"?"USD":"ARS"})} style={{width:"100%"}}><option value="BYMA">BYMA</option><option value="NYSE">NYSE</option><option value="NASDAQ">NASDAQ</option></select></div>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Broker</label><select value={form.broker} onChange={e=>setForm({...form,broker:e.target.value})} style={{width:"100%"}}><option value="BM">Bull Market</option><option value="AT">Allaria</option><option value="IOL">IOL</option><option value="PPI">PPI</option></select></div>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Fecha</label><input value={form.fecha} onChange={e=>setForm({...form,fecha:e.target.value})} placeholder="DD-MM-AA" style={{width:"100%"}}/></div>
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          {(form.moneda==="ARS")&&<div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>CCL {!editId&&<span style={{color:"#60a5fa"}}>(auto: ${fmt(macro.dolarCCL)})</span>}</label><input type="number" step="0.01" value={form.ccl} onChange={e=>setForm({...form,ccl:e.target.value})} placeholder={String(macro.dolarCCL)} style={{width:"100%"}}/></div>}
          <div style={{display:"flex",alignItems:"flex-end",gap:8,flex:1,marginTop:4}}><Btn variant="success" onClick={submit} style={{flex:1}}>{editId?"Actualizar":"Guardar"}</Btn><Btn variant="ghost" onClick={cancelForm}>✕</Btn></div>
        </div>
      </form>
    </Card>}
    {confirmDel&&<div style={{background:"#7f1d1d22",border:"1px solid #dc262644",borderRadius:10,padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
      <span style={{fontSize:13,color:"#fca5a5"}}>¿Eliminar la operación de <strong>{ops.find(o=>o.id===confirmDel)?.ticker}</strong> del {ops.find(o=>o.id===confirmDel)?.fecha}?</span>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>deleteOp(confirmDel)} style={{background:"#dc2626",border:"none",color:"#fff",borderRadius:6,padding:"6px 16px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Sí, eliminar</button>
        <button onClick={()=>setConfirmDel(null)} style={{background:"#334155",border:"none",color:"#94a3b8",borderRadius:6,padding:"6px 16px",fontSize:12,cursor:"pointer"}}>Cancelar</button>
      </div>
    </div>}
    <Card>
      <div className="table-wrap" style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:950}}>
          <thead><tr>{["Fecha","Ticker","Tipo","Cantidad","Precio","CCL","Monto ARS","Monto USD","Broker",""].map(h2=><th key={h2} style={{padding:"10px 8px",textAlign:["Fecha","Ticker","Tipo",""].includes(h2)?"left":"right",fontSize:11,fontWeight:600,color:"#64748b",textTransform:"uppercase",borderBottom:"1px solid #252d3d",background:"#151a27"}}>{h2}</th>)}</tr></thead>
          <tbody>{[...fl].reverse().map(op=>{const usd=montoUSD(op);return <tr key={op.id} style={{borderBottom:"1px solid #1e293b",background:editId===op.id?"#2563eb11":"transparent"}} onMouseEnter={e=>{if(editId!==op.id)e.currentTarget.style.background="#252d3d33"}} onMouseLeave={e=>{if(editId!==op.id)e.currentTarget.style.background=editId===op.id?"#2563eb11":"transparent"}}>
            <td style={{padding:"10px 8px",fontSize:13}}>{op.fecha}</td>
            <td style={{padding:"10px 8px",fontWeight:700,fontSize:14}}>{op.ticker}</td>
            <td style={{padding:"10px 8px"}}><Badge text={op.tipo} color={op.tipo==="COMPRA"?"#34d399":"#f87171"} bg={op.tipo==="COMPRA"?"#065f4622":"#7f1d1d22"}/></td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{fmt(op.cantidad)}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{op.moneda==="USD"?fU(op.precio):`$${fmt(op.precio)}`}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:12,color:op.ccl?"#60a5fa":"#334155"}}>{op.ccl?`$${fmt(op.ccl,2)}`:"—"}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{op.moneda==="ARS"?`$${fmt(op.cantidad*op.precio)}`:"—"}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontWeight:600,color:"#f1f5f9"}}>{usd!=null?fU(usd):"—"}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontSize:12,color:"#94a3b8"}}>{op.broker}</td>
            <td style={{padding:"10px 8px",whiteSpace:"nowrap"}}>
              <button onClick={()=>startEdit(op)} title="Editar" style={{background:"none",border:"none",cursor:"pointer",padding:"4px 6px",fontSize:14,opacity:.5,transition:"opacity .15s"}} onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=.5}>✏️</button>
              <button onClick={()=>setConfirmDel(op.id)} title="Eliminar" style={{background:"none",border:"none",cursor:"pointer",padding:"4px 6px",fontSize:14,opacity:.5,transition:"opacity .15s"}} onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=.5}>🗑</button>
            </td>
          </tr>})}</tbody>
        </table>
      </div>
    </Card>
  </div>;
}

/* ── ALERTAS ──────────────────────────────── */
function Alertas({alerts,setAlerts,prices,pos}){
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({ticker:"",condition:"above",price:""});
  const add=e=>{e.preventDefault();if(!form.ticker||!form.price)return;setAlerts([...alerts,{id:Date.now(),ticker:form.ticker.toUpperCase(),condition:form.condition,price:parseFloat(form.price),active:true}]);setForm({ticker:"",condition:"above",price:""});setShowForm(false);};

  return <div style={{display:"flex",flexDirection:"column",gap:18}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
      <div><h2 style={{margin:0,fontSize:18,fontWeight:700}}>Alertas de Precio</h2><p style={{margin:"4px 0 0",fontSize:13,color:"#64748b"}}>Configurá alertas para monitorear precios.</p></div>
      <Btn onClick={()=>setShowForm(!showForm)}>+ Nueva Alerta</Btn>
    </div>
    {showForm&&<Card title="Crear Alerta">
      <form onSubmit={add} style={{display:"flex",gap:12,alignItems:"flex-end",flexWrap:"wrap"}}>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Ticker</label><select value={form.ticker} onChange={e=>setForm({...form,ticker:e.target.value})} required style={{minWidth:120}}><option value="">Seleccionar...</option>{pos.map(p=><option key={p.ticker} value={p.ticker}>{p.ticker}</option>)}</select></div>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Condición</label><select value={form.condition} onChange={e=>setForm({...form,condition:e.target.value})} style={{minWidth:160}}><option value="above">Sube por encima de</option><option value="below">Baja por debajo de</option></select></div>
        <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Precio USD</label><input type="number" step="0.0001" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} required style={{width:130}}/></div>
        <Btn variant="success" onClick={add}>Crear</Btn>
      </form>
    </Card>}
    <div style={{display:"grid",gap:10}}>
      {alerts.map(a=>{const p=prices[a.ticker];const trig=a.active&&p&&(a.condition==="above"?p.price>=a.price:p.price<=a.price);
        return <div key={a.id} style={{background:trig?"#dc262612":"#1a1f2e",border:`1px solid ${trig?"#dc262644":"#252d3d"}`,borderRadius:10,padding:"16px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,animation:trig?"pulse 2s infinite":"none"}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:40,height:40,borderRadius:8,background:trig?"#dc262622":"#252d3d",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{a.condition==="above"?"📈":"📉"}</div>
            <div>
              <div style={{fontWeight:700,fontSize:16}}>{a.ticker}</div>
              <div style={{fontSize:12,color:"#64748b"}}>{a.condition==="above"?"Sube por encima de":"Baja por debajo de"} <strong style={{color:"#e2e8f0"}}>{fU(a.price)}</strong></div>
              <div style={{fontSize:11,color:"#64748b",marginTop:2}}>Actual: <span style={{color:p?.change>=0?"#34d399":"#f87171",fontWeight:600}}>{fU(p?.price)}</span></div>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            {trig&&<Badge text="ACTIVADA" color="#fca5a5" bg="#dc262633"/>}
            <button onClick={()=>setAlerts(alerts.map(x=>x.id===a.id?{...x,active:!x.active}:x))} style={{background:a.active?"#065f4622":"#334155",border:`1px solid ${a.active?"#065f4644":"#475569"}`,color:a.active?"#34d399":"#64748b",borderRadius:6,padding:"6px 12px",fontSize:11,cursor:"pointer",fontWeight:500}}>{a.active?"Activa":"Pausada"}</button>
            <button onClick={()=>setAlerts(alerts.filter(x=>x.id!==a.id))} style={{background:"none",border:"none",color:"#64748b",cursor:"pointer",padding:4,fontSize:16}}>🗑</button>
          </div>
        </div>;
      })}
    </div>
    {alerts.length===0&&<div style={{textAlign:"center",padding:60,color:"#475569"}}><div style={{fontSize:48}}>🔔</div><p style={{marginTop:12,fontSize:14}}>No tenés alertas configuradas.</p></div>}
  </div>;
}

/* ── NOTICIAS ────────────────────────────── */
function Noticias({pos}){
  const [sel,setSel]=useState("Todos");
  const tickers=pos.map(p=>p.ticker);
  const fl=sel==="Todos"?NEWS:NEWS.filter(n=>n.ticker===sel);
  const sc2={positive:"#34d399",negative:"#f87171"};
  const sb2={positive:"#065f4622",negative:"#7f1d1d22"};
  const sl2={positive:"Positivo",negative:"Negativo"};

  return <div style={{display:"flex",flexDirection:"column",gap:18}}>
    <div><h2 style={{margin:0,fontSize:18,fontWeight:700}}>Noticias del Portfolio</h2><p style={{margin:"4px 0 0",fontSize:13,color:"#64748b"}}>Feed de noticias relevantes para tus activos.</p></div>
    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      <button onClick={()=>setSel("Todos")} style={{background:sel==="Todos"?"#2563eb":"#1e293b",border:`1px solid ${sel==="Todos"?"#2563eb":"#334155"}`,color:sel==="Todos"?"#fff":"#94a3b8",borderRadius:6,padding:"5px 12px",fontSize:12,cursor:"pointer",fontWeight:500}}>Todos</button>
      {tickers.map(t=><button key={t} onClick={()=>setSel(t)} style={{background:sel===t?"#2563eb":"#1e293b",border:`1px solid ${sel===t?"#2563eb":"#334155"}`,color:sel===t?"#fff":"#94a3b8",borderRadius:6,padding:"5px 12px",fontSize:12,cursor:"pointer",fontWeight:500}}>{t}</button>)}
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {fl.map((n,i)=><div key={n.id} style={{background:"#1a1f2e",border:"1px solid #252d3d",borderRadius:10,padding:"18px 20px",animation:`slideIn .3s ease ${i*.05}s both`}} onMouseEnter={e=>e.currentTarget.style.borderColor="#334155"} onMouseLeave={e=>e.currentTarget.style.borderColor="#252d3d"}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}><Badge text={n.ticker} color="#60a5fa"/><Badge text={sl2[n.sentiment]} color={sc2[n.sentiment]} bg={sb2[n.sentiment]}/></div>
          <span style={{fontSize:11,color:"#475569"}}>Hace {n.time}</span>
        </div>
        <h4 style={{margin:"0 0 6px",fontSize:15,fontWeight:600,color:"#f1f5f9",lineHeight:1.4}}>{n.title}</h4>
        <p style={{margin:"0 0 8px",fontSize:13,color:"#94a3b8",lineHeight:1.5}}>{n.summary}</p>
        <div style={{fontSize:11,color:"#475569"}}>{n.source}</div>
      </div>)}
    </div>
  </div>;
}

/* ── HELPERS PERSISTENCIA ────────────────── */
function loadLS(key,fallback){try{const v=localStorage.getItem("eid_"+key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function saveLS(key,val){try{localStorage.setItem("eid_"+key,JSON.stringify(val))}catch(e){}}

const INIT_ALERTS=[{id:1,ticker:"YPFD",condition:"above",price:42,active:true},{id:2,ticker:"IBM",condition:"below",price:230,active:true},{id:3,ticker:"MELI",condition:"above",price:15,active:true}];
const INIT_CASA={precioCompra:398000,anios:1,tasaAnual:4};
const INIT_HIPOTECA={uvas:200696,cotizacionUVA:1858.61};

/* ── GIST SYNC ENGINE ───────────────────── */
const GIST_FILENAME="fin-cloud-data.json";

async function gistSave(token,gistId,data){
  const body={files:{[GIST_FILENAME]:{content:JSON.stringify(data,null,2)}}};
  const url=gistId
    ?`https://api.github.com/gists/${gistId}`
    :"https://api.github.com/gists";
  const method=gistId?"PATCH":"POST";
  if(!gistId) body.description="Fin-Cloud Dashboard Data (auto-sync)";
  if(!gistId) body.public=false;
  const res=await fetch(url,{method,headers:{"Authorization":`token ${token}`,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok) throw new Error(`GitHub ${res.status}`);
  return res.json();
}

async function gistLoad(token,gistId){
  const res=await fetch(`https://api.github.com/gists/${gistId}`,{headers:{"Authorization":`token ${token}`}});
  if(!res.ok) throw new Error(`GitHub ${res.status}`);
  const g=await res.json();
  const content=g.files[GIST_FILENAME]?.content;
  return content?JSON.parse(content):null;
}

/* ── PANEL CONFIG (token + gist id) ──────── */
function SyncConfigPanel({onClose}){
  const [token,setToken]=useState(loadLS("gh_token",""));
  const [gistId,setGistId]=useState(loadLS("gist_id",""));
  const [status,setStatus]=useState("");
  const [testing,setTesting]=useState(false);

  const testConnection=async()=>{
    setTesting(true);setStatus("");
    try{
      const res=await fetch("https://api.github.com/user",{headers:{"Authorization":`token ${token}`}});
      if(!res.ok) throw new Error("Token inválido");
      const u=await res.json();
      setStatus(`✅ Conectado como ${u.login}`);
      saveLS("gh_token",token);
      if(gistId){saveLS("gist_id",gistId)}
    }catch(e){setStatus("❌ "+e.message)}
    setTesting(false);
  };

  const btnSt={background:"#2563eb",border:"none",color:"#fff",borderRadius:6,padding:"8px 16px",fontSize:13,cursor:"pointer",fontWeight:600};
  const inpSt={background:"#1e293b",border:"1px solid #334155",borderRadius:6,padding:"8px 12px",color:"#e2e8f0",fontSize:13,width:"100%",outline:"none"};

  return <div style={{position:"fixed",inset:0,background:"#000c",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
    <div style={{background:"#1a1f2e",border:"1px solid #252d3d",borderRadius:12,padding:24,maxWidth:480,width:"100%"}} onClick={e=>e.stopPropagation()}>
      <h3 style={{margin:"0 0 4px",fontSize:18,fontWeight:700}}>Configurar Sync</h3>
      <p style={{margin:"0 0 16px",fontSize:13,color:"#94a3b8"}}>Configurá una vez y tus datos se sincronizan automáticamente entre todos tus dispositivos.</p>

      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div>
          <label style={{fontSize:12,color:"#64748b",display:"block",marginBottom:4}}>GitHub Personal Access Token</label>
          <input type="password" value={token} onChange={e=>setToken(e.target.value)} placeholder="ghp_xxxxxxxxxxxx" style={inpSt}/>
          <div style={{fontSize:11,color:"#475569",marginTop:4}}>
            Crealo en: <a href="https://github.com/settings/tokens/new?scopes=gist&description=Fin-Cloud-Sync" target="_blank" rel="noopener" style={{color:"#60a5fa"}}>github.com/settings/tokens</a> → solo marcá "gist"
          </div>
        </div>

        <div>
          <label style={{fontSize:12,color:"#64748b",display:"block",marginBottom:4}}>Gist ID (se crea solo la primera vez, dejalo vacío)</label>
          <input value={gistId} onChange={e=>{setGistId(e.target.value);saveLS("gist_id",e.target.value)}} placeholder="Se genera automáticamente" style={inpSt}/>
        </div>

        {status&&<div style={{fontSize:13,padding:"8px 12px",borderRadius:6,background:status.startsWith("✅")?"#065f4622":"#7f1d1d22",color:status.startsWith("✅")?"#34d399":"#f87171"}}>{status}</div>}

        <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:4}}>
          <button onClick={onClose} style={{...btnSt,background:"#334155"}}>Cerrar</button>
          <button onClick={testConnection} disabled={testing||!token} style={{...btnSt,opacity:testing||!token?.5:1}}>{testing?"Probando...":"Probar Conexión"}</button>
        </div>
      </div>
    </div>
  </div>;
}

/* ── APP ─────────────────────────────────── */
function App(){
  const [tab,setTab]=useState("resumen");
  const [ops,setOps]=useState(()=>loadLS("ops",INIT_OPS));
  const [alerts,setAlerts]=useState(()=>loadLS("alerts",INIT_ALERTS));
  const [prices,setPrices]=useState(LIVE);
  const [macro]=useState(MACRO);
  const [lastUp,setLastUp]=useState(new Date());
  const [showConfig,setShowConfig]=useState(false);
  const [syncStatus,setSyncStatus]=useState("idle"); /* idle | syncing | ok | error */
  const [lastSync,setLastSync]=useState(null);
  const syncTimer=React.useRef(null);
  const isFirstLoad=React.useRef(true);

  /* Inmobiliario */
  const [casa,setCasa]=useState(()=>loadLS("casa",INIT_CASA));
  const [hipoteca,setHipoteca]=useState(()=>loadLS("hipoteca",INIT_HIPOTECA));

  /* Persistir en localStorage siempre */
  useEffect(()=>{saveLS("ops",ops)},[ops]);
  useEffect(()=>{saveLS("alerts",alerts)},[alerts]);
  useEffect(()=>{saveLS("casa",casa)},[casa]);
  useEffect(()=>{saveLS("hipoteca",hipoteca)},[hipoteca]);

  /* ── Auto-load desde Gist al abrir ──── */
  useEffect(()=>{
    const token=loadLS("gh_token","");
    const gistId=loadLS("gist_id","");
    if(!token||!gistId){isFirstLoad.current=false;return;}
    setSyncStatus("syncing");
    gistLoad(token,gistId).then(d=>{
      if(d){
        if(d.ops)setOps(d.ops);
        if(d.alerts)setAlerts(d.alerts);
        if(d.casa)setCasa(d.casa);
        if(d.hipoteca)setHipoteca(d.hipoteca);
      }
      setSyncStatus("ok");setLastSync(new Date());
      setTimeout(()=>{isFirstLoad.current=false},500);
    }).catch(()=>{setSyncStatus("error");isFirstLoad.current=false});
  },[]);

  /* ── Auto-save a Gist con debounce de 3s ──── */
  const doGistSave=useCallback(()=>{
    const token=loadLS("gh_token","");
    if(!token)return;
    const gistId=loadLS("gist_id","");
    const data={ops,alerts,casa,hipoteca,lastSaved:new Date().toISOString()};
    setSyncStatus("syncing");
    gistSave(token,gistId,data).then(g=>{
      if(!gistId&&g.id){saveLS("gist_id",g.id)}
      setSyncStatus("ok");setLastSync(new Date());
    }).catch(()=>setSyncStatus("error"));
  },[ops,alerts,casa,hipoteca]);

  useEffect(()=>{
    if(isFirstLoad.current)return;
    const token=loadLS("gh_token","");
    if(!token)return;
    if(syncTimer.current)clearTimeout(syncTimer.current);
    syncTimer.current=setTimeout(doGistSave,3000);
    return()=>{if(syncTimer.current)clearTimeout(syncTimer.current)};
  },[ops,alerts,casa,hipoteca,doGistSave]);

  /* Exportar datos como JSON (backup local) */
  const exportData=useCallback(()=>{
    const data={ops,alerts,casa,hipoteca,exportDate:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="fin-cloud-backup-"+new Date().toISOString().slice(0,10)+".json";
    a.click();URL.revokeObjectURL(url);
  },[ops,alerts,casa,hipoteca]);

  /* Resetear a datos originales */
  const resetData=useCallback(()=>{
    if(!confirm("¿Estás seguro? Esto borra todos tus cambios y vuelve a los datos iniciales."))return;
    setOps(INIT_OPS);setAlerts(INIT_ALERTS);setCasa(INIT_CASA);setHipoteca(INIT_HIPOTECA);
  },[]);

  /* Posiciones derivadas 100% de operaciones */
  const pos=useMemo(()=>calcPositions(ops),[ops]);

  /* Cálculos inmobiliarios */
  const casaActual=useMemo(()=>{
    const val=casa.precioCompra*Math.pow(1+casa.tasaAnual/100,casa.anios);
    const pl=val-casa.precioCompra;
    const rend=(pl/casa.precioCompra)*100;
    return{valor:val,pl,rend};
  },[casa]);
  const deudaUSD=useMemo(()=>{
    const deudaARS=hipoteca.uvas*hipoteca.cotizacionUVA;
    return deudaARS/macro.dolarMEP;
  },[hipoteca,macro]);

  useEffect(()=>{
    const iv=setInterval(()=>{
      setPrices(prev=>{const u={...prev};const ts=Object.keys(u);const t=ts[Math.floor(Math.random()*ts.length)];const v=(Math.random()-.48)*.02;const np=u[t].price*(1+v);const nc=((np-u[t].prev)/u[t].prev)*100;u[t]={...u[t],price:np,change:nc};return u;});
      setLastUp(new Date());
    },4000);
    return()=>clearInterval(iv);
  },[]);

  const enriched=useMemo(()=>pos.map(p=>{
    const l=prices[p.ticker]||{price:p.ppc,change:0};const mi=p.cantidad*p.ppc;const ma=p.cantidad*l.price;const pl=ma-mi;const r=mi>0?(pl/mi)*100:0;
    return{...p,precioActual:l.price,variacion:l.change,montoInvertido:mi,montoActual:ma,pl,rendimiento:r};
  }),[pos,prices]);

  const total=useMemo(()=>enriched.reduce((s,p)=>s+p.montoActual,0),[enriched]);
  const invertido=useMemo(()=>enriched.reduce((s,p)=>s+p.montoInvertido,0),[enriched]);
  const pl=total-invertido;const rend=invertido>0?(pl/invertido)*100:0;
  const trigAlerts=useMemo(()=>alerts.filter(a=>a.active&&prices[a.ticker]&&(a.condition==="above"?prices[a.ticker].price>=a.price:prices[a.ticker].price<=a.price)),[alerts,prices]);

  /* Patrimonio total incluyendo inmueble neto */
  const patrimonioNeto=total+casaActual.valor-deudaUSD;

  const tabs=[{id:"resumen",label:"Resumen",emoji:"🏠"},{id:"operaciones",label:"Operaciones",emoji:"📝"},{id:"alertas",label:"Alertas",emoji:"🔔"},{id:"noticias",label:"Noticias",emoji:"📰"}];

  return <div style={{minHeight:"100vh"}}>
    <header style={{background:"linear-gradient(90deg,#111827,#1e293b)",borderBottom:"1px solid #1e293b",padding:"12px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <div style={{width:36,height:36,borderRadius:8,background:"linear-gradient(135deg,#2563eb,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:16,color:"#fff",flexShrink:0}}>EI</div>
        <div>
          <h1 className="hdr-title" style={{margin:0,fontSize:18,fontWeight:700,color:"#f1f5f9",letterSpacing:"-.02em"}}>Financial Dashboard</h1>
          <span style={{fontSize:11,color:"#64748b"}}>Actualizado: {lastUp.toLocaleTimeString("es-AR")}</span>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        {trigAlerts.length>0&&<div style={{background:"#dc262622",border:"1px solid #dc262655",borderRadius:6,padding:"4px 10px",fontSize:12,color:"#fca5a5",display:"flex",alignItems:"center",gap:6,animation:"pulse 2s infinite"}}>🔔 {trigAlerts.length} alerta{trigAlerts.length>1?"s":""}</div>}
        <div className="macro-strip" style={{display:"flex",gap:12,fontSize:10}}>
          {(()=>{
            const of1=macro.dolarOficial;
            const bMEP=((macro.dolarMEP-of1)/of1*100).toFixed(1);
            const bCCL=((macro.dolarCCL-of1)/of1*100).toFixed(1);
            const bBlue=((macro.dolarBlue-of1)/of1*100).toFixed(1);
            return[
              {l:"Oficial",v:`$${fmt(of1)}`},
              {l:"MEP",v:`$${fmt(macro.dolarMEP)}`,brecha:bMEP},
              {l:"CCL",v:`$${fmt(macro.dolarCCL)}`,brecha:bCCL},
              {l:"Blue",v:`$${fmt(macro.dolarBlue)}`,brecha:bBlue},
              {l:"Riesgo País",v:String(macro.riesgoPais)+" bp"},
              {l:"Inflación",v:`${fmt(macro.inflacion,1)}%`},
              {l:"Tasa",v:`${fmt(macro.tasa,1)}%`},
              {l:"UVA",v:`$${fmt(macro.uva,2)}`}
            ].map(i=><div key={i.l} style={{textAlign:"center",minWidth:48}}>
              <div style={{color:"#475569",marginBottom:1,whiteSpace:"nowrap"}}>{i.l}</div>
              <div style={{fontWeight:600,color:"#94a3b8",fontVariantNumeric:"tabular-nums",whiteSpace:"nowrap"}}>{i.v}</div>
              {i.brecha&&<div style={{fontSize:9,color:+i.brecha>0?"#fbbf24":"#34d399",fontWeight:500}}>+{i.brecha}%</div>}
            </div>);
          })()}
        </div>
      </div>
    </header>
    <nav className="nav-bar" style={{background:"#111827",borderBottom:"1px solid #1e293b",display:"flex",gap:0,padding:"0 20px",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",gap:0}}>
        {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{background:"none",border:"none",color:tab===t.id?"#60a5fa":"#64748b",padding:"12px 16px",cursor:"pointer",fontSize:13,fontWeight:tab===t.id?600:400,borderBottom:tab===t.id?"2px solid #2563eb":"2px solid transparent",display:"flex",alignItems:"center",gap:6,transition:"all .15s",whiteSpace:"nowrap"}}>{t.emoji} {t.label}</button>)}
      </div>
      <div style={{display:"flex",gap:6,alignItems:"center",paddingRight:4}}>
        {syncStatus==="syncing"&&<span style={{fontSize:11,color:"#fbbf24",animation:"pulse 1s infinite"}}>⏳ Sincronizando...</span>}
        {syncStatus==="ok"&&<span style={{fontSize:11,color:"#34d399"}} title={lastSync?"Último sync: "+lastSync.toLocaleTimeString("es-AR"):""}>☁️ Sync OK</span>}
        {syncStatus==="error"&&<span style={{fontSize:11,color:"#f87171"}}>⚠ Error sync</span>}
        {syncStatus==="idle"&&!loadLS("gh_token","")&&<span style={{fontSize:11,color:"#64748b"}}>☁️ Sin sync</span>}
        <button onClick={()=>setShowConfig(true)} title="Configurar sincronización" style={{background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>⚙️ Sync</button>
        <button onClick={exportData} title="Backup local JSON" style={{background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>💾</button>
        <button onClick={resetData} title="Resetear datos" style={{background:"#1e293b",border:"1px solid #7f1d1d44",color:"#f87171",borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>🔄</button>
      </div>
    </nav>
    {showConfig&&<SyncConfigPanel onClose={()=>setShowConfig(false)}/>}
    <main className="main-content" style={{padding:24,maxWidth:1400,margin:"0 auto"}}>
      {tab==="resumen"&&<Resumen enriched={enriched} total={total} invertido={invertido} pl={pl} rend={rend} macro={macro} ops={ops} trigAlerts={trigAlerts} prices={prices} casa={casa} setCasa={setCasa} casaActual={casaActual} hipoteca={hipoteca} setHipoteca={setHipoteca} deudaUSD={deudaUSD} patrimonioNeto={patrimonioNeto}/>}
      {tab==="operaciones"&&<Operaciones ops={ops} setOps={setOps} macro={macro}/>}
      {tab==="alertas"&&<Alertas alerts={alerts} setAlerts={setAlerts} prices={prices} pos={pos}/>}
      {tab==="noticias"&&<Noticias pos={pos}/>}
    </main>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
