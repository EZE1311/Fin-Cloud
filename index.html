const fmt=(n,d=0)=>{if(n==null||isNaN(n))return"—";return new Intl.NumberFormat("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n)};
const fU=n=>{if(n==null||isNaN(n))return"—";const abs=Math.abs(n);const d=abs<0.01?6:abs<1?4:2;return`USD ${fmt(n,d)}`;};
const fP=n=>n==null||isNaN(n)?"—":`${n>=0?"+":""}${fmt(n,2)}%`;

const todayISO=()=>{const d=new Date();return d.toISOString().split("T")[0]};
const toISO=(ddmmyy)=>{if(!ddmmyy)return"";const p=ddmmyy.split("-");if(p.length!==3)return"";const yy=parseInt(p[2],10);const yyyy=yy<50?2000+yy:1900+yy;return`${yyyy}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`};
const fromISO=(iso)=>{if(!iso)return"";const p=iso.split("-");if(p.length!==3)return"";return`${p[2]}-${p[1]}-${p[0].slice(2)}`};

/* ── SVG Charts ──────────────────────────── */
/* 3D Pie with labels near slices + leader lines */
function Pie3D({data,width=460,height=320}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0)return null;
  const cx=width/2,cy=140,rx=110,ry=60,depth=16;
  let cum=0;
  const slices=data.map(d=>{const pct=d.value/total;const s0=cum;cum+=pct;return{...d,pct,s0,s1:cum};});

  function ep(angle,eCy,r1,r2){return[cx+(r1||rx)*Math.cos(angle),eCy+(r2||ry)*Math.sin(angle)]}
  function slicePath(s0,s1,eCy){
    const a0=s0*2*Math.PI-Math.PI/2,a1=s1*2*Math.PI-Math.PI/2;
    const large=s1-s0>.5?1:0;
    const[x0,y0]=ep(a0,eCy);const[x1,y1]=ep(a1,eCy);
    return`M ${cx} ${eCy} L ${x0} ${y0} A ${rx} ${ry} 0 ${large} 1 ${x1} ${y1} Z`;
  }
  function sidePath(s0,s1){
    const a0=s0*2*Math.PI-Math.PI/2,a1=s1*2*Math.PI-Math.PI/2;
    const steps=Math.max(2,Math.ceil((a1-a0)/(Math.PI/20)));
    let d="";
    for(let i=0;i<=steps;i++){const a=a0+(a1-a0)*(i/steps);const[x,y]=ep(a,cy);d+=(i===0?"M":"L")+` ${x} ${y}`;}
    for(let i=steps;i>=0;i--){const a=a0+(a1-a0)*(i/steps);const[x,y]=ep(a,cy+depth);d+=`L ${x} ${y}`;}
    return d+"Z";
  }
  const sides=slices.filter(s=>{const a0=s.s0*2*Math.PI-Math.PI/2,a1=s.s1*2*Math.PI-Math.PI/2;return a1>0&&a0<Math.PI;}).map(s=>{
    const a0=Math.max(s.s0*2*Math.PI-Math.PI/2,0);const a1=Math.min(s.s1*2*Math.PI-Math.PI/2,Math.PI);
    return{...s,sa0:a0,sa1:a1};
  });

  /* Label positions — near each slice with leader line + collision avoidance */
  const rawLabels=slices.filter(s=>s.pct>=.02).map(s=>{
    const midAngle=(s.s0+s.s1)/2*2*Math.PI-Math.PI/2;
    const[ix,iy]=ep(midAngle,cy,rx*0.72,ry*0.72);
    const[ox,oy]=ep(midAngle,cy,rx+28,ry+28);
    const anchor=ox<cx?"end":"start";
    const lx=ox<cx?ox-4:ox+4;
    return{...s,ix,iy,ox,oy,lx,ly:oy,anchor,midAngle};
  });
  /* Push apart labels that overlap vertically (min 18px gap) */
  const labels=[...rawLabels].sort((a,b)=>a.ly-b.ly);
  for(let i=1;i<labels.length;i++){
    const prev=labels[i-1],cur=labels[i];
    if(Math.abs(cur.ly-prev.ly)<18&&Math.abs(cur.lx-prev.lx)<60){
      const mid=(prev.ly+cur.ly)/2;
      prev.ly=mid-9;prev.oy=mid-9;
      cur.ly=mid+9;cur.oy=mid+9;
    }
  }

  return <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{display:"block",margin:"0 auto"}}>
    {sides.map((s,i)=><path key={"s"+i} d={sidePath(s.sa0/(2*Math.PI)+.25,s.sa1/(2*Math.PI)+.25)} fill={s.color} opacity={.5}/>)}
    {slices.map((s,i)=><path key={"b"+i} d={slicePath(s.s0,s.s1,cy+depth)} fill={s.color} opacity={.25}/>)}
    {slices.map((s,i)=><path key={"t"+i} d={slicePath(s.s0,s.s1,cy)} fill={s.color} stroke="#08090d" strokeWidth={.5}/>)}
    {/* Leader lines + labels */}
    {labels.map((l,i)=><g key={"l"+i}>
      <line x1={l.ix} y1={l.iy} x2={l.ox} y2={l.oy} stroke={l.color} strokeWidth={1} opacity={.6}/>
      <circle cx={l.ox} cy={l.oy} r={2} fill={l.color}/>
      <text x={l.lx} y={l.ly-6} textAnchor={l.anchor} fill="#e6edf3" fontSize="11" fontWeight="700">{l.name}</text>
      <text x={l.lx} y={l.ly+7} textAnchor={l.anchor} fill="#c1c8d4" fontSize="10" fontWeight="500">{(l.pct*100).toFixed(1)}%</text>
    </g>)}
  </svg>;
}

function HBarChart({data,height:h2=220}){
  const max=Math.max(...data.map(d=>d.value));
  const total=data.reduce((s,d)=>s+d.value,0);
  const barH=Math.min(28,h2/data.length-6);
  return(
    <svg width="100%" height={h2} viewBox={`0 0 440 ${h2}`} preserveAspectRatio="xMidYMid meet">
      {data.map((d,i)=>{
        const y=i*(barH+6)+4;const w=max>0?(d.value/max)*230:0;const pct=total>0?(d.value/total*100).toFixed(1):0;
        return <g key={i}>
          <text x={105} y={y+barH/2+4} textAnchor="end" fill="#e6edf3" fontSize="12" fontWeight="600">{d.name}</text>
          <rect x={110} y={y} width={w} height={barH} rx={3} fill={d.color} opacity={.85}/>
          <text x={115+w} y={y+barH/2+4} fill="#c1c8d4" fontSize="11" fontWeight="600">{pct}% · ${(d.value/1000).toFixed(0)}k</text>
        </g>;
      })}
    </svg>
  );
}

const SC_AUTO_COLORS=["#0ea5e9","#d946ef","#f43f5e","#14b8a6","#fb923c","#a3e635","#818cf8","#f59e0b","#2dd4bf","#c084fc"];

const META_CACHE_KEY="eid_ticker_meta";

/* Traducciones de sector Yahoo → español */
const SECTOR_MAP={"Technology":"Tecnología","Energy":"Energía","Healthcare":"Salud","Financial Services":"Finanzas","Consumer Cyclical":"Consumo","Consumer Defensive":"Consumo","Communication Services":"Comunicación","Industrials":"Industrial","Basic Materials":"Materiales","Real Estate":"Real Estate","Utilities":"Servicios Públicos"};

/* Buscar sector + nombre de empresa de Yahoo Finance */
async function fetchProfileYahoo(symbol){
  const usaSym=d912Sym(symbol,D912_USA_ALIAS);
  /* Intentar múltiples variantes del símbolo: original, alias USA, y con sufijo .BA (BYMA) */
  const candidates=[usaSym];
  if(usaSym===symbol.toUpperCase()&&!usaSym.includes("."))candidates.push(usaSym+".BA");
  for(const sym of candidates){
    const url=`https://query1.finance.yahoo.com/v10/finance/quoteSummary/${encodeURIComponent(sym)}?modules=assetProfile,price`;
    try{
      let r;
      try{r=await fetch(url);}catch(e){r=await fetch(PROXY+encodeURIComponent(url));}
      if(!r||!r.ok)continue;
      const data=await r.json();
      const res=data?.quoteSummary?.result?.[0];
      if(!res)continue;
      const profile=res?.assetProfile;
      const price=res?.price;
      const sector=profile?.sector?SECTOR_MAP[profile.sector]||profile.sector:null;
      const name=price?.shortName||price?.longName||null;
      const country=profile?.country||null;
      if(sector||name)return{sector,name,country};
    }catch(e){}
  }
  return{sector:null,name:null,country:null};
}

/* Construir metadata para un ticker basándose en data912 membership + Yahoo sector */
function inferMeta(ticker,broker,mercado,d912Info){
  const tu=ticker.toUpperCase();
  /* Tipo y país desde data912 */
  let tipo="Acción",pais="USA";
  if(d912Info){
    if(d912Info.isBond){tipo="Bono";pais="Argentina";}
    else if(d912Info.isCedear){tipo="CEDEAR";pais=broker==="BM"?"Argentina":"USA";}
    else if(d912Info.isArgStock){tipo="Acción";pais="Argentina";}
    else if(d912Info.isUsaStock){tipo="Acción";pais="USA";}
  } else {
    /* Fallback por broker/mercado + Yahoo country */
    const cache=loadMetaCache();
    const yahooCountry=(cache[tu]?.country||"").toLowerCase();
    if(mercado==="BYMA"){
      pais="Argentina";
      /* Si Yahoo dice que es de Argentina → acción local, sino → CEDEAR */
      tipo=(yahooCountry.includes("argentin"))?"Acción":"CEDEAR";
    }
    else{pais="USA";tipo="Acción";}
  }
  return{tipo,pais};
}

/* ── Comisiones Bull Market — Active Trader Plus ── */
/* Calcula comisión total (broker + derecho mercado + IVA si aplica) sobre un monto */
function calcComision(monto, broker, tipo){
  if(broker!=="BM") return 0; /* CS u otros brokers USA: sin comisión */
  const IVA=1.21;
  /* Bonos, Letras, ONs → exentos de IVA */
  const exento=tipo==="Bono"||tipo==="Letra"||tipo==="ON";
  let comBroker, derechoMercado;
  if(tipo==="Bono"||tipo==="ON"){
    comBroker=0.0010; derechoMercado=0.0001; /* 0.10% + 0.01% */
  } else if(tipo==="Letra"){
    comBroker=0.0010; derechoMercado=0.00001; /* 0.10% + 0.001% */
  } else {
    /* Acciones, CEDEARs */
    comBroker=0.0010; derechoMercado=0.0008; /* 0.10% + 0.08% */
  }
  const subtotal=monto*(comBroker+derechoMercado);
  return exento?subtotal:subtotal*IVA;
}

/* ── Caución calculation (shared by Caucion tab + Resumen) ── */
const CAUCION_DER_MERCADO_DIARIO=0.00045/90;
const CAUCION_GTO_GTIA_DIARIO=0.00045/90;
const CAUCION_IVA=0.21;
const CAUCION_COM_TOMADORA_MENSUAL=0.005;
const CAUCION_COM_COLOCADORA_MENSUAL=0.00083;

function calcCaucion(m,tna,d,esColocadora){
  if(m<=0||d<=0)return null;
  const tasaDecimal=tna/100;
  const tasa=tasaDecimal*d/365;
  const interes=m*tasa;
  const montoFuturo=m+interes;
  const comMensual=esColocadora?CAUCION_COM_COLOCADORA_MENSUAL:CAUCION_COM_TOMADORA_MENSUAL;
  const comision=montoFuturo*comMensual*d/30;
  const derMercado=montoFuturo*CAUCION_DER_MERCADO_DIARIO*d;
  const gtoGtia=esColocadora?0:montoFuturo*CAUCION_GTO_GTIA_DIARIO*d;
  const gastos=comision+derMercado+gtoGtia;
  const iva=gastos*CAUCION_IVA;
  const totalGastos=gastos+iva;
  const hoy=new Date();const venc=new Date(hoy);venc.setDate(venc.getDate()+d);
  const fmtDate=dt=>`${String(dt.getDate()).padStart(2,"0")}/${String(dt.getMonth()+1).padStart(2,"0")}/${dt.getFullYear()}`;
  if(esColocadora){
    const montoCobrar=montoFuturo-totalGastos;
    const ganNeta=montoCobrar-m;
    const tasaNeta=m>0?(ganNeta/m)*(365/d)*100:0;
    const tePeriodo=m>0?(ganNeta/m)*100:0;
    return{monto:m,tna,dias:d,tasa:tasa*100,interes,montoFuturo,comision,derMercado,gtoGtia,gastos,iva,totalGastos,montoCobrar,ganNeta,tasaNeta,tePeriodo,fechaOp:fmtDate(hoy),fechaVenc:fmtDate(venc)};
  }else{
    const montoPagar=montoFuturo+totalGastos;
    const cft=m>0?(montoPagar-m)/m*(365/d)*100:0;
    const tePeriodo=m>0?((montoPagar-m)/m)*100:0;
    return{monto:m,tna,dias:d,tasa:tasa*100,interes,montoFuturo,comision,derMercado,gtoGtia,gastos,iva,totalGastos,montoPagar,costoNeto:-totalGastos,cft,tePeriodo,fechaOp:fmtDate(hoy),fechaVenc:fmtDate(venc)};
  }
}

/* Sector seed eliminado — sectores se obtienen dinámicamente via refreshMetaCache (Yahoo Finance) */
/* Si un ticker no tiene sector en cache, se muestra "Sin clasificar" hasta que Yahoo responda */

/* Actualizar cache de metadata con sectores y nombres (async, no bloquea render) */
async function refreshMetaCache(tickers,priceData){
  const cache=loadMetaCache();
  let updated=false;
  const promises=tickers.filter(t=>!cache[t]||!cache[t].sector).map(async t=>{
    const{sector,name,country}=await fetchProfileYahoo(t);
    if(sector||name){
      cache[t]={...cache[t]};
      if(sector)cache[t].sector=sector;
      if(name)cache[t].name=name;
      if(country)cache[t].country=country;
      updated=true;
    }
  });
  await Promise.allSettled(promises);
  if(updated)saveMetaCache(cache);
  return cache;
}

/* Calcula posiciones abiertas a partir de operaciones */
function calcPositions(ops){
  const map={};
  ops.forEach(op=>{
    const t=op.ticker;
    if(!map[t]) map[t]={ticker:t,cantCompra:0,costoTotal:0,cantVenta:0,mercado:op.mercado,broker:op.broker,moneda:op.moneda};
    /* Normalizar precio a USD para operaciones ARS */
    const precioUSD=op.moneda==="ARS"&&op.ccl>0?op.precio/op.ccl:op.precio;
    if(op.tipo==="COMPRA"){
      map[t].cantCompra+=op.cantidad;
      map[t].costoTotal+=op.cantidad*precioUSD;
    }else{
      map[t].cantVenta+=op.cantidad;
    }
  });
  return Object.values(map).filter(p=>(p.cantCompra-p.cantVenta)>0).map(p=>{
    const cantidad=p.cantCompra-p.cantVenta;
    const ppc=p.cantCompra>0?p.costoTotal/p.cantCompra:0;
    return{ticker:p.ticker,cantidad,ppc,mercado:p.mercado,broker:p.broker,moneda:p.moneda};
  });
}

/* Enriquece posiciones con metadata dinámica (tipo, país, sector) */
function applyMeta(positions,prices,metaCache){
  return positions.map(p=>{
    const cached=metaCache[p.ticker]||{};
    const d912=prices[p.ticker]?.d912||null;
    const inferred=inferMeta(p.ticker,p.broker,p.mercado,d912);
    return{...p,sector:cached.sector||"Sin clasificar",pais:cached.pais||inferred.pais,tipo:cached.tipo||inferred.tipo};
  });
}

/* ── API ENGINE — Datos reales ──────────────── */

/* data912.com — API gratuita de cotizaciones del mercado argentino (misma fuente que google-sheets-argento) */
/* Endpoints: /live/arg_stocks (acciones AR), /live/arg_cedears (CEDEARs), /live/usa_stocks (acciones USA) */
/* Campos: symbol, c (precio), pct_change (var%), v (volumen), px_bid, px_ask, q_bid, q_ask, q_op */
const DATA912_BASE="https://data912.com/live";

/* Excepciones: ticker interno → símbolo distinto en data912 USA (solo cuando difieren) */
const D912_USA_ALIAS={YPFD:"YPF"};
/* Resolver símbolo: usa el alias si existe, sino el ticker tal cual */
const d912Sym=(ticker,aliases={})=>aliases[ticker.toUpperCase()]||ticker.toUpperCase();

/* Proxy CORS para APIs que no permiten fetch directo del browser.
   Mantenemos cadena de fallbacks porque proxies públicos van y vienen.
   Verificado 2026-05-07: allorigins caído (502/520), corsproxy.io bloqueado (403),
   codetabs OK. Si todos fallan, el ticker queda con ⚠ price fallback. */
const PROXIES=[
  "https://api.codetabs.com/v1/proxy?quest=",
  "https://api.allorigins.win/raw?url=",
];
/* Compat: PROXY legacy apunta al primer proxy de la cadena */
const PROXY=PROXIES[0];

/* fetchWithProxies(url) — intenta directo, después cada proxy en orden.
   Devuelve el Response. Lanza si todos fallan. */
async function fetchWithProxies(url,opts={}){
  /* 1) Directo (funciona cuando la API tiene CORS *) */
  try{
    const r=await fetch(url,opts);
    if(r&&r.ok)return r;
  }catch(e){}
  /* 2) Cadena de proxies */
  for(const p of PROXIES){
    try{
      const r=await fetch(p+encodeURIComponent(url),opts);
      if(r&&r.ok)return r;
    }catch(e){}
  }
  throw new Error("All proxies failed for "+url);
}

async function fetchMacroReal(){
  try{
    /* Dólares desde DolarAPI */
    const dolarRes=await fetch("https://dolarapi.com/v1/dolares");
    const dolares=await dolarRes.json();
    const findD=(casa)=>{const d=dolares.find(x=>x.casa===casa);return d?d.venta:0;};
    const oficial=findD("oficial");
    const mep=findD("bolsa");
    const ccl=findD("contadoconliqui");
    const blue=findD("blue");
    const tarjeta=findD("tarjeta");

    /* Riesgo país desde ArgentinaDatos */
    let riesgoPais=617;
    try{
      const rpRes=await fetch("https://api.argentinadatos.com/v1/finanzas/indices/riesgo-pais/ultimo");
      const rpData=await rpRes.json();
      riesgoPais=rpData.valor||rpData.value||617;
    }catch(e){}

    /* UVA desde ArgentinaDatos */
    let uva=1858.61;
    let uvaVar30d=0;
    try{
      const uvaRes=await fetch("https://api.argentinadatos.com/v1/finanzas/indices/uva");
      const uvaData=await uvaRes.json();
      if(Array.isArray(uvaData)&&uvaData.length>0){
        uva=uvaData[uvaData.length-1].valor||uva;
        /* Calcular variación 30 días */
        if(uvaData.length>=30){
          const uva30ago=uvaData[uvaData.length-31]?.valor||uvaData[uvaData.length-30]?.valor;
          if(uva30ago&&uva30ago>0) uvaVar30d=((uva-uva30ago)/uva30ago*100);
        }
      }
    }catch(e){}

    /* Inflación mensual desde ArgentinaDatos */
    let inflacion=0;
    try{
      const infRes=await fetch("https://api.argentinadatos.com/v1/finanzas/indices/inflacion");
      const infData=await infRes.json();
      if(Array.isArray(infData)&&infData.length>0) inflacion=infData[infData.length-1].valor||inflacion;
    }catch(e){}

    /* ── BCRA API — Tasa Política Monetaria, Inflación Interanual, Reservas ── */
    /* v3.0 deprecada 28/02/2026 — migrado a v4.0 */
    /* NOTA: BCRA dejó de publicar "Tasa de política monetaria" (IDs 6/160/161) en jul-2025.
       Se usa rango amplio (2 años) para capturar último valor conocido si no hay datos recientes. */
    const BCRA_BASE="https://api.bcra.gob.ar/estadisticas/v4.0/monetarias";
    const hoy=new Date();
    const hace60=new Date(hoy);hace60.setDate(hoy.getDate()-60);
    const hace2y=new Date(hoy);hace2y.setFullYear(hoy.getFullYear()-2);
    const fmtD=(d)=>d.toISOString().split("T")[0];
    const bcraFetch=async(idVar,desde)=>{
      try{
        const url=BCRA_BASE+"/"+idVar+"?desde="+fmtD(desde||hace60)+"&hasta="+fmtD(hoy)+"&limit=1000";
        /* Intentar directo primero, si falla CORS usar proxy */
        let r;
        try{r=await fetch(url);}catch(e){r=await fetch(PROXY+encodeURIComponent(url));}
        if(r&&r.ok){
          const j=await r.json();
          const res=j.results||j.data||j;
          /* v4.0 devuelve [{idVariable, detalle:[{fecha,valor}]}] */
          let arr=res;
          if(Array.isArray(res)&&res.length>0&&res[0].detalle) arr=res[0].detalle;
          if(Array.isArray(arr)&&arr.length>0){const last=arr[arr.length-1];return last.v??last.valor??last.value??null;}
        }
      }catch(e){}
      return null;
    };
    /* Fallback: datos.gob.ar series API (no requiere auth, sin CORS issues) */
    const datosFetch=async(serieId)=>{
      try{
        const url="https://apis.datos.gob.ar/series/api/series/?ids="+serieId+"&last=1&format=json";
        let r;
        try{r=await fetch(url);}catch(e){r=await fetch(PROXY+encodeURIComponent(url));}
        if(r&&r.ok){const j=await r.json();if(j.data&&j.data.length>0)return j.data[0][1];}
      }catch(e){}
      return null;
    };

    /* ArgentinaDatos: inflación interanual (fuente primaria, más confiable que BCRA API) */
    const adFetch=async(path)=>{
      try{
        const url="https://api.argentinadatos.com/v1/"+path;
        let r;
        try{r=await fetch(url);}catch(e){r=await fetch(PROXY+encodeURIComponent(url));}
        if(r&&r.ok){const j=await r.json();if(Array.isArray(j)&&j.length>0)return j[j.length-1].valor||null;}
      }catch(e){}
      return null;
    };

    /* Fuentes en paralelo: BCRA v4 (BADLAR, Reservas) + ArgentinaDatos (Infl IA) + BCRA v4 Infl IA */
    /* BCRA dejó de publicar "Tasa de política monetaria" (IDs 6/160/161) tras jul-2025.
       Se usa BADLAR bancos privados (ID 7) como referencia de tasa — se actualiza diariamente. */
    let tasa=0,inflacionIA=0,reservas=0;
    try{
      const [vBadlar,vRes,vIA_ad,vIA_bcra]=await Promise.allSettled([
        bcraFetch(7),                                     /* BCRA v4: BADLAR bancos privados (TNA) */
        bcraFetch(1),                                     /* BCRA v4: Reservas */
        adFetch("finanzas/indices/inflacionInteranual"),   /* ArgentinaDatos: Infl IA */
        bcraFetch(28)                                     /* BCRA v4: Infl IA (backup) */
      ]);
      if(vBadlar.status==="fulfilled"&&vBadlar.value) tasa=vBadlar.value;
      if(vRes.status==="fulfilled"&&vRes.value) reservas=Math.round(vRes.value);
      /* Inflación IA: preferir ArgentinaDatos, fallback BCRA */
      if(vIA_ad.status==="fulfilled"&&vIA_ad.value) inflacionIA=vIA_ad.value;
      else if(vIA_bcra.status==="fulfilled"&&vIA_bcra.value) inflacionIA=vIA_bcra.value;
    }catch(e){}
    /* Si reservas quedó en 0, intentar fallback datos.gob.ar */
    try{
      const fb=[];
      if(!reservas) fb.push(datosFetch("92.2_RESERVAS_IRES_0_0_32_40").then(v=>{if(v)reservas=Math.round(v);}));
      if(fb.length>0)await Promise.allSettled(fb);
    }catch(e){}

    /* Índices de mercado: S&P 500 y Merval (para contexto de movimientos) */
    /* Índices: usar v8/chart (v7/quote requiere auth desde ~2025) */
    let sp500Chg=0,mervalChg=0;
    try{
      const chartIdx=async(sym)=>{
        const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=1d&interval=1d`;
        let r;try{r=await fetchWithProxies(url);}catch(e){r=null;}
        if(r&&r.ok){const j=await r.json();const m=j.chart?.result?.[0]?.meta;if(m){const p=m.regularMarketPrice,prev=m.chartPreviousClose||m.previousClose;return prev?((p-prev)/prev*100):0;}}
        return 0;
      };
      const [spR,mvR]=await Promise.allSettled([chartIdx("^GSPC"),chartIdx("^MERV")]);
      if(spR.status==="fulfilled")sp500Chg=spR.value;
      if(mvR.status==="fulfilled")mervalChg=mvR.value;
    }catch(e){}

    return{dolarOficial:oficial||0,dolarMEP:mep||0,dolarCCL:ccl||0,dolarBlue:blue||0,dolarTarjeta:tarjeta||0,riesgoPais,inflacion,inflacionIA,tasa,uva,uvaVar30d,reservas,sp500Chg,mervalChg};
  }catch(e){
    console.warn("Macro API fallback:",e);
    return MACRO_FALLBACK;
  }
}

async function fetchPricesReal(tickers){
  try{
    /* Fetch data912 endpoints en paralelo: CEDEARs ARS + acciones ARG + acciones USA */
    const fetchD912=async(endpoint)=>{
      try{
        const r=await fetchWithProxies(DATA912_BASE+"/"+endpoint);
        return await r.json();
      }catch(e){console.warn("data912 fetch failed:",endpoint,e);return[];}
    };
    const [cedears,argStocks,argBonds,usaStocks]=await Promise.all([
      fetchD912("arg_cedears"),
      fetchD912("arg_stocks"),
      fetchD912("arg_bonds"),
      fetchD912("usa_stocks")
    ]);

    /* Indexar por symbol para búsqueda rápida */
    const idxCedears={};cedears.forEach(x=>{if(x.symbol)idxCedears[x.symbol.toUpperCase()]=x;});
    const idxArg={};argStocks.forEach(x=>{if(x.symbol)idxArg[x.symbol.toUpperCase()]=x;});
    const idxBonds={};argBonds.forEach(x=>{if(x.symbol)idxBonds[x.symbol.toUpperCase()]=x;});
    const idxUsa={};usaStocks.forEach(x=>{if(x.symbol)idxUsa[x.symbol.toUpperCase()]=x;});

    const prices={};
    tickers.forEach(t=>{
      const tu=t.toUpperCase();
      /* Buscar dinámicamente en todos los endpoints de data912 */
      const inCedears=idxCedears[tu]||null;
      const inArg=idxArg[tu]||null;
      const inBonds=idxBonds[tu]||null;
      const usaSym=d912Sym(tu,D912_USA_ALIAS);
      const inUsa=idxUsa[usaSym]||idxUsa[tu]||null;

      /* Precio ARS: CEDEARs → acciones arg → bonos arg */
      const arsData=inCedears||inArg||inBonds;
      /* Precio USD: usa_stocks */
      const usdData=inUsa;

      const priceARS=arsData?arsData.c:null;
      const changeARS=arsData?arsData.pct_change:null;
      const priceUSD=usdData?usdData.c:null;
      const changeUSD=usdData?usdData.pct_change:null;

      if(priceARS||priceUSD){
        prices[t]={
          price:priceUSD||0,
          change:changeUSD||0,
          prev:priceUSD?(priceUSD/(1+(changeUSD||0)/100)):0,
          priceARS:priceARS||null,
          changeARS:changeARS??null,
          d912:{isCedear:!!inCedears,isArgStock:!!inArg,isBond:!!inBonds,isUsaStock:!!inUsa}
        };
      }
    });

    /* Yahoo Finance fallback para tickers no encontrados en data912 */
    /* NOTA: Yahoo v7/finance/quote requiere auth desde ~2025. Usar v8/finance/chart (público). */
    /* BKUCF: se usa el ticker OTC directo (igual que TradingView). Yahoo devuelve precio OTC real. */
    const missing=tickers.filter(t=>!prices[t]);
    if(missing.length>0){
      const yfChartFetch=async(ticker)=>{
        const sym=d912Sym(ticker,D912_USA_ALIAS);
        try{
          const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=5d&interval=1d`;
          /* Yahoo no tiene CORS-allow-all → siempre via proxy (la fn maneja reintentos) */
          const r=await fetchWithProxies(url);
          if(r&&r.ok){
            const j=await r.json();
            const meta=j.chart?.result?.[0]?.meta;
            if(meta&&meta.regularMarketPrice){
              const price=meta.regularMarketPrice;
              const prev=meta.chartPreviousClose||meta.previousClose||price;
              const change=prev?((price-prev)/prev*100):0;
              const isArg=(meta.exchangeName||"").includes("Buenos")||(meta.currency||"")==="ARS";
              return{ticker,price:isArg?0:price,change:isArg?0:change,prev:isArg?0:prev,priceARS:isArg?price:null,changeARS:isArg?change:null,d912:{isCedear:false,isArgStock:isArg,isBond:false,isUsaStock:!isArg}};
            }
          }
        }catch(e){console.warn("Yahoo chart fetch failed:",ticker,e);}
        return null;
      };
      try{
        const results=await Promise.allSettled(missing.map(t=>yfChartFetch(t)));
        results.forEach(r=>{if(r.status==="fulfilled"&&r.value){const d=r.value;prices[d.ticker]=d;}});
      }catch(e){}
    }
    return prices;
  }catch(e){
    console.warn("data912 API fallback:",e);
    return null;
  }
}

/* ── KEYWORDS para detección de tickers en noticias ── */
/* 100% dinámico — genera keywords desde metaCache (nombre empresa via Yahoo) + alias conocidos */
function getTickerKW(ticker){
  const tu=ticker.toUpperCase();
  const kws=[tu];
  /* Alias USA (d912) */
  const alias=d912Sym(tu,D912_USA_ALIAS);
  if(alias!==tu)kws.push(alias);
  /* Nombre de empresa desde metaCache (populado por refreshMetaCache vía Yahoo Finance) */
  const cache=loadMetaCache();
  if(cache[tu]?.name){
    const name=cache[tu].name.toUpperCase();
    kws.push(name);
    /* Agregar primera palabra del nombre si es significativa (>3 chars) para match parcial */
    const firstWord=name.split(/[\s,\.]+/)[0];
    if(firstWord.length>3&&firstWord!==tu&&!kws.includes(firstWord))kws.push(firstWord);
  }
  /* Bonos AR — agregar keywords genéricos si parece bono */
  if(/^(AL|GD|AE|BA)\d{2}/.test(tu))kws.push("BONO SOBERANO","BONOS ARGENTINOS","DEUDA ARGENTINA");
  return kws;
}

/* ── Portfolio News JSON — curado server-side por finance-briefing ──
 * Fuente: EDGAR filings (8-K/10-Q/10-K/6-K) + Google News dirigido por ticker
 * + RSS AR/global filtrados. Ya viene filtrado por los tickers del Gist,
 * pero acá igual aplicamos el filtro local (defensa) y dejamos pasar sólo
 * los tickers que están en esta cartera actual. Cache 5 min en max-age del raw.
 */
const PORTFOLIO_NEWS_URL="https://raw.githubusercontent.com/EZE1311/Fin-Cloud/main/portfolio_news.json";
async function fetchPortfolioNewsJSON(tickers){
  try{
    const res=await fetch(PORTFOLIO_NEWS_URL+"?t="+Math.floor(Date.now()/300000)); /* bust cada 5 min */
    if(!res.ok)return[];
    const data=await res.json();
    const tkSet=new Set(tickers.map(t=>t.toUpperCase()));
    const out=(data.news||[]).filter(n=>n.ticker&&tkSet.has(n.ticker.toUpperCase()));
    return out;
  }catch(e){console.warn("portfolio_news.json fetch failed:",e);return[];}
}

/* Noticias — Bloomberg-style deep search across global + local portals */
async function fetchNewsReal(tickers){
  try{
    const R2J="https://api.rss2json.com/v1/api.json?rss_url=";
    const allNews=[];
    const seen=new Set();
    const posWords=["SUBE","CRECE","POSITIV","RÉCORD","AVANZ","GANA","SUPERA","BEAT","SURGE","RALLY","GAIN","PROFIT","RECORD","EXPAND","RISE","SOAR","UPGRADE"];
    const negWords=["BAJA","CAE","NEGATIV","PIERDE","CAÍDA","RECORT","PRESIÓN","LOSS","DROP","FALL","CUT","DECLINE","WARN","RISK","SLUMP","DOWN","CRASH","DOWNGRADE"];

    const addItem=(ticker,item,source)=>{
      /* Dedup: normalizar título (sin puntuación, espacios extra) para detectar duplicados */
      const norm=item.title.replace(/[^a-zA-Z0-9\s]/g,"").replace(/\s+/g," ").trim().toUpperCase().slice(0,60);
      if(seen.has(norm))return;seen.add(norm);
      const text=(item.title+" "+(item.description||"")).toUpperCase();
      let sentiment="neutral";
      if(posWords.some(w=>text.includes(w)))sentiment="positive";
      if(negWords.some(w=>text.includes(w)))sentiment=sentiment==="positive"?"positive":"negative";
      allNews.push({
        id:`${ticker}-${norm.slice(0,30)}-${allNews.length}`,ticker,title:item.title,source,
        sentiment,summary:item.description?item.description.replace(/<[^>]*>/g,"").slice(0,250):"",
        link:item.link,pubDate:item.pubDate
      });
    };

    /* ── 0) Portfolio News JSON (server-side, curado por finance-briefing) ──
     * Estas entradas vienen ya asociadas a un ticker del portfolio, con
     * filings SEC EDGAR marcados con kind="filing". Tienen prioridad por
     * calidad: sin CORS-proxy, sin rate-limit, y filings únicos. */
    const portfolioJSON=await fetchPortfolioNewsJSON(tickers);
    portfolioJSON.forEach(n=>{
      const source=n.source+(n.kind==="filing"?" 📄":"");
      addItem(n.ticker,{
        title:n.title,
        description:n.summary||"",
        link:n.url,
        pubDate:n.published
      },source);
    });

    /* ── 1) Feeds POR TICKER — noticias específicas de cada activo ── */
    const tickerFeeds=[];
    tickers.forEach(tk=>{
      const sym=d912Sym(tk,D912_USA_ALIAS);
      /* Yahoo Finance por ticker */
      tickerFeeds.push({tk,url:`https://feeds.finance.yahoo.com/rss/2.0/headline?s=${sym}&region=US&lang=en-US`,source:"Yahoo Finance"});
      /* Google News por ticker (busca nombre empresa o ticker) */
      const kws=getTickerKW(tk);
      const q=encodeURIComponent(kws[0]||tk);
      tickerFeeds.push({tk,url:`https://news.google.com/rss/search?q=${q}+stock&hl=en-US&gl=US&ceid=US:en`,source:"Google News"});
    });

    const tickerResults=await Promise.allSettled(tickerFeeds.map(async f=>{
      const res=await fetch(R2J+encodeURIComponent(f.url));
      return{...f,data:await res.json()};
    }));
    tickerResults.forEach(r=>{
      if(r.status!=="fulfilled"||!r.value.data?.items)return;
      const{tk,source,data}=r.value;
      data.items.slice(0,5).forEach(item=>addItem(tk,item,source));
    });

    /* ── 2) Feeds ARGENTINOS generales — para bonos, CEDEARs arg, mercado local ── */
    const argFeeds=[
      {url:"https://www.ambito.com/rss/economia.xml",source:"Ámbito"},
      {url:"https://www.cronista.com/files/rss/news.xml",source:"Cronista"},
      {url:"https://www.iprofesional.com/rss/finanzas",source:"iProfesional"},
    ];
    const argResults=await Promise.allSettled(argFeeds.map(async f=>{
      const res=await fetch(R2J+encodeURIComponent(f.url));
      return{...f,data:await res.json()};
    }));
    argResults.forEach(r=>{
      if(r.status!=="fulfilled"||!r.value.data?.items)return;
      const{source,data}=r.value;
      data.items.forEach(item=>{
        const text=(item.title+" "+(item.description||"")).toUpperCase();
        let matched=null;
        for(const tk of tickers){
          const kws=getTickerKW(tk);
          if(kws.some(kw=>{const esc=kw.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return new RegExp("\\b"+esc+"\\b").test(text);})){matched=tk;break;}
        }
        if(matched)addItem(matched,item,source);
      });
    });

    /* ── 3) Si no hay nada, noticias generales de mercado ── */
    if(allNews.length===0){
      const genFeeds=[{url:"https://feeds.reuters.com/reuters/businessNews",source:"Reuters"},{url:"https://www.cnbc.com/id/100003114/device/rss/rss.html",source:"CNBC"}];
      const genResults=await Promise.allSettled(genFeeds.map(async f=>{
        const res=await fetch(R2J+encodeURIComponent(f.url));
        return{...f,data:await res.json()};
      }));
      genResults.forEach(r=>{
        if(r.status!=="fulfilled"||!r.value.data?.items)return;
        r.value.data.items.slice(0,5).forEach(item=>addItem("MERCADO",item,r.value.source));
      });
    }

    allNews.sort((a,b)=>new Date(b.pubDate||0)-new Date(a.pubDate||0));
    return allNews.length>0?allNews.slice(0,40):null;
  }catch(e){
    console.warn("News fetch error:",e);
    return null;
  }
}

function timeAgo(dateStr){
  if(!dateStr)return"";
  const d=new Date(dateStr);const now=new Date();const mins=Math.floor((now-d)/60000);
  if(mins<1)return"ahora";if(mins<60)return`${mins} min`;
  const hrs=Math.floor(mins/60);if(hrs<24)return`${hrs} hs`;
  return`${Math.floor(hrs/24)} días`;
}

/* ── IOL API — Tasa de Caución ────────────── */
/* IOL error state — visible to UI */
window._iolLastError=null;

/* ── CORS proxy helpers ── */
const CORS_PROXIES=[
  url=>"https://corsproxy.io/?url="+encodeURIComponent(url),
  url=>"https://api.allorigins.win/raw?url="+encodeURIComponent(url),
];
/* Smart fetch: intenta directo, si CORS falla reintenta con proxy */
async function iolFetch(url,opts={}){
  /* Intento directo */
  try{
    const res=await fetch(url,opts);
    return res;
  }catch(e){
    console.log("[IOL] Directo falló (CORS), probando proxies...",e.message);
  }
  /* Intentar con cada proxy */
  for(const mkProxy of CORS_PROXIES){
    const proxyUrl=mkProxy(url);
    try{
      console.log("[IOL] Proxy →",proxyUrl.substring(0,80)+"...");
      const res=await fetch(proxyUrl,{
        ...opts,
        headers:{...(opts.headers||{}),"x-requested-with":"XMLHttpRequest"}
      });
      if(res.ok||res.status===400||res.status===401){
        console.log("[IOL] Proxy OK, status:",res.status);
        return res;
      }
    }catch(e2){
      console.log("[IOL] Proxy falló:",e2.message);
    }
  }
  return null;
}

async function iolGetToken(){
  const creds=loadLS("iol_creds",null);
  if(!creds||!creds.user||!creds.pass){
    window._iolLastError="Sin credenciales configuradas";
    return null;
  }
  /* Check cached token */
  const cached=loadLS("iol_token",null);
  if(cached&&cached.access_token&&cached.expires_at>Date.now()+60000){
    return cached.access_token;
  }
  const tokenUrl="https://api.invertironline.com/token";
  /* Try refresh token first */
  if(cached&&cached.refresh_token){
    console.log("[IOL] Refreshing token...");
    const res=await iolFetch(tokenUrl,{
      method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:`grant_type=refresh_token&refresh_token=${encodeURIComponent(cached.refresh_token)}`
    });
    if(res&&res.ok){
      try{
        const d=await res.json();
        const tokenData={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||900)*1000};
        saveLS("iol_token",tokenData);
        console.log("[IOL] Token refreshed OK");
        window._iolLastError=null;
        return d.access_token;
      }catch(e){console.log("[IOL] Error parsing refresh response")}
    }
  }
  /* Fresh login */
  console.log("[IOL] Fresh login...");
  const res=await iolFetch(tokenUrl,{
    method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:`username=${encodeURIComponent(creds.user)}&password=${encodeURIComponent(creds.pass)}&grant_type=password`
  });
  if(!res){
    window._iolLastError="No se pudo conectar a IOL (CORS + proxies fallaron)";
    return null;
  }
  if(!res.ok){
    let errDetail="";try{errDetail=await res.text()}catch(x){}
    console.error("[IOL] Login failed:",res.status,errDetail);
    window._iolLastError=res.status===400||res.status===401
      ?"Credenciales inválidas o API no activada"
      :`Error ${res.status}`;
    return null;
  }
  try{
    const d=await res.json();
    const tokenData={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||900)*1000};
    saveLS("iol_token",tokenData);
    console.log("[IOL] Login OK, token válido por",d.expires_in,"s");
    window._iolLastError=null;
    return d.access_token;
  }catch(e){
    window._iolLastError="Error parseando respuesta de login";
    return null;
  }
}

async function iolFetchCaucionRate(){
  const token=await iolGetToken();
  if(!token){
    console.log("[IOL] No token, abortando fetch de caución");
    return null;
  }
  const base="https://api.invertironline.com/api/v2";
  const hdrs={"Authorization":"Bearer "+token};

  /* Helper: intenta un endpoint vía iolFetch (con fallback proxy) */
  async function tryEndpoint(url,label){
    console.log("[IOL]",label,"→",url);
    const res=await iolFetch(url,{headers:hdrs});
    if(!res){console.log("[IOL]",label,"→ sin respuesta");return null;}
    console.log("[IOL]",label,"status:",res.status);
    if(!res.ok){
      let body="";try{body=await res.text()}catch(x){}
      console.log("[IOL]",label,"error:",body.substring(0,200));
      return null;
    }
    try{
      const d=await res.json();
      console.log("[IOL]",label,"OK:",JSON.stringify(d).substring(0,500));
      return d;
    }catch(e){
      console.log("[IOL]",label,"JSON parse error");
      return null;
    }
  }

  /* ── Helper: classify titulo by moneda and plazo ── */
  function classifyTitulo(t,forceMoneda){
    const s=((t.simbolo||"")+" "+(t.descripcion||"")).toLowerCase();
    const isDollar=forceMoneda==="USD"||s.includes("dólar")||s.includes("dolar")||s.includes("usd")||s.includes("dollar");
    const moneda=isDollar?"USD":(forceMoneda||"ARS");
    /* Parse plazo: T0=1, T1=2, T2=3 or number from text/fields */
    let plazo=null;
    const rawPlazo=t.plazo||t.dias||t.duracion||null;
    if(typeof rawPlazo==="number"&&rawPlazo>0)plazo=rawPlazo;
    else if(typeof rawPlazo==="string"){
      const tMatch=rawPlazo.match(/^T(\d+)$/i);
      if(tMatch)plazo=parseInt(tMatch[1])+1; /* T0=1day, T1=2days */
      else{const n=parseInt(rawPlazo);if(n>0)plazo=n;}
    }
    if(!plazo){
      if(s.match(/30\s*d/i))plazo=30;
      else if(s.match(/7\s*d/i))plazo=7;
      else if(s.match(/1\s*d/i))plazo=1;
    }
    const tna=t.ultimoPrecio||t.puntas?.precioCompra||0;
    return{moneda,plazo,tna,sym:t.simbolo};
  }

  /* ── Helper: assign classified titulos to result slots ── */
  function assignRates(classified,result){
    for(const c of classified){
      if(c.tna<=0)continue;
      if(c.moneda==="ARS"&&c.plazo!=null&&c.plazo<=7&&result.pesos1d==null)result.pesos1d=c.tna;
      if(c.moneda==="ARS"&&c.plazo!=null&&c.plazo>=28&&c.plazo<=35&&result.pesos30d==null)result.pesos30d=c.tna;
      if(c.moneda==="USD"&&c.plazo!=null&&c.plazo<=7&&result.usd1d==null)result.usd1d=c.tna;
      if(c.moneda==="USD"&&c.plazo!=null&&c.plazo>=28&&c.plazo<=35&&result.usd30d==null)result.usd30d=c.tna;
    }
    /* Fallback: if exactly 1 ARS with no plazo, assume 1D */
    const arsNoplazo=classified.filter(c=>c.moneda==="ARS"&&c.tna>0&&c.plazo==null);
    if(result.pesos1d==null&&arsNoplazo.length===1)result.pesos1d=arsNoplazo[0].tna;
    const usdNoplazo=classified.filter(c=>c.moneda==="USD"&&c.tna>0&&c.plazo==null);
    if(result.usd1d==null&&usdNoplazo.length===1)result.usd1d=usdNoplazo[0].tna;
  }

  /* ── Helper: fetch and classify a panel ── */
  async function fetchPanel(panel,label,forceMoneda){
    const d=await tryEndpoint(base+"/Cotizaciones/cauciones/argentina/"+panel,label);
    if(!d)return[];
    const titulos=d.titulos||d;
    if(!Array.isArray(titulos)||titulos.length===0)return[];
    console.log("[IOL] "+label+" ("+titulos.length+"):",JSON.stringify(titulos.map(t=>({s:t.simbolo,d:t.descripcion,p:t.ultimoPrecio,plazo:t.plazo}))));
    const classified=titulos.map(t=>classifyTitulo(t,forceMoneda));
    console.log("[IOL] Clasificadas:",classified.map(c=>c.sym+"|"+c.moneda+"|"+c.plazo+"d|"+c.tna+"%").join(" · "));
    return classified;
  }

  const result={pesos1d:null,pesos30d:null,usd1d:null,usd30d:null};

  /* ── Fetch panel "Todos" — the only panel IOL reliably supports ── */
  const allClassified=await fetchPanel("Todos","Cauciones Todos",null);
  assignRates(allClassified,result);

  /* ── Save all rates ── */
  console.log("[IOL] Resultado final:",JSON.stringify(result));
  if(result.pesos1d!=null||result.usd1d!=null){
    saveLS("iol_caucion",{...result,ts:Date.now(),src:"cotizaciones"});
    return result;
  }

  /* ── Fallback: Test — portafolio (verificar que el token funciona) ── */
  const dTest=await tryEndpoint(base+"/portafolio/argentina","Test portafolio");
  if(dTest){
    console.log("[IOL] Token OK pero no se encontró caución. Portafolio:",JSON.stringify(dTest).substring(0,500));
    window._iolLastError="Token OK pero sin datos de caución en los endpoints";
  }else{
    window._iolLastError=window._iolLastError||"No se pudo conectar a IOL";
  }

  return null;
}
