            <td style={{padding:"6px 8px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums"}}>{t.cantidad.toLocaleString("es-AR")}</td>
            <td style={{padding:"6px 8px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums"}}>{fT2(t.precioCompra)}</td>
            <td style={{padding:"6px 8px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums"}}>{fT2(t.precioVenta)}</td>
            <td style={{padding:"6px 8px",textAlign:"right",fontSize:11,color:"#f59e0b",fontVariantNumeric:"tabular-nums"}}>{fT2(t.totalGastos)}</td>
            <td style={{padding:"6px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>
              <div style={{fontSize:13,fontWeight:700,color:t.neto>=0?"#10b981":"#f43f5e"}}>{fT(t.neto)}</div>
              <div style={{fontSize:10,color:"#818cf8"}}>{fTalt(t.neto)}</div>
            </td>
            <td style={{padding:"6px 8px",textAlign:"right",fontSize:12,fontWeight:600,color:rendPct>=0?"#10b981":"#f43f5e"}}>{rendPct.toFixed(2)}%</td>
            <td style={{padding:"6px 8px",textAlign:"right"}}><button onClick={()=>removeTrade(t.id)} style={{background:"none",border:"none",color:"#7a8497",cursor:"pointer",fontSize:12,padding:2}} title="Eliminar">✕</button></td>
          </tr>;
        })}</tbody>
        {trades.length>1&&<tfoot><tr style={{borderTop:"2px solid #2a2f3f"}}>
          <td colSpan={7} style={{padding:"8px",fontSize:12,fontWeight:700,color:"#c1c8d4"}}>TOTAL ({trades.length} ops)</td>
          <td style={{padding:"8px",textAlign:"right"}}>
            <div style={{fontSize:14,fontWeight:800,color:tradesTotals.netoARS>=0?"#10b981":"#f43f5e"}}>{fARS(tradesTotals.netoARS)}</div>
            <div style={{fontSize:11,color:"#818cf8",fontWeight:600}}>{fUSD(tradesTotals.netoUSD)}</div>
          </td>
          <td style={{padding:"8px",textAlign:"right",fontSize:12,fontWeight:600,color:tradesTotals.netoARS>=0?"#10b981":"#f43f5e"}}>{tradesTotals.montoARS>0?(tradesTotals.netoARS/tradesTotals.montoARS*100).toFixed(2)+"%":"—"}</td>
          <td></td>
        </tr></tfoot>}
      </table>
    </Card>}

    {/* ── Alertas de Precio (solo tabla) ── */}
    {priceAlerts.length>0&&<Card title="🔔 Alertas Activas" right={loadLS("tg_token","")&&loadLS("tg_chat_id","")?<span style={{fontSize:10,color:"#10b981"}}>📱 Telegram activo</span>:null}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          {["Ticker","Tipo","Precio","Nota","Estado",""].map(h=><th key={h} style={{padding:"5px 8px",textAlign:"left",fontSize:10,fontWeight:600,color:"#7a8497",textTransform:"uppercase",borderBottom:"1px solid #22263350"}}>{h}</th>)}
        </tr></thead>
        <tbody>{priceAlerts.map(a=>{
          const pd=prices[a.ticker];
          const isBM=a.mercado==="BYMA";
          const cur=isBM?(pd?.priceARS||0):(pd?.price||0);
          const dist=a.price&&cur?((a.price-cur)/cur*100):null;

            <td style={{padding:"5px 8px",fontWeight:700,fontSize:13}}>{a.ticker} <span style={{fontSize:10,color:"#7a8497"}}>{isBM?"🇦🇷":"🇺🇸"}</span></td>
            <td style={{padding:"5px 8px",fontSize:12}}><span style={{color:isTarget?"#10b981":"#f43f5e",fontWeight:600}}>{isTarget?"⬆️ Target":"⬇️ Stop Loss"}</span></td>
            <td style={{padding:"5px 8px",fontSize:13,fontWeight:600,fontVariantNumeric:"tabular-nums"}}>
              {isBM?fARS(a.price):`USD ${a.price.toFixed(2)}`}
              {dist!=null&&<span style={{fontSize:10,color:dist>=0?"#10b981":"#f43f5e",marginLeft:6}}>({dist>=0?"+":""}{dist.toFixed(1)}%)</span>}
            </td>
            <td style={{padding:"5px 8px",fontSize:11,color:"#c1c8d4"}}>{a.label||"—"}</td>
            <td style={{padding:"5px 8px",fontSize:11}}>
              {a.triggeredAt?<span style={{color:"#f59e0b"}}>🔔 Disparada {new Date(a.triggeredAt).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span>

            </td>
            <td style={{padding:"5px 8px",display:"flex",gap:4}}>
              <button onClick={()=>togglePriceAlert(a.id)} style={{background:"none",border:"none",color:"#7a8497",cursor:"pointer",fontSize:11,padding:2}} title={a.active?"Pausar":"Activar"}>{a.active?"⏸":"▶️"}</button>
              <button onClick={()=>removePriceAlert(a.id)} style={{background:"none",border:"none",color:"#7a8497",cursor:"pointer",fontSize:11,padding:2}} title="Eliminar">✕</button>
            </td>
          </tr>;
        })}</tbody>
      </table>
    </Card>}

    <div style={{fontSize:9,color:"#4d5365",fontStyle:"italic",textAlign:"center"}}>{isBYMA?"BM Active Trader Plus · Acciones/CEDEARs: 0,10% + 0,080% normal | 0,05% + 0,055% intra (bonificación 50% si compra y venta mismo día) · IVA 21% (Bonos/Letras/ONs exentos) · Fuente: Tarifario BM Marzo 2025":"Comisión 0,60% all-in · Sin IVA · Fuente: Allaria (CS)"} · Equivalencias a MEP ${new Intl.NumberFormat("es-AR",{maximumFractionDigits:0}).format(mep)}</div>
  </div>;
}

/* ── POTENCIAL ──────────────────────────── */

async function fetchHistorical(ticker,range){
  const sym=yfSym(ticker);
  /* interval: 1wk for 1y/5y, 1mo for 10y to keep data manageable */
  const interval=range==="10y"?"1mo":"1wk";
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=${range}&interval=${interval}&includePrePost=false`;
  try{
    let res;
    try{res=await fetch(PROXY+encodeURIComponent(url));}catch(e){
      try{res=await fetch("https://corsproxy.io/?"+encodeURIComponent(url));}catch(e2){return null;}
    }
    const data=await res.json();
    const result=data?.chart?.result?.[0];
    if(!result)return null;
    const ts=result.timestamp||[];
    const closes=result.indicators?.quote?.[0]?.close||[];
    const currency=result.meta?.currency||"USD";
    const currentPrice=result.meta?.regularMarketPrice||0;
    /* Build array of {date, close} filtering nulls */
    const points=[];
    for(let i=0;i<ts.length;i++){
      if(closes[i]!=null&&closes[i]>0){
        points.push({date:new Date(ts[i]*1000).toISOString().slice(0,10),close:closes[i]});
      }
    }
    return{sym,ticker,currency,currentPrice,points};
  }catch(e){console.warn("fetchHistorical error:",ticker,e);return null;}
}

function Potencial({pos,prices,macro}){
  const [range,setRange]=useState("1y");
  const [histData,setHistData]=useState({});
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const mep=macro.dolarMEP||1;

  const fARS=n=>n==null||isNaN(n)?"—":`$ ${new Intl.NumberFormat("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0}).format(n)}`;
  const fUSD=n=>n==null||isNaN(n)?"—":`USD ${new Intl.NumberFormat("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)}`;
  const fPct=(n)=>n==null||isNaN(n)?"—":`${n>=0?"+":""}${n.toFixed(1)}%`;

  /* Tickers from portfolio (only those with open positions) */
  const tickers=useMemo(()=>pos.filter(p=>p.cantidad>0).map(p=>p.ticker),[pos]);

  /* Fetch on range or tickers change */
  useEffect(()=>{
    if(tickers.length===0)return;
    let cancelled=false;
    setLoading(true);setError(null);
    Promise.all(tickers.map(t=>fetchHistorical(t,range))).then(results=>{
      if(cancelled)return;
      const map={};
      results.forEach((r,i)=>{if(r)map[tickers[i]]=r;});
      setHistData(map);
      if(Object.keys(map).length===0)setError("No se pudieron obtener datos históricos");
      setLoading(false);
    }).catch(e=>{if(!cancelled){setError("Error al cargar datos");setLoading(false);}});
    return()=>{cancelled=true;};
  },[tickers.join(","),range]);

  /* Analyze each ticker */
  const analysis=useMemo(()=>{
    return tickers.map(t=>{
      const hist=histData[t];
      const posInfo=pos.find(p=>p.ticker===t);
      if(!hist||!posInfo||hist.points.length===0)return null;

      const closes=hist.points.map(p=>p.close);
      const maxPrice=Math.max(...closes);
      const minPrice=Math.min(...closes);
      const currentUSD=hist.currentPrice;
      const maxDate=hist.points.find(p=>p.close===maxPrice)?.date||"";
      const minDate=hist.points.find(p=>p.close===minPrice)?.date||"";

      /* % from current to max/min */
      const upsidePct=currentUSD>0?((maxPrice-currentUSD)/currentUSD)*100:0;
      const downsidePct=currentUSD>0?((minPrice-currentUSD)/currentUSD)*100:0;

      /* Current position value in USD */
      const isBYMA=posInfo.mercado==="BYMA";
      const priceData=prices[t];
      let posValueUSD=0;
      if(isBYMA){
        posValueUSD=(priceData?.priceARS||0)*posInfo.cantidad/mep;
      }else{
        posValueUSD=(priceData?.price||currentUSD)*posInfo.cantidad;
      }

      /* Projected values at max/min */
      const valueAtMax=posValueUSD*(1+upsidePct/100);
      const valueAtMin=posValueUSD*(1+downsidePct/100);

      return{ticker:t,mercado:posInfo.mercado,cantidad:posInfo.cantidad,currentUSD,maxPrice,minPrice,maxDate,minDate,upsidePct,downsidePct,posValueUSD,valueAtMax,valueAtMin,yfSym:hist.sym};
    }).filter(Boolean);
  },[tickers,histData,pos,prices,mep]);

  /* Portfolio totals */
  const totals=useMemo(()=>{
    let currentTotal=0,maxTotal=0,minTotal=0;
    analysis.forEach(a=>{currentTotal+=a.posValueUSD;maxTotal+=a.valueAtMax;minTotal+=a.valueAtMin;});
    const upsidePct=currentTotal>0?((maxTotal-currentTotal)/currentTotal)*100:0;
    const downsidePct=currentTotal>0?((minTotal-currentTotal)/currentTotal)*100:0;
    return{currentTotal,maxTotal,minTotal,upsidePct,downsidePct};

      </div>
      <div style={{display:"flex",gap:4}}>

    </div>

    {loading&&<div style={{textAlign:"center",padding:40,color:"#f59e0b",fontSize:14}}>Cargando datos históricos de {tickers.length} activos...</div>}
    {error&&!loading&&<div style={{textAlign:"center",padding:40,color:"#f43f5e",fontSize:14}}>{error}</div>}

    {/* Portfolio Summary Cards */}
    {!loading&&analysis.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14}}>
      <div style={{background:"#0c0e14",border:"1px solid #2a2f3f",borderRadius:12,padding:20,textAlign:"center"}}>
        <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:6}}>Valor Actual</div>
        <div style={{fontSize:22,fontWeight:800,color:"#e6edf3"}}>{fUSD(totals.currentTotal)}</div>

        <div style={{fontSize:11,color:"#7a8497",marginTop:2}}>{fUSD(totals.minTotal-totals.currentTotal)}</div>

      <table style={{width:"100%",borderCollapse:"collapse"}}>

        </tr></thead>
        <tbody>{analysis.map(a=>{
          return<tr key={a.ticker} style={{borderBottom:"1px solid #1a1d27"}}>
            <td style={{padding:"8px",fontWeight:700,fontSize:13}}>
              <div>{a.ticker}</div>
              <div style={{fontSize:10,color:"#7a8497"}}>{a.yfSym!==a.ticker?`(${a.yfSym}) `:""}{a.mercado==="BYMA"?"🇦🇷":"🇺🇸"} ×{a.cantidad.toLocaleString("es-AR")}</div>
            </td>
            <td style={{padding:"8px",textAlign:"right",fontSize:13,fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{fUSD(a.currentUSD)}</td>
            <td style={{padding:"8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>
              <div style={{fontSize:13,fontWeight:600}}>{fUSD(a.maxPrice)}</div>
              <div style={{fontSize:9,color:"#7a8497"}}>{a.maxDate}</div>

function loadLS(key,fallback){try{const v=localStorage.getItem("eid_"+key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function saveLS(key,val){try{localStorage.setItem("eid_"+key,JSON.stringify(val))}catch(e){}}

/* ── GIST SYNC ENGINE ───────────────────── */
const GIST_FILENAME="fin-cloud-data.json";

async function gistSave(token,gistId,data){
  /* Preserva campos pipeline-owned (tesis, perfSnapshots) del server: el briefing
     pushea tesis frescas al gist; si el dashboard tiene tesis viejas en su state
     (ej: cache de sesión anterior) y escribe sin merge, pisa el trabajo del
     pipeline. Fetch-modify-write resuelve la race definitivamente. */
  let payload=data;
  if(gistId){
    try{
      const current=await gistLoad(token,gistId);
      if(current){
        const serverTesisTs=_maxTesisTs(current.tesis);
        const clientTesisTs=_maxTesisTs(data.tesis);
        /* Si el server tiene tesis más nuevas que las del cliente → usar server.
           Si son iguales o el cliente no tiene → usar el que tenga contenido real. */
        const keepServerTesis=serverTesisTs>=clientTesisTs&&Object.keys(current.tesis||{}).length>0;
        payload={...data,tesis:keepServerTesis?current.tesis:(data.tesis||current.tesis||{}),
          perfSnapshots:data.perfSnapshots&&data.perfSnapshots.length>=((current.perfSnapshots||[]).length)?data.perfSnapshots:current.perfSnapshots};
      }
    }catch(e){/* si falla el fetch, seguimos con data tal cual — mejor escribir algo que nada */}
  }
  const body={files:{[GIST_FILENAME]:{content:JSON.stringify(payload,null,2)}}};
  const url=gistId
    ?`https://api.github.com/gists/${gistId}`
    :"https://api.github.com/gists";
  const method=gistId?"PATCH":"POST";
  if(!gistId) body.description="Fin-Cloud Dashboard Data (auto-sync)";
  if(!gistId) body.public=false;
  const res=await fetch(url,{method,headers:{"Authorization":`token ${token}`,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok) throw new Error(`GitHub ${res.status}`);
  return res.json();
}

/* Devuelve el max timestamp (ms) entre ultimaActualizacion de todas las tesis.
   0 si no hay tesis o ninguna tiene timestamp parseable. */
function _maxTesisTs(tesis){
  if(!tesis||typeof tesis!=="object")return 0;
  let max=0;
  for(const k in tesis){
    const ts=tesis[k]?.ultimaActualizacion;
    if(!ts)continue;
    const ms=Date.parse(ts);
    if(!isNaN(ms)&&ms>max)max=ms;
  }
  return max;
}

async function gistLoad(token,gistId){
  const res=await fetch(`https://api.github.com/gists/${gistId}`,{headers:{"Authorization":`token ${token}`}});
  if(!res.ok) throw new Error(`GitHub ${res.status}`);
  const g=await res.json();
  const content=g.files[GIST_FILENAME]?.content;
  return content?JSON.parse(content):null;
}

/* ── TESIS ACTIVA ─────────────────────────── */
const VEREDICTO_COLORS={Comprar:"#22c55e",Mantener:"#818cf8",Reducir:"#f59e0b",Vender:"#ef4444",Esperar:"#c1c8d4"};
const VEREDICTO_BG={Comprar:"#22c55e22",Mantener:"#818cf822",Reducir:"#f59e0b22",Vender:"#ef444422",Esperar:"#c1c8d422"};

function TesisBar({stop,entry,target,actual}){
  /* Bar visual con 4 marcadores: stop (rojo) | entry (gris) | actual (azul) | target (verde)
     Layout:
       - Stop     → label ARRIBA de la línea
       - Target   → label ARRIBA de la línea
       - Entry    → label ABAJO de la línea
       - Actual   → label ARRIBA por default (evita pisar Entry, que es el caso más común
                    cuando el precio está cerca del PPC). Si Actual cae cerca de Stop o
                    Target (ambos arriba), lo bajamos para evitar pisarlos. Si ahí también
                    choca con Entry, se estiran a una fila 2 debajo (container crece). */
  const nums=[stop,entry,target,actual].filter(n=>typeof n==="number"&&!isNaN(n));
  if(nums.length<2)return <div style={{fontSize:11,color:"#7a8497",fontStyle:"italic"}}>Faltan niveles</div>;
  const min=Math.min(...nums)*0.98, max=Math.max(...nums)*1.02;
  const pct=v=>((v-min)/(max-min))*100;
  /* Formato compacto del precio: 2 dec si <100, 4 si <1, 0 si >=1000 */
  const fmtP=n=>{if(n<1)return "$"+n.toFixed(n<0.1?4:3);if(n<100)return "$"+n.toFixed(2);if(n<1000)return "$"+n.toFixed(1);return "$"+Math.round(n).toLocaleString("es-AR");};
  const LBL_W=60;
  const OVERLAP_PCT=14; /* LBL_W=60px sobre card ~420px ≈ 14%; si dos labels están a <14% se pisan */

  /* Colocación de Actual según colisiones */
  const hasActual=typeof actual==="number"&&!isNaN(actual);
  const pA=hasActual?pct(actual):null;
  const pS=typeof stop==="number"?pct(stop):null;
  const pE=typeof entry==="number"?pct(entry):null;
  const pT=typeof target==="number"?pct(target):null;
  const near=(a,b)=>a!==null&&b!==null&&Math.abs(a-b)<OVERLAP_PCT;
  /* Si Actual == Entry (dentro de 0.5%), el label "Actual" es redundante:
     el marcador azul ya muestra la posición y el número coincide con Entry.
     Solo renderizamos el marcador (sin label) para evitar duplicación visual. */
  const actualEqualsEntry=hasActual&&typeof entry==="number"&&Math.abs(actual-entry)/Math.max(Math.abs(entry),1e-9)<0.005;
  let actualAbove=true;
  let actualRow2=false; /* si colisiona arriba Y abajo, usar fila 2 abajo */
  if(hasActual&&!actualEqualsEntry){
    const clashAbove=near(pA,pS)||near(pA,pT);
    if(clashAbove){
      actualAbove=false;
      if(near(pA,pE))actualRow2=true;
    }
  }
  const ROW_ABOVE=0, ROW_BELOW=46, ROW_BELOW2=72; /* 72 deja hueco real de 26px entre filas */
  const actualTop=actualAbove?ROW_ABOVE:(actualRow2?ROW_BELOW2:ROW_BELOW);
  const containerH=actualRow2?96:72;

  return <div style={{position:"relative",height:containerH,marginTop:10,marginBottom:6}}>
    {/* Zona de riesgo (stop→entry) */}
    <div style={{position:"absolute",top:30,left:pct(Math.min(stop,entry))+"%",width:(pct(Math.max(stop,entry))-pct(Math.min(stop,entry)))+"%",height:8,background:"#ef444433",borderRadius:2}}/>
    {/* Zona de recompensa (entry→target) */}
    <div style={{position:"absolute",top:30,left:pct(Math.min(entry,target))+"%",width:(pct(Math.max(entry,target))-pct(Math.min(entry,target)))+"%",height:8,background:"#22c55e33",borderRadius:2}}/>
    {/* Línea base */}
    <div style={{position:"absolute",top:33,left:0,right:0,height:2,background:"#2a2f3f"}}/>
    {/* Stop — ARRIBA */}
    {typeof stop==="number"&&!isNaN(stop)&&<><div style={{position:"absolute",top:24,left:`calc(${pct(stop)}% - 1px)`,width:2,height:20,background:"#ef4444"}}/>
      <div style={{position:"absolute",top:ROW_ABOVE,left:`calc(${pct(stop)}% - ${LBL_W/2}px)`,width:LBL_W,textAlign:"center",lineHeight:1.15}}>
        <div style={{fontSize:9,color:"#ef4444",fontWeight:700}}>Stop</div>
        <div style={{fontSize:10,color:"#ef4444",fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{fmtP(stop)}</div>
      </div></>}
    {/* Entry — ABAJO */}
    {typeof entry==="number"&&!isNaN(entry)&&<><div style={{position:"absolute",top:24,left:`calc(${pct(entry)}% - 1px)`,width:2,height:20,background:"#c1c8d4"}}/>
      <div style={{position:"absolute",top:ROW_BELOW,left:`calc(${pct(entry)}% - ${LBL_W/2}px)`,width:LBL_W,textAlign:"center",lineHeight:1.15}}>
        <div style={{fontSize:9,color:"#c1c8d4",fontWeight:700}}>Entry</div>
        <div style={{fontSize:10,color:"#c1c8d4",fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{fmtP(entry)}</div>
      </div></>}
    {/* Target — ARRIBA */}
    {typeof target==="number"&&!isNaN(target)&&<><div style={{position:"absolute",top:24,left:`calc(${pct(target)}% - 1px)`,width:2,height:20,background:"#22c55e"}}/>
      <div style={{position:"absolute",top:ROW_ABOVE,left:`calc(${pct(target)}% - ${LBL_W/2}px)`,width:LBL_W,textAlign:"center",lineHeight:1.15}}>
        <div style={{fontSize:9,color:"#22c55e",fontWeight:700}}>Target</div>
        <div style={{fontSize:10,color:"#22c55e",fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{fmtP(target)}</div>
      </div></>}
    {/* Actual — marcador siempre; label solo si NO coincide con Entry.
        Colisión-aware con Stop/Target: arriba por default, abajo/fila2 si choca. */}
    {hasActual&&<div style={{position:"absolute",top:26,left:`calc(${pct(actual)}% - 6px)`,width:12,height:12,background:"#3b82f6",borderRadius:"50%",border:"2px solid #0c0e14",boxShadow:"0 0 0 1px #3b82f6"}}/>}
    {hasActual&&!actualEqualsEntry&&<div style={{position:"absolute",top:actualTop,left:`calc(${pct(actual)}% - ${LBL_W/2}px)`,width:LBL_W,textAlign:"center",lineHeight:1.15}}>
      <div style={{fontSize:9,color:"#3b82f6",fontWeight:700}}>Actual</div>
      <div style={{fontSize:10,color:"#3b82f6",fontWeight:700,fontVariantNumeric:"tabular-nums"}}>{fmtP(actual)}</div>
    </div>}
  </div>;
}

function TesisCard({p,t}){
  const hasT=t&&t.veredicto;
  const actual=p.precioActual;
  const upside=hasT&&t.target?((t.target-actual)/actual*100):null;
  const downside=hasT&&t.stop?((t.stop-actual)/actual*100):null;
  const rr=hasT&&t.target&&t.stop&&t.entry?Math.abs((t.target-t.entry)/(t.entry-t.stop)):null;
  const daysSince=hasT&&t.ultimaActualizacion?Math.floor((Date.now()-new Date(t.ultimaActualizacion).getTime())/86400000):null;
  const stale=daysSince!==null&&daysSince>30;
  const vColor=hasT?VEREDICTO_COLORS[t.veredicto]||"#c1c8d4":"#4d5365";
  const vBg=hasT?VEREDICTO_BG[t.veredicto]||"#c1c8d422":"#4d536522";

  return <div style={{background:"#0c0e14",borderRadius:10,padding:14,border:`1px solid ${hasT?vColor+"44":"#1a1d27"}`,display:"flex",flexDirection:"column",gap:10}}>
    {/* Header */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
      <div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontWeight:700,fontSize:15,color:"#f1f5f9"}}>{p.ticker}</span>
          {hasT&&<span style={{background:vBg,color:vColor,fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20,textTransform:"uppercase",letterSpacing:0.5}}>{t.veredicto}</span>}
          {stale&&<span style={{background:"#f5973522",color:"#f59735",fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:10}}>⚠ VENCIDA {daysSince}d</span>}
        </div>
        <div style={{fontSize:10,color:"#7a8497",marginTop:2}}>
          {p.broker}·{p.mercado} · ${actual?.toFixed(2)} · PPC ${p.ppc?.toFixed(2)} · <span style={{color:p.rendimiento>=0?"#10b981":"#f43f5e"}}>{p.rendimiento>=0?"+":""}{p.rendimiento?.toFixed(1)}%</span>
        </div>
      </div>
      {hasT&&t.fuente&&<span style={{background:"#1a1d27",color:"#7a8497",fontSize:9,fontWeight:600,padding:"3px 8px",borderRadius:6,textTransform:"uppercase",letterSpacing:0.5}}>{t.fuente}</span>}
    </div>

    {hasT?<>
      {/* Barra visual */}
      <TesisBar stop={t.stop} entry={t.entry} target={t.target} actual={actual}/>

      {/* Métricas derivadas */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,fontSize:11}}>
        <div style={{background:"#1a1d27",padding:"6px 8px",borderRadius:6}}>
          <div style={{color:"#7a8497",fontSize:9,textTransform:"uppercase",letterSpacing:0.5}}>Upside</div>
          <div style={{color:upside>=0?"#10b981":"#f43f5e",fontWeight:700,fontSize:13}}>{upside!==null?(upside>=0?"+":"")+upside.toFixed(1)+"%":"—"}</div>
        </div>
        <div style={{background:"#1a1d27",padding:"6px 8px",borderRadius:6}}>
          <div style={{color:"#7a8497",fontSize:9,textTransform:"uppercase",letterSpacing:0.5}}>Downside</div>
          <div style={{color:"#f43f5e",fontWeight:700,fontSize:13}}>{downside!==null?downside.toFixed(1)+"%":"—"}</div>
        </div>
        <div style={{background:"#1a1d27",padding:"6px 8px",borderRadius:6}}>
          <div style={{color:"#7a8497",fontSize:9,textTransform:"uppercase",letterSpacing:0.5}}>R/R</div>
          <div style={{color:rr>=2?"#10b981":rr>=1?"#f59e0b":"#f43f5e",fontWeight:700,fontSize:13}}>{rr!==null?rr.toFixed(2):"—"}</div>
        </div>
      </div>

      {/* Tesis */}
      {t.tesis&&<div style={{fontSize:11,color:"#e6edf3",lineHeight:1.5,background:"#1a1d2755",padding:"8px 10px",borderRadius:6,borderLeft:`3px solid ${vColor}`}}>{t.tesis}</div>}

      {/* Catalizadores + Riesgos en columnas */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {t.catalizadores&&<div>
          <div style={{fontSize:9,color:"#10b981",fontWeight:700,textTransform:"uppercase",marginBottom:3}}>▲ Catalizadores</div>
          <div style={{fontSize:10,color:"#c1c8d4",lineHeight:1.4,whiteSpace:"pre-wrap"}}>{t.catalizadores}</div>
        </div>}
        {t.riesgos&&<div>
          <div style={{fontSize:9,color:"#f43f5e",fontWeight:700,textTransform:"uppercase",marginBottom:3}}>▼ Riesgos</div>
          <div style={{fontSize:10,color:"#c1c8d4",lineHeight:1.4,whiteSpace:"pre-wrap"}}>{t.riesgos}</div>
        </div>}
      </div>

      {/* Footer */}
      <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:"#7a8497",borderTop:"1px solid #1a1d27",paddingTop:6,marginTop:2}}>

        <span>{t.ultimaActualizacion?new Date(t.ultimaActualizacion).toLocaleDateString("es-AR"):""}</span>
      </div>
    </>:<div style={{fontSize:11,color:"#7a8497",fontStyle:"italic",padding:"14px 0",textAlign:"center"}}>Sin tesis aún — se genera automático en el próximo briefing (08:00 / 18:00 ART).</div>}
  </div>;
}

function TesisActiva({enriched,tesis}){
  const [filter,setFilter]=useState("todas");

  /* Última actualización global — max ultimaActualizacion across all tesis */
  const lastUpdate=useMemo(()=>{
    const dates=Object.values(tesis||{}).map(t=>t?.ultimaActualizacion).filter(Boolean).map(d=>new Date(d).getTime());
    if(!dates.length)return null;
    return new Date(Math.max(...dates));
  },[tesis]);

  /* Stats agregados */
  const stats=useMemo(()=>{
    const positions=enriched.length;
    const withTesis=enriched.filter(p=>tesis[p.ticker]).length;
    const stale=enriched.filter(p=>{
      const t=tesis[p.ticker];
      if(!t?.ultimaActualizacion)return false;
      return (Date.now()-new Date(t.ultimaActualizacion).getTime())>30*86400000;
    }).length;
    const porVeredicto={};
    Object.values(tesis).forEach(t=>{if(t.veredicto)porVeredicto[t.veredicto]=(porVeredicto[t.veredicto]||0)+1;});
    return {positions,withTesis,stale,porVeredicto};
  },[enriched,tesis]);

  /* Filtrado */
  const visible=useMemo(()=>{
    if(filter==="todas")return enriched;
    if(filter==="sin-tesis")return enriched.filter(p=>!tesis[p.ticker]);
    if(filter==="vencidas")return enriched.filter(p=>{
      const t=tesis[p.ticker];
      if(!t?.ultimaActualizacion)return false;
      return (Date.now()-new Date(t.ultimaActualizacion).getTime())>30*86400000;
    });
    return enriched.filter(p=>tesis[p.ticker]?.veredicto===filter);
  },[enriched,tesis,filter]);

  const chipSt=(active,color)=>({background:active?(color||"#3b82f6"):"#1a1d27",color:active?"#f1f5f9":"#c1c8d4",border:`1px solid ${active?(color||"#3b82f6"):"#2a2f3f"}`,borderRadius:20,padding:"4px 12px",fontSize:11,cursor:"pointer",fontWeight:600});

  /* Formato relativo para última actualización */
  const relativeTime=(d)=>{
    if(!d)return null;
    const diff=Date.now()-d.getTime();
    const mins=Math.floor(diff/60000);
    const hours=Math.floor(diff/3600000);
    const days=Math.floor(diff/86400000);
    if(mins<60)return `hace ${mins}m`;
    if(hours<24)return `hace ${hours}h`;
    if(days<7)return `hace ${days}d`;
    return d.toLocaleDateString("es-AR");
  };

  return <div style={{display:"flex",flexDirection:"column",gap:16}}>
    {/* Header con stats */}
    <Card title="🧠 Tesis Activa por Posición">
      <div style={{background:"#0c0e1455",border:"1px solid #1a1d27",borderRadius:8,padding:"8px 12px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={{fontSize:11,color:"#c1c8d4",lineHeight:1.4}}>
          <span style={{color:"#818cf8",fontWeight:700}}>◉ Auto-refresh 2x/día</span> · Se actualiza solo en cada briefing (08:00 y 18:00 ART L-V) — lectura directa del Gist.
        </div>
        {lastUpdate&&<div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",letterSpacing:0.5,fontWeight:600}}>
          Última: <span style={{color:"#e6edf3"}}>{relativeTime(lastUpdate)}</span>
        </div>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:14}}>
        <div style={{background:"#0c0e14",padding:10,borderRadius:8,borderLeft:"3px solid #3b82f6"}}>
          <div style={{fontSize:9,color:"#7a8497",textTransform:"uppercase",letterSpacing:0.5,fontWeight:600}}>Posiciones</div>
          <div style={{fontSize:20,fontWeight:700,color:"#f1f5f9"}}>{stats.positions}</div>
        </div>
        <div style={{background:"#0c0e14",padding:10,borderRadius:8,borderLeft:"3px solid #22c55e"}}>
          <div style={{fontSize:9,color:"#7a8497",textTransform:"uppercase",letterSpacing:0.5,fontWeight:600}}>Con tesis</div>
          <div style={{fontSize:20,fontWeight:700,color:"#10b981"}}>{stats.withTesis}/{stats.positions}</div>
        </div>
        <div style={{background:"#0c0e14",padding:10,borderRadius:8,borderLeft:"3px solid #f59735"}}>
          <div style={{fontSize:9,color:"#7a8497",textTransform:"uppercase",letterSpacing:0.5,fontWeight:600}}>Vencidas (&gt;30d)</div>
          <div style={{fontSize:20,fontWeight:700,color:stats.stale?"#f59735":"#7a8497"}}>{stats.stale}</div>
        </div>
        {Object.entries(stats.porVeredicto).map(([v,n])=>(
          <div key={v} style={{background:"#0c0e14",padding:10,borderRadius:8,borderLeft:`3px solid ${VEREDICTO_COLORS[v]||"#c1c8d4"}`}}>
            <div style={{fontSize:9,color:"#7a8497",textTransform:"uppercase",letterSpacing:0.5,fontWeight:600}}>{v}</div>
            <div style={{fontSize:20,fontWeight:700,color:VEREDICTO_COLORS[v]||"#c1c8d4"}}>{n}</div>
          </div>
        ))}
      </div>

      {/* Filtros */}
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        <button onClick={()=>setFilter("todas")} style={chipSt(filter==="todas")}>Todas ({stats.positions})</button>
        <button onClick={()=>setFilter("sin-tesis")} style={chipSt(filter==="sin-tesis","#7a8497")}>Sin tesis ({stats.positions-stats.withTesis})</button>
        {stats.stale>0&&<button onClick={()=>setFilter("vencidas")} style={chipSt(filter==="vencidas","#f59735")}>⚠ Vencidas ({stats.stale})</button>}
        {Object.entries(stats.porVeredicto).map(([v,n])=>(
          <button key={v} onClick={()=>setFilter(v)} style={chipSt(filter===v,VEREDICTO_COLORS[v])}>{v} ({n})</button>
        ))}
      </div>
    </Card>

    {/* Grid de cards */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(360px,1fr))",gap:12}}>
      {visible.length===0?<div style={{gridColumn:"1/-1",textAlign:"center",padding:40,color:"#7a8497",fontStyle:"italic"}}>No hay posiciones que coincidan con este filtro.</div>:
       visible.map(p=>(
        <TesisCard key={p.ticker} p={p} t={tesis[p.ticker]}/>
       ))
      }
    </div>
  </div>;
}

  const [casa,setCasa]=useState(()=>loadLS("casa",INIT_CASA));
  const [hipoteca,setHipoteca]=useState(()=>loadLS("hipoteca",INIT_HIPOTECA));
  const [caucion,setCaucion]=useState(()=>loadLS("caucion",INIT_CAUCION));

  /* ── Form states lifted so they persist across tab switches ── */
  const [tradingForm,setTradingForm]=useState({tickerInput:"",cantidad:"",precioCompra:"",precioVentaManual:"",mercado:"BYMA"});
  const [caucionForm,setCaucionForm]=useState(()=>loadLS("caucionForm",INIT_CAUCION_FORM));

  /* ── Price Alerts System ── */
  /* Alert: {id, ticker, mercado, condition:"above"|"below", price, active, label, createdAt, triggeredAt} */
  const [priceAlerts,setPriceAlerts]=useState(()=>loadLS("price_alerts",[]));

  /* ── Tesis activa por posición ── */
  /* tesis: {[ticker]: {veredicto, entry, target, stop, horizonte, tesis, catalizadores, riesgos, fuente, ultimaActualizacion}} */
  const [tesis,setTesis]=useState(()=>loadLS("tesis",{}));

  const addPriceAlert=useCallback((alert)=>{
    setPriceAlerts(prev=>[{id:Date.now(),...alert,active:true,createdAt:new Date().toISOString(),triggeredAt:null},...prev]);
  },[]);

  const removePriceAlert=useCallback((id)=>{
    setPriceAlerts(prev=>prev.filter(a=>a.id!==id));
  },[]);

  const togglePriceAlert=useCallback((id)=>{
    setPriceAlerts(prev=>prev.map(a=>a.id===id?{...a,active:!a.active}:a));
  },[]);

  /* Send Telegram message */
  const sendTelegram=useCallback(async(msg)=>{
    const token=loadLS("tg_token","");
    const chatId=loadLS("tg_chat_id","");
    if(!token||!chatId)return;
    const url=`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}`;
    try{await fetch(url);return;}catch(e){}
    try{await fetch(PROXY+encodeURIComponent(url));return;}catch(e){}
    try{await fetch("https://corsproxy.io/?"+encodeURIComponent(url));}catch(e){console.warn("Telegram send failed — all proxies tried");}
  },[]);

  /* Send browser notification */
  const sendBrowserNotif=useCallback((title,body)=>{
    if(!("Notification" in window))return;
    if(Notification.permission==="granted"){
      new Notification(title,{body,icon:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>"});
    }else if(Notification.permission!=="denied"){
      Notification.requestPermission();
    }
  },[]);

  /* Check alerts against current prices — runs every 60s */
  const checkAlerts=useCallback(()=>{
    if(priceAlerts.length===0)return;
    const mep=macro.dolarMEP||1;
    setPriceAlerts(prev=>{
      let changed=false;
      const updated=prev.map(a=>{
        if(!a.active)return a;
        const pd=prices[a.ticker];
        if(!pd)return a;
        const isBYMA=a.mercado==="BYMA";
        const currentPrice=isBYMA?(pd.priceARS||0):(pd.price||0);
        if(currentPrice<=0)return a;
        const triggered=(a.condition==="above"&&currentPrice>=a.price)||(a.condition==="below"&&currentPrice<=a.price);
        if(triggered){
          changed=true;
          const dir=a.condition==="above"?"⬆️ SUBE":"⬇️ BAJA";
          const priceStr=isBYMA?`$${currentPrice.toLocaleString("es-AR")}`:`USD ${currentPrice.toFixed(2)}`;
          const targetStr=isBYMA?`$${a.price.toLocaleString("es-AR")}`:`USD ${a.price.toFixed(2)}`;
          const msg=`${dir} ${a.ticker} ${a.condition==="above"?"superó":"cayó a"} ${targetStr} → Precio actual: ${priceStr}${a.label?" | "+a.label:""}`;
          /* Browser notification */
          sendBrowserNotif(`🚨 Alerta ${a.ticker}`,msg);
          /* Telegram */
          sendTelegram(`🚨 TRADE ALERT\n${msg}`);
          /* Play sound */
          try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;o.type="sine";g.gain.value=0.3;o.start();setTimeout(()=>{o.stop();ctx.close()},300);}catch(e){}
          return{...a,active:false,triggeredAt:new Date().toISOString()};
        }
        return a;
      });
      return changed?updated:prev;
    });
  },[prices,macro,sendTelegram,sendBrowserNotif]);

  /* Alert monitoring interval — every 60 seconds */
  useEffect(()=>{
    /* Request notification permission on mount */
    if("Notification" in window&&Notification.permission==="default"){Notification.requestPermission();}
    const iv=setInterval(checkAlerts,60000);
    checkAlerts(); /* check immediately on mount/price change */
    return()=>clearInterval(iv);
  },[checkAlerts]);

  /* Persistir en localStorage siempre */
  useEffect(()=>{saveLS("ops",ops)},[ops]);
  useEffect(()=>{saveLS("price_alerts",priceAlerts)},[priceAlerts]);
  useEffect(()=>{saveLS("tesis",tesis)},[tesis]);
  useEffect(()=>{saveLS("casa",casa)},[casa]);
  useEffect(()=>{saveLS("hipoteca",hipoteca)},[hipoteca]);
  useEffect(()=>{saveLS("caucion",caucion)},[caucion]);
  useEffect(()=>{saveLS("caucionForm",caucionForm)},[caucionForm]);

  /* ── Auto-load desde Gist al abrir ──── */
  useEffect(()=>{
    const token=loadLS("gh_token","");
    const gistId=loadLS("gist_id","");
    if(!token||!gistId){isFirstLoad.current=false;return;}
    setSyncStatus("syncing");
    gistLoad(token,gistId).then(d=>{
      if(d){
        if(d.ops)setOps(d.ops);
        if(d.priceAlerts)setPriceAlerts(d.priceAlerts);
        else if(d.alerts)setPriceAlerts(d.alerts); /* backwards compat with old backups */
        if(d.tesis)setTesis(d.tesis);
        if(d.casa)setCasa(d.casa);
        if(d.hipoteca)setHipoteca(d.hipoteca);
        if(d.caucion)setCaucion(d.caucion);
        if(d.perfSnapshots){setPerfSnapshots(d.perfSnapshots);saveLS("perf_snapshots",d.perfSnapshots);}
      }
      setSyncStatus("ok");setLastSync(new Date());
      setTimeout(()=>{isFirstLoad.current=false},500);
    }).catch(()=>{setSyncStatus("error");isFirstLoad.current=false});
  },[]);

  /* ── Auto-refresh del Gist cada 5 min — solo campos read-only del pipeline ────
     Tesis + perfSnapshots vienen del briefing (morning/closing scheduled tasks).
     No tocamos ops/casa/hipoteca/caucion acá: esos son editables por el usuario
     y el auto-save con debounce de 3s es la fuente de verdad para ellos. */
  useEffect(()=>{
    const token=loadLS("gh_token","");
    const gistId=loadLS("gist_id","");
    if(!token||!gistId)return;
    const refresh=()=>{
      gistLoad(token,gistId).then(d=>{
        if(!d)return;
        if(d.tesis)setTesis(d.tesis);
        if(d.perfSnapshots){setPerfSnapshots(d.perfSnapshots);saveLS("perf_snapshots",d.perfSnapshots);}
        setLastSync(new Date());
      }).catch(()=>{});
    };
    const iv=setInterval(refresh,5*60*1000); /* cada 5 min */
    return()=>clearInterval(iv);
  },[]);

  /* ── Auto-save a Gist con debounce de 3s ──── */
  /* Incluye snapshot de portfolio para que tareas programadas puedan leerlo */
  const doGistSave=useCallback(()=>{
    const token=loadLS("gh_token","");
    if(!token)return;
    const gistId=loadLS("gist_id","");
    /* Portfolio snapshot con precios actuales para consumo externo */
    const portfolioSnapshot=enriched.map(p=>({
      ticker:p.ticker,cantidad:p.cantidad,ppc:Math.round(p.ppc*100)/100,
      precioActual:Math.round(p.precioActual*100)/100,
      montoInvertido:Math.round(p.montoInvertido*100)/100,
      montoActual:Math.round(p.montoActual*100)/100,
      pl:Math.round(p.pl*100)/100,rendimiento:Math.round(p.rendimiento*100)/100,
      variacion:Math.round((p.variacion||0)*100)/100,
      broker:p.broker,mercado:p.mercado
    }));
    const macroSnap={dolarCCL:macro.dolarCCL,dolarMEP:macro.dolarMEP,dolarBlue:macro.dolarBlue,
      riesgoPais:macro.riesgoPais,inflacion:macro.inflacion,inflacionIA:macro.inflacionIA,
      tasa:macro.tasa,reservas:macro.reservas,mervalChg:macro.mervalChg,sp500Chg:macro.sp500Chg};
    const data={ops,priceAlerts,tesis,casa,hipoteca,caucion,perfSnapshots,
      portfolioSnapshot,macroSnapshot:macroSnap,
      portfolioTotal:Math.round(portfolioTotal*100)/100,
      invertido:Math.round(invertido*100)/100,
      pl:Math.round(pl*100)/100,
      rend:Math.round(rend*100)/100,
      caucionUSD:Math.round(caucionUSD*100)/100,
      lastSaved:new Date().toISOString()};
    setSyncStatus("syncing");
    gistSave(token,gistId,data).then(g=>{
      if(!gistId&&g.id){saveLS("gist_id",g.id)}
      setSyncStatus("ok");setLastSync(new Date());
    }).catch(()=>setSyncStatus("error"));
  },[ops,priceAlerts,tesis,casa,hipoteca,caucion,enriched,macro,portfolioTotal,invertido,pl,rend,caucionUSD]);

  useEffect(()=>{
    if(isFirstLoad.current)return;
    const token=loadLS("gh_token","");
    if(!token)return;
    if(syncTimer.current)clearTimeout(syncTimer.current);
    syncTimer.current=setTimeout(doGistSave,3000);
    return()=>{if(syncTimer.current)clearTimeout(syncTimer.current)};
  },[ops,priceAlerts,tesis,casa,hipoteca,caucion,doGistSave]);

  /* Exportar datos como JSON (backup local) */
  const exportData=useCallback(()=>{
    const data={ops,priceAlerts,tesis,casa,hipoteca,caucion,perfSnapshots,exportDate:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="fin-cloud-backup-"+new Date().toISOString().slice(0,10)+".json";
    a.click();URL.revokeObjectURL(url);
  },[ops,priceAlerts,tesis,casa,hipoteca,caucion,perfSnapshots]);

  /* Resetear — limpia todo a vacío */
  const resetData=useCallback(()=>{
    if(!confirm("¿Estás seguro? Esto borra todas tus operaciones, alertas y configuración."))return;
    setOps([]);setPriceAlerts([]);setTesis({});setCasa({precioCompra:0,anios:0,tasaAnual:0});setHipoteca({uvas:0});setCaucion({montoARS:0,tna:21,dias:1});setCaucionForm(INIT_CAUCION_FORM);setPerfSnapshots([]);saveLS("perf_snapshots",[]);
  },[]);

  /* Posiciones derivadas 100% de operaciones */
  const posRaw=useMemo(()=>calcPositions(ops),[ops]);
  const [metaCache,setMetaCache]=useState(()=>loadMetaCache());
  const pos=useMemo(()=>applyMeta(posRaw,prices,metaCache),[posRaw,prices,metaCache]);

  /* Cálculos inmobiliarios */
  const casaActual=useMemo(()=>{
    const val=casa.precioCompra*Math.pow(1+casa.tasaAnual/100,casa.anios);
    const pl=val-casa.precioCompra;
    const rend=(pl/casa.precioCompra)*100;
    return{valor:val,pl,rend};
  },[casa]);
  const deudaUSD=useMemo(()=>{
    const deudaARS=hipoteca.uvas*macro.uva;
    return macro.dolarMEP>0?deudaARS/macro.dolarMEP:0;
  },[hipoteca,macro]);

  /* ── Helpers: mercado abierto? ──── */
  const isMarketOpen=useCallback(()=>{
    const now=new Date();
    const day=now.getDay();
    if(day===0||day===6)return{byma:false,nyse:false,any:false};
    /* BYMA: Lun-Vie 11:00-17:00 ART (UTC-3) */
    const artH=now.getUTCHours()-3;const artM=now.getUTCMinutes();
    const artMin=artH*60+artM;
    const byma=artMin>=660&&artMin<1020; /* 11:00-17:00 */
    /* NYSE: Lun-Vie 9:30-16:00 ET (UTC-4 o UTC-5 DST) */
    const etOff=(() => {const jan=new Date(now.getFullYear(),0,1).getTimezoneOffset();const jul=new Date(now.getFullYear(),6,1).getTimezoneOffset();const isDST=now.getTimezoneOffset()<Math.max(jan,jul);return isDST?-4:-5;})();
    const etH=now.getUTCHours()+etOff;const etM=now.getUTCMinutes();
    const etMin=etH*60+etM;
    const nyse=etMin>=570&&etMin<960; /* 9:30-16:00 */
    return{byma,nyse,any:byma||nyse};
  },[]);

  /* ── Fetch separados: precios vs macro+noticias ──── */
  const allTickers=useMemo(()=>[...new Set(ops.map(o=>o.ticker))],[ops]);

  const updateMacro=useCallback((macroData)=>{
    setMacro(macroData);
    try{
      const todayStr=new Date().toISOString().split("T")[0];
      const prev=JSON.parse(localStorage.getItem("eid_macro_prev")||"{}");
      if(prev._date!==todayStr){
        const cur=JSON.parse(localStorage.getItem("eid_macro_cur")||"null");
        if(cur)localStorage.setItem("eid_macro_prev",JSON.stringify({...cur,_date:todayStr}));
      }
      localStorage.setItem("eid_macro_cur",JSON.stringify(macroData));
      setMacroPrev(JSON.parse(localStorage.getItem("eid_macro_prev")||"{}"));
    }catch(e){}
  },[]);

  const updatePrices=useCallback((priceData)=>{
    if(priceData&&Object.keys(priceData).length>0){
      setPrices(prev=>{const merged={...prev,...priceData};savePriceCache(merged);return merged;});
      setDataSource("live");
      refreshMetaCache(allTickers,priceData).then(cache=>setMetaCache({...cache}));
    }else{setDataSource("fallback")}
  },[allTickers]);

  /* Fetch completo (carga inicial) */
  const fetchAllData=useCallback(async()=>{
    const[macroData,priceData,newsData]=await Promise.all([
      fetchMacroReal(),fetchPricesReal(allTickers),fetchNewsReal(allTickers)
    ]);
    updateMacro(macroData);
    updatePrices(priceData);
    if(newsData){setNews(newsData);saveNewsCache(newsData);}
    setLastUp(new Date());
  },[allTickers,updateMacro,updatePrices]);

  /* Fetch solo precios (cada 60s en horario de mercado) */
  const fetchPricesOnly=useCallback(async()=>{
    if(!isMarketOpen().any)return;
    const priceData=await fetchPricesReal(allTickers);
    updatePrices(priceData);
    setLastUp(new Date());
  },[allTickers,updatePrices,isMarketOpen]);

  /* Fetch macro+noticias (cada 5 min en horario de mercado) */
  const fetchMacroNews=useCallback(async()=>{
    if(!isMarketOpen().any)return;
    const[macroData,newsData]=await Promise.all([fetchMacroReal(),fetchNewsReal(allTickers)]);
    updateMacro(macroData);
    if(newsData){setNews(newsData);saveNewsCache(newsData);}
    setLastUp(new Date());
  },[allTickers,updateMacro,isMarketOpen]);

  useEffect(()=>{
    fetchAllData(); /* carga inicial siempre */
    const ivPrices=setInterval(fetchPricesOnly,60000);    /* precios cada 60s */
    const ivMacro=setInterval(fetchMacroNews,300000);     /* macro+news cada 5 min */
    return()=>{clearInterval(ivPrices);clearInterval(ivMacro);};
  },[fetchAllData,fetchPricesOnly,fetchMacroNews]);

  /* ── IOL: fetch tasas de caución (pesos/USD, 1D/30D) ── */
  const [iolStatus,setIolStatus]=useState(()=>{
    const cached=loadLS("iol_caucion",null);
    if(cached&&(cached.pesos1d!=null||cached.tna!=null)){
      return{pesos1d:cached.pesos1d||cached.tna,pesos30d:cached.pesos30d,usd1d:cached.usd1d,usd30d:cached.usd30d,ts:cached.ts,status:"cached"};
    }
    return{pesos1d:null,pesos30d:null,usd1d:null,usd30d:null,ts:null,status:"idle"};
  });

  const fetchCaucionRate=useCallback(async()=>{
    const creds=loadLS("iol_creds",null);
    if(!creds){
      setIolStatus(s=>({...s,status:"idle"}));
      return;
    }
    setIolStatus(s=>({...s,status:"fetching"}));
    try{
      const rates=await iolFetchCaucionRate();
      if(rates!=null){
        setIolStatus({pesos1d:rates.pesos1d,pesos30d:rates.pesos30d,usd1d:rates.usd1d,usd30d:rates.usd30d,ts:Date.now(),status:"ok"});
        if(rates.pesos1d!=null)setCaucion(c=>({...c,tna:Math.round(rates.pesos1d*10)/10}));
      }else{
        const cached=loadLS("iol_caucion",null);
        if(cached&&(cached.pesos1d||cached.tna)&&(Date.now()-cached.ts)<3600000){
          setIolStatus({pesos1d:cached.pesos1d||cached.tna,pesos30d:cached.pesos30d,usd1d:cached.usd1d,usd30d:cached.usd30d,ts:cached.ts,status:"cached"});
        }else{
          setIolStatus(s=>({...s,status:"error",msg:window._iolLastError||"Sin datos de caución"}));
        }
      }
    }catch(e){
      setIolStatus(s=>({...s,status:"error",msg:e.message||"Error de conexión"}));
    }
  },[setCaucion]);

  useEffect(()=>{
    fetchCaucionRate();
    /* Refresh every 5 min during BYMA hours */
    const iv=setInterval(()=>{if(isMarketOpen().byma)fetchCaucionRate()},300000);
    return()=>clearInterval(iv);
  },[fetchCaucionRate,isMarketOpen]);

  const enriched=useMemo(()=>pos.map(p=>{
    const l=prices[p.ticker]||{price:p.ppc,change:0};
    /* BM: precio = CEDEAR ARS / CCL → refleja valor real en tu broker.
       Si priceARS o CCL fallan, NO caer a l.price porque para CEDEARs grandes (MELI, ORCL, etc.)
       l.price es el ADR subyacente en USD → patrimonio se ve ~16x inflado.
       Mejor mantener PPC hasta que la data se recupere. */
    const ccl=macro.dolarCCL>0?macro.dolarCCL:null;
    const isBM=p.broker==="BM";
    let precioUSD;
    let priceFallback=false;
    if(isBM){
      if(l.priceARS&&ccl)precioUSD=l.priceARS/ccl;
      else{precioUSD=p.ppc;priceFallback=true;}
    }else{
      precioUSD=l.price||p.ppc;
      if(!l.price)priceFallback=true;
    }
    const varPct=(p.broker==="BM"&&l.changeARS!=null)?l.changeARS:l.change;
    const mi=p.cantidad*p.ppc;const ma=p.cantidad*precioUSD;const pl=ma-mi;const r=mi>0?(pl/mi)*100:0;
    const comCompra=calcComision(mi,p.broker,p.tipo);
    const comVenta=calcComision(ma,p.broker,p.tipo);
    const comTotal=comCompra+comVenta;
    const plNeto=pl-comTotal;
    const rendNeto=mi>0?((ma-comVenta-(mi+comCompra))/(mi+comCompra))*100:0;
    return{...p,precioActual:precioUSD,variacion:varPct,montoInvertido:mi,montoActual:ma,pl,rendimiento:r,priceARS:l.priceARS||null,changeARS:l.changeARS||null,comCompra,comVenta,comTotal,plNeto,rendNeto,priceFallback};
  }),[pos,prices,macro]);

  const portfolioTotal=useMemo(()=>enriched.reduce((s,p)=>s+p.montoActual,0),[enriched]);
  const invertido=useMemo(()=>enriched.reduce((s,p)=>s+p.montoInvertido,0),[enriched]);
  const caucionUSD=(caucion.montoARS>0&&macro.dolarMEP>0)?caucion.montoARS/macro.dolarMEP:0;
  const portfolioLiquido=portfolioTotal-caucionUSD;
  const totalComVenta=useMemo(()=>enriched.reduce((s,p)=>s+p.comVenta,0),[enriched]);
  const portfolioNeto=portfolioLiquido-totalComVenta; /* lo que queda en mano si vendés todo */
  const pl=portfolioTotal-invertido;const rend=invertido>0?(pl/invertido)*100:0;
  /* Variación diaria del P&L */
  const dailyPL=useMemo(()=>{
    const monto=enriched.reduce((s,p)=>s+p.montoActual*(p.variacion/100),0);
    const pct=portfolioTotal>0?(monto/portfolioTotal)*100:0;
    return{monto,pct};
  },[enriched,portfolioTotal]);

  /* Patrimonio total incluyendo inmueble neto - caución */
  const patrimonioNeto=portfolioTotal+casaActual.valor-deudaUSD-caucionUSD;

  /* ── Snapshots diarios de rendimiento ── */
  const [perfSnapshots,setPerfSnapshots]=useState(()=>loadLS("perf_snapshots",[]));
  useEffect(()=>{
    if(portfolioTotal<=0||!macro.dolarCCL)return;
    const today=new Date().toISOString().split("T")[0];
    const existing=perfSnapshots.find(s=>s.date===today);
    const snap={date:today,portfolioUSD:Math.round(portfolioTotal*100)/100,invertidoUSD:Math.round(invertido*100)/100,portfolioARS:Math.round(portfolioTotal*macro.dolarCCL),dolarCCL:macro.dolarCCL};
    /* Intentar guardar benchmarks (Merval en USD y S&P) — se obtienen via Yahoo */
    const fetchBenchmarks=async()=>{
      try{
        const url=PROXY+encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/%5EMERV?range=1d&interval=1d");
        const r=await fetch(url);const j=await r.json();
        const mervalARS=j.chart?.result?.[0]?.meta?.regularMarketPrice||0;
        if(mervalARS>0)snap.merval=Math.round((mervalARS/macro.dolarCCL)*100)/100;
      }catch(e){}
      try{
        const url2=PROXY+encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=1d&interval=1d");
        const r2=await fetch(url2);const j2=await r2.json();
        snap.sp500=j2.chart?.result?.[0]?.meta?.regularMarketPrice||0;
      }catch(e){}
      let updated;
      if(existing){
        updated=perfSnapshots.map(s=>s.date===today?{...existing,...snap}:s);
      }else{
        updated=[...perfSnapshots,snap].slice(-365); /* max 1 año */
      }
      setPerfSnapshots(updated);
      saveLS("perf_snapshots",updated);
    };
    fetchBenchmarks();
  },[portfolioTotal,invertido,macro.dolarCCL]); /* eslint-disable-line react-hooks/exhaustive-deps */

  const tabs=[{id:"resumen",label:"Resumen",emoji:"🏠"},{id:"tesis",label:"Tesis",emoji:"🧠"},{id:"dividendos",label:"Dividendos",emoji:"💰"},{id:"operaciones",label:"Operaciones",emoji:"📝"},{id:"noticias",label:"Noticias",emoji:"📰"},{id:"caucion",label:"Caución",emoji:"🏦"},{id:"trading",label:"Trading",emoji:"⚡"},{id:"potencial",label:"Potencial",emoji:"🎯"}];

  return <div style={{minHeight:"100vh"}}>
    <header style={{background:"linear-gradient(90deg,#0c0e14,#1a1d27)",borderBottom:"1px solid #1a1d27",padding:"12px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <img src="logo.png" alt="Eze & Claude Finance" style={{height:38,width:"auto",flexShrink:0,objectFit:"contain"}} onError={e=>{e.target.outerHTML='<div style="font-size:28;line-height:1;flex-shrink:0">🐻⚔️🐂</div>';}}/>
        <div>
          <h1 className="hdr-title" style={{margin:0,fontSize:18,fontWeight:700,color:"#f1f5f9",letterSpacing:"-.02em"}}>Dashboard de Eze 🇦🇷</h1>
          <div style={{fontSize:11,color:"#7a8497"}}>Actualizado: {lastUp.toLocaleTimeString("es-AR")}</div>
          <div style={{display:"flex",gap:10,fontSize:10,marginTop:2}}>
            <span>Data: <span style={{color:dataSource==="live"?"#10b981":dataSource==="fallback"?"#f59e0b":"#7a8497",fontWeight:600}}>{dataSource==="live"?"Online":dataSource==="fallback"?"Offline":"⏳"}</span></span>
            {(()=>{const now=new Date();const utc=now.getTime()+now.getTimezoneOffset()*60000;const art=new Date(utc-3*3600000);const h=art.getHours();const m=art.getMinutes();const d=art.getDay();const t=h*60+m;const bymaOn=d>=1&&d<=5&&t>=630&&t<1020;return <span>BYMA: <span style={{color:bymaOn?"#10b981":"#f43f5e",fontWeight:600}}>{bymaOn?"Online":"Offline"}</span></span>;})()}
            {(()=>{const now=new Date();const utc=now.getTime()+now.getTimezoneOffset()*60000;const et=new Date(utc-4*3600000);const h=et.getHours();const m=et.getMinutes();const d=et.getDay();const t=h*60+m;const nyseOn=d>=1&&d<=5&&t>=570&&t<960;return <span>NYSE: <span style={{color:nyseOn?"#10b981":"#f43f5e",fontWeight:600}}>{nyseOn?"Online":"Offline"}</span></span>;})()}
          </div>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <div className="macro-strip" style={{display:"flex",gap:12,fontSize:12}}>
          {(()=>{
            const of1=macro.dolarOficial;
            const bMEP=((macro.dolarMEP-of1)/of1*100).toFixed(1);
            const bCCL=((macro.dolarCCL-of1)/of1*100).toFixed(1);
            const bBlue=((macro.dolarBlue-of1)/of1*100).toFixed(1);
            const bTarjeta=((macro.dolarTarjeta-of1)/of1*100).toFixed(1);
            const mp=macroPrev;
            const dVar=(cur,prev)=>{if(!prev||!cur||prev===0)return null;return((cur-prev)/prev*100);};
            const fVar=v=>{if(v==null)return null;return`${v>=0?"+":""}${v.toFixed(1)}%`;};
            return[
              {l:"Oficial",v:`$${fmt(of1)}`,sub:"Brecha",daily:fVar(dVar(of1,mp.dolarOficial))},
              {l:"MEP",v:`$${fmt(macro.dolarMEP)}`,brecha:bMEP,daily:fVar(dVar(macro.dolarMEP,mp.dolarMEP))},
              {l:"CCL",v:`$${fmt(macro.dolarCCL)}`,brecha:bCCL,daily:fVar(dVar(macro.dolarCCL,mp.dolarCCL))},
              {l:"Blue",v:`$${fmt(macro.dolarBlue)}`,brecha:bBlue,daily:fVar(dVar(macro.dolarBlue,mp.dolarBlue))},
              {l:"Tarjeta",v:`$${fmt(macro.dolarTarjeta)}`,brecha:bTarjeta,daily:fVar(dVar(macro.dolarTarjeta,mp.dolarTarjeta))},
              {l:"Riesgo País",v:String(macro.riesgoPais)+" bp",daily:fVar(dVar(macro.riesgoPais,mp.riesgoPais))},
              {l:"Reservas",v:`USD ${fmt(macro.reservas,0)}M`,daily:fVar(dVar(macro.reservas,mp.reservas))},
              {l:"Inflación",v:`${fmt(macro.inflacion,1)}%`,sub:"mensual"},
              {l:"Infl. IA",v:`${fmt(macro.inflacionIA,1)}%`,sub:"interanual"},
              {l:"BADLAR",v:`${fmt(macro.tasa,1)}%`,daily:fVar(dVar(macro.tasa,mp.tasa))},
              {l:"UVA",v:`$${fmt(macro.uva,2)}`,sub:macro.uvaVar30d?`30d: ${macro.uvaVar30d>0?"+":""}${macro.uvaVar30d.toFixed(1)}%`:null,daily:fVar(dVar(macro.uva,mp.uva))}
            ].map(i=><div key={i.l} style={{textAlign:"center",minWidth:48}}>
              <div style={{color:"#4d5365",marginBottom:1,whiteSpace:"nowrap"}}>{i.l}</div>
              <div style={{fontWeight:600,color:"#c1c8d4",fontVariantNumeric:"tabular-nums",whiteSpace:"nowrap"}}>{i.v}</div>
              <div style={{fontSize:10,color:"#7a8497",fontWeight:500,minHeight:14}}>{i.brecha?`${i.brecha>=0?"+":""}${i.brecha}%`:i.sub||"\u00A0"}</div>
              <div style={{fontSize:9,fontWeight:500,minHeight:13,color:i.daily?(i.daily.startsWith("+")?"#10b981":i.daily.startsWith("-")?"#f43f5e":"#7a8497"):"transparent"}}>{i.daily||"\u00A0"}</div>
            </div>);
          })()}
        </div>
      </div>
    </header>
    <nav className="nav-bar" style={{background:"#0c0e14",borderBottom:"1px solid #1a1d27",display:"flex",gap:0,padding:"0 20px",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",gap:0}}>
        {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{background:"none",border:"none",color:tab===t.id?"#818cf8":"#7a8497",padding:"12px 16px",cursor:"pointer",fontSize:13,fontWeight:tab===t.id?600:400,borderBottom:tab===t.id?"2px solid #6366f1":"2px solid transparent",display:"flex",alignItems:"center",gap:6,transition:"all .15s",whiteSpace:"nowrap"}}>{t.emoji} {t.label}</button>)}
      </div>
      <div style={{display:"flex",gap:6,alignItems:"center",paddingRight:4}}>
        {syncStatus==="syncing"&&<span style={{fontSize:11,color:"#f59e0b",animation:"pulse 1s infinite"}}>⏳ Sincronizando...</span>}
        {syncStatus==="ok"&&<span style={{fontSize:11,color:"#10b981"}} title={lastSync?"Último sync: "+lastSync.toLocaleTimeString("es-AR"):""}>☁️ Sync OK</span>}
        {syncStatus==="error"&&<span style={{fontSize:11,color:"#f43f5e"}}>⚠ Error sync</span>}
        {syncStatus==="idle"&&!loadLS("gh_token","")&&<span style={{fontSize:11,color:"#7a8497"}}>☁️ Sin sync</span>}
        <button onClick={()=>setShowConfig(true)} title="Configurar sincronización" style={{background:"#1a1d27",border:"1px solid #2a2f3f",color:"#c1c8d4",borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>⚙️ Sync</button>
        <button onClick={exportData} title="Backup local JSON" style={{background:"#1a1d27",border:"1px solid #2a2f3f",color:"#c1c8d4",borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>💾</button>
        <button onClick={resetData} title="Resetear datos" style={{background:"#1a1d27",border:"1px solid #7f1d2e44",color:"#f43f5e",borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>🔄</button>
      </div>
    </nav>
    {showConfig&&<SyncConfigPanel onClose={()=>setShowConfig(false)}/>}
    <main className="main-content" style={{padding:24,maxWidth:1400,margin:"0 auto"}}>
      {tab==="resumen"&&<Resumen enriched={enriched} total={portfolioTotal} invertido={invertido} pl={pl} rend={rend} macro={macro} ops={ops} prices={prices} casa={casa} setCasa={setCasa} casaActual={casaActual} hipoteca={hipoteca} setHipoteca={setHipoteca} deudaUSD={deudaUSD} patrimonioNeto={patrimonioNeto} caucion={caucion} setCaucion={setCaucion} caucionUSD={caucionUSD} portfolioLiquido={portfolioLiquido} portfolioTotal={portfolioTotal} dailyPL={dailyPL} news={news} portfolioNeto={portfolioNeto} totalComVenta={totalComVenta}/>}
      {tab==="tesis"&&<TesisActiva enriched={enriched} tesis={tesis}/>}
      {tab==="dividendos"&&<Dividendos enriched={enriched}/>}
      {tab==="operaciones"&&<Operaciones ops={ops} setOps={setOps} macro={macro} enriched={enriched}/>}
      {tab==="trading"&&<Trading macro={macro} prices={prices} pos={pos} priceAlerts={priceAlerts} addPriceAlert={addPriceAlert} removePriceAlert={removePriceAlert} togglePriceAlert={togglePriceAlert} onOpenConfig={()=>setShowConfig(true)} tradingForm={tradingForm} setTradingForm={setTradingForm}/>}
      {tab==="potencial"&&<Potencial pos={pos} prices={prices} macro={macro}/>}
      {tab==="noticias"&&<Noticias pos={pos} news={news}/>}
      {tab==="caucion"&&<Caucion caucion={caucion} setCaucion={setCaucion} iolStatus={iolStatus} fetchCaucionRate={fetchCaucionRate} caucionForm={caucionForm} setCaucionForm={setCaucionForm}/>}
    </main>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
