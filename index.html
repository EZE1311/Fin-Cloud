                  <rect x={0} y={barH/3} width={48} height={barH/3} fill="#fff"/>
                  <rect x={0} y={barH*2/3} width={48} height={barH/3} fill="#74ACDF"/>
                  <circle cx={24} cy={barH/2} r={2.5} fill="#F6B40E" stroke="#85340A" strokeWidth={.3}/>
                </pattern>
              </defs>
              {byCountry.map((d,i)=>{
                const y=i*(barH+10)+4;const w=max>0?(d.value/max)*220:0;const pct=total>0?(d.value/total*100).toFixed(1):0;
                return <g key={i}>
                  <text x={105} y={y+barH/2+4} textAnchor="end" fill="#e6edf3" fontSize="12" fontWeight="600">{d.name}</text>
                  <rect x={110} y={y} width={w} height={barH} rx={3} fill={`url(#flag-${d.flag})`}/>
                  <rect x={110} y={y} width={w} height={barH} rx={3} fill="rgba(0,0,0,0.15)"/>
                  <text x={115+w} y={y+barH/2+4} fill="#e6edf3" fontSize="11" fontWeight="600">{pct}% · ${(d.value/1000).toFixed(0)}k</text>
                </g>;
              })}
            </svg>;
          })()}
        </div>
      </Card>
    </div>

    {/* ── Movers + News Feed (Bloomberg-style) ── */}
    <div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      {(()=>{
        /* Evolución histórica del portfolio — datos hardcoded + año actual dinámico */
        const hist=[
          {year:2023,capital:152951,pl:21924,rend:16.73},
          {year:2024,capital:429639,pl:276688,rend:180.90},
          {year:2025,capital:371436,pl:-58203,rend:-13.55},
        ];
        const curYear=new Date().getFullYear();
        const prevYearCap=hist.length>0?hist[hist.length-1].capital:0;
        const curPL=patrimonioNeto-prevYearCap;
        const curRend=prevYearCap>0?((patrimonioNeto-prevYearCap)/prevYearCap*100):0;
        const curEntry={year:curYear,capital:patrimonioNeto,pl:curPL,rend:curRend};
        /* Auto-snapshot: si estamos en enero y el año anterior no está en hist, guardarlo */
        const all=[...hist,curEntry];
        /* CAGR — retorno anualizado compuesto */
        const compFactor=all.reduce((acc,d)=>acc*(1+d.rend/100),1);
        const startOfFirstYear=new Date(all[0].year,0,1);
        const now=new Date();
        const nYears=(now-startOfFirstYear)/(365.25*24*60*60*1000);
        const cagr=nYears>0?(Math.pow(compFactor,1/nYears)-1)*100:0;
        const maxCap=Math.max(...all.map(d=>d.capital));
        const barW=260;
        return <Card title="Evolución del Portfolio" right={<span style={{fontSize:10,color:"#4d5365",fontWeight:400}}>Cierre anual en USD</span>}>
          {/* Gráfico de barras */}
          <svg width="100%" height={all.length*44+10} viewBox={`0 0 440 ${all.length*44+10}`} preserveAspectRatio="xMidYMid meet">
            {all.map((d,i)=>{
              const y=i*44+5;const w=maxCap>0?(d.capital/maxCap)*barW:0;
              const isNeg=d.rend<0;const isCur=d.year===curYear;
              return <g key={d.year}>
                <text x={40} y={y+18} textAnchor="end" fill={isCur?"#818cf8":"#e6edf3"} fontSize="13" fontWeight="700">{d.year}</text>
                <rect x={48} y={y} width={w} height={28} rx={4} fill={isCur?"#6366f1":isNeg?"#dc2626":"#10b981"} opacity={isCur?.9:.7}/>
                <text x={54+w} y={y+12} fill="#e6edf3" fontSize="11" fontWeight="600">{fU(d.capital)}</text>
                <text x={54+w} y={y+24} fill={d.pl>=0?"#10b981":"#f43f5e"} fontSize="10" fontWeight="500">{d.pl>=0?"+":""}{fU(d.pl)} ({d.rend>=0?"+":""}{d.rend.toFixed(1)}%)</text>
              </g>;
            })}
          </svg>
          {/* Tabla resumen */}
          <table style={{width:"100%",borderCollapse:"collapse",marginTop:12,borderTop:"1px solid #22263350"}}>
            <thead><tr>
              {["Año","Capital","P&L","Rend%"].map(h=><th key={h} style={{padding:"8px 6px",fontSize:10,fontWeight:600,color:"#7a8497",textTransform:"uppercase",textAlign:h==="Año"?"left":"right",borderBottom:"1px solid #22263350"}}>{h}</th>)}
            </tr></thead>
            <tbody>{all.map(d=>{
              const isCur=d.year===curYear;
              return <tr key={d.year} style={{borderBottom:"1px solid #1a1d27",background:isCur?"#1a1d2744":"transparent"}}>
                <td style={{padding:"6px",fontSize:12,fontWeight:isCur?700:500,color:isCur?"#818cf8":"#e6edf3"}}>{d.year}{isCur?" *":""}</td>
                <td style={{padding:"6px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums",fontWeight:600}}>{fU(d.capital)}</td>
                <td style={{padding:"6px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums",fontWeight:600,color:d.pl>=0?"#10b981":"#f43f5e"}}>{d.pl>=0?"+":""}{fU(d.pl)}</td>
                <td style={{padding:"6px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums",fontWeight:600,color:d.rend>=0?"#10b981":"#f43f5e"}}>{d.rend>=0?"+":""}{d.rend.toFixed(2)}%</td>
              </tr>;
            })}</tbody>
            <tfoot><tr style={{borderTop:"2px solid #2a2f3f"}}>
              <td style={{padding:"8px 6px",fontSize:12,fontWeight:700,color:"#c1c8d4"}}>CAGR</td>
              <td colSpan={2} style={{padding:"8px 6px",textAlign:"right",fontSize:10,color:"#7a8497"}}>Retorno anualizado</td>
              <td style={{padding:"8px 6px",textAlign:"right",fontSize:13,fontVariantNumeric:"tabular-nums",fontWeight:700,color:cagr>=0?"#10b981":"#f43f5e"}}>{cagr>=0?"+":""}{cagr.toFixed(2)}%</td>
            </tr></tfoot>
          </table>
          <div style={{fontSize:9,color:"#4d5365",marginTop:6,fontStyle:"italic"}}>* {curYear} en curso · CAGR = retorno anualizado compuesto desde {all[0].year}</div>
        </Card>;
      })()}
      <Card title="Noticias Relevantes" right={<span style={{fontSize:10,color:"#4d5365",fontWeight:400}}>LIVE FEED</span>}>
        <div style={{display:"flex",flexDirection:"column",gap:0}}>
          {relevantNews.map((n,i)=><div key={n.id}>
            <div style={{display:"flex",alignItems:"flex-start",gap:10,padding:"8px 0",borderBottom:i<relevantNews.length-1?"1px solid #1a1d27":"none",transition:"background .15s"}} onMouseEnter={e=>e.currentTarget.style.background="#2226335033"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              <span style={{fontSize:10,color:"#4d5365",whiteSpace:"nowrap",marginTop:2,minWidth:42,fontVariantNumeric:"tabular-nums"}}>{n.pubDate?timeAgo(n.pubDate):n.time}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                  <span style={{fontSize:10,fontWeight:700,color:n.sentiment==="positive"?"#10b981":"#f43f5e",letterSpacing:".03em"}}>{n.ticker}</span>
                  <span style={{fontSize:10,color:"#4d5365"}}>· {n.source}</span>
                </div>
                <a href={n.link||`https://www.google.com/search?q=${encodeURIComponent(n.title)}&tbm=nws`} target="_blank" rel="noopener" style={{fontSize:12,fontWeight:500,color:"#e6edf3",lineHeight:1.4,display:"block",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",textDecoration:"none",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.color="#818cf8"} onMouseLeave={e=>e.currentTarget.style.color="#e6edf3"}>{n.title}</a>
              </div>
            </div>
          </div>)}
        </div>
      </Card>
    </div>

    {/* ── Inmobiliario (al final) ── */}
    <div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <Card title="🏠 Valuación Casa">
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
            <label style={{fontSize:12,color:"#c1c8d4"}}>Precio compra USD <input type="number" value={casa.precioCompra} onChange={e=>setCasa(c=>({...c,precioCompra:+e.target.value}))} style={inputSt}/></label>
            <label style={{fontSize:12,color:"#c1c8d4"}}>Años <input type="number" value={casa.anios} min={0} onChange={e=>setCasa(c=>({...c,anios:+e.target.value}))} style={{...inputSt,width:60}}/></label>
            <label style={{fontSize:12,color:"#c1c8d4"}}>Tasa anual % <input type="number" value={casa.tasaAnual} step={0.5} onChange={e=>setCasa(c=>({...c,tasaAnual:+e.target.value}))} style={{...inputSt,width:70}}/></label>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
            <div style={{background:"#0c0e14",borderRadius:8,padding:"10px 12px",border:"1px solid #1a1d27"}}>
              <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:3}}>Valor Actual</div>
              <div style={{fontSize:16,fontWeight:700,color:"#e6edf3"}}>{fU(casaActual.valor)}</div>
            </div>
            <div style={{background:"#0c0e14",borderRadius:8,padding:"10px 12px",border:"1px solid #1a1d27"}}>
              <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:3}}>P&L</div>
              <div style={{fontSize:16,fontWeight:700,color:casaActual.pl>=0?"#10b981":"#f43f5e"}}>{fU(casaActual.pl)}</div>
            </div>
            <div style={{background:"#0c0e14",borderRadius:8,padding:"10px 12px",border:"1px solid #1a1d27"}}>
              <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:3}}>Rend</div>
              <div style={{fontSize:16,fontWeight:700,color:casaActual.rend>=0?"#10b981":"#f43f5e"}}>{fP(casaActual.rend)}</div>
            </div>
          </div>
        </div>
      </Card>
      <Card title="🏦 Hipoteca BBVA (UVAs)">
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
            <label style={{fontSize:12,color:"#c1c8d4"}}>Cant. UVAs <input type="number" value={hipoteca.uvas} onChange={e=>setHipoteca(h=>({...h,uvas:+e.target.value}))} style={{...inputSt,width:120}}/></label>
            <label style={{fontSize:12,color:"#c1c8d4"}}>Cotiz. UVA $ <span style={{display:"inline-block",background:"#0c0e14",border:"1px solid #1a1d27",borderRadius:6,padding:"4px 8px",color:"#10b981",fontSize:14,fontWeight:600,minWidth:90,fontVariantNumeric:"tabular-nums"}}>${fmt(macro.uva,2)}</span></label>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
            <div style={{background:"#0c0e14",borderRadius:8,padding:"10px 12px",border:"1px solid #1a1d27"}}>
              <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:3}}>Deuda ARS</div>
              <div style={{fontSize:16,fontWeight:700,color:"#f59e0b"}}>${fmt(deudaARS)}</div>
            </div>
            <div style={{background:"#0c0e14",borderRadius:8,padding:"10px 12px",border:"1px solid #1a1d27"}}>
              <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:3}}>Deuda USD (MEP)</div>
              <div style={{fontSize:16,fontWeight:700,color:"#f43f5e"}}>{fU(deudaUSD)}</div>
            </div>
            <div style={{background:"#0c0e14",borderRadius:8,padding:"10px 12px",border:"1px solid #1a1d27"}}>
              <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:3}}>Préstamo Inicial</div>
              <div style={{fontSize:16,fontWeight:700,color:"#10b981"}}>USD 200.695,76</div>
            </div>
            <div style={{background:"#0c0e14",borderRadius:8,padding:"10px 12px",border:"1px solid #1a1d27"}}>
              <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:3}}>Saldo vs Inicial</div>
              <div style={{fontSize:16,fontWeight:700,color:deudaUSD>200695.76?"#f43f5e":"#10b981"}}>{deudaUSD>200695.76?"+":" "}{fU(deudaUSD-200695.76)}</div>
            </div>
          </div>
        </div>
      </Card>
    </div>
  </div>;
}

/* ── OPERACIONES ─────────────────────────── */
function Operaciones({ops,setOps,macro,enriched}){
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState({ticker:"",tipo:"COMPRA",cantidad:"",precio:"",mercado:"BYMA",broker:"BM",moneda:"ARS",fecha:todayISO(),ccl:""});
  const [filter,setFilter]=useState("");
  const [confirmDel,setConfirmDel]=useState(null);
  const emptyForm={ticker:"",tipo:"COMPRA",cantidad:"",precio:"",mercado:"BYMA",broker:"BM",moneda:"ARS",fecha:todayISO(),ccl:""};
  const montoUSD=(op)=>{
    if(op.moneda==="USD") return op.cantidad*op.precio;
    if(op.ccl&&op.ccl>0) return (op.cantidad*op.precio)/op.ccl;
    return null;
  };
  const startEdit=(op)=>{
    setEditId(op.id);
    setForm({ticker:op.ticker,tipo:op.tipo,cantidad:String(op.cantidad),precio:String(op.precio),mercado:op.mercado,broker:op.broker,moneda:op.moneda,fecha:toISO(op.fecha)||op.fecha,ccl:op.ccl?String(op.ccl):""});
    setShowForm(true);
  };
  const deleteOp=(id)=>{
    setOps(ops.filter(o=>o.id!==id));
    setConfirmDel(null);
  };
  const submit=e=>{
    e.preventDefault();if(!form.ticker||!form.cantidad||!form.precio)return;
    const isARS=form.moneda==="ARS";
    const cclVal=isARS?(form.ccl?parseFloat(form.ccl):macro.dolarCCL):null;
    const opData={ticker:form.ticker.toUpperCase(),tipo:form.tipo,cantidad:parseFloat(form.cantidad),precio:parseFloat(form.precio),mercado:form.mercado,broker:form.broker,moneda:form.moneda,fecha:form.fecha?fromISO(form.fecha):today(),ccl:cclVal};
    if(editId){
      setOps(ops.map(o=>o.id===editId?{...o,...opData}:o));
      setEditId(null);
    }else{
      setOps([...ops,{id:Date.now(),...opData}]);
    }
    setForm(emptyForm);setShowForm(false);
  };
  const cancelForm=()=>{setShowForm(false);setEditId(null);setForm(emptyForm);};
  const fl=filter?ops.filter(o=>o.ticker.toLowerCase().includes(filter.toLowerCase())):ops;

  return <div style={{display:"flex",flexDirection:"column",gap:18}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <input placeholder="Filtrar por ticker..." value={filter} onChange={e=>setFilter(e.target.value)} style={{width:200}}/>
        <span style={{fontSize:12,color:"#7a8497"}}>{fl.length} ops</span>
      </div>
      <Btn onClick={()=>{setEditId(null);setForm(emptyForm);setShowForm(!showForm)}}>+ Nueva Operación</Btn>
    </div>
    {showForm&&<Card title={editId?"Modificar Operación":"Registrar Operación"}>
      <form onSubmit={submit} className="form-grid" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
        <div><label style={{fontSize:11,color:"#7a8497",display:"block",marginBottom:4}}>Ticker</label><input value={form.ticker} onChange={e=>setForm({...form,ticker:e.target.value.toUpperCase()})} placeholder="AAPL" required style={{width:"100%"}}/></div>
        <div><label style={{fontSize:11,color:"#7a8497",display:"block",marginBottom:4}}>Tipo</label><select value={form.tipo} onChange={e=>setForm({...form,tipo:e.target.value})} style={{width:"100%"}}><option value="COMPRA">COMPRA</option><option value="VENTA">VENTA</option></select></div>
        <div><label style={{fontSize:11,color:"#7a8497",display:"block",marginBottom:4}}>Cantidad</label><input type="number" value={form.cantidad} onChange={e=>setForm({...form,cantidad:e.target.value})} required style={{width:"100%"}}/></div>
        <div><label style={{fontSize:11,color:"#7a8497",display:"block",marginBottom:4}}>Precio</label><input type="number" step="0.0001" value={form.precio} onChange={e=>setForm({...form,precio:e.target.value})} required style={{width:"100%"}}/></div>
        <div><label style={{fontSize:11,color:"#7a8497",display:"block",marginBottom:4}}>Broker</label><select value={form.broker} onChange={e=>{const b=e.target.value;setForm({...form,broker:b,mercado:b==="CS"?"NYSE":"BYMA",moneda:b==="CS"?"USD":"ARS"})}} style={{width:"100%"}}><option value="BM">Bull Market (BYMA/ARS)</option><option value="CS">Charles Schwab (USA/USD)</option></select></div>
        <div><label style={{fontSize:11,color:"#7a8497",display:"block",marginBottom:4}}>Mercado</label><div style={{padding:"8px 12px",background:"#0c0e14",borderRadius:6,fontSize:13,color:"#c1c8d4"}}>{form.broker==="CS"?"NYSE":"BYMA"} · {form.broker==="CS"?"USD":"ARS"}</div></div>
        <div><label style={{fontSize:11,color:"#7a8497",display:"block",marginBottom:4}}>Fecha</label><input type="date" value={form.fecha} onChange={e=>setForm({...form,fecha:e.target.value})} style={{width:"100%",colorScheme:"dark"}}/></div>
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          {(form.moneda==="ARS")&&<div><label style={{fontSize:11,color:"#7a8497",display:"block",marginBottom:4}}>CCL {!editId&&<span style={{color:"#818cf8"}}>(auto: ${fmt(macro.dolarCCL)})</span>}</label><input type="number" step="0.01" value={form.ccl} onChange={e=>setForm({...form,ccl:e.target.value})} placeholder={String(macro.dolarCCL)} style={{width:"100%"}}/></div>}
          <div style={{display:"flex",alignItems:"flex-end",gap:8,flex:1,marginTop:4}}><Btn variant="success" onClick={submit} style={{flex:1}}>{editId?"Actualizar":"Guardar"}</Btn><Btn variant="ghost" onClick={cancelForm}>✕</Btn></div>
        </div>
      </form>
    </Card>}
    {confirmDel&&<div style={{background:"#7f1d2e22",border:"1px solid #dc262644",borderRadius:10,padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
      <span style={{fontSize:13,color:"#fca5a5"}}>¿Eliminar la operación de <strong>{ops.find(o=>o.id===confirmDel)?.ticker}</strong> del {ops.find(o=>o.id===confirmDel)?.fecha}?</span>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>deleteOp(confirmDel)} style={{background:"#dc2626",border:"none",color:"#fff",borderRadius:6,padding:"6px 16px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Sí, eliminar</button>
        <button onClick={()=>setConfirmDel(null)} style={{background:"#2a2f3f",border:"none",color:"#c1c8d4",borderRadius:6,padding:"6px 16px",fontSize:12,cursor:"pointer"}}>Cancelar</button>
      </div>
    </div>}
    <Card>
      <div className="table-wrap" style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:950}}>
          <thead><tr>{["Fecha","Ticker","Tipo","Cantidad","Precio","CCL","Monto ARS","Monto USD","Comisión","Broker",""].map(h2=><th key={h2} style={{padding:"10px 8px",textAlign:["Fecha","Ticker","Tipo",""].includes(h2)?"left":"right",fontSize:11,fontWeight:600,color:"#7a8497",textTransform:"uppercase",borderBottom:"1px solid #22263350",background:"#151a27"}}>{h2}</th>)}</tr></thead>
          <tbody>{[...fl].reverse().map(op=>{const usd=montoUSD(op);const ep=enriched&&enriched.find(e=>e.ticker===op.ticker);const tipoActivo=ep?ep.tipo:"Acción";const com=usd!=null?calcComision(usd,op.broker,tipoActivo):0;return <tr key={op.id} style={{borderBottom:"1px solid #1a1d27",background:editId===op.id?"#6366f111":"transparent"}} onMouseEnter={e=>{if(editId!==op.id)e.currentTarget.style.background="#2226335033"}} onMouseLeave={e=>{if(editId!==op.id)e.currentTarget.style.background=editId===op.id?"#6366f111":"transparent"}}>
            <td style={{padding:"10px 8px",fontSize:13}}>{op.fecha}</td>
            <td style={{padding:"10px 8px",fontWeight:700,fontSize:14}}>{op.ticker}</td>
            <td style={{padding:"10px 8px"}}><Badge text={op.tipo} color={op.tipo==="COMPRA"?"#10b981":"#f43f5e"} bg={op.tipo==="COMPRA"?"#065f4622":"#7f1d2e22"}/></td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{fmt(op.cantidad)}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{op.moneda==="USD"?fU(op.precio):`$${fmt(op.precio)}`}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:12,color:op.ccl?"#818cf8":"#2a2f3f"}}>{op.ccl?`$${fmt(op.ccl,2)}`:"—"}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{op.moneda==="ARS"?`$${fmt(op.cantidad*op.precio)}`:"—"}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontWeight:600,color:"#f1f5f9"}}>{usd!=null?fU(usd):"—"}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:12,color:com>0?"#f59e0b":"#4d5365"}}>{com>0?fU(com):"—"}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontSize:12,color:"#c1c8d4"}}>{op.broker}</td>
            <td style={{padding:"10px 8px",whiteSpace:"nowrap"}}>
              <button onClick={()=>startEdit(op)} title="Editar" style={{background:"none",border:"none",cursor:"pointer",padding:"4px 6px",fontSize:14,opacity:.5,transition:"opacity .15s"}} onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=.5}>✏️</button>
              <button onClick={()=>setConfirmDel(op.id)} title="Eliminar" style={{background:"none",border:"none",cursor:"pointer",padding:"4px 6px",fontSize:14,opacity:.5,transition:"opacity .15s"}} onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=.5}>🗑</button>
            </td>
          </tr>})}</tbody>
        </table>
      </div>
    </Card>

    {/* ── Simulador de Comisiones ── */}
    {enriched&&enriched.length>0&&<Card title="Comisiones Estimadas" right={<span style={{fontSize:10,color:"#4d5365"}}>Bull Market · Active Trader Plus</span>}>
      {(()=>{
        const totComCompra=enriched.reduce((s,p)=>s+p.comCompra,0);
        const totComVenta=enriched.reduce((s,p)=>s+p.comVenta,0);
        const totCom=totComCompra+totComVenta;
        const totActual=enriched.reduce((s,p)=>s+p.montoActual,0);
        const pctCost=totActual>0?(totCom/totActual*100):0;
        return<div>
          {/* Resumen */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14,marginBottom:16}}>
            <div style={{background:"#0c0e14",borderRadius:8,padding:"12px 14px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:4}}>Comisión Compra</div>
              <div style={{fontSize:18,fontWeight:700,color:"#f59e0b",fontVariantNumeric:"tabular-nums"}}>{fU(totComCompra)}</div>
              <div style={{fontSize:10,color:"#4d5365"}}>ya pagada</div>
            </div>
            <div style={{background:"#0c0e14",borderRadius:8,padding:"12px 14px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:4}}>Comisión Venta</div>
              <div style={{fontSize:18,fontWeight:700,color:"#f59e0b",fontVariantNumeric:"tabular-nums"}}>{fU(totComVenta)}</div>
              <div style={{fontSize:10,color:"#4d5365"}}>estimada a valor actual</div>
            </div>
            <div style={{background:"#0c0e14",borderRadius:8,padding:"12px 14px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:4}}>Costo Total</div>
              <div style={{fontSize:18,fontWeight:700,color:"#f43f5e",fontVariantNumeric:"tabular-nums"}}>{fU(totCom)}</div>
              <div style={{fontSize:10,color:"#4d5365"}}>{fmt(pctCost,3)}% del portfolio</div>
            </div>
          </div>
          {/* Detalle por posición */}
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr>
              {["Ticker","Tipo","Broker","Compra","Venta","Total","IVA"].map(h=><th key={h} style={{padding:"6px 8px",textAlign:h==="Ticker"||h==="Tipo"||h==="Broker"?"left":"right",fontSize:10,fontWeight:600,color:"#7a8497",textTransform:"uppercase",borderBottom:"1px solid #22263350"}}>{h}</th>)}
            </tr></thead>
            <tbody>{enriched.map(p=>{
              const exento=p.tipo==="Bono"||p.tipo==="Letra"||p.tipo==="ON";
              return<tr key={p.ticker} style={{borderBottom:"1px solid #1a1d27"}}>
                <td style={{padding:"6px 8px",fontWeight:700,fontSize:12}}>{p.ticker}</td>
                <td style={{padding:"6px 8px",fontSize:11,color:"#c1c8d4"}}>{p.tipo}</td>
                <td style={{padding:"6px 8px",fontSize:11,color:"#c1c8d4"}}>{p.broker}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums",color:p.comCompra>0?"#f59e0b":"#4d5365"}}>{fU(p.comCompra)}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums",color:p.comVenta>0?"#f59e0b":"#4d5365"}}>{fU(p.comVenta)}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontSize:12,fontVariantNumeric:"tabular-nums",fontWeight:600,color:p.comTotal>0?"#f43f5e":"#4d5365"}}>{fU(p.comTotal)}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontSize:10,color:exento?"#10b981":"#f59e0b"}}>{exento?"Exento":"21%"}</td>
              </tr>;
            })}</tbody>
            <tfoot><tr style={{borderTop:"2px solid #2a2f3f"}}>
              <td colSpan={3} style={{padding:"8px",fontWeight:700,fontSize:12}}>TOTAL</td>
              <td style={{padding:"8px",textAlign:"right",fontWeight:700,fontSize:12,color:"#f59e0b"}}>{fU(totComCompra)}</td>
              <td style={{padding:"8px",textAlign:"right",fontWeight:700,fontSize:12,color:"#f59e0b"}}>{fU(totComVenta)}</td>
              <td style={{padding:"8px",textAlign:"right",fontWeight:700,fontSize:12,color:"#f43f5e"}}>{fU(totCom)}</td>
              <td></td>
            </tr></tfoot>
          </table>
          <div style={{fontSize:9,color:"#4d5365",marginTop:8,fontStyle:"italic"}}>Bonos, Letras y ONs exentos de IVA · Mercado internacional (CS) sin comisión · Fuente: Tarifario BM Marzo 2025</div>
        </div>;
      })()}
    </Card>}
  </div>;
}

/* ── DIVIDENDOS · FLUJO + PROYECCIÓN ─────────── */
function Dividendos({enriched}){
  const fU=n=>`USD ${new Intl.NumberFormat("es-AR",{maximumFractionDigits:2}).format(n)}`;
  const fU0=n=>`USD ${new Intl.NumberFormat("es-AR",{maximumFractionDigits:0}).format(n)}`;
  const [divData,setDivData]=useState([]);
  const [loading,setLoading]=useState(false);
  const [progress,setProgress]=useState({done:0,total:0});
  const [lastFetch,setLastFetch]=useState(null);

  const tickers=[...new Set((enriched||[]).map(e=>e.ticker))];

  /* Fetch dividends in PARALLEL with per-ticker timeout + progress counter */
  const fetchDividends=useCallback(async()=>{
    if(tickers.length===0)return;
    setLoading(true);
    setProgress({done:0,total:tickers.length});
    const now=Math.floor(Date.now()/1000);
    const oneYearAgo=now-365*86400;
    const oneYearFwd=now+365*86400;

    const fetchOne=async ticker=>{
      const pos=enriched.find(e=>e.ticker===ticker);
      if(!pos)return [];
      const sym=yfSym(ticker);
      const url=`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?period1=${oneYearAgo}&period2=${oneYearFwd}&interval=1mo&events=dividends`;
      const tryFetch=async u=>{
        const ctrl=new AbortController();
        const tid=setTimeout(()=>ctrl.abort(),8000);
        try{const r=await fetch(u,{signal:ctrl.signal});clearTimeout(tid);return r;}
        catch(e){clearTimeout(tid);return null;}
      };
      try{
        let r=await tryFetch(PROXY+encodeURIComponent(url));
        if(!r||!r.ok)r=await tryFetch("https://corsproxy.io/?"+encodeURIComponent(url));
        if(!r||!r.ok)return [];
        const j=await r.json();
        const divs=j.chart?.result?.[0]?.events?.dividends;
        if(!divs)return [];
        const price=pos.precioActual||pos.ppc;
        return Object.values(divs).map(d=>({
          ticker,sym,
          date:new Date(d.date*1000).toISOString().split("T")[0],
          amount:d.amount,cantidad:pos.cantidad,
          total:d.amount*pos.cantidad,
          yield:price>0?((d.amount/price)*100):0,
          isPast:d.date<now
        }));
      }catch(e){console.warn("Div fetch error for",ticker,e);return [];}
      finally{setProgress(p=>({done:p.done+1,total:p.total}));}
    };

    /* Parallel fetch: all tickers at once */
    const all=await Promise.all(tickers.map(fetchOne));
    const results=all.flat().sort((a,b)=>a.date.localeCompare(b.date));
    setDivData(results);
    setLastFetch(new Date());
    setLoading(false);
  },[enriched,tickers.join(",")]); /* eslint-disable-line */

  useEffect(()=>{if(tickers.length>0&&divData.length===0)fetchDividends();},[tickers.length]); /* eslint-disable-line */

  /* Split into past and upcoming */
  const today=new Date().toISOString().split("T")[0];
  const upcoming=divData.filter(d=>d.date>=today).map(u=>({...u,isProjected:false}));
  const past=divData.filter(d=>d.date<today);

  /* Forward projection: shift past dividends +365 days. Snapshot current cantidad. */
  const projected=past.map(d=>{
    const nd=new Date(d.date+"T12:00:00");
    nd.setDate(nd.getDate()+365);
    const pos=enriched.find(e=>e.ticker===d.ticker);
    const cant=pos?pos.cantidad:d.cantidad;
    return {...d,date:nd.toISOString().split("T")[0],cantidad:cant,total:d.amount*cant,isProjected:true};
  }).filter(p=>p.date>=today);

  /* Merge confirmed + projected, dedup within ±15d window per ticker (prefer confirmed) */
  const merged=[...upcoming];
  projected.forEach(p=>{
    const pT=new Date(p.date+"T12:00:00").getTime();
    const dup=merged.find(u=>u.ticker===p.ticker&&Math.abs(new Date(u.date+"T12:00:00").getTime()-pT)<15*86400000);
    if(!dup)merged.push(p);
  });
  merged.sort((a,b)=>a.date.localeCompare(b.date));

  /* Annual projection: sum of last 12 months dividends per ticker, projected forward */
  const annualByTicker={};
  past.forEach(d=>{
    if(!annualByTicker[d.ticker])annualByTicker[d.ticker]={ticker:d.ticker,annual:0,cantidad:d.cantidad,price:0,count:0};
    annualByTicker[d.ticker].annual+=d.amount;
    annualByTicker[d.ticker].count++;
  });
  upcoming.forEach(d=>{
    if(!annualByTicker[d.ticker])annualByTicker[d.ticker]={ticker:d.ticker,annual:0,cantidad:d.cantidad,price:0,count:0};
  });
  /* Use current portfolio cantidad + price for accuracy */
  Object.values(annualByTicker).forEach(a=>{
    const pos=enriched.find(e=>e.ticker===a.ticker);
    if(pos){a.price=pos.precioActual||pos.ppc;a.cantidad=pos.cantidad;}
  });

  /* Build next 12-month forward buckets from merged */
  const next12=[];
  const startD=new Date();startD.setDate(1);
  for(let i=0;i<12;i++){
    const d=new Date(startD);d.setMonth(d.getMonth()+i);
    next12.push({month:d.toISOString().slice(0,7),total:0,confirmed:0,projected:0,items:[]});
  }
  merged.forEach(d=>{
    const slot=next12.find(s=>s.month===d.date.slice(0,7));
    if(!slot)return;
    slot.total+=d.total;
    if(d.isProjected)slot.projected+=d.total;else slot.confirmed+=d.total;
    slot.items.push(d);
  });

  const totalNext12=next12.reduce((s,m)=>s+m.total,0);
  const totalAnnualProjection=Object.values(annualByTicker).reduce((s,a)=>s+a.annual*a.cantidad,0);
  const portfolioTotal=enriched.reduce((s,p)=>s+p.montoActual,0);
  const fwdYield=portfolioTotal>0?(totalNext12/portfolioTotal)*100:0;
  const totalUpcoming=upcoming.reduce((s,d)=>s+d.total,0);
  const totalPast=past.reduce((s,d)=>s+d.total,0);
  const avgMonth=totalNext12/12;

  /* Month names */
  const monthName=d=>{const m=new Date(d+"T12:00:00").toLocaleDateString("es-AR",{month:"short"});return m.charAt(0).toUpperCase()+m.slice(1);};
  const monthLong=key=>{const d=new Date(key+"-15T12:00:00");const m=d.toLocaleDateString("es-AR",{month:"long"});return m.charAt(0).toUpperCase()+m.slice(1);};

  /* Group merged (confirmed + projected) by month for calendar */
  const upByMonth={};
  merged.forEach(d=>{const k=d.date.slice(0,7);if(!upByMonth[k])upByMonth[k]=[];upByMonth[k].push(d);});

  /* Bar chart dimensions for flujo 12 meses */
  const W=820,H=240,PAD_L=50,PAD_R=20,PAD_T=20,PAD_B=42;
  const chartW=W-PAD_L-PAD_R,chartH=H-PAD_T-PAD_B;
  const maxV=Math.max(...next12.map(m=>m.total),1);
  const colW=chartW/12,barW=colW*0.7,gap=colW*0.3;

  const statSt={background:"#13151c",borderRadius:10,padding:"14px 18px",border:"1px solid #22263350",flex:1,textAlign:"center"};

  return <Card title="💰 Dividendos · Flujo & Proyección" right={<button onClick={fetchDividends} disabled={loading} style={{background:"#1a1d27",border:"1px solid #2a2f3f",color:"#c1c8d4",borderRadius:6,padding:"4px 12px",fontSize:11,cursor:"pointer",fontWeight:500}}>
    {loading?`⏳ ${progress.done}/${progress.total}`:"🔄 Actualizar"}{lastFetch&&!loading&&<span style={{marginLeft:6,fontSize:9,color:"#4d5365"}}>{lastFetch.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}</span>}
  </button>}>

    {tickers.length===0&&<div style={{color:"#4d5365",textAlign:"center",padding:20,fontSize:13}}>Agregá posiciones en tu cartera para ver dividendos.</div>}

    {tickers.length>0&&divData.length===0&&!loading&&<div style={{color:"#4d5365",textAlign:"center",padding:20,fontSize:13}}>Presioná "Actualizar" para buscar dividendos de tu cartera.</div>}

    {divData.length>0&&<div>
      {/* ── Resumen cards ── */}
      <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        <div style={statSt}>
          <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:4}}>Próximos 12 meses</div>
          <div style={{fontSize:22,fontWeight:700,color:"#10b981"}}>{fU0(totalNext12)}</div>
          <div style={{fontSize:11,color:"#c1c8d4"}}>Yield fwd: {fwdYield.toFixed(2)}%</div>
        </div>
        <div style={statSt}>
          <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:4}}>Confirmados</div>
          <div style={{fontSize:22,fontWeight:700,color:"#818cf8"}}>{fU0(totalUpcoming)}</div>
          <div style={{fontSize:11,color:"#c1c8d4"}}>{upcoming.length} pago{upcoming.length!==1?"s":""} declarado{upcoming.length!==1?"s":""}</div>
        </div>
        <div style={statSt}>
          <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:4}}>Cobrados (12m)</div>
          <div style={{fontSize:22,fontWeight:700,color:"#a78bfa"}}>{fU0(totalPast)}</div>
          <div style={{fontSize:11,color:"#c1c8d4"}}>{past.length} pago{past.length!==1?"s":""}</div>
        </div>
        <div style={statSt}>
          <div style={{fontSize:10,color:"#7a8497",textTransform:"uppercase",marginBottom:4}}>Mensual Promedio</div>
          <div style={{fontSize:22,fontWeight:700,color:"#f59e0b"}}>{fU0(avgMonth)}</div>
          <div style={{fontSize:11,color:"#c1c8d4"}}>fwd 12m</div>
        </div>
      </div>

      {/* ── Flujo proyectado próximos 12 meses (bar chart) ── */}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:12,fontWeight:600,color:"#c1c8d4",marginBottom:8,textTransform:"uppercase",letterSpacing:".04em",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
          <span>Flujo proyectado próximos 12 meses</span>
          <span style={{fontSize:10,color:"#4d5365",textTransform:"none",fontWeight:400}}>
            <span style={{color:"#818cf8"}}>■</span> Confirmado &nbsp;
            <span style={{color:"#10b981"}}>■</span> Proyectado (basado en histórico) &nbsp;
            <span style={{color:"#f59e0b"}}>┄</span> Promedio
          </span>
        </div>
        <div style={{overflowX:"auto",background:"#0c0e14",borderRadius:10,border:"1px solid #1a1d27"}}>
          <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxHeight:300}}>
            {/* Grid + Y-axis labels */}
            {(()=>{const items=[];const steps=4;for(let i=0;i<=steps;i++){const v=maxV*i/steps;const y=PAD_T+chartH-(v/maxV)*chartH;items.push(React.createElement("line",{key:"g"+i,x1:PAD_L,x2:W-PAD_R,y1:y,y2:y,stroke:"#1a1d27",strokeWidth:1}));items.push(React.createElement("text",{key:"t"+i,x:PAD_L-6,y:y+4,fill:"#4d5365",fontSize:10,textAnchor:"end"},"$"+Math.round(v)));}return items;})()}
            {/* Average line */}
            {avgMonth>0&&React.createElement("line",{x1:PAD_L,x2:W-PAD_R,y1:PAD_T+chartH-(avgMonth/maxV)*chartH,y2:PAD_T+chartH-(avgMonth/maxV)*chartH,stroke:"#f59e0b",strokeWidth:1.5,strokeDasharray:"4,4"})}
            {avgMonth>0&&React.createElement("text",{x:W-PAD_R-4,y:PAD_T+chartH-(avgMonth/maxV)*chartH-4,fill:"#f59e0b",fontSize:9,textAnchor:"end"},"prom $"+Math.round(avgMonth))}
            {/* Bars */}
            {next12.map((m,i)=>{
              const x=PAD_L+i*colW+gap/2;
              const totalH=(m.total/maxV)*chartH;
              const confH=(m.confirmed/maxV)*chartH;
              const projH=(m.projected/maxV)*chartH;
              const yBase=PAD_T+chartH;
              return <g key={m.month}>
                {projH>0&&<rect x={x} y={yBase-totalH} width={barW} height={projH} fill="#10b981" fillOpacity="0.55" stroke="#10b981" strokeWidth="0.6" rx="2"/>}
                {confH>0&&<rect x={x} y={yBase-confH} width={barW} height={confH} fill="#818cf8" rx="2"/>}
                {m.total>0&&<text x={x+barW/2} y={yBase-totalH-4} fill="#e6edf3" fontSize="9" textAnchor="middle" fontWeight="600">${Math.round(m.total)}</text>}
                <text x={x+barW/2} y={H-PAD_B+14} fill="#7a8497" fontSize="10" textAnchor="middle">{monthName(m.month+"-15")}</text>
                <text x={x+barW/2} y={H-PAD_B+26} fill="#4d5365" fontSize="8" textAnchor="middle">'{m.month.slice(2,4)}</text>
              </g>;
            })}
          </svg>
        </div>
      </div>

      {/* ── Proyección por ticker ── */}
      <div style={{marginBottom:16}}>
        <div style={{fontSize:12,fontWeight:600,color:"#c1c8d4",marginBottom:8,textTransform:"uppercase",letterSpacing:".04em"}}>Proyección anual por activo</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>
          {Object.values(annualByTicker).filter(a=>a.annual>0).sort((a,b)=>(b.annual*b.cantidad)-(a.annual*a.cantidad)).map(a=>{
            const totalTk=a.annual*a.cantidad;
            const yld=a.price>0?(a.annual/a.price*100):0;
            return <div key={a.ticker} style={{background:"#0c0e14",borderRadius:8,padding:"10px 14px",border:"1px solid #1a1d27"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontWeight:700,color:"#e6edf3",fontSize:14}}>{a.ticker}</span>
                <span style={{color:"#10b981",fontWeight:600,fontSize:13}}>{fU(totalTk)}</span>
              </div>
              <div style={{fontSize:10,color:"#7a8497",marginTop:2}}>${a.annual.toFixed(2)}/acción · {a.cantidad} acc · yield {yld.toFixed(1)}%</div>
              {/* Barra visual */}
              <div style={{marginTop:6,height:4,background:"#1a1d27",borderRadius:2,overflow:"hidden"}}>
                <div style={{height:"100%",background:"#10b981",borderRadius:2,width:`${Math.min(100,totalNext12>0?(totalTk/totalNext12*100):0)}%`}}/>
              </div>
            </div>;
          })}
        </div>
      </div>

      {/* ── Timeline próximos pagos (confirmado + proyectado) ── */}
      {merged.length>0&&<div style={{marginBottom:16}}>
        <div style={{fontSize:12,fontWeight:600,color:"#c1c8d4",marginBottom:8,textTransform:"uppercase",letterSpacing:".04em"}}>Calendario · próximos pagos</div>
        {Object.entries(upByMonth).sort((a,b)=>a[0].localeCompare(b[0])).map(([month,divs])=><div key={month} style={{marginBottom:12}}>
          <div style={{fontSize:13,fontWeight:700,color:"#818cf8",marginBottom:6,display:"flex",alignItems:"center",gap:8}}>
            <span style={{background:"#1e40af33",padding:"2px 10px",borderRadius:12,fontSize:12}}>{monthLong(month)} {month.slice(0,4)}</span>
            <span style={{fontSize:11,color:"#4d5365",fontWeight:400}}>Total: {fU(divs.reduce((s,d)=>s+d.total,0))}</span>
          </div>
          {divs.map((d,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 12px",background:"#0c0e14",borderRadius:8,marginBottom:4,border:"1px solid #1a1d27"}}>
            <div style={{minWidth:70,fontSize:12,color:"#7a8497"}}>{d.date.slice(5)}</div>
            <div style={{minWidth:60,fontWeight:700,color:"#e6edf3",fontSize:13}}>{d.ticker}</div>
            <div style={{fontSize:9,padding:"2px 7px",borderRadius:8,background:d.isProjected?"#2a2f3f55":"#1e40af55",color:d.isProjected?"#c1c8d4":"#818cf8",fontWeight:600,textTransform:"uppercase",letterSpacing:".03em"}}>
              {d.isProjected?"proyectado":"confirmado"}
            </div>
            <div style={{fontSize:11,color:"#c1c8d4",flex:1}}>${d.amount.toFixed(4)} × {d.cantidad} acc</div>
            <div style={{fontWeight:700,color:d.isProjected?"#86efac":"#10b981",fontSize:13}}>{fU(d.total)}</div>
          </div>)}
        </div>)}
      </div>}

      {/* ── Historial reciente ── */}
      {past.length>0&&<details style={{marginTop:4}}>
        <summary style={{fontSize:12,color:"#7a8497",cursor:"pointer",marginBottom:8}}>Dividendos cobrados últimos 12 meses ({past.length})</summary>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr style={{borderBottom:"1px solid #2a2f3f"}}>
            <th style={{textAlign:"left",padding:6,color:"#4d5365",fontWeight:500}}>Fecha</th>

/* ── TRADING — Simulador Intraday ────────── */
function Trading({macro,prices,pos,priceAlerts=[],addPriceAlert,removePriceAlert,togglePriceAlert,onOpenConfig,tradingForm,setTradingForm}){
  const fARS=n=>n==null||isNaN(n)?"—":`$ ${new Intl.NumberFormat("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0}).format(n)}`;
  const fARS2=n=>n==null||isNaN(n)?"—":`$ ${new Intl.NumberFormat("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)}`;
  const fPct=(n,d=2)=>n==null||isNaN(n)?"—":`${n.toFixed(d)}%`;
  const fUSD=n=>{if(n==null||isNaN(n))return"—";const abs=Math.abs(n);if(abs<1&&abs>0)return`USD ${n.toFixed(2)}`;return`USD ${new Intl.NumberFormat("en-US",{minimumFractionDigits:0,maximumFractionDigits:0}).format(n)}`;};

  /* Helper: parsear input numérico (soporta 34.800 y 34,50) */
  const parseNum=s=>{if(!s)return 0;const clean=s.replace(/\./g,"").replace(",",".");return parseFloat(clean)||0;};
  /* Helper: formatear número para mostrar en input */
  const fmtInput=(s,decimals)=>{const n=parseNum(s);if(!s||n===0&&s!=="0")return s;return n.toLocaleString("es-AR",{maximumFractionDigits:decimals,minimumFractionDigits:0});};

  /* Operación */
  /* Form state lifted to App so it persists across tab switches */
  const tickerInput=tradingForm.tickerInput;
  const cantidad=tradingForm.cantidad;
  const precioCompra=tradingForm.precioCompra;
  const precioVentaManual=tradingForm.precioVentaManual;
  const mercado=tradingForm.mercado;
  const setTickerInput=v=>setTradingForm(f=>({...f,tickerInput:v}));
  const setCantidad=v=>setTradingForm(f=>({...f,cantidad:v}));
  const setPrecioCompra=v=>setTradingForm(f=>({...f,precioCompra:v}));
  const setPrecioVentaManual=v=>setTradingForm(f=>({...f,precioVentaManual:v}));
  const setMercado=v=>setTradingForm(f=>({...f,mercado:v}));

  /* Inline alert inputs */
  const [inlineTarget,setInlineTarget]=useState("");
  const [inlineStop,setInlineStop]=useState("");

  /* Ticker: acepta cualquier texto, uppercase */
  const ticker=tickerInput.trim().toUpperCase();

  /* Auto-detect mercado from portfolio if ticker found */
  const posInfo=pos.find(p=>p.ticker===ticker);
  const detectedMercado=posInfo?.mercado||(pos.find(p=>p.ticker===ticker)?"BYMA":null);
  React.useEffect(()=>{if(detectedMercado)setMercado(detectedMercado);},[ticker,detectedMercado]);

  /* Derive tipo from pos metadata */
  const tipoActivo=posInfo?.tipo||"";
  const exento=tipoActivo==="Bono"||tipoActivo==="Letra"||tipoActivo==="ON";

  /* Comisiones según mercado */
  const isBYMA=mercado==="BYMA";
  const moneda=isBYMA?"ARS":"USD";
  const monedaSym=isBYMA?"$":"USD ";

  /* ── Helpers de tarifa ──
     BYMA = Bull Market Active Trader Plus (Marzo 2025)
       · Acciones/CEDEARs: 0,10% comisión + 0,080% der. mercado (normal) / 0,05% + 0,055% (intra)
       · Bonos/ONs:        0,10% comisión + 0,010% der. mercado (intra solo bonifica comisión a 0,05%)
       · Letras del Tesoro:0,10% comisión + 0,001% der. mercado (NO aplica bonificación intra)
       · IVA 21% sobre comisión + der. mercado, EXCEPTO bonos/letras/ONs (exentos).
       · "Intra" = compra Y venta el mismo día → AMBAS patas se bonifican.
         Si carriás overnight, las dos patas pasan a tarifa normal.
     NYSE = Allaria/CS — 0,60% all-in approx, sin distinción intra ni IVA. */
  const calcFeesBYMA=(tipo,isIntra)=>{
    const isFixed=tipo==="Bono"||tipo==="Letra"||tipo==="ON";
    const intraApplies=isIntra&&tipo!=="Letra"; /* Letras no aplican intra */
    const comPct=intraApplies?0.0005:0.0010;
    let derPct;
    if(tipo==="Letra")derPct=0.00001;
    else if(isFixed)derPct=0.00010;
    else derPct=intraApplies?0.00055:0.00080;
    const ivaMult=isFixed?1:1.21;
    return{comPct,derPct,ivaMult,factor:(comPct+derPct)*ivaMult,intraApplies};
  };
  const calcFeesNYSE=(_isIntra)=>({comPct:0.0060,derPct:0,ivaMult:1,factor:0.0060,intraApplies:false});
  const calcFees=(mkt,tipo,isIntra)=>mkt==="BYMA"?calcFeesBYMA(tipo,isIntra):calcFeesNYSE(isIntra);

  /* Para el form: asumimos intra (lo más optimista; si carriás, las fees suben). */
  const formFees=calcFees(mercado,tipoActivo,true);
  const formFeesNonIntra=calcFees(mercado,tipoActivo,false);
  const comPct=formFees.comPct;
  const derPct=formFees.derPct;
  const ivaMult=formFees.ivaMult;

  /* On-demand price fetch for tickers not in portfolio */
  const [tradingPrice,setTradingPrice]=useState(null);
  const [tradingPriceLoading,setTradingPriceLoading]=useState(false);
  const fetchTimerRef=React.useRef(null);

  /* Track if user manually edited precioCompra to avoid overwriting */
  const userEditedCompraRef=React.useRef(false);

  React.useEffect(()=>{
    /* Reset on ticker change */
    setPrecioVentaManual("");
    setPrecioCompra("");
    userEditedCompraRef.current=false;
    setTradingPrice(null);
    if(fetchTimerRef.current)clearTimeout(fetchTimerRef.current);
    if(!ticker||ticker.length<2)return;
    /* If already in portfolio prices, no need to fetch */
    if(prices[ticker])return;
    /* Debounce 600ms then fetch from data912 + Yahoo */
    setTradingPriceLoading(true);
    fetchTimerRef.current=setTimeout(async()=>{
      try{
        const fetchD912=async(ep)=>{try{const r=await fetchWithProxies(DATA912_BASE+"/"+ep);return await r.json()}catch(e){return[]}};
        const [cedears,argStocks,argBonds,usaStocks]=await Promise.all([fetchD912("arg_cedears"),fetchD912("arg_stocks"),fetchD912("arg_bonds"),fetchD912("usa_stocks")]);
        const find=(arr)=>(arr||[]).find(x=>(x.symbol||"").toUpperCase()===ticker);
        const hit=find(cedears)||find(argStocks)||find(argBonds)||find(usaStocks);
        if(hit&&hit.c){
          const isArg=!!(find(cedears)||find(argStocks)||find(argBonds));
          setTradingPrice({priceARS:isArg?hit.c:null,price:isArg?0:hit.c,changeARS:isArg?(hit.pct_change||0):null,change:isArg?0:(hit.pct_change||0)});
          setTradingPriceLoading(false);return;
        }
        /* Yahoo v8/chart fallback (v7/quote requiere auth desde ~2025) */
        /* BKUCF: ticker OTC directo (igual que TradingView) */
        try{
          const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?range=5d&interval=1d`;
          let r;try{r=await fetchWithProxies(url);}catch(e){r=null;}
          if(r&&r.ok){
            const j=await r.json();const meta=j.chart?.result?.[0]?.meta;
            if(meta&&meta.regularMarketPrice){
              const p=meta.regularMarketPrice,prev=meta.chartPreviousClose||meta.previousClose||p;
              const chg=prev?((p-prev)/prev*100):0;
              const isArg=(meta.exchangeName||"").includes("Buenos")||(meta.currency||"")==="ARS";
              setTradingPrice({priceARS:isArg?p:null,price:isArg?0:p,changeARS:isArg?chg:null,change:isArg?0:chg});
            }
          }
        }catch(e){}
      }catch(e){console.warn("Trading price fetch error:",e);}
      setTradingPriceLoading(false);
    },600);
    return()=>{if(fetchTimerRef.current)clearTimeout(fetchTimerRef.current)};
  },[ticker]);

  /* Merge portfolio prices with on-demand trading price */
  const priceData=prices[ticker]||tradingPrice;

  /* Autofill Precio Compra con la cotización actual al cambiar ticker.
     Solo si el usuario no editó manualmente. Permite ajuste fino para precio real ejecutado. */
  React.useEffect(()=>{
    if(!ticker||userEditedCompraRef.current)return;
    const cur=isBYMA?(priceData?.priceARS||0):(priceData?.price||0);
    if(cur<=0)return;
    const formatted=isBYMA
      ?new Intl.NumberFormat("es-AR",{maximumFractionDigits:2}).format(cur)
      :cur.toFixed(2);
    setPrecioCompra(formatted);
  },[ticker,priceData,isBYMA]);

  /* All available tickers for datalist suggestions */
  const allTickers=useMemo(()=>{
    const set=new Set(pos.map(p=>p.ticker));
    Object.keys(prices).forEach(t=>set.add(t));
    return[...set].sort();
  },[pos,prices]);

  const cant=parseNum(cantidad);
  const pc=parseNum(precioCompra);
  const montoCompra=cant*pc;
  const mep=macro.dolarMEP||1;

  /* Comisiones de compra (asumiendo intra; si carriás overnight la fee real es la normal). */
  const comCompra=montoCompra*formFees.factor;
  const comCompraOvernight=montoCompra*formFeesNonIntra.factor;

  /* Breakeven (intra) — se calcula con la misma factor en ambas patas */
  const ventaFactor=formFees.factor;
  const breakeven=cant>0?(montoCompra+comCompra)/(cant*(1-ventaFactor)):0;
  const breakevenOvernight=cant>0?(montoCompra+comCompraOvernight)/(cant*(1-formFeesNonIntra.factor)):0;

  /* Auto-alert prices: solve for pv where neto = +/- alertPL */
  const alertPL=isBYMA?1000000:1000; /* $1M ARS or USD 1000 */
  /* neto = cant*pv*(1-ventaFactor) - montoCompra - comCompra → pv = (neto + montoCompra + comCompra) / (cant*(1-ventaFactor)) */
  const autoTarget=cant>0&&pc>0?(alertPL+montoCompra+comCompra)/(cant*(1-ventaFactor)):0;
  const autoStop=cant>0&&pc>0?(-alertPL+montoCompra+comCompra)/(cant*(1-ventaFactor)):0;

  /* Auto-fill alert inputs when compra data changes */
  React.useEffect(()=>{
    if(cant>0&&pc>0&&autoTarget>0){
      setInlineTarget(isBYMA?Math.ceil(autoTarget).toString():autoTarget.toFixed(2));
    }
    if(cant>0&&pc>0&&autoStop>0){
      setInlineStop(isBYMA?Math.floor(autoStop).toString():autoStop.toFixed(2));
    }
  },[cant,pc,isBYMA]);

  /* Scenarios — asume cierre intra (mismo día) */
  const scenarios=pc>0?[-3,-2,-1,-0.5,0.5,1,2,3].map(pct=>{
    const pvS=pc*(1+pct/100);
    const mvS=cant*pvS;
    const cvS=mvS*formFees.factor;
    const netoS=mvS-montoCompra-comCompra-cvS;
    return{pct,pv:pvS,neto:netoS};
  }):[];

  /* ── Intraday Trades List (persisted) ── */
  const [trades,setTrades]=useState(()=>loadLS("intraday_trades",[]));
  useEffect(()=>{saveLS("intraday_trades",trades)},[trades]);

  /* ── Watchlist (posiciones intraday abiertas) ── */
  const [watchlist,setWatchlist]=useState(()=>loadLS("intraday_watchlist",[]));
  useEffect(()=>{saveLS("intraday_watchlist",watchlist)},[watchlist]);
  const [watchlistPrices,setWatchlistPrices]=useState({});
  const [closingId,setClosingId]=useState(null);
  const [closingPrice,setClosingPrice]=useState("");

  /* Helper único para calcular fees de una posición del watchlist.
     Si la posición está carriada (overnight), AMBAS patas (compra y venta) usan tarifa normal,
     no la intra. Las fees suben → el breakeven sube. */
  const calcRowFees=(item)=>{
    const todayLocal=new Date().toLocaleDateString("en-CA");
    const aperturaLocal=item.fechaApertura?new Date(item.fechaApertura).toLocaleDateString("en-CA"):todayLocal;
    const isCarriedOver=aperturaLocal!==todayLocal;
    const isIntraNow=!isCarriedOver;
    /* Legacy: items viejos guardaban exento pero no tipo. Si exento, asumimos Bono. */
    const tipoForFees=item.tipo||(item.exento?"Bono":"");
    const fees=calcFees(item.mercado,tipoForFees,isIntraNow);
    const feesIntra=calcFees(item.mercado,tipoForFees,true);
    /* Comisión de compra dinámica: si está intra, paga intra; si carrió, paga normal */
    const comCompra=item.montoCompra*fees.factor;
    const comCompraIfIntra=item.montoCompra*feesIntra.factor;
    const ventaFactor=fees.factor;
    const breakeven=item.cantidad>0?(item.montoCompra+comCompra)/(item.cantidad*(1-ventaFactor)):0;
    const breakevenIfIntra=item.cantidad>0?(item.montoCompra+comCompraIfIntra)/(item.cantidad*(1-feesIntra.factor)):0;
    let daysCarried=0;
    if(isCarriedOver){
      const a=new Date(aperturaLocal),t=new Date(todayLocal);
      daysCarried=Math.max(1,Math.round((t-a)/(86400000)));
    }
    return{ventaFactor,breakeven,breakevenIfIntra,comCompra,isCarriedOver,daysCarried,fees,feesIntra};
  };

  /* Autofill del precio de cierre: si el precio aún no llegó al hacer click en Cerrar,
     completa cuando esté disponible. Si el usuario ya escribió, no toca. */
  React.useEffect(()=>{
    if(closingId==null||closingPrice)return;
    const item=watchlist.find(x=>x.id===closingId);
    if(!item)return;
    const isBM=item.mercado==="BYMA";
    const pd=prices[item.ticker]||watchlistPrices[item.ticker];
    const pAct=isBM?(pd?.priceARS||0):(pd?.price||0);
    if(pAct<=0)return;
    setClosingPrice(isBM?String(Math.round(pAct*100)/100):pAct.toFixed(2));
  },[closingId,closingPrice,watchlist,prices,watchlistPrices]);

  /* Live-fetch precios para tickers de watchlist que no estén en portfolio prices.
     Refresca cada 60s mientras haya watchlist activa. */
  const wlTickerKey=watchlist.map(w=>w.ticker).join(",");
  React.useEffect(()=>{
    if(watchlist.length===0){setWatchlistPrices({});return;}
    const need=[...new Set(watchlist.map(w=>w.ticker))].filter(t=>!prices[t]);
    if(need.length===0){setWatchlistPrices({});return;}
    let cancelled=false;
    const fetchD912=async(ep)=>{try{const r=await fetchWithProxies(DATA912_BASE+"/"+ep);return await r.json()}catch(e){return[]}};
    const fetchOne=async(tk)=>{
      try{
        const [cedears,argStocks,argBonds,usaStocks]=await Promise.all([fetchD912("arg_cedears"),fetchD912("arg_stocks"),fetchD912("arg_bonds"),fetchD912("usa_stocks")]);
        const find=arr=>(arr||[]).find(x=>(x.symbol||"").toUpperCase()===tk);
        const hit=find(cedears)||find(argStocks)||find(argBonds)||find(usaStocks);
        if(hit&&hit.c){
          const isArg=!!(find(cedears)||find(argStocks)||find(argBonds));
          return[tk,{priceARS:isArg?hit.c:null,price:isArg?0:hit.c,changeARS:isArg?(hit.pct_change||0):null,change:isArg?0:(hit.pct_change||0)}];
        }
        const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(tk)}?range=5d&interval=1d`;
        let r;try{r=await fetchWithProxies(url);}catch(e){r=null;}
        if(r&&r.ok){
          const j=await r.json();const meta=j.chart?.result?.[0]?.meta;
          if(meta&&meta.regularMarketPrice){
            const p=meta.regularMarketPrice,prev=meta.chartPreviousClose||meta.previousClose||p;
            const chg=prev?((p-prev)/prev*100):0;
            const isArg=(meta.exchangeName||"").includes("Buenos")||(meta.currency||"")==="ARS";
            return[tk,{priceARS:isArg?p:null,price:isArg?0:p,changeARS:isArg?chg:null,change:isArg?0:chg}];
          }
        }
      }catch(e){console.warn("Watchlist price fetch error:",tk,e);}
      return null;
    };
    const refresh=async()=>{
      const results=await Promise.all(need.map(fetchOne));
      if(cancelled)return;
      const map={};results.forEach(r=>{if(r)map[r[0]]=r[1];});
      setWatchlistPrices(prev=>({...prev,...map}));
    };
    refresh();
    const timer=setInterval(refresh,60000);
    return()=>{cancelled=true;clearInterval(timer);};
  },[wlTickerKey,Object.keys(prices).join(",")]);

  const canAdd=ticker&&cant>0&&pc>0;
  const addToWatchlist=()=>{
    if(!canAdd)return;
    const groupId=Date.now();
    /* Guardamos solo data primaria. comCompra y breakeven se recalculan dinámicamente
       según si la posición sigue intraday o ya carrió overnight. */
    const item={id:groupId,fechaApertura:new Date().toISOString(),ticker,mercado,cantidad:cant,precioCompra:pc,montoCompra,tipo:tipoActivo||"",exento,moneda,mep,alertGroupId:groupId};
    setWatchlist(prev=>[item,...prev]);
    /* Auto-crear alertas si target/stop ya están escritos */
    const tParsed=parseNum(inlineTarget);
    const sParsed=parseNum(inlineStop);
    if(tParsed>0)addPriceAlert({ticker,mercado,condition:"above",price:tParsed,label:"Target",groupId});
    if(sParsed>0)addPriceAlert({ticker,mercado,condition:"below",price:sParsed,label:"Stop Loss",groupId});
    setTickerInput("");setCantidad("");setPrecioCompra("");setPrecioVentaManual("");
    setInlineTarget("");setInlineStop("");
  };

  const removeFromWatchlist=(id)=>{
    if(!confirm("Eliminar de la watchlist? (no se registra como operación cerrada)"))return;
    setWatchlist(prev=>prev.filter(x=>x.id!==id));
  };

  const closeWatchlistItem=(id,precioVentaStr)=>{
    const w=watchlist.find(x=>x.id===id);
    if(!w)return;
    const pv2=parseNum(precioVentaStr);
    if(pv2<=0){alert("Ingresá un precio de venta válido");return;}
    const fees=calcRowFees(w);
    const montoVenta2=w.cantidad*pv2;
    const comVenta2=montoVenta2*fees.ventaFactor;
    const totalGastos2=fees.comCompra+comVenta2;
    const bruto2=montoVenta2-w.montoCompra;
    const neto2=bruto2-totalGastos2;
    const trade={id:Date.now(),fecha:new Date().toISOString().slice(0,10),ticker:w.ticker,mercado:w.mercado,cantidad:w.cantidad,precioCompra:w.precioCompra,precioVenta:pv2,montoCompra:w.montoCompra,montoVenta:montoVenta2,comCompra:fees.comCompra,comVenta:comVenta2,totalGastos:totalGastos2,bruto:bruto2,neto:neto2,breakeven:fees.breakeven,exento:w.exento,moneda:w.moneda,mep:w.mep,fromWatchlist:true,fechaApertura:w.fechaApertura,carriedOver:fees.isCarriedOver,daysCarried:fees.daysCarried,tipo:w.tipo};
    setTrades(prev=>[trade,...prev]);
    setWatchlist(prev=>prev.filter(x=>x.id!==id));
    setClosingId(null);setClosingPrice("");
  };

  const removeTrade=(id)=>setTrades(prev=>prev.filter(t=>t.id!==id));
  const clearTrades=()=>{if(confirm("Borrar todas las operaciones intraday?"))setTrades([]);};

  /* Totals across all trades */
  const tradesTotals=useMemo(()=>{
    let netoARS=0,netoUSD=0,gastosARS=0,gastosUSD=0,montoARS=0,montoUSD=0;
    trades.forEach(t=>{
      const m=t.mep||mep;
      if(t.mercado==="BYMA"){netoARS+=t.neto;gastosARS+=t.totalGastos;netoUSD+=t.neto/m;montoARS+=t.montoCompra;montoUSD+=t.montoCompra/m;}
      else{netoUSD+=t.neto;gastosUSD+=t.totalGastos;netoARS+=t.neto*m;montoUSD+=t.montoCompra;montoARS+=t.montoCompra*m;}
    });
    return{netoARS,netoUSD,gastosARS,gastosUSD,montoARS,montoUSD,count:trades.length};
  },[trades,mep]);

  const inputSt={background:"#0c0e14",border:"1px solid #2a2f3f",borderRadius:6,padding:"8px 12px",color:"#e6edf3",fontSize:15,fontWeight:600,width:"100%",fontVariantNumeric:"tabular-nums"};
  const labelSt={fontSize:11,color:"#7a8497",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:".04em"};

  /* Formatear montos en la moneda del mercado */
  const fM=n=>{if(n==null||isNaN(n))return"—";if(isBYMA)return fARS(n);const abs=Math.abs(n);const d=abs<0.01?6:abs<1?4:2;return`USD ${new Intl.NumberFormat("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n)}`;};
  const fM2=n=>{if(n==null||isNaN(n))return"—";if(isBYMA)return fARS2(n);const abs=Math.abs(n);const d=abs<0.01?6:abs<1?4:2;return`USD ${new Intl.NumberFormat("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n)}`;};
  /* Equivalente en la otra moneda */
  const fAlt=n=>n==null||isNaN(n)?"—":isBYMA?fUSD(n/mep):fARS(n*mep);
  const fAltLabel=isBYMA?"MEP":"ARS";

  const mercadoBtnSt=(active)=>({background:active?"#6366f1":"#1a1d27",border:`1px solid ${active?"#6366f1":"#2a2f3f"}`,color:active?"#fff":"#c1c8d4",borderRadius:6,padding:"4px 12px",fontSize:11,cursor:"pointer",fontWeight:600});

  return <div style={{display:"flex",flexDirection:"column",gap:18}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
      <div>
        <h2 style={{margin:0,fontSize:18,fontWeight:700}}>Simulador de Trading Intraday</h2>
        <p style={{margin:"4px 0 0",fontSize:13,color:"#7a8497"}}>Simulá compra y venta en el día con comisiones reales. {isBYMA?"BYMA · Bull Market Active Trader Plus":"NYSE · Allaria (CS)"}.</p>
      </div>
      <div style={{display:"flex",gap:4,alignItems:"center"}}>
        <button onClick={()=>setMercado("BYMA")} style={mercadoBtnSt(isBYMA)}>🇦🇷 BYMA</button>
        <button onClick={()=>setMercado("NYSE")} style={mercadoBtnSt(!isBYMA)}>🇺🇸 NYSE</button>
      </div>
    </div>

    {/* Operación */}
    <Card title="Operación" right={<span style={{fontSize:10,color:exento?"#10b981":"#7a8497"}}>{tipoActivo?`${tipoActivo} · `:""}{moneda}{exento?" · IVA Exento":isBYMA?" · IVA 21%":" · Sin IVA"}</span>}>
      <div style={{display:"grid",gridTemplateColumns:"1.4fr 1fr 1fr",gap:14,alignItems:"start"}}>
        <div><label style={labelSt}>Ticker</label>
          <div style={{position:"relative"}}>
            <input type="text" value={tickerInput} onChange={e=>setTickerInput(e.target.value.toUpperCase())} style={inputSt} placeholder={isBYMA?"Ej: GGAL, VIST, MELI":"Ej: IBM, AAPL, TSLA"}/>
            {ticker&&tradingPriceLoading&&<div style={{fontSize:10,color:"#f59e0b",marginTop:4,position:"absolute",left:0,top:"100%",whiteSpace:"nowrap"}}>Buscando cotización...</div>}
            {ticker&&priceData&&!tradingPriceLoading&&<div style={{fontSize:10,color:"#10b981",marginTop:4,position:"absolute",left:0,top:"100%",whiteSpace:"nowrap"}}>Cotización: {isBYMA?(priceData.priceARS?`$ ${new Intl.NumberFormat("es-AR",{maximumFractionDigits:2}).format(priceData.priceARS)}`:"—"):(priceData.price?`USD ${priceData.price.toFixed(2)}`:"—")}</div>}
            {ticker&&!priceData&&!tradingPriceLoading&&<div style={{fontSize:10,color:"#7a8497",marginTop:4,position:"absolute",left:0,top:"100%",whiteSpace:"nowrap"}}>Sin cotización — ingresá precio manual</div>}
          </div>
        </div>
        <div><label style={labelSt}>Cantidad</label><input type="text" value={cantidad} onChange={e=>setCantidad(e.target.value.replace(/[^\d]/g,""))} style={inputSt} placeholder="Nominales"/></div>
        <div><label style={labelSt}>Precio Compra ({monedaSym.trim()}) {precioCompra&&!userEditedCompraRef.current?<span style={{color:"#10b981",fontWeight:400,textTransform:"none"}}>— auto</span>:null}</label><input type="text" value={precioCompra} onChange={e=>{userEditedCompraRef.current=true;setPrecioCompra(e.target.value.replace(/[^\d.,]/g,""));}} style={{...inputSt,color:precioCompra&&!userEditedCompraRef.current?"#10b981":"#e6edf3"}} placeholder={isBYMA?"34.800 ó 34800":"232.50"}/></div>
      </div>
      {/* Inline Alert: Target / Stop Loss */}
      {ticker&&(()=>{
        const curPrice=isBYMA?(priceData?.priceARS||0):(priceData?.price||0);
        const alertMercado=isBYMA?"BYMA":"NYSE";
        const tParsed=parseNum(inlineTarget);
        const sParsed=parseNum(inlineStop);
        const createInlineAlerts=()=>{
          if(tParsed<=0&&sParsed<=0)return;
          const groupId=Date.now();
          if(tParsed>0)addPriceAlert({ticker,mercado:alertMercado,condition:"above",price:tParsed,label:"Target",groupId});
          if(sParsed>0)addPriceAlert({ticker,mercado:alertMercado,condition:"below",price:sParsed,label:"Stop Loss",groupId});
          setInlineTarget("");setInlineStop("");
        };
        const existing=priceAlerts.filter(a=>a.ticker===ticker&&a.active);
        const hasTarget=existing.some(a=>a.condition==="above");
        const hasStop=existing.some(a=>a.condition==="below");
        return <div style={{marginTop:14,paddingTop:12,borderTop:"1px solid #1a1d27"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <span style={{fontSize:11,color:"#7a8497",fontWeight:600,minWidth:50}}>🔔 ALERTAS</span>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <label style={{fontSize:10,color:"#10b981"}}>⬆️ Target</label>
              <input value={inlineTarget} onChange={e=>setInlineTarget(e.target.value.replace(/[^\d.,]/g,""))} placeholder={curPrice>0?Math.round(curPrice*1.05).toLocaleString("es-AR"):"—"} style={{...inputSt,fontSize:12,padding:"4px 8px",width:110,borderColor:inlineTarget?"#10b98166":"#2a2f3f"}}/>
              {tParsed>0&&cant>0&&pc>0&&(()=>{const mv=cant*tParsed;const cv=mv*ventaFactor;const n=mv-montoCompra-comCompra-cv;return <span style={{fontSize:10,color:"#10b981"}}>{isBYMA?fARS(n):`USD ${n.toFixed(0)}`}</span>})()}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <label style={{fontSize:10,color:"#f43f5e"}}>⬇️ Stop</label>
              <input value={inlineStop} onChange={e=>setInlineStop(e.target.value.replace(/[^\d.,]/g,""))} placeholder={curPrice>0?Math.round(curPrice*0.95).toLocaleString("es-AR"):"—"} style={{...inputSt,fontSize:12,padding:"4px 8px",width:110,borderColor:inlineStop?"#f43f5e66":"#2a2f3f"}}/>
              {sParsed>0&&cant>0&&pc>0&&(()=>{const mv=cant*sParsed;const cv=mv*ventaFactor;const n=mv-montoCompra-comCompra-cv;return <span style={{fontSize:10,color:"#f43f5e"}}>{isBYMA?fARS(n):`USD ${n.toFixed(0)}`}</span>})()}
            </div>
            <button onClick={createInlineAlerts} disabled={tParsed<=0&&sParsed<=0} style={{background:"#6366f1",border:"none",color:"#fff",borderRadius:5,padding:"4px 12px",fontSize:11,cursor:"pointer",fontWeight:600,opacity:(tParsed<=0&&sParsed<=0)?0.4:1}}>+ Alerta</button>
            {(hasTarget||hasStop)&&<span style={{fontSize:10,color:"#10b981",marginLeft:4}}>{hasTarget?"⬆️ ":""}{hasStop?"⬇️ ":""}activa{hasTarget&&hasStop?"s":""}</span>}
            <span style={{flex:1}}/>
            {canAdd&&<button onClick={addToWatchlist} title={(tParsed>0||sParsed>0)?"Agrega la posición y crea las alertas":"Agrega la posición a la watchlist"} style={{background:"#16a34a",border:"none",color:"#fff",borderRadius:5,padding:"6px 14px",fontSize:12,cursor:"pointer",fontWeight:700}}>+ Watchlist {(tParsed>0||sParsed>0)?<span style={{fontSize:10,opacity:0.85}}>· 🔔 {tParsed>0?"⬆️":""}{sParsed>0?"⬇️":""}</span>:null}</button>}
            {!loadLS("tg_token","")&&<button onClick={onOpenConfig} style={{fontSize:10,color:"#818cf8",background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>⚙️ Configurar Telegram</button>}
          </div>
        </div>;
      })()}
    </Card>

    {/* Breakeven destacado — muestra ambos escenarios para que el user vea el costo real de carriar */}
    {pc>0&&cant>0&&<div style={{background:"linear-gradient(135deg,#13151c 0%,#0c0e14 100%)",border:"1px solid #2a2f3f",borderRadius:12,padding:"20px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:14}}>
      <div style={{display:"flex",alignItems:"center",gap:16}}>
        <div style={{background:"#0c0e14",borderRadius:10,padding:"12px 16px",border:"1px solid #22263350",textAlign:"center",minWidth:150}}>
          <div style={{fontSize:28,fontWeight:800,color:"#f59e0b",fontVariantNumeric:"tabular-nums",lineHeight:1}}>{fM2(breakeven)}</div>
          <div style={{fontSize:10,color:"#10b981",marginTop:4,fontWeight:600}}>intra · por acción</div>
        </div>
        <div>
          <h3 style={{margin:0,fontSize:15,fontWeight:700,color:"#e6edf3"}}>Precio Breakeven</h3>
          <div style={{fontSize:12,color:"#c1c8d4",marginTop:2}}>Vendé a este precio o más para no perder plata</div>
          <div style={{fontSize:11,color:"#7a8497",marginTop:4}}>Spread intra: {fM2(breakeven-pc)} ({fPct((breakeven-pc)/pc*100,3)}) sobre compra</div>
          {isBYMA&&breakevenOvernight!==breakeven&&<div style={{fontSize:11,color:"#a78bfa",marginTop:6}}>📅 Si carriás overnight → BE sube a <b>{fM2(breakevenOvernight)}</b> ({fPct((breakevenOvernight-pc)/pc*100,3)})</div>}
        </div>
      </div>
      <div style={{textAlign:"right"}}>
        <div style={{fontSize:11,color:"#7a8497"}}>Monto Compra</div>
        <div style={{fontSize:16,fontWeight:700,color:"#e6edf3",fontVariantNumeric:"tabular-nums"}}>{fM(montoCompra)}</div>
        <div style={{fontSize:10,color:"#f59e0b",marginTop:2}}>+ {fM2(comCompra)} gastos intra</div>
        {isBYMA&&comCompraOvernight!==comCompra&&<div style={{fontSize:10,color:"#a78bfa",marginTop:1}}>(overnight: + {fM2(comCompraOvernight)})</div>}
        <div style={{fontSize:10,color:"#818cf8",marginTop:2}}>{fAlt(montoCompra)} ({fAltLabel})</div>
      </div>

    {/* Cuadro de Sensibilidad */}
    {scenarios.length>0&&<Card title="Cuadro de Sensibilidad" right={<span style={{fontSize:10,color:"#4d5365"}}>P&L neto según variación · MEP ${new Intl.NumberFormat("es-AR",{maximumFractionDigits:0}).format(mep)}</span>}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          {["Variación","Precio Venta","Monto Venta","Gastos Totales","P&L Neto",isBYMA?"P&L USD":"P&L ARS"].map(h=><th key={h} style={{padding:"8px 10px",textAlign:h==="Variación"?"left":"right",fontSize:10,fontWeight:600,color:"#7a8497",textTransform:"uppercase",borderBottom:"1px solid #22263350"}}>{h}</th>)}
        </tr></thead>
        <tbody>{scenarios.map(s=>{
          const mvS=cant*s.pv;
          const cvS=mvS*formFees.factor;
          const gastosTotal=comCompra+cvS;
          return<tr key={s.pct} style={{borderBottom:"1px solid #1a1d27",background:s.neto>=0?"#065f4608":"#7f1d2e08"}}>
            <td style={{padding:"8px 10px",fontWeight:700,fontSize:13,color:s.pct>=0?"#10b981":"#f43f5e"}}>{s.pct>0?"+":""}{s.pct}%</td>
            <td style={{padding:"8px 10px",textAlign:"right",fontSize:13,fontVariantNumeric:"tabular-nums"}}>{fM2(s.pv)}</td>
            <td style={{padding:"8px 10px",textAlign:"right",fontSize:13,fontVariantNumeric:"tabular-nums"}}>{fM(mvS)}</td>
            <td style={{padding:"8px 10px",textAlign:"right",fontSize:12,color:"#f59e0b",fontVariantNumeric:"tabular-nums"}}>{fM2(gastosTotal)}</td>
            <td style={{padding:"8px 10px",textAlign:"right",fontSize:13,fontWeight:700,color:s.neto>=0?"#10b981":"#f43f5e",fontVariantNumeric:"tabular-nums"}}>{fM(s.neto)}</td>
            <td style={{padding:"8px 10px",textAlign:"right",fontSize:12,color:"#818cf8",fontVariantNumeric:"tabular-nums"}}>{fAlt(s.neto)}</td>
          </tr>;
        })}</tbody>
      </table>
    </Card>}

    {/* ── Watchlist (Posiciones Intraday Abiertas) ── */}
    {watchlist.length>0&&(()=>{
      /* Per-row formatters because rows can mix BYMA/NYSE */
      const rowFmt=(item)=>{
        const isBM=item.mercado==="BYMA";
        const fT=n=>{if(n==null||isNaN(n))return"—";if(isBM)return fARS(n);const a=Math.abs(n);const d=a<1&&a>0?2:0;return`USD ${new Intl.NumberFormat("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n)}`;};
        const fT2=n=>{if(n==null||isNaN(n))return"—";if(isBM)return fARS2(n);const a=Math.abs(n);const d=a<0.01?6:a<1?4:2;return`USD ${new Intl.NumberFormat("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n)}`;};
        const fTalt=n=>n==null||isNaN(n)?"—":isBM?fUSD(n/(item.mep||mep)):fARS(n*(item.mep||mep));
        return{fT,fT2,fTalt,isBM};
      };

      /* Live P&L per row using current price + fees actualizados (intra/overnight).
         Si la posición carrió, AMBAS patas (compra y venta) usan tarifa normal. */
      const rowsLive=watchlist.map(item=>{
        const isBM=item.mercado==="BYMA";
        const fees=calcRowFees(item);
        const pd=prices[item.ticker]||watchlistPrices[item.ticker];
        const pAct=isBM?(pd?.priceARS||0):(pd?.price||0);
        const montoVentaLive=item.cantidad*pAct;
        const comVentaLive=montoVentaLive*fees.ventaFactor;
        const netoLive=montoVentaLive-item.montoCompra-fees.comCompra-comVentaLive;
        const rendPct=item.montoCompra>0&&pAct>0?(netoLive/item.montoCompra*100):null;
        return{item,pAct,netoLive,rendPct,fees};
      });

      /* Aggregate live P&L (open positions) */
      const liveTotals=rowsLive.reduce((acc,r)=>{
        if(r.pAct<=0)return acc;
        const m=r.item.mep||mep;
        if(r.item.mercado==="BYMA"){acc.netoARS+=r.netoLive;acc.netoUSD+=r.netoLive/m;}
        else{acc.netoUSD+=r.netoLive;acc.netoARS+=r.netoLive*m;}
        return acc;
      },{netoARS:0,netoUSD:0});

      return <Card title={`Watchlist — Posiciones Abiertas (${watchlist.length})`} right={<div style={{display:"flex",gap:10,alignItems:"center"}}>
        <span style={{fontSize:11,color:liveTotals.netoARS>=0?"#10b981":"#f43f5e",fontWeight:700}}>P&L Live: {fARS(liveTotals.netoARS)} / {fUSD(liveTotals.netoUSD)}</span>

          <tbody>{rowsLive.map(({item,pAct,netoLive,rendPct,fees})=>{
            const{fT,fT2,isBM}=rowFmt(item);
            const isClosing=closingId===item.id;
            const fechaShort=item.fechaApertura?new Date(item.fechaApertura).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
            const tickerAlerts=priceAlerts.filter(a=>a.ticker===item.ticker&&a.active);
            const tAlert=tickerAlerts.find(a=>a.condition==="above");
            const sAlert=tickerAlerts.find(a=>a.condition==="below");
            if(isClosing){
              return <tr key={item.id} style={{background:"#0c1322",borderBottom:"1px solid #1a1d27"}}>
                <td colSpan={10} style={{padding:"10px 12px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                    <span style={{fontSize:12,fontWeight:700,color:"#e6edf3"}}>Cerrar {item.ticker}</span>
                    <span style={{fontSize:11,color:"#7a8497"}}>×{item.cantidad.toLocaleString("es-AR")} @ {fT2(item.precioCompra)}</span>
                    {fees.isCarriedOver&&<span style={{fontSize:10,color:"#a78bfa",background:"#3730a322",border:"1px solid #6366f155",borderRadius:4,padding:"2px 6px"}} title={`Posición carriada · sin comisión intra venta`}>📅 Overnight +{fees.daysCarried}d</span>}

                    {pAct>0&&<button onClick={()=>setClosingPrice(isBM?String(Math.round(pAct*100)/100):pAct.toFixed(2))} style={{background:"#1a1d27",border:"1px solid #2a2f3f",color:"#c1c8d4",borderRadius:5,padding:"4px 8px",fontSize:10,cursor:"pointer"}}>Usar actual</button>}
                    {(()=>{
                      const pvN=parseNum(closingPrice);
                      if(pvN<=0||item.cantidad<=0)return null;

                      const cv=mv*fees.ventaFactor;

                  </div>

              </td>
              <td style={{padding:"6px 8px",textAlign:"right",fontSize:12,fontWeight:600,color:rendPct==null?"#7a8497":(rendPct>=0?"#10b981":"#f43f5e")}}>{rendPct==null?"—":rendPct.toFixed(2)+"%"}</td>
              <td style={{padding:"6px 8px",fontSize:10}}>
                <div style={{display:"flex",flexDirection:"column",gap:2}}>
                  {tAlert?<span style={{color:"#10b981"}}>⬆️ {fT2(tAlert.price)}</span>:<span style={{color:"#4d5365"}}>—</span>}
                  {sAlert?<span style={{color:"#f43f5e"}}>⬇️ {fT2(sAlert.price)}</span>:<span style={{color:"#4d5365"}}>—</span>}
                </div>

              <td style={{padding:"6px 8px",textAlign:"right",whiteSpace:"nowrap"}}>
                <button onClick={()=>{setClosingId(item.id);setClosingPrice(pAct>0?(isBM?String(Math.round(pAct*100)/100):pAct.toFixed(2)):"");}} style={{background:"#16a34a",color:"#fff",border:"none",borderRadius:5,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer",marginRight:4}}>Cerrar</button>
                <button onClick={()=>removeFromWatchlist(item.id)} style={{background:"none",border:"none",color:"#7a8497",cursor:"pointer",fontSize:13,padding:2}} title="Eliminar sin cerrar">✕</button>

    {/* ── Operaciones Intraday Guardadas ── */}
    {trades.length>0&&<Card title={`Operaciones Intraday (${trades.length})`} right={<div style={{display:"flex",gap:8,alignItems:"center"}}>
      <span style={{fontSize:11,color:tradesTotals.netoARS>=0?"#10b981":"#f43f5e",fontWeight:700}}>P&L: {fARS(tradesTotals.netoARS)} / {fUSD(tradesTotals.netoUSD)}</span>
      <button onClick={clearTrades} style={{background:"#7f1d2e33",border:"1px solid #7f1d2e55",color:"#f43f5e",borderRadius:6,padding:"3px 8px",fontSize:10,cursor:"pointer"}} title="Borrar todo">🗑</button>
    </div>}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          {["Fecha","Ticker","Mdo","Cant","P.Compra","P.Venta","Gastos","P&L Neto","Rend",""].map(h=><th key={h} style={{padding:"6px 8px",textAlign:h===""||h==="Fecha"||h==="Ticker"||h==="Mdo"?"left":"right",fontSize:10,fontWeight:600,color:"#7a8497",textTransform:"uppercase",borderBottom:"1px solid #22263350"}}>{h}</th>)}

          const fTalt=n=>isBM?fUSD(n/(t.mep||mep)):fARS(n*(t.mep||mep));
          const rendPct=t.montoCompra>0?(t.neto/t.montoCompra*100):0;
          return<tr key={t.id} style={{borderBottom:"1px solid #1a1d27",background:t.neto>=0?"#065f4608":"#7f1d2e08"}}>
            <td style={{padding:"6px 8px",fontSize:11,color:"#c1c8d4"}}>{t.fecha}</td>
            <td style={{padding:"6px 8px",fontSize:13,fontWeight:700}}>{t.ticker}</td>
