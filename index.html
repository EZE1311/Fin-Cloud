input, select, button { font-family: inherit; }
input, select { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; padding: 8px 12px; font-size: 14px; outline: none; -webkit-appearance: none; }
input:focus, select:focus { border-color: #2563eb; }
input::placeholder { color: #475569; }
::-webkit-scrollbar { width: 6px; height: 6px; }

::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideIn { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }
@media(max-width:768px) {
  .desktop-only { display: none !important; }
  .grid-2 { grid-template-columns: 1fr !important; }
  .grid-4 { grid-template-columns: 1fr 1fr !important; }
  .macro-strip { display: none !important; }

  .main-content { padding: 12px !important; }
  .stat-card-value { font-size: 18px !important; }
  .table-wrap { font-size: 12px; }
  .form-grid { grid-template-columns: 1fr 1fr !important; }
}
@media(max-width:480px) {
  .grid-4 { grid-template-columns: 1fr !important; }
  .header-title { font-size: 15px !important; }
}

};

// ─── COMPONENTS ────────────────────────────────────────────
function Card({title,children,style:s={},right=null}){
  return (
    <div style={{background:"#1a1f2e",border:"1px solid #252d3d",borderRadius:10,overflow:"hidden",animation:"fadeIn .3s ease",...s}}>
      {title && <div style={{padding:"14px 18px",borderBottom:"1px solid #252d3d",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h3 style={{margin:0,fontSize:14,fontWeight:600,color:"#cbd5e1"}}>{title}</h3>{right}
      </div>}
      <div style={{padding:18}}>{children}</div>
    </div>
  );
}

function Stat({label,value,sub,color="#60a5fa",icon}){
  return (
    <div style={{background:"#1a1f2e",border:"1px solid #252d3d",borderRadius:10,padding:"16px 18px",animation:"fadeIn .3s ease"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <div style={{fontSize:11,color:"#64748b",marginBottom:6,textTransform:"uppercase",letterSpacing:".05em"}}>{label}</div>
          <div className="stat-card-value" style={{fontSize:22,fontWeight:700,color,fontVariantNumeric:"tabular-nums"}}>{value}</div>
          {sub && <div style={{fontSize:12,color:sub.startsWith("+")?'#34d399':sub.startsWith("-")?'#f87171':'#94a3b8',marginTop:4,fontWeight:500}}>{sub}</div>}
        </div>
        {icon && <div style={{opacity:.3}}><Ic name={icon} size={28}/></div>}
      </div>
    </div>
  );
}

function Btn({children,onClick,variant="primary",style:s={}}){
  const bg = variant==="primary" ? "#2563eb" : variant==="success" ? "#059669" : "#334155";
  const cl = variant==="ghost" ? "#94a3b8" : "#fff";
  return <button onClick={onClick} style={{background:bg,border:"none",color:cl,borderRadius:6,padding:"8px 16px",fontSize:13,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:6,...s}}>{children}</button>;
}

function Badge({text,color="#60a5fa",bg="#252d3d"}){
  return <span style={{background:bg,borderRadius:4,padding:"2px 8px",fontSize:11,fontWeight:600,color}}>{text}</span>;
}

// ─── RESUMEN ───────────────────────────────────────────────
function Resumen({enriched,total,invertido,pl,rend,macro,ops,trigAlerts,prices}){
  const byType = useMemo(()=>{
    const m={};enriched.forEach(p=>{m[p.tipo]=(m[p.tipo]||0)+p.montoActual});
    return Object.entries(m).map(([name,value])=>({name,value}));
  },[enriched]);
  const bySector = useMemo(()=>{
    const m={};enriched.forEach(p=>{m[p.sector]=(m[p.sector]||0)+p.montoActual});
    return Object.entries(m).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);
  },[enriched]);
  const movers = useMemo(()=>[...enriched].sort((a,b)=>Math.abs(b.variacion)-Math.abs(a.variacion)).slice(0,5),[enriched]);

  return (
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      {trigAlerts.length>0 && <div style={{background:"#dc262612",border:"1px solid #dc262633",borderRadius:10,padding:"14px 18px"}}>
        <div style={{fontSize:13,fontWeight:600,color:"#fca5a5",marginBottom:8}}>⚠ Alertas Activadas</div>
        {trigAlerts.map(a=><div key={a.id} style={{fontSize:12,color:"#fca5a5",padding:"3px 0"}}>{a.ticker} {a.condition==="above"?"superó":"cayó debajo de"} USD {fmt(a.price,2)} → Actual: USD {fmt(prices[a.ticker]?.price,4)}</div>)}
      </div>}
      <div className="grid-4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14}}>
        <Stat label="Valor del Portfolio" value={fmtUSD(total)} sub={fmtPct(rend)} color="#f1f5f9" icon="dollar"/>
        <Stat label="Total Invertido" value={fmtUSD(invertido)} color="#94a3b8" icon="chart"/>
        <Stat label="P&L Total" value={fmtUSD(pl)} sub={pl>=0?"Ganancia":"Pérdida"} color={pl>=0?"#34d399":"#f87171"} icon={pl>=0?"up":"down"}/>
        <Stat label="Posiciones" value={String(enriched.length)} sub={`${enriched.filter(p=>p.variacion>0).length} en verde`} color="#60a5fa" icon="portfolio"/>
      </div>
      <div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        <Card title="Distribución por Tipo">
          <ResponsiveContainer width="100%" height={220}>
            <PieChart><Pie data={byType} cx="50%" cy="50%" outerRadius={80} innerRadius={45} dataKey="value" label={({name,percent})=>`${name} ${(percent*100).toFixed(0)}%`} labelLine={false} style={{fontSize:11}}>
              {byType.map((_,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}
            </Pie><Tooltip formatter={v=>fmtUSD(v)} contentStyle={{background:"#1e293b",border:"1px solid #334155",borderRadius:6,fontSize:12}}/></PieChart>
          </ResponsiveContainer>
        </Card>
        <Card title="Distribución por Sector">
          <ResponsiveContainer width="100%" height={220}>
            <BarChart data={bySector} layout="vertical" margin={{left:70,right:10,top:5,bottom:5}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1e293b"/>
              <XAxis type="number" tickFormatter={v=>`$${(v/1000).toFixed(0)}k`} style={{fontSize:10}} stroke="#475569"/>
              <YAxis type="category" dataKey="name" style={{fontSize:11}} stroke="#475569" width={65}/>
              <Tooltip formatter={v=>fmtUSD(v)} contentStyle={{background:"#1e293b",border:"1px solid #334155",borderRadius:6,fontSize:12}}/>
              <Bar dataKey="value" radius={[0,4,4,0]}>
                {bySector.map((e,i)=><Cell key={i} fill={SEC_COL[e.name]||COLORS[i%COLORS.length]}/>)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </Card>
      </div>
      <div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        <Card title="Mayores Movimientos Hoy">
          {movers.map((p,i)=><div key={p.ticker} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:i<movers.length-1?"1px solid #252d3d":"none"}}>
            <div><div style={{fontWeight:600,fontSize:14}}>{p.ticker}</div><div style={{fontSize:11,color:"#64748b"}}>{p.sector} · {p.mercado}</div></div>
            <div style={{textAlign:"right"}}><div style={{fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{fmtUSD(p.precioActual)}</div><div style={{fontSize:12,fontWeight:500,color:p.variacion>=0?"#34d399":"#f87171"}}>{fmtPct(p.variacion)}</div></div>
          </div>)}
        </Card>
        <Card title="Últimas Operaciones">
          {[...ops].reverse().slice(0,6).map((op,i)=><div key={op.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:i<5?"1px solid #252d3d":"none"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:28,height:28,borderRadius:6,background:op.tipo==="COMPRA"?"#065f4622":"#7f1d1d22",border:`1px solid ${op.tipo==="COMPRA"?"#065f4644":"#7f1d1d44"}`,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <span style={{fontSize:11,fontWeight:700,color:op.tipo==="COMPRA"?"#34d399":"#f87171"}}>{op.tipo==="COMPRA"?"C":"V"}</span>
              </div>

// ─── PORTFOLIO ─────────────────────────────────────────────
function Portfolio({enriched,total}){
  const [sortBy,setSortBy]=useState("montoActual");
  const [sortDir,setSortDir]=useState("desc");
  const [filterType,setFilterType]=useState("Todos");
  const types=["Todos",...new Set(enriched.map(p=>p.tipo))];
  const sorted=useMemo(()=>{
    let d=filterType==="Todos"?enriched:enriched.filter(p=>p.tipo===filterType);
    return [...d].sort((a,b)=>sortDir==="desc"?b[sortBy]-a[sortBy]:a[sortBy]-b[sortBy]);
  },[enriched,sortBy,sortDir,filterType]);
  const toggle=(c)=>{if(sortBy===c)setSortDir(d=>d==="desc"?"asc":"desc");else{setSortBy(c);setSortDir("desc")}};

  const byCountry=useMemo(()=>{
    const m={};enriched.forEach(p=>{m[p.pais]=(m[p.pais]||0)+p.montoActual});
    return Object.entries(m).map(([name,value])=>({name,value}));
  },[enriched]);

  const TH=({col,label,align="right"})=>(
    <th onClick={()=>toggle(col)} style={{padding:"10px 8px",textAlign:align,fontSize:11,fontWeight:600,color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",cursor:"pointer",userSelect:"none",whiteSpace:"nowrap",borderBottom:"1px solid #252d3d",background:"#151a27"}}>
      {label} {sortBy===col?(sortDir==="desc"?"↓":"↑"):""}
    </th>
  );

  return (
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {types.map(t=><button key={t} onClick={()=>setFilterType(t)} style={{background:filterType===t?"#2563eb":"#1e293b",border:`1px solid ${filterType===t?"#2563eb":"#334155"}`,color:filterType===t?"#fff":"#94a3b8",borderRadius:6,padding:"6px 14px",fontSize:12,cursor:"pointer",fontWeight:500}}>{t}</button>)}
      </div>
      <Card>
        <div className="table-wrap" style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:900}}>
            <thead><tr>
              <TH col="ticker" label="Ticker" align="left"/><th style={{padding:"10px 8px",textAlign:"left",fontSize:11,fontWeight:600,color:"#64748b",borderBottom:"1px solid #252d3d",background:"#151a27"}}>Tipo</th>
              <TH col="cantidad" label="Cant"/><TH col="ppc" label="PPC"/><TH col="precioActual" label="Precio"/><TH col="variacion" label="Var%"/>
              <TH col="montoInvertido" label="Invertido"/><TH col="montoActual" label="Actual"/><TH col="pl" label="P&L"/><TH col="rendimiento" label="Rend%"/>
              <th style={{padding:"10px 8px",textAlign:"right",fontSize:11,fontWeight:600,color:"#64748b",borderBottom:"1px solid #252d3d",background:"#151a27"}}>%Port</th>
            </tr></thead>
            <tbody>{sorted.map(p=>(
              <tr key={p.ticker} style={{borderBottom:"1px solid #1e293b"}} onMouseEnter={e=>e.currentTarget.style.background="#252d3d33"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                <td style={{padding:"10px 8px"}}><div style={{fontWeight:700,fontSize:14}}>{p.ticker}</div><div style={{fontSize:10,color:"#64748b"}}>{p.mercado}·{p.broker}</div></td>
                <td style={{padding:"10px 8px"}}><Badge text={p.tipo}/></td>
                <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:13}}>{fmt(p.cantidad)}</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:13}}>{fmtUSD(p.ppc)}</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:13,fontWeight:600}}>{fmtUSD(p.precioActual)}</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:13,fontWeight:600,color:p.variacion>=0?"#34d399":"#f87171"}}>{fmtPct(p.variacion)}</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:13}}>{fmtUSD(p.montoInvertido)}</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:13,fontWeight:600}}>{fmtUSD(p.montoActual)}</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:13,fontWeight:600,color:p.pl>=0?"#34d399":"#f87171"}}>{fmtUSD(p.pl)}</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:13,fontWeight:600,color:p.rendimiento>=0?"#34d399":"#f87171"}}>{fmtPct(p.rendimiento)}</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontSize:13}}>{fmt((p.montoActual/total)*100,1)}%</td>
              </tr>
            ))}</tbody>
            <tfoot><tr style={{borderTop:"2px solid #2563eb"}}>
              <td colSpan={6} style={{padding:12,fontWeight:700,fontSize:14}}>TOTAL</td>
              <td style={{padding:12,textAlign:"right",fontWeight:700,fontVariantNumeric:"tabular-nums"}}>{fmtUSD(sorted.reduce((s,p)=>s+p.montoInvertido,0))}</td>
              <td style={{padding:12,textAlign:"right",fontWeight:700,fontVariantNumeric:"tabular-nums"}}>{fmtUSD(sorted.reduce((s,p)=>s+p.montoActual,0))}</td>
              <td style={{padding:12,textAlign:"right",fontWeight:700,fontVariantNumeric:"tabular-nums",color:sorted.reduce((s,p)=>s+p.pl,0)>=0?"#34d399":"#f87171"}}>{fmtUSD(sorted.reduce((s,p)=>s+p.pl,0))}</td>
              <td colSpan={2}></td>

            {byCountry.map((_,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}
          </Pie><Tooltip formatter={v=>fmtUSD(v)} contentStyle={{background:"#1e293b",border:"1px solid #334155",borderRadius:6,fontSize:12}}/></PieChart>
        </ResponsiveContainer>
      </Card>
    </div>
  );
}

// ─── OPERACIONES ───────────────────────────────────────────
function Operaciones({ops,setOps,pos,setPos}){
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({ticker:"",tipo:"COMPRA",cantidad:"",precio:"",mercado:"BYMA",broker:"BM",moneda:"ARS",fecha:""});
  const [filter,setFilter]=useState("");

  const submit=(e)=>{
    e.preventDefault();
    if(!form.ticker||!form.cantidad||!form.precio) return;
    const op={id:Date.now(),...form,cantidad:parseFloat(form.cantidad),precio:parseFloat(form.precio),fecha:form.fecha||today()};
    setOps([...ops,op]);
    const ex=pos.find(p=>p.ticker===form.ticker.toUpperCase());
    if(ex){
      if(form.tipo==="COMPRA"){
        const nc=ex.cantidad+op.cantidad;
        const np=((ex.cantidad*ex.ppc)+(op.cantidad*op.precio))/nc;
        setPos(pos.map(p=>p.ticker===form.ticker.toUpperCase()?{...p,cantidad:nc,ppc:np}:p));
      } else {
        const nc=ex.cantidad-op.cantidad;
        if(nc<=0) setPos(pos.filter(p=>p.ticker!==form.ticker.toUpperCase()));
        else setPos(pos.map(p=>p.ticker===form.ticker.toUpperCase()?{...p,cantidad:nc}:p));
      }
    } else if(form.tipo==="COMPRA"){
      setPos([...pos,{ticker:form.ticker.toUpperCase(),cantidad:op.cantidad,ppc:op.precio,mercado:form.mercado,tipo:form.mercado==="NYSE"?"Acción":"CEDEAR",moneda:form.moneda,broker:form.broker,sector:"Sin clasificar",pais:form.mercado==="NYSE"?"USA":"Argentina"}]);
    }
    setForm({ticker:"",tipo:"COMPRA",cantidad:"",precio:"",mercado:"BYMA",broker:"BM",moneda:"ARS",fecha:""});
    setShowForm(false);
  };

  const fl=filter?ops.filter(o=>o.ticker.toLowerCase().includes(filter.toLowerCase())):ops;

  return (
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <input placeholder="Filtrar por ticker..." value={filter} onChange={e=>setFilter(e.target.value)} style={{width:200}}/>
          <span style={{fontSize:12,color:"#64748b"}}>{fl.length} ops</span>
        </div>
        <Btn onClick={()=>setShowForm(!showForm)}><Ic name="add" size={16}/> Nueva Operación</Btn>
      </div>
      {showForm && <Card title="Registrar Operación">
        <form onSubmit={submit} className="form-grid" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
          <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Ticker</label><input value={form.ticker} onChange={e=>setForm({...form,ticker:e.target.value.toUpperCase()})} placeholder="AAPL" required style={{width:"100%"}}/></div>
          <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Tipo</label><select value={form.tipo} onChange={e=>setForm({...form,tipo:e.target.value})} style={{width:"100%"}}><option value="COMPRA">COMPRA</option><option value="VENTA">VENTA</option></select></div>
          <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Cantidad</label><input type="number" value={form.cantidad} onChange={e=>setForm({...form,cantidad:e.target.value})} required style={{width:"100%"}}/></div>
          <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Precio</label><input type="number" step="0.0001" value={form.precio} onChange={e=>setForm({...form,precio:e.target.value})} required style={{width:"100%"}}/></div>
          <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Mercado</label><select value={form.mercado} onChange={e=>setForm({...form,mercado:e.target.value,moneda:e.target.value==="NYSE"?"USD":"ARS"})} style={{width:"100%"}}><option value="BYMA">BYMA</option><option value="NYSE">NYSE</option><option value="NASDAQ">NASDAQ</option></select></div>
          <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Broker</label><select value={form.broker} onChange={e=>setForm({...form,broker:e.target.value})} style={{width:"100%"}}><option value="BM">Bull Market</option><option value="AT">Allaria</option><option value="IOL">IOL</option><option value="PPI">PPI</option></select></div>
          <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Fecha</label><input value={form.fecha} onChange={e=>setForm({...form,fecha:e.target.value})} placeholder="DD-MM-AA" style={{width:"100%"}}/></div>
          <div style={{display:"flex",alignItems:"flex-end",gap:8}}><Btn variant="success" onClick={submit} style={{flex:1}}>Guardar</Btn><Btn variant="ghost" onClick={()=>setShowForm(false)}>X</Btn></div>
        </form>
      </Card>}
      <Card>
        <div className="table-wrap" style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:700}}>
            <thead><tr>{["Fecha","Ticker","Tipo","Cantidad","Precio","Monto","Mercado","Broker"].map(h=><th key={h} style={{padding:"10px 8px",textAlign:["Fecha","Ticker","Tipo"].includes(h)?"left":"right",fontSize:11,fontWeight:600,color:"#64748b",textTransform:"uppercase",borderBottom:"1px solid #252d3d",background:"#151a27"}}>{h}</th>)}</tr></thead>
            <tbody>{[...fl].reverse().map(op=>(
              <tr key={op.id} style={{borderBottom:"1px solid #1e293b"}} onMouseEnter={e=>e.currentTarget.style.background="#252d3d33"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                <td style={{padding:"10px 8px",fontSize:13}}>{op.fecha}</td>
                <td style={{padding:"10px 8px",fontWeight:700,fontSize:14}}>{op.ticker}</td>
                <td style={{padding:"10px 8px"}}><Badge text={op.tipo} color={op.tipo==="COMPRA"?"#34d399":"#f87171"} bg={op.tipo==="COMPRA"?"#065f4622":"#7f1d1d22"}/></td>
                <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{fmt(op.cantidad)}</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{op.moneda==="USD"?fmtUSD(op.precio):`$${fmt(op.precio)}`}</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontVariantNumeric:"tabular-nums",fontWeight:600}}>{op.moneda==="USD"?fmtUSD(op.cantidad*op.precio):`$${fmt(op.cantidad*op.precio)}`}</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontSize:12,color:"#94a3b8"}}>{op.mercado}</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontSize:12,color:"#94a3b8"}}>{op.broker}</td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

// ─── ALERTAS ───────────────────────────────────────────────
function Alertas({alerts,setAlerts,prices,pos}){
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({ticker:"",condition:"above",price:""});
  const add=(e)=>{e.preventDefault();if(!form.ticker||!form.price)return;setAlerts([...alerts,{id:Date.now(),ticker:form.ticker.toUpperCase(),condition:form.condition,price:parseFloat(form.price),active:true}]);setForm({ticker:"",condition:"above",price:""});setShowForm(false);};

  return (
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <div><h2 style={{margin:0,fontSize:18,fontWeight:700}}>Alertas de Precio</h2><p style={{margin:"4px 0 0",fontSize:13,color:"#64748b"}}>Configurá alertas para monitorear precios de tus activos.</p></div>
        <Btn onClick={()=>setShowForm(!showForm)}><Ic name="add" size={16}/> Nueva Alerta</Btn>
      </div>
      {showForm && <Card title="Crear Alerta">
        <form onSubmit={add} style={{display:"flex",gap:12,alignItems:"flex-end",flexWrap:"wrap"}}>
          <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Ticker</label><select value={form.ticker} onChange={e=>setForm({...form,ticker:e.target.value})} style={{minWidth:120}} required><option value="">Seleccionar...</option>{pos.map(p=><option key={p.ticker} value={p.ticker}>{p.ticker}</option>)}</select></div>
          <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Condición</label><select value={form.condition} onChange={e=>setForm({...form,condition:e.target.value})} style={{minWidth:160}}><option value="above">Sube por encima de</option><option value="below">Baja por debajo de</option></select></div>
          <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Precio USD</label><input type="number" step="0.0001" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} required style={{width:130}}/></div>
          <Btn variant="success" onClick={add}>Crear</Btn>
        </form>
      </Card>}
      <div style={{display:"grid",gap:10}}>
        {alerts.map(a=>{
          const p=prices[a.ticker];const trig=p&&(a.condition==="above"?p.price>=a.price:p.price<=a.price);
          return <div key={a.id} style={{background:trig?"#dc262612":"#1a1f2e",border:`1px solid ${trig?"#dc262644":"#252d3d"}`,borderRadius:10,padding:"16px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,animation:trig?"pulse 2s infinite":"none"}}>
            <div style={{display:"flex",alignItems:"center",gap:14}}>
              <div style={{width:40,height:40,borderRadius:8,background:trig?"#dc262622":"#252d3d",display:"flex",alignItems:"center",justifyContent:"center"}}><Ic name={a.condition==="above"?"up":"down"} size={20}/></div>
              <div>
                <div style={{fontWeight:700,fontSize:16}}>{a.ticker}</div>
                <div style={{fontSize:12,color:"#64748b"}}>{a.condition==="above"?"Sube por encima de":"Baja por debajo de"} <strong style={{color:"#e2e8f0"}}>{fmtUSD(a.price)}</strong></div>
                <div style={{fontSize:11,color:"#64748b",marginTop:2}}>Actual: <span style={{color:p?.change>=0?"#34d399":"#f87171",fontWeight:600}}>{fmtUSD(p?.price)}</span></div>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              {trig && <Badge text="ACTIVADA" color="#fca5a5" bg="#dc262633"/>}
              <button onClick={()=>setAlerts(alerts.map(x=>x.id===a.id?{...x,active:!x.active}:x))} style={{background:a.active?"#065f4622":"#334155",border:`1px solid ${a.active?"#065f4644":"#475569"}`,color:a.active?"#34d399":"#64748b",borderRadius:6,padding:"6px 12px",fontSize:11,cursor:"pointer",fontWeight:500}}>{a.active?"Activa":"Pausada"}</button>
              <button onClick={()=>setAlerts(alerts.filter(x=>x.id!==a.id))} style={{background:"none",border:"none",color:"#64748b",cursor:"pointer",padding:4}}><Ic name="del" size={16}/></button>
            </div>
          </div>;
        })}
      </div>
      {alerts.length===0 && <div style={{textAlign:"center",padding:60,color:"#475569"}}><Ic name="bell" size={48}/><p style={{marginTop:12,fontSize:14}}>No tenés alertas configuradas.</p></div>}
    </div>
  );
}

    const iv=setInterval(()=>{
      setPrices(prev=>{
        const u={...prev};const ts=Object.keys(u);const t=ts[Math.floor(Math.random()*ts.length)];
        const v=(Math.random()-.48)*.02;const np=u[t].price*(1+v);const nc=((np-u[t].prev)/u[t].prev)*100;
        u[t]={...u[t],price:np,change:nc};return u;
      });
      setLastUp(new Date());
    },4000);
    return ()=>clearInterval(iv);
  },[]);

  const enriched=useMemo(()=>pos.map(p=>{
    const l=prices[p.ticker]||{price:p.ppc,change:0};
    const mi=p.cantidad*p.ppc;const ma=p.cantidad*l.price;const pl=ma-mi;const r=mi>0?(pl/mi)*100:0;
    return {...p,precioActual:l.price,variacion:l.change,montoInvertido:mi,montoActual:ma,pl,rendimiento:r};
  }),[pos,prices]);

  const total=useMemo(()=>enriched.reduce((s,p)=>s+p.montoActual,0),[enriched]);
  const invertido=useMemo(()=>enriched.reduce((s,p)=>s+p.montoInvertido,0),[enriched]);
  const pl=total-invertido;const rend=invertido>0?(pl/invertido)*100:0;
  const trigAlerts=useMemo(()=>alerts.filter(a=>{if(!a.active)return false;const p=prices[a.ticker];if(!p)return false;return a.condition==="above"?p.price>=a.price:p.price<=a.price;}),[alerts,prices]);

  const tabs=[{id:"resumen",label:"Resumen",icon:"home"},{id:"portfolio",label:"Portfolio",icon:"portfolio"},{id:"operaciones",label:"Operaciones",icon:"ops"},{id:"alertas",label:"Alertas",icon:"bell"},{id:"noticias",label:"Noticias",icon:"news"}];

  return (
    <div style={{minHeight:"100vh"}}>
      <header style={{background:"linear-gradient(90deg,#111827,#1e293b)",borderBottom:"1px solid #1e293b",padding:"12px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:36,height:36,borderRadius:8,background:"linear-gradient(135deg,#2563eb,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:16,color:"#fff",flexShrink:0}}>EI</div>
          <div>
            <h1 className="header-title" style={{margin:0,fontSize:18,fontWeight:700,color:"#f1f5f9",letterSpacing:"-.02em"}}>Financial Dashboard</h1>
            <span style={{fontSize:11,color:"#64748b"}}>Actualizado: {lastUp.toLocaleTimeString("es-AR")}</span>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          {trigAlerts.length>0 && <div style={{background:"#dc262622",border:"1px solid #dc262655",borderRadius:6,padding:"4px 10px",fontSize:12,color:"#fca5a5",display:"flex",alignItems:"center",gap:6,animation:"pulse 2s infinite"}}><Ic name="bell" size={14}/> {trigAlerts.length} alerta{trigAlerts.length>1?"s":""}</div>}
          <div className="macro-strip" style={{display:"flex",gap:16,fontSize:11}}>
            {[{l:"Oficial",v:`$${fmt(macro.dolarOficial)}`},{l:"MEP",v:`$${fmt(macro.dolarMEP)}`},{l:"CCL",v:`$${fmt(macro.dolarCCL)}`},{l:"Blue",v:`$${fmt(macro.dolarBlue)}`},{l:"Riesgo",v:String(macro.riesgoPais)}].map(i=><div key={i.l} style={{textAlign:"center"}}><div style={{color:"#64748b",marginBottom:1}}>{i.l}</div><div style={{fontWeight:600,color:"#94a3b8",fontVariantNumeric:"tabular-nums"}}>{i.v}</div></div>)}
          </div>
        </div>
      </header>
      <nav className="nav-bar" style={{background:"#111827",borderBottom:"1px solid #1e293b",display:"flex",gap:0,padding:"0 20px"}}>
        {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{background:"none",border:"none",color:tab===t.id?"#60a5fa":"#64748b",padding:"12px 16px",cursor:"pointer",fontSize:13,fontWeight:tab===t.id?600:400,borderBottom:tab===t.id?"2px solid #2563eb":"2px solid transparent",display:"flex",alignItems:"center",gap:6,transition:"all .15s",whiteSpace:"nowrap"}}><Ic name={t.icon} size={16}/> {t.label}</button>)}
      </nav>
      <main className="main-content" style={{padding:24,maxWidth:1400,margin:"0 auto"}}>
        {tab==="resumen" && <Resumen enriched={enriched} total={total} invertido={invertido} pl={pl} rend={rend} macro={macro} ops={ops} trigAlerts={trigAlerts} prices={prices}/>}
        {tab==="portfolio" && <Portfolio enriched={enriched} total={total}/>}
        {tab==="operaciones" && <Operaciones ops={ops} setOps={setOps} pos={pos} setPos={setPos}/>}
        {tab==="alertas" && <Alertas alerts={alerts} setAlerts={setAlerts} prices={prices} pos={pos}/>}
        {tab==="noticias" && <Noticias pos={pos}/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
