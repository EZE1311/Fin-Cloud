          <div style={rowSt}><span style={{color:"#94a3b8",fontSize:12}}>Fecha:</span><span style={valSt}>{data.fechaOp}</span></div>
          <div style={rowSt}><span style={{color:"#94a3b8",fontSize:12}}>Monto Contado:</span><span style={{...valSt,color:"#f1f5f9"}}>{fARS(data.monto)}</span></div>
          <div style={rowSt}><span style={{color:"#94a3b8",fontSize:12}}>Tasa Bruta (TNA):</span><span style={valSt}>{fPct(data.tna)}</span></div>
          <div style={rowSt}><span style={{color:"#94a3b8",fontSize:12}}>Días:</span><span style={valSt}>{data.dias}</span></div>
          <div style={{...rowSt,borderBottom:"none"}}><span style={{color:"#94a3b8",fontSize:12,fontWeight:600}}>Monto Futuro:</span><span style={{...valSt,color:"#f1f5f9",fontSize:14}}>{fARS(data.montoFuturo)}</span></div>
        </div>
        {/* Desglose de gastos */}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",marginBottom:8,letterSpacing:".04em"}}>Desglose de Gastos</div>
          <div style={rowSt}><span style={{color:"#94a3b8",fontSize:12}}>Comisión:</span><span style={{...valSt,color:"#fbbf24"}}>{fARS(data.comision)}</span></div>
          <div style={rowSt}><span style={{color:"#94a3b8",fontSize:12}}>Derecho Mercado:</span><span style={valSt}>{fARS(data.derMercado)}</span></div>
          {!esColocadora&&<div style={rowSt}><span style={{color:"#94a3b8",fontSize:12}}>Gto. Adm. Gtías:</span><span style={valSt}>{fARS(data.gtoGtia)}</span></div>}
          {esColocadora&&<div style={rowSt}><span style={{color:"#94a3b8",fontSize:12}}>Gto. Adm. Gtías:</span><span style={{...valSt,color:"#475569"}}>$ 0,00</span></div>}
          <div style={rowSt}><span style={{color:"#94a3b8",fontSize:12}}>IVA (21%):</span><span style={valSt}>{fARS(data.iva)}</span></div>
          <div style={{...rowSt,borderBottom:"none",borderTop:"1px solid #334155",paddingTop:8}}><span style={{color:"#94a3b8",fontSize:12,fontWeight:700}}>Total Gastos:</span><span style={{...valSt,color:"#f87171",fontSize:14}}>{fARS(data.totalGastos)}</span></div>
        </div>
        {/* Resultado */}
        <div style={{background:esColocadora?"#065f4622":"#7f1d1d22",borderRadius:8,padding:"12px 14px",border:`1px solid ${esColocadora?"#34d39933":"#f8717133"}`}}>
          <div style={rowSt}><span style={{color:"#94a3b8",fontSize:12}}>Fecha {esColocadora?"cobro":"pago"}:</span><span style={valSt}>{data.fechaVenc}</span></div>
          <div style={rowSt}><span style={{color:"#94a3b8",fontSize:12,fontWeight:700}}>{esColocadora?"Monto a Cobrar":"Monto a Pagar"}:</span><span style={{...valSt,color:esColocadora?"#34d399":"#f87171",fontSize:15}}>{fARS(esColocadora?data.montoCobrar:data.montoPagar)}</span></div>
          <div style={rowSt}><span style={{color:"#94a3b8",fontSize:12}}>{esColocadora?"Tasa Neta":"C.F.T."}:</span><span style={valSt}>{fPct(esColocadora?data.tasaNeta:data.cft)}</span></div>
          <div style={rowSt}><span style={{color:"#94a3b8",fontSize:12}}>T.E. Período:</span><span style={{...valSt,color:esColocadora?"#34d399":"#f87171",background:esColocadora?"#065f4644":"#fbbf2433",padding:"2px 8px",borderRadius:4}}>{fPct(data.tePeriodo)}</span></div>
          <div style={{...rowSt,borderBottom:"none"}}><span style={{color:"#94a3b8",fontSize:12,fontWeight:700}}>{esColocadora?"Ganancia Neta":"Costo Neto"}:</span><span style={{...valSt,color:esColocadora?"#34d399":"#f87171",fontSize:15}}>{fARS(esColocadora?data.ganNeta:data.costoNeto)}</span></div>
        </div>
      </div>
    </div>;
  }

  const statusColor=iolStatus?.status==="ok"?"#34d399":iolStatus?.status==="cached"?"#fbbf24":iolStatus?.status==="error"?"#f87171":"#64748b";
  const statusDot=<span style={{width:8,height:8,borderRadius:"50%",background:statusColor,display:"inline-block",animation:iolStatus?.status==="fetching"?"pulse 1s infinite":"none"}}/>;
  const tna1d=iolStatus?.pesos1d;
  const te1d=tna1d?(tna1d/365):null;

  return <div style={{display:"flex",flexDirection:"column",gap:18}}>
    {/* ── TASA IOL — Caución Pesos 1D ── */}
    <div style={{background:"linear-gradient(135deg,#1a1f2e 0%,#0f172a 100%)",border:"1px solid #334155",borderRadius:12,padding:"20px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:14}}>
      <div style={{display:"flex",alignItems:"center",gap:16}}>
        <div style={{background:"#111827",borderRadius:10,padding:"12px 16px",border:"1px solid #252d3d",textAlign:"center",minWidth:120}}>
          {tna1d!=null&&tna1d>0?
            <div style={{fontSize:28,fontWeight:800,color:"#34d399",fontVariantNumeric:"tabular-nums",lineHeight:1}}>{tna1d}%<span style={{fontSize:13,fontWeight:500,color:"#64748b",marginLeft:4}}>TNA</span></div>:
            iolStatus?.status==="fetching"?
              <div style={{fontSize:14,color:"#60a5fa",animation:"pulse 1s infinite"}}>Consultando...</div>:
              <div style={{fontSize:14,color:"#475569"}}>Sin datos</div>
          }
          {te1d!=null&&<div style={{fontSize:10,color:"#64748b",marginTop:4}}>T.E. diaria: {te1d.toFixed(4)}%</div>}
        </div>
        <div>
          <h3 style={{margin:0,fontSize:15,fontWeight:700,color:"#e2e8f0"}}>Caución Pesos 1 Día</h3>
          <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
            {statusDot}
            {iolStatus?.status==="ok"&&<span style={{fontSize:11,color:"#34d399"}}>IOL Conectado</span>}
            {iolStatus?.status==="cached"&&<span style={{fontSize:11,color:"#fbbf24"}}>Cache</span>}
            {iolStatus?.status==="error"&&<span style={{fontSize:11,color:"#f87171"}} title={window._iolLastError||iolStatus?.msg||""}>{window._iolLastError?.includes("Credenciales")?"Credenciales inválidas":"Error de conexión"}</span>}
            {iolStatus?.status==="idle"&&<span style={{fontSize:11,color:"#64748b"}}>No configurado</span>}
            {iolStatus?.ts&&<span style={{fontSize:10,color:"#475569"}}>· {timeAgo(new Date(iolStatus.ts).toISOString())}</span>}
          </div>
        </div>
      </div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={fetchCaucionRate} style={{background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",borderRadius:6,padding:"6px 12px",fontSize:12,cursor:"pointer",fontWeight:500}}>🔄 Actualizar</button>
        <button onClick={()=>setShowIOLConfig(!showIOLConfig)} style={{background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",borderRadius:6,padding:"6px 12px",fontSize:12,cursor:"pointer",fontWeight:500}}>⚙️ Config</button>
      </div>
    </div>

    {/* IOL Config panel */}
    {showIOLConfig&&<div style={{background:"#1a1f2e",border:"1px solid #252d3d",borderRadius:10,padding:"16px 18px"}}>
      <div style={{fontSize:13,fontWeight:600,color:"#e2e8f0",marginBottom:10}}>Credenciales InvertirOnline</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:10,alignItems:"end"}}>
        <div>
          <label style={{fontSize:10,color:"#64748b",display:"block",marginBottom:4}}>Email</label>
          <input value={iolUser} onChange={e=>setIolUser(e.target.value)} style={{background:"#111827",border:"1px solid #334155",borderRadius:6,padding:"6px 10px",color:"#e2e8f0",fontSize:13,width:"100%"}} placeholder="tu@email.com"/>
        </div>
        <div>
          <label style={{fontSize:10,color:"#64748b",display:"block",marginBottom:4}}>Contraseña</label>
          <input type="password" value={iolPass} onChange={e=>setIolPass(e.target.value)} style={{background:"#111827",border:"1px solid #334155",borderRadius:6,padding:"6px 10px",color:"#e2e8f0",fontSize:13,width:"100%"}} placeholder="••••"/>
        </div>
        <button onClick={()=>{saveLS("iol_creds",{user:iolUser,pass:iolPass});saveLS("iol_token",null);fetchCaucionRate();setShowIOLConfig(false);}} style={{background:"#2563eb",border:"none",color:"#fff",borderRadius:6,padding:"6px 14px",fontSize:12,cursor:"pointer",fontWeight:600,height:34}}>Guardar</button>
      </div>
      <div style={{fontSize:10,color:"#475569",marginTop:8}}>Las credenciales se guardan solo en tu browser (localStorage).</div>
      <div style={{fontSize:10,color:"#fbbf24",marginTop:6,background:"#fbbf2411",padding:"8px 10px",borderRadius:6,lineHeight:1.5}}>
        <b>Requisitos para usar la API de IOL:</b><br/>
        1. Logueate en invertironline.com<br/>
        2. Enviá un mensaje solicitando la activación de APIs<br/>
        3. Una vez confirmada, aceptá los términos en: <b>Mi Cuenta → Personalización → APIs</b><br/>
        4. Abrí la consola del browser (F12) para ver los logs detallados [IOL]
      </div>
    </div>}

    {/* ── Calculadora de Caución ── */}
    <Card title="Calculadora de Caución" right={<span style={{fontSize:10,color:"#475569"}}>BYMA · Bull Market Active Trader Plus</span>}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr",gap:14,alignItems:"end"}}>
        <div style={{gridColumn:"span 1"}}><label style={labelSt}>Monto Contado ($)</label><input type="text" value={monto?parseInt(monto).toLocaleString("es-AR"):""} onChange={e=>{const raw=e.target.value.replace(/[^\d]/g,"");setMonto(raw);}} style={inputSt}/></div>
        <div><label style={labelSt}>TNA Tomadora (%)</label><input type="number" step="0.5" value={tnaTom} onChange={e=>setTnaTom(e.target.value)} style={inputSt}/></div>
        <div><label style={labelSt}>Días Tomadora</label><input type="number" value={diasTom} onChange={e=>setDiasTom(e.target.value)} style={inputSt}/></div>
        <div><label style={labelSt}>TNA Colocadora (%)</label><input type="number" step="0.5" value={tnaCol} onChange={e=>setTnaCol(e.target.value)} style={inputSt}/></div>
        <div><label style={labelSt}>Días Colocadora</label><input type="number" value={diasCol} onChange={e=>setDiasCol(e.target.value)} style={inputSt}/></div>
      </div>
    </Card>
    {/* Paneles lado a lado */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <CaucionPanel title="CAUCIÓN TOMADORA" color="#f87171" bg="#7f1d1d33" data={tom} esColocadora={false}/>
      <CaucionPanel title="CAUCIÓN COLOCADORA" color="#34d399" bg="#065f4633" data={col} esColocadora={true}/>
    </div>
    <div style={{fontSize:9,color:"#475569",fontStyle:"italic",textAlign:"center"}}>Comisión Tomadora: 0,5% mensual · Colocadora: 0,083% mensual · Derechos+Gtías: 0,045%/90 días · IVA 21% · Fuente: Tarifario BM Marzo 2025 + BYMA</div>
  </div>;
}

/* ── TRADING — Simulador Intraday ────────── */
function Trading({macro,prices,pos,priceAlerts=[],addPriceAlert,removePriceAlert,togglePriceAlert,onOpenConfig}){
  const fARS=n=>n==null||isNaN(n)?"—":`$ ${new Intl.NumberFormat("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0}).format(n)}`;
  const fARS2=n=>n==null||isNaN(n)?"—":`$ ${new Intl.NumberFormat("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)}`;
  const fPct=(n,d=2)=>n==null||isNaN(n)?"—":`${n.toFixed(d)}%`;
  const fUSD=n=>{if(n==null||isNaN(n))return"—";const abs=Math.abs(n);if(abs<1&&abs>0)return`USD ${n.toFixed(2)}`;return`USD ${new Intl.NumberFormat("en-US",{minimumFractionDigits:0,maximumFractionDigits:0}).format(n)}`;};

  /* Helper: parsear input numérico (soporta 34.800 y 34,50) */
  const parseNum=s=>{if(!s)return 0;const clean=s.replace(/\./g,"").replace(",",".");return parseFloat(clean)||0;};
  /* Helper: formatear número para mostrar en input */
  const fmtInput=(s,decimals)=>{const n=parseNum(s);if(!s||n===0&&s!=="0")return s;return n.toLocaleString("es-AR",{maximumFractionDigits:decimals,minimumFractionDigits:0});};

  /* Operación */
  const [tickerInput,setTickerInput]=useState("");
  const [cantidad,setCantidad]=useState("");
  const [precioCompra,setPrecioCompra]=useState("");
  const [precioVentaManual,setPrecioVentaManual]=useState("");
  const [mercado,setMercado]=useState("BYMA"); /* BYMA (ARS) | NYSE (USD) */

  /* Ticker: acepta cualquier texto, uppercase */
  const ticker=tickerInput.trim().toUpperCase();

  /* Auto-detect mercado from portfolio if ticker found */
  const posInfo=pos.find(p=>p.ticker===ticker);
  const detectedMercado=posInfo?.mercado||(pos.find(p=>p.ticker===ticker)?"BYMA":null);
  React.useEffect(()=>{if(detectedMercado)setMercado(detectedMercado);},[ticker,detectedMercado]);

  /* Derive tipo from pos metadata */
  const tipoActivo=posInfo?.tipo||"";
  const exento=tipoActivo==="Bono"||tipoActivo==="Letra"||tipoActivo==="ON";

  /* Comisiones según mercado */
  const isBYMA=mercado==="BYMA";
  /* BM Active Trader Plus (BYMA) */
  const comPctBM=0.0010;   /* 0.10% broker */
  const derPctBM=0.0007;   /* 0.07% der mercado */
  const intraPctBM=0.0005; /* 0.05% intra venta */
  /* Allaria/CS (NYSE) — comisiones más bajas, sin der mercado local ni intra */
  const comPctAT=0.0060;   /* 0.60% all-in approx */
  const derPctAT=0;
  const intraPctAT=0;

  const comPct=isBYMA?comPctBM:comPctAT;
  const derPct=isBYMA?derPctBM:derPctAT;
  const intraPct=isBYMA?intraPctBM:intraPctAT;
  const ivaMult=(isBYMA&&!exento)?1.21:1; /* NYSE no paga IVA; BYMA bonos/letras/ONs exentos */
  const moneda=isBYMA?"ARS":"USD";
  const monedaSym=isBYMA?"$":"USD ";

  /* On-demand price fetch for tickers not in portfolio */
  const [tradingPrice,setTradingPrice]=useState(null);
  const [tradingPriceLoading,setTradingPriceLoading]=useState(false);
  const fetchTimerRef=React.useRef(null);

  React.useEffect(()=>{
    /* Reset on ticker change */
    setPrecioVentaManual("");
    setTradingPrice(null);
    if(fetchTimerRef.current)clearTimeout(fetchTimerRef.current);
    if(!ticker||ticker.length<2)return;
    /* If already in portfolio prices, no need to fetch */
    if(prices[ticker])return;
    /* Debounce 600ms then fetch from data912 + Yahoo */
    setTradingPriceLoading(true);
    fetchTimerRef.current=setTimeout(async()=>{
      try{
        const fetchD912=async(ep)=>{try{let r;try{r=await fetch(DATA912_BASE+"/"+ep)}catch(e){r=await fetch(PROXY+encodeURIComponent(DATA912_BASE+"/"+ep))}return await r.json()}catch(e){return[]}};
        const [cedears,argStocks,argBonds,usaStocks]=await Promise.all([fetchD912("arg_cedears"),fetchD912("arg_stocks"),fetchD912("arg_bonds"),fetchD912("usa_stocks")]);
        const find=(arr)=>(arr||[]).find(x=>(x.symbol||"").toUpperCase()===ticker);
        const hit=find(cedears)||find(argStocks)||find(argBonds)||find(usaStocks);
        if(hit&&hit.c){
          const isArg=!!(find(cedears)||find(argStocks)||find(argBonds));
          setTradingPrice({priceARS:isArg?hit.c:null,price:isArg?0:hit.c,changeARS:isArg?(hit.pct_change||0):null,change:isArg?0:(hit.pct_change||0)});
          setTradingPriceLoading(false);return;
        }
        /* Yahoo fallback */
        try{
          const yfUrl=PROXY+encodeURIComponent(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${ticker}&fields=regularMarketPrice,regularMarketChangePercent`);
          const yfRes=await fetch(yfUrl);const yfData=await yfRes.json();
          const q=(yfData.quoteResponse?.result||[])[0];
          if(q&&q.regularMarketPrice){
            const isArg=q.exchange==="BUE"||q.currency==="ARS";
            setTradingPrice({priceARS:isArg?q.regularMarketPrice:null,price:isArg?0:q.regularMarketPrice,changeARS:isArg?(q.regularMarketChangePercent||0):null,change:isArg?0:(q.regularMarketChangePercent||0)});
          }
        }catch(e){}
      }catch(e){console.warn("Trading price fetch error:",e);}
      setTradingPriceLoading(false);
    },600);
    return()=>{if(fetchTimerRef.current)clearTimeout(fetchTimerRef.current)};
  },[ticker]);

  /* Merge portfolio prices with on-demand trading price */
  const priceData=prices[ticker]||tradingPrice;
  const precioVentaAuto=isBYMA?(priceData?.priceARS||0):(priceData?.price||0);

  /* Precio venta: usa manual si lo escribió, sino auto */
  const pvManual=parseNum(precioVentaManual);
  const pv=pvManual>0?pvManual:precioVentaAuto;
  const pvIsAuto=pvManual===0&&precioVentaAuto>0;

  /* All available tickers for datalist suggestions */
  const allTickers=useMemo(()=>{
    const set=new Set(pos.map(p=>p.ticker));
    Object.keys(prices).forEach(t=>set.add(t));
    return[...set].sort();
  },[pos,prices]);

  const cant=parseNum(cantidad);
  const pc=parseNum(precioCompra);
  const montoCompra=cant*pc;
  const montoVenta=cant*pv;
  const mep=macro.dolarMEP||1;

  /* Comisiones */
  const comCompra=montoCompra*(comPct+derPct)*ivaMult;
  const comVenta=montoVenta*(comPct+derPct+intraPct)*ivaMult;
  const totalGastos=comCompra+comVenta;

  /* P&L */
  const bruto=montoVenta-montoCompra;
  const neto=bruto-totalGastos;

  /* Breakeven */
  const ventaFactor=(comPct+derPct+intraPct)*ivaMult;
  const breakeven=cant>0?(montoCompra+comCompra)/(cant*(1-ventaFactor)):0;

  /* Scenarios */
  const scenarios=pc>0?[-3,-2,-1,-0.5,0.5,1,2,3].map(pct=>{
    const pvS=pc*(1+pct/100);
    const mvS=cant*pvS;
    const cvS=mvS*(comPct+derPct+intraPct)*ivaMult;
    const netoS=mvS-montoCompra-comCompra-cvS;
    return{pct,pv:pvS,neto:netoS};
  }):[];

  /* ── Intraday Trades List (persisted) ── */
  const [trades,setTrades]=useState(()=>loadLS("intraday_trades",[]));
  useEffect(()=>{saveLS("intraday_trades",trades)},[trades]);

  const canAdd=ticker&&cant>0&&pc>0&&pv>0;
  const addTrade=()=>{
    if(!canAdd)return;
    const trade={id:Date.now(),fecha:new Date().toISOString().slice(0,10),ticker,mercado,cantidad:cant,precioCompra:pc,precioVenta:pv,montoCompra,montoVenta,comCompra,comVenta,totalGastos,bruto,neto,breakeven,exento,moneda,mep};
    setTrades(prev=>[trade,...prev]);
    setTickerInput("");setCantidad("");setPrecioCompra("");setPrecioVentaManual("");
  };

  const removeTrade=(id)=>setTrades(prev=>prev.filter(t=>t.id!==id));
  const clearTrades=()=>{if(confirm("Borrar todas las operaciones intraday?"))setTrades([]);};

  /* Totals across all trades */
  const tradesTotals=useMemo(()=>{
    let netoARS=0,netoUSD=0,gastosARS=0,gastosUSD=0,montoARS=0,montoUSD=0;
    trades.forEach(t=>{
      const m=t.mep||mep;
      if(t.mercado==="BYMA"){netoARS+=t.neto;gastosARS+=t.totalGastos;netoUSD+=t.neto/m;montoARS+=t.montoCompra;montoUSD+=t.montoCompra/m;}
      else{netoUSD+=t.neto;gastosUSD+=t.totalGastos;netoARS+=t.neto*m;montoUSD+=t.montoCompra;montoARS+=t.montoCompra*m;}
    });
    return{netoARS,netoUSD,gastosARS,gastosUSD,montoARS,montoUSD,count:trades.length};
  },[trades,mep]);

  const inputSt={background:"#111827",border:"1px solid #334155",borderRadius:6,padding:"8px 12px",color:"#e2e8f0",fontSize:15,fontWeight:600,width:"100%",fontVariantNumeric:"tabular-nums"};
  const labelSt={fontSize:11,color:"#64748b",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:".04em"};

  /* Formatear montos en la moneda del mercado */
  const fM=n=>n==null||isNaN(n)?"—":isBYMA?fARS(n):`USD ${new Intl.NumberFormat("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)}`;
  const fM2=n=>n==null||isNaN(n)?"—":isBYMA?fARS2(n):`USD ${new Intl.NumberFormat("en-US",{minimumFractionDigits:2,maximumFractionDigits:4}).format(n)}`;
  /* Equivalente en la otra moneda */
  const fAlt=n=>n==null||isNaN(n)?"—":isBYMA?fUSD(n/mep):fARS(n*mep);
  const fAltLabel=isBYMA?"MEP":"ARS";

  const mercadoBtnSt=(active)=>({background:active?"#2563eb":"#1e293b",border:`1px solid ${active?"#2563eb":"#334155"}`,color:active?"#fff":"#94a3b8",borderRadius:6,padding:"4px 12px",fontSize:11,cursor:"pointer",fontWeight:600});

  return <div style={{display:"flex",flexDirection:"column",gap:18}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
      <div>
        <h2 style={{margin:0,fontSize:18,fontWeight:700}}>Simulador de Trading Intraday</h2>
        <p style={{margin:"4px 0 0",fontSize:13,color:"#64748b"}}>Simulá compra y venta en el día con comisiones reales. {isBYMA?"BYMA · Bull Market Active Trader Plus":"NYSE · Allaria (CS)"}.</p>
      </div>
      <div style={{display:"flex",gap:4,alignItems:"center"}}>
        <button onClick={()=>setMercado("BYMA")} style={mercadoBtnSt(isBYMA)}>🇦🇷 BYMA</button>
        <button onClick={()=>setMercado("NYSE")} style={mercadoBtnSt(!isBYMA)}>🇺🇸 NYSE</button>
      </div>
    </div>

    {/* Operación */}
    <Card title="Operación" right={<span style={{fontSize:10,color:exento?"#34d399":"#64748b"}}>{tipoActivo?`${tipoActivo} · `:""}{moneda}{exento?" · IVA Exento":isBYMA?" · IVA 21%":" · Sin IVA"}</span>}>
      <div style={{display:"grid",gridTemplateColumns:"1.2fr 1fr 1fr 1fr",gap:14,alignItems:"start"}}>
        <div><label style={labelSt}>Ticker</label>
          <div style={{position:"relative"}}>
            <input type="text" value={tickerInput} onChange={e=>setTickerInput(e.target.value.toUpperCase())} style={inputSt} placeholder={isBYMA?"Ej: GGAL, VIST, MELI":"Ej: IBM, AAPL, TSLA"} list="ticker-list"/>
            <datalist id="ticker-list">{allTickers.map(t=><option key={t} value={t}/>)}</datalist>
            {ticker&&tradingPriceLoading&&<div style={{fontSize:10,color:"#fbbf24",marginTop:4,position:"absolute",left:0,top:"100%",whiteSpace:"nowrap"}}>Buscando cotización...</div>}
            {ticker&&priceData&&!tradingPriceLoading&&<div style={{fontSize:10,color:"#34d399",marginTop:4,position:"absolute",left:0,top:"100%",whiteSpace:"nowrap"}}>Cotización: {isBYMA?(priceData.priceARS?`$ ${new Intl.NumberFormat("es-AR",{maximumFractionDigits:2}).format(priceData.priceARS)}`:"—"):(priceData.price?`USD ${new Intl.NumberFormat("en-US",{maximumFractionDigits:2}).format(priceData.price)}`:"—")}</div>}

/* Yahoo Finance symbol mapping: BYMA ticker → NYSE/NASDAQ USD equivalent */
const YF_SYM_MAP={YPFD:"YPF",GGAL:"GGAL",EDN:"EDN",MELI:"MELI",ORCL:"ORCL",IBM:"IBM",BKUCF:"BKUCF",TSLA:"TSLA",AAPL:"AAPL",MSFT:"MSFT",AMZN:"AMZN",GOOGL:"GOOGL",META:"META",NVDA:"NVDA",UNH:"UNH",FISV:"FISV",JNJ:"JNJ",KO:"KO",DIS:"DIS",GLOB:"GLOB",SUPV:"SUPV",PAMP:"PAM",BMA:"BMA",CEPU:"CEPU",LOMA:"LOMA",TEO:"TEO",CRESY:"CRESY",TGS:"TGS",IRCP:"IRS",DESP:"DESP",CAAP:"CAAP",BIOX:"BIOX",AGRO:"AGRO",VISTA:"VIST"};
const yfSym=t=>{const u=t.toUpperCase();return YF_SYM_MAP[u]||u;};

async function fetchHistorical(ticker,range){
  const sym=yfSym(ticker);
  /* interval: 1wk for 1y/5y, 1mo for 10y to keep data manageable */
  const interval=range==="10y"?"1mo":"1wk";
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=${range}&interval=${interval}&includePrePost=false`;
  try{
    let res;
    try{res=await fetch(PROXY+encodeURIComponent(url));}catch(e){
      try{res=await fetch("https://corsproxy.io/?"+encodeURIComponent(url));}catch(e2){return null;}
    }
    const data=await res.json();
    const result=data?.chart?.result?.[0];
    if(!result)return null;
    const ts=result.timestamp||[];
    const closes=result.indicators?.quote?.[0]?.close||[];
    const currency=result.meta?.currency||"USD";
    const currentPrice=result.meta?.regularMarketPrice||0;
    /* Build array of {date, close} filtering nulls */
    const points=[];
    for(let i=0;i<ts.length;i++){
      if(closes[i]!=null&&closes[i]>0){
        points.push({date:new Date(ts[i]*1000).toISOString().slice(0,10),close:closes[i]});
      }
    }
    return{sym,ticker,currency,currentPrice,points};
  }catch(e){console.warn("fetchHistorical error:",ticker,e);return null;}
}

function Potencial({pos,prices,macro}){
  const [range,setRange]=useState("1y");
  const [histData,setHistData]=useState({});
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const mep=macro.dolarMEP||1;

  const fARS=n=>n==null||isNaN(n)?"—":`$ ${new Intl.NumberFormat("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0}).format(n)}`;
  const fUSD=n=>n==null||isNaN(n)?"—":`USD ${new Intl.NumberFormat("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)}`;
  const fPct=(n)=>n==null||isNaN(n)?"—":`${n>=0?"+":""}${n.toFixed(1)}%`;

  /* Tickers from portfolio (only those with open positions) */
  const tickers=useMemo(()=>pos.filter(p=>p.cantidad>0).map(p=>p.ticker),[pos]);

  /* Fetch on range or tickers change */
  useEffect(()=>{
    if(tickers.length===0)return;
    let cancelled=false;
    setLoading(true);setError(null);
    Promise.all(tickers.map(t=>fetchHistorical(t,range))).then(results=>{
      if(cancelled)return;
      const map={};
      results.forEach((r,i)=>{if(r)map[tickers[i]]=r;});
      setHistData(map);
      if(Object.keys(map).length===0)setError("No se pudieron obtener datos históricos");
      setLoading(false);
    }).catch(e=>{if(!cancelled){setError("Error al cargar datos");setLoading(false);}});
    return()=>{cancelled=true;};
  },[tickers.join(","),range]);

  /* Analyze each ticker */
  const analysis=useMemo(()=>{
    return tickers.map(t=>{
      const hist=histData[t];
      const posInfo=pos.find(p=>p.ticker===t);
      if(!hist||!posInfo||hist.points.length===0)return null;

      const closes=hist.points.map(p=>p.close);
      const maxPrice=Math.max(...closes);
      const minPrice=Math.min(...closes);
      const currentUSD=hist.currentPrice;
      const maxDate=hist.points.find(p=>p.close===maxPrice)?.date||"";
      const minDate=hist.points.find(p=>p.close===minPrice)?.date||"";

      /* % from current to max/min */
      const upsidePct=currentUSD>0?((maxPrice-currentUSD)/currentUSD)*100:0;
      const downsidePct=currentUSD>0?((minPrice-currentUSD)/currentUSD)*100:0;

      /* Current position value in USD */
      const isBYMA=posInfo.mercado==="BYMA";
      const priceData=prices[t];
      let posValueUSD=0;
      if(isBYMA){
        posValueUSD=(priceData?.priceARS||0)*posInfo.cantidad/mep;
      }else{
        posValueUSD=(priceData?.price||currentUSD)*posInfo.cantidad;
      }

      /* Projected values at max/min */
      const valueAtMax=posValueUSD*(1+upsidePct/100);
      const valueAtMin=posValueUSD*(1+downsidePct/100);

      return{ticker:t,mercado:posInfo.mercado,cantidad:posInfo.cantidad,currentUSD,maxPrice,minPrice,maxDate,minDate,upsidePct,downsidePct,posValueUSD,valueAtMax,valueAtMin,yfSym:hist.sym};
    }).filter(Boolean);
  },[tickers,histData,pos,prices,mep]);

  /* Portfolio totals */
  const totals=useMemo(()=>{
    let currentTotal=0,maxTotal=0,minTotal=0;
    analysis.forEach(a=>{currentTotal+=a.posValueUSD;maxTotal+=a.valueAtMax;minTotal+=a.valueAtMin;});
    const upsidePct=currentTotal>0?((maxTotal-currentTotal)/currentTotal)*100:0;
    const downsidePct=currentTotal>0?((minTotal-currentTotal)/currentTotal)*100:0;
    return{currentTotal,maxTotal,minTotal,upsidePct,downsidePct};
  },[analysis]);

  const rangeBtnSt=(r)=>({background:range===r?"#2563eb":"#1e293b",border:`1px solid ${range===r?"#2563eb":"#334155"}`,color:range===r?"#fff":"#94a3b8",borderRadius:6,padding:"5px 14px",fontSize:12,cursor:"pointer",fontWeight:600});
  const rangeLabel={"1y":"1 Año","5y":"5 Años","10y":"10 Años"};

  return <div style={{display:"flex",flexDirection:"column",gap:18}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
      <div>
        <h2 style={{margin:0,fontSize:18,fontWeight:700}}>Potencial del Portfolio</h2>
        <p style={{margin:"4px 0 0",fontSize:13,color:"#64748b"}}>Máximos y mínimos históricos de tus activos ({rangeLabel[range]}). Precios en USD vía NYSE/NASDAQ.</p>
      </div>
      <div style={{display:"flex",gap:4}}>
        {["1y","5y","10y"].map(r=><button key={r} onClick={()=>setRange(r)} style={rangeBtnSt(r)}>{rangeLabel[r]}</button>)}
      </div>
    </div>

    {loading&&<div style={{textAlign:"center",padding:40,color:"#fbbf24",fontSize:14}}>Cargando datos históricos de {tickers.length} activos...</div>}
    {error&&!loading&&<div style={{textAlign:"center",padding:40,color:"#f87171",fontSize:14}}>{error}</div>}

    {/* Portfolio Summary Cards */}
    {!loading&&analysis.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14}}>
      <div style={{background:"#0f172a",border:"1px solid #334155",borderRadius:12,padding:20,textAlign:"center"}}>
        <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",marginBottom:6}}>Valor Actual</div>
        <div style={{fontSize:22,fontWeight:800,color:"#e2e8f0"}}>{fUSD(totals.currentTotal)}</div>
        <div style={{fontSize:11,color:"#64748b",marginTop:4}}>{fARS(totals.currentTotal*mep)}</div>
      </div>
      <div style={{background:"linear-gradient(135deg,#065f4611,#0f172a)",border:"1px solid #34d39933",borderRadius:12,padding:20,textAlign:"center"}}>
        <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",marginBottom:6}}>Si llega a Máximos ({rangeLabel[range]})</div>
        <div style={{fontSize:22,fontWeight:800,color:"#34d399"}}>{fUSD(totals.maxTotal)}</div>
        <div style={{fontSize:14,fontWeight:700,color:"#34d399",marginTop:4}}>{fPct(totals.upsidePct)}</div>
        <div style={{fontSize:11,color:"#64748b",marginTop:2}}>+{fUSD(totals.maxTotal-totals.currentTotal)}</div>
      </div>
      <div style={{background:"linear-gradient(135deg,#7f1d1d11,#0f172a)",border:"1px solid #f8717133",borderRadius:12,padding:20,textAlign:"center"}}>
        <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",marginBottom:6}}>Si cae a Mínimos ({rangeLabel[range]})</div>
        <div style={{fontSize:22,fontWeight:800,color:"#f87171"}}>{fUSD(totals.minTotal)}</div>
        <div style={{fontSize:14,fontWeight:700,color:"#f87171",marginTop:4}}>{fPct(totals.downsidePct)}</div>
        <div style={{fontSize:11,color:"#64748b",marginTop:2}}>{fUSD(totals.minTotal-totals.currentTotal)}</div>
      </div>
    </div>}

    {/* Per-ticker analysis table */}
    {!loading&&analysis.length>0&&<Card title="Detalle por Activo" right={<span style={{fontSize:10,color:"#475569"}}>{rangeLabel[range]} · USD · Yahoo Finance</span>}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          {["Ticker","Precio Actual","Máx Período","Upside","Mín Período","Downside","Valor Actual","→ Máx","→ Mín"].map(h=><th key={h} style={{padding:"8px 8px",textAlign:h==="Ticker"?"left":"right",fontSize:10,fontWeight:600,color:"#64748b",textTransform:"uppercase",borderBottom:"1px solid #252d3d"}}>{h}</th>)}
        </tr></thead>
        <tbody>{analysis.map(a=>{
          return<tr key={a.ticker} style={{borderBottom:"1px solid #1e293b"}}>
            <td style={{padding:"8px",fontWeight:700,fontSize:13}}>
              <div>{a.ticker}</div>
              <div style={{fontSize:10,color:"#64748b"}}>{a.yfSym!==a.ticker?`(${a.yfSym}) `:""}{a.mercado==="BYMA"?"🇦🇷":"🇺🇸"} ×{a.cantidad.toLocaleString("es-AR")}</div>
            </td>
            <td style={{padding:"8px",textAlign:"right",fontSize:13,fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{fUSD(a.currentUSD)}</td>
            <td style={{padding:"8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>
              <div style={{fontSize:13,fontWeight:600}}>{fUSD(a.maxPrice)}</div>
              <div style={{fontSize:9,color:"#64748b"}}>{a.maxDate}</div>
            </td>
            <td style={{padding:"8px",textAlign:"right",fontSize:14,fontWeight:800,color:"#34d399"}}>{fPct(a.upsidePct)}</td>
            <td style={{padding:"8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>
              <div style={{fontSize:13,fontWeight:600}}>{fUSD(a.minPrice)}</div>
              <div style={{fontSize:9,color:"#64748b"}}>{a.minDate}</div>
            </td>
            <td style={{padding:"8px",textAlign:"right",fontSize:14,fontWeight:800,color:"#f87171"}}>{fPct(a.downsidePct)}</td>
            <td style={{padding:"8px",textAlign:"right",fontSize:12,fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{fUSD(a.posValueUSD)}</td>
            <td style={{padding:"8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>
              <div style={{fontSize:12,fontWeight:700,color:"#34d399"}}>{fUSD(a.valueAtMax)}</div>
              <div style={{fontSize:10,color:"#34d399"}}>+{fUSD(a.valueAtMax-a.posValueUSD)}</div>
            </td>
            <td style={{padding:"8px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>
              <div style={{fontSize:12,fontWeight:700,color:"#f87171"}}>{fUSD(a.valueAtMin)}</div>
              <div style={{fontSize:10,color:"#f87171"}}>{fUSD(a.valueAtMin-a.posValueUSD)}</div>
            </td>
          </tr>;
        })}</tbody>
        <tfoot><tr style={{borderTop:"2px solid #334155",background:"#111827"}}>
          <td style={{padding:"10px 8px",fontWeight:800,fontSize:13}}>TOTAL</td>
          <td></td><td></td>
          <td style={{padding:"10px 8px",textAlign:"right",fontSize:15,fontWeight:800,color:"#34d399"}}>{fPct(totals.upsidePct)}</td>
          <td></td>
          <td style={{padding:"10px 8px",textAlign:"right",fontSize:15,fontWeight:800,color:"#f87171"}}>{fPct(totals.downsidePct)}</td>
          <td style={{padding:"10px 8px",textAlign:"right",fontSize:13,fontWeight:800}}>{fUSD(totals.currentTotal)}</td>
          <td style={{padding:"10px 8px",textAlign:"right"}}>
            <div style={{fontSize:13,fontWeight:800,color:"#34d399"}}>{fUSD(totals.maxTotal)}</div>
            <div style={{fontSize:10,color:"#34d399"}}>+{fUSD(totals.maxTotal-totals.currentTotal)}</div>
          </td>
          <td style={{padding:"10px 8px",textAlign:"right"}}>
            <div style={{fontSize:13,fontWeight:800,color:"#f87171"}}>{fUSD(totals.minTotal)}</div>
            <div style={{fontSize:10,color:"#f87171"}}>{fUSD(totals.minTotal-totals.currentTotal)}</div>
          </td>
        </tr></tfoot>
      </table>
    </Card>}

    {!loading&&analysis.length>0&&<div style={{fontSize:9,color:"#475569",fontStyle:"italic",textAlign:"center"}}>Datos históricos vía Yahoo Finance (v8 chart). Tickers BYMA mapeados a su equivalente NYSE/NASDAQ en USD. El potencial asume que el % de variación del subyacente aplica proporcionalmente a la posición. MEP ${new Intl.NumberFormat("es-AR",{maximumFractionDigits:0}).format(mep)}.</div>}
  </div>;
}

function loadLS(key,fallback){try{const v=localStorage.getItem("eid_"+key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function saveLS(key,val){try{localStorage.setItem("eid_"+key,JSON.stringify(val))}catch(e){}}

const INIT_CASA={precioCompra:0,anios:0,tasaAnual:0};
const INIT_HIPOTECA={uvas:0};

/* ── GIST SYNC ENGINE ───────────────────── */
const GIST_FILENAME="fin-cloud-data.json";

async function gistSave(token,gistId,data){
  const body={files:{[GIST_FILENAME]:{content:JSON.stringify(data,null,2)}}};
  const url=gistId
    ?`https://api.github.com/gists/${gistId}`
    :"https://api.github.com/gists";
  const method=gistId?"PATCH":"POST";
  if(!gistId) body.description="Fin-Cloud Dashboard Data (auto-sync)";
  if(!gistId) body.public=false;
  const res=await fetch(url,{method,headers:{"Authorization":`token ${token}`,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok) throw new Error(`GitHub ${res.status}`);
  return res.json();
}

async function gistLoad(token,gistId){
  const res=await fetch(`https://api.github.com/gists/${gistId}`,{headers:{"Authorization":`token ${token}`}});
  if(!res.ok) throw new Error(`GitHub ${res.status}`);
  const g=await res.json();
  const content=g.files[GIST_FILENAME]?.content;
  return content?JSON.parse(content):null;
}

        {tgStatus&&<div style={{fontSize:13,padding:"8px 12px",borderRadius:6,background:tgStatus.startsWith("✅")?"#065f4622":"#7f1d1d22",color:tgStatus.startsWith("✅")?"#34d399":"#f87171"}}>{tgStatus}</div>}
        <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:4}}>
          <button onClick={onClose} style={{...btnSt,background:"#334155"}}>Cerrar</button>
          <button onClick={testTelegram} disabled={tgTesting||!tgToken||!tgChatId} style={{...btnSt,opacity:tgTesting||!tgToken||!tgChatId?.5:1}}>{tgTesting?"Enviando...":"Enviar Mensaje de Prueba"}</button>
        </div>
      </div>}

}

/* ── APP ─────────────────────────────────── */
function App(){
  const [tab,setTab]=useState("resumen");
  const [ops,setOps]=useState(()=>loadLS("ops",INIT_OPS));
  const [alerts,setAlerts]=useState(()=>loadLS("alerts",[]));
  const [prices,setPrices]=useState(LIVE_FALLBACK);
  const [macro,setMacro]=useState(()=>{
    /* Intentar cargar macro cacheado de localStorage para no arrancar en 0 */
    try{const c=JSON.parse(localStorage.getItem("eid_macro_prev")||"{}");return Object.keys(c).length>3?{...MACRO_FALLBACK,...c}:MACRO_FALLBACK;}catch(e){return MACRO_FALLBACK;}
  });
  const [macroPrev,setMacroPrev]=useState(()=>{try{return JSON.parse(localStorage.getItem("eid_macro_prev")||"{}")}catch(e){return{}}});
  const [news,setNews]=useState(NEWS_FALLBACK);
  const [lastUp,setLastUp]=useState(new Date());
  const [dataSource,setDataSource]=useState("cargando..."); /* live | fallback | cargando */
  const [showConfig,setShowConfig]=useState(false);
  const [syncStatus,setSyncStatus]=useState("idle"); /* idle | syncing | ok | error */
  const [lastSync,setLastSync]=useState(null);
  const syncTimer=React.useRef(null);
  const isFirstLoad=React.useRef(true);

  /* Inmobiliario + Caución */
  const [casa,setCasa]=useState(()=>loadLS("casa",INIT_CASA));
  const [hipoteca,setHipoteca]=useState(()=>loadLS("hipoteca",INIT_HIPOTECA));
  const [caucion,setCaucion]=useState(()=>loadLS("caucion",INIT_CAUCION));

  /* ── Price Alerts System ── */
  /* Alert: {id, ticker, mercado, condition:"above"|"below", price, active, label, createdAt, triggeredAt} */
  const [priceAlerts,setPriceAlerts]=useState(()=>loadLS("price_alerts",[]));

  const addPriceAlert=useCallback((alert)=>{
    setPriceAlerts(prev=>[{id:Date.now(),...alert,active:true,createdAt:new Date().toISOString(),triggeredAt:null},...prev]);
  },[]);

  const removePriceAlert=useCallback((id)=>{
    setPriceAlerts(prev=>prev.filter(a=>a.id!==id));
  },[]);

  const togglePriceAlert=useCallback((id)=>{
    setPriceAlerts(prev=>prev.map(a=>a.id===id?{...a,active:!a.active}:a));
  },[]);

  /* Send Telegram message */
  const sendTelegram=useCallback(async(msg)=>{
    const token=loadLS("tg_token","");
    const chatId=loadLS("tg_chat_id","");
    if(!token||!chatId)return;
    const url=`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}`;
    try{await fetch(url);return;}catch(e){}
    try{await fetch(PROXY+encodeURIComponent(url));return;}catch(e){}
    try{await fetch("https://corsproxy.io/?"+encodeURIComponent(url));}catch(e){console.warn("Telegram send failed — all proxies tried");}
  },[]);

  /* Send browser notification */
  const sendBrowserNotif=useCallback((title,body)=>{
    if(!("Notification" in window))return;
    if(Notification.permission==="granted"){
      new Notification(title,{body,icon:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>"});
    }else if(Notification.permission!=="denied"){
      Notification.requestPermission();
    }
  },[]);

  /* Check alerts against current prices — runs every 60s */
  const checkAlerts=useCallback(()=>{
    if(priceAlerts.length===0)return;
    const mep=macro.dolarMEP||1;
    setPriceAlerts(prev=>{
      let changed=false;
      const updated=prev.map(a=>{
        if(!a.active)return a;
        const pd=prices[a.ticker];
        if(!pd)return a;
        const isBYMA=a.mercado==="BYMA";
        const currentPrice=isBYMA?(pd.priceARS||0):(pd.price||0);
        if(currentPrice<=0)return a;
        const triggered=(a.condition==="above"&&currentPrice>=a.price)||(a.condition==="below"&&currentPrice<=a.price);
        if(triggered){
          changed=true;
          const dir=a.condition==="above"?"⬆️ SUBE":"⬇️ BAJA";
          const priceStr=isBYMA?`$${currentPrice.toLocaleString("es-AR")}`:`USD ${currentPrice.toFixed(2)}`;
          const targetStr=isBYMA?`$${a.price.toLocaleString("es-AR")}`:`USD ${a.price.toFixed(2)}`;
          const msg=`${dir} ${a.ticker} ${a.condition==="above"?"superó":"cayó a"} ${targetStr} → Precio actual: ${priceStr}${a.label?" | "+a.label:""}`;
          /* Browser notification */
          sendBrowserNotif(`🚨 Alerta ${a.ticker}`,msg);
          /* Telegram */
          sendTelegram(`🚨 TRADE ALERT\n${msg}`);
          /* Play sound */
          try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;o.type="sine";g.gain.value=0.3;o.start();setTimeout(()=>{o.stop();ctx.close()},300);}catch(e){}
          return{...a,active:false,triggeredAt:new Date().toISOString()};
        }
        return a;
      });
      return changed?updated:prev;
    });
  },[prices,macro,sendTelegram,sendBrowserNotif]);

  /* Alert monitoring interval — every 60 seconds */
  useEffect(()=>{
    /* Request notification permission on mount */
    if("Notification" in window&&Notification.permission==="default"){Notification.requestPermission();}
    const iv=setInterval(checkAlerts,60000);
    checkAlerts(); /* check immediately on mount/price change */
    return()=>clearInterval(iv);
  },[checkAlerts]);

  /* Persistir en localStorage siempre */
  useEffect(()=>{saveLS("ops",ops)},[ops]);
  useEffect(()=>{saveLS("alerts",alerts)},[alerts]);
  useEffect(()=>{saveLS("price_alerts",priceAlerts)},[priceAlerts]);
  useEffect(()=>{saveLS("casa",casa)},[casa]);
  useEffect(()=>{saveLS("hipoteca",hipoteca)},[hipoteca]);
  useEffect(()=>{saveLS("caucion",caucion)},[caucion]);

  /* ── Auto-load desde Gist al abrir ──── */
  useEffect(()=>{
    const token=loadLS("gh_token","");
    const gistId=loadLS("gist_id","");
    if(!token||!gistId){isFirstLoad.current=false;return;}
    setSyncStatus("syncing");
    gistLoad(token,gistId).then(d=>{
      if(d){
        if(d.ops)setOps(d.ops);
        if(d.alerts)setAlerts(d.alerts);
        if(d.casa)setCasa(d.casa);
        if(d.hipoteca)setHipoteca(d.hipoteca);
        if(d.caucion)setCaucion(d.caucion);
      }
      setSyncStatus("ok");setLastSync(new Date());
      setTimeout(()=>{isFirstLoad.current=false},500);
    }).catch(()=>{setSyncStatus("error");isFirstLoad.current=false});
  },[]);

  /* ── Auto-save a Gist con debounce de 3s ──── */
  const doGistSave=useCallback(()=>{
    const token=loadLS("gh_token","");
    if(!token)return;
    const gistId=loadLS("gist_id","");
    const data={ops,alerts,casa,hipoteca,caucion,lastSaved:new Date().toISOString()};
    setSyncStatus("syncing");
    gistSave(token,gistId,data).then(g=>{
      if(!gistId&&g.id){saveLS("gist_id",g.id)}
      setSyncStatus("ok");setLastSync(new Date());
    }).catch(()=>setSyncStatus("error"));
  },[ops,alerts,casa,hipoteca,caucion]);

  useEffect(()=>{
    if(isFirstLoad.current)return;
    const token=loadLS("gh_token","");
    if(!token)return;
    if(syncTimer.current)clearTimeout(syncTimer.current);
    syncTimer.current=setTimeout(doGistSave,3000);
    return()=>{if(syncTimer.current)clearTimeout(syncTimer.current)};
  },[ops,alerts,casa,hipoteca,caucion,doGistSave]);

  /* Exportar datos como JSON (backup local) */
  const exportData=useCallback(()=>{
    const data={ops,alerts,casa,hipoteca,caucion,exportDate:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="fin-cloud-backup-"+new Date().toISOString().slice(0,10)+".json";
    a.click();URL.revokeObjectURL(url);
  },[ops,alerts,casa,hipoteca,caucion]);

  /* Resetear — limpia todo a vacío */
  const resetData=useCallback(()=>{
    if(!confirm("¿Estás seguro? Esto borra todas tus operaciones, alertas y configuración."))return;
    setOps([]);setAlerts([]);setCasa({precioCompra:0,anios:0,tasaAnual:0});setHipoteca({uvas:0});setCaucion({montoARS:0,tna:21,dias:1});
  },[]);

  /* Posiciones derivadas 100% de operaciones */
  const posRaw=useMemo(()=>calcPositions(ops),[ops]);
  const [metaCache,setMetaCache]=useState(()=>loadMetaCache());
  const pos=useMemo(()=>applyMeta(posRaw,prices,metaCache),[posRaw,prices,metaCache]);

  /* Cálculos inmobiliarios */
  const casaActual=useMemo(()=>{
    const val=casa.precioCompra*Math.pow(1+casa.tasaAnual/100,casa.anios);
    const pl=val-casa.precioCompra;
    const rend=(pl/casa.precioCompra)*100;
    return{valor:val,pl,rend};
  },[casa]);
  const deudaUSD=useMemo(()=>{
    const deudaARS=hipoteca.uvas*macro.uva;
    return deudaARS/macro.dolarMEP;
  },[hipoteca,macro]);

  /* ── Helpers: mercado abierto? ──── */
  const isMarketOpen=useCallback(()=>{
    const now=new Date();
    const day=now.getDay();
    if(day===0||day===6)return{byma:false,nyse:false,any:false};
    /* BYMA: Lun-Vie 11:00-17:00 ART (UTC-3) */
    const artH=now.getUTCHours()-3;const artM=now.getUTCMinutes();
    const artMin=artH*60+artM;
    const byma=artMin>=660&&artMin<1020; /* 11:00-17:00 */
    /* NYSE: Lun-Vie 9:30-16:00 ET (UTC-4 o UTC-5 DST) */
    const etOff=(() => {const jan=new Date(now.getFullYear(),0,1).getTimezoneOffset();const jul=new Date(now.getFullYear(),6,1).getTimezoneOffset();const isDST=now.getTimezoneOffset()<Math.max(jan,jul);return isDST?-4:-5;})();
    const etH=now.getUTCHours()+etOff;const etM=now.getUTCMinutes();
    const etMin=etH*60+etM;
    const nyse=etMin>=570&&etMin<960; /* 9:30-16:00 */
    return{byma,nyse,any:byma||nyse};
  },[]);

  /* ── Fetch separados: precios vs macro+noticias ──── */
  const allTickers=useMemo(()=>[...new Set(ops.map(o=>o.ticker))],[ops]);

  const updateMacro=useCallback((macroData)=>{
    setMacro(macroData);
    try{
      const todayStr=new Date().toISOString().split("T")[0];
      const prev=JSON.parse(localStorage.getItem("eid_macro_prev")||"{}");
      if(prev._date!==todayStr){
        const cur=JSON.parse(localStorage.getItem("eid_macro_cur")||"null");
        if(cur)localStorage.setItem("eid_macro_prev",JSON.stringify({...cur,_date:todayStr}));
      }
      localStorage.setItem("eid_macro_cur",JSON.stringify(macroData));
      setMacroPrev(JSON.parse(localStorage.getItem("eid_macro_prev")||"{}"));
    }catch(e){}
  },[]);

  const updatePrices=useCallback((priceData)=>{
    if(priceData&&Object.keys(priceData).length>0){
      setPrices(prev=>{const merged={...prev,...priceData};savePriceCache(merged);return merged;});
      setDataSource("live");
      refreshMetaCache(allTickers,priceData).then(cache=>setMetaCache({...cache}));
    }else{setDataSource("fallback")}
  },[allTickers]);

  /* Fetch completo (carga inicial) */
  const fetchAllData=useCallback(async()=>{
    const[macroData,priceData,newsData]=await Promise.all([
      fetchMacroReal(),fetchPricesReal(allTickers),fetchNewsReal(allTickers)
    ]);
    updateMacro(macroData);
    updatePrices(priceData);
    if(newsData){setNews(newsData);saveNewsCache(newsData);}
    setLastUp(new Date());
  },[allTickers,updateMacro,updatePrices]);

  /* Fetch solo precios (cada 60s en horario de mercado) */
  const fetchPricesOnly=useCallback(async()=>{
    if(!isMarketOpen().any)return;
    const priceData=await fetchPricesReal(allTickers);
    updatePrices(priceData);
    setLastUp(new Date());
  },[allTickers,updatePrices,isMarketOpen]);

  /* Fetch macro+noticias (cada 5 min en horario de mercado) */
  const fetchMacroNews=useCallback(async()=>{
    if(!isMarketOpen().any)return;
    const[macroData,newsData]=await Promise.all([fetchMacroReal(),fetchNewsReal(allTickers)]);
    updateMacro(macroData);
    if(newsData){setNews(newsData);saveNewsCache(newsData);}
    setLastUp(new Date());
  },[allTickers,updateMacro,isMarketOpen]);

  useEffect(()=>{
    fetchAllData(); /* carga inicial siempre */
    const ivPrices=setInterval(fetchPricesOnly,60000);    /* precios cada 60s */
    const ivMacro=setInterval(fetchMacroNews,300000);     /* macro+news cada 5 min */
    return()=>{clearInterval(ivPrices);clearInterval(ivMacro);};
  },[fetchAllData,fetchPricesOnly,fetchMacroNews]);

  /* ── IOL: fetch tasas de caución (pesos/USD, 1D/30D) ── */
  const [iolStatus,setIolStatus]=useState(()=>{
    const cached=loadLS("iol_caucion",null);
    if(cached&&(cached.pesos1d!=null||cached.tna!=null)){
      return{pesos1d:cached.pesos1d||cached.tna,pesos30d:cached.pesos30d,usd1d:cached.usd1d,usd30d:cached.usd30d,ts:cached.ts,status:"cached"};
    }
    return{pesos1d:null,pesos30d:null,usd1d:null,usd30d:null,ts:null,status:"idle"};
  });

  const fetchCaucionRate=useCallback(async()=>{
    const creds=loadLS("iol_creds",null);
    if(!creds){
      setIolStatus(s=>({...s,status:"idle"}));
      return;
    }
    setIolStatus(s=>({...s,status:"fetching"}));
    try{
      const rates=await iolFetchCaucionRate();
      if(rates!=null){
        setIolStatus({pesos1d:rates.pesos1d,pesos30d:rates.pesos30d,usd1d:rates.usd1d,usd30d:rates.usd30d,ts:Date.now(),status:"ok"});
        if(rates.pesos1d!=null)setCaucion(c=>({...c,tna:Math.round(rates.pesos1d*10)/10}));
      }else{
        const cached=loadLS("iol_caucion",null);
        if(cached&&(cached.pesos1d||cached.tna)&&(Date.now()-cached.ts)<3600000){
          setIolStatus({pesos1d:cached.pesos1d||cached.tna,pesos30d:cached.pesos30d,usd1d:cached.usd1d,usd30d:cached.usd30d,ts:cached.ts,status:"cached"});
        }else{
          setIolStatus(s=>({...s,status:"error",msg:window._iolLastError||"Sin datos de caución"}));
        }
      }
    }catch(e){
      setIolStatus(s=>({...s,status:"error",msg:e.message||"Error de conexión"}));
    }
  },[setCaucion]);

  useEffect(()=>{
    fetchCaucionRate();
    /* Refresh every 5 min during BYMA hours */
    const iv=setInterval(()=>{if(isMarketOpen().byma)fetchCaucionRate()},300000);
    return()=>clearInterval(iv);
  },[fetchCaucionRate,isMarketOpen]);

  const enriched=useMemo(()=>pos.map(p=>{
    const l=prices[p.ticker]||{price:p.ppc,change:0};
    /* BM: precio = CEDEAR ARS / CCL → refleja valor real en tu broker */
    const ccl=macro.dolarCCL||1;
    const precioUSD=(p.broker==="BM"&&l.priceARS)?l.priceARS/ccl:l.price;
    const varPct=(p.broker==="BM"&&l.changeARS!=null)?l.changeARS:l.change;
    const mi=p.cantidad*p.ppc;const ma=p.cantidad*precioUSD;const pl=ma-mi;const r=mi>0?(pl/mi)*100:0;
    const comCompra=calcComision(mi,p.broker,p.tipo);
    const comVenta=calcComision(ma,p.broker,p.tipo);
    const comTotal=comCompra+comVenta;
    const plNeto=pl-comTotal;
    const rendNeto=mi>0?((ma-comVenta-(mi+comCompra))/(mi+comCompra))*100:0;
    return{...p,precioActual:precioUSD,variacion:varPct,montoInvertido:mi,montoActual:ma,pl,rendimiento:r,priceARS:l.priceARS||null,changeARS:l.changeARS||null,comCompra,comVenta,comTotal,plNeto,rendNeto};
  }),[pos,prices,macro]);

  const portfolioTotal=useMemo(()=>enriched.reduce((s,p)=>s+p.montoActual,0),[enriched]);
  const invertido=useMemo(()=>enriched.reduce((s,p)=>s+p.montoInvertido,0),[enriched]);
  const caucionUSD=caucion.montoARS>0?caucion.montoARS/macro.dolarMEP:0;
  const portfolioLiquido=portfolioTotal-caucionUSD;
  const totalComVenta=useMemo(()=>enriched.reduce((s,p)=>s+p.comVenta,0),[enriched]);
  const portfolioNeto=portfolioLiquido-totalComVenta; /* lo que queda en mano si vendés todo */
  const pl=portfolioTotal-invertido;const rend=invertido>0?(pl/invertido)*100:0;
  const trigAlerts=useMemo(()=>alerts.filter(a=>a.active&&prices[a.ticker]&&(a.condition==="above"?prices[a.ticker].price>=a.price:prices[a.ticker].price<=a.price)),[alerts,prices]);

  /* Variación diaria del P&L */
  const dailyPL=useMemo(()=>{
    const monto=enriched.reduce((s,p)=>s+p.montoActual*(p.variacion/100),0);
    const pct=portfolioTotal>0?(monto/portfolioTotal)*100:0;
    return{monto,pct};
  },[enriched,portfolioTotal]);

  /* Patrimonio total incluyendo inmueble neto - caución */
  const patrimonioNeto=portfolioTotal+casaActual.valor-deudaUSD-caucionUSD;

  const tabs=[{id:"resumen",label:"Resumen",emoji:"🏠"},{id:"operaciones",label:"Operaciones",emoji:"📝"},{id:"noticias",label:"Noticias",emoji:"📰"},{id:"caucion",label:"Caución",emoji:"🏦"},{id:"trading",label:"Trading",emoji:"⚡"},{id:"potencial",label:"Potencial",emoji:"🎯"}];

  return <div style={{minHeight:"100vh"}}>
    <header style={{background:"linear-gradient(90deg,#111827,#1e293b)",borderBottom:"1px solid #1e293b",padding:"12px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <div style={{fontSize:28,lineHeight:1,flexShrink:0}}>🐻⚔️🐂</div>
        <div>
          <h1 className="hdr-title" style={{margin:0,fontSize:18,fontWeight:700,color:"#f1f5f9",letterSpacing:"-.02em"}}>Dashboard de Eze 🇦🇷</h1>
          <div style={{fontSize:11,color:"#64748b"}}>Actualizado: {lastUp.toLocaleTimeString("es-AR")}</div>
          <div style={{display:"flex",gap:10,fontSize:10,marginTop:2}}>
            <span>Data: <span style={{color:dataSource==="live"?"#34d399":dataSource==="fallback"?"#fbbf24":"#64748b",fontWeight:600}}>{dataSource==="live"?"Online":dataSource==="fallback"?"Offline":"⏳"}</span></span>
            {(()=>{const now=new Date();const utc=now.getTime()+now.getTimezoneOffset()*60000;const art=new Date(utc-3*3600000);const h=art.getHours();const d=art.getDay();const bymaOn=d>=1&&d<=5&&h>=11&&h<17;return <span>BYMA: <span style={{color:bymaOn?"#34d399":"#f87171",fontWeight:600}}>{bymaOn?"Online":"Offline"}</span></span>;})()}
            {(()=>{const now=new Date();const utc=now.getTime()+now.getTimezoneOffset()*60000;const et=new Date(utc-4*3600000);const h=et.getHours();const m=et.getMinutes();const d=et.getDay();const t=h*60+m;const nyseOn=d>=1&&d<=5&&t>=570&&t<960;return <span>NYSE: <span style={{color:nyseOn?"#34d399":"#f87171",fontWeight:600}}>{nyseOn?"Online":"Offline"}</span></span>;})()}
          </div>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <div className="macro-strip" style={{display:"flex",gap:12,fontSize:12}}>
          {(()=>{
            const of1=macro.dolarOficial;
            const bMEP=((macro.dolarMEP-of1)/of1*100).toFixed(1);
            const bCCL=((macro.dolarCCL-of1)/of1*100).toFixed(1);
            const bBlue=((macro.dolarBlue-of1)/of1*100).toFixed(1);
            const bTarjeta=((macro.dolarTarjeta-of1)/of1*100).toFixed(1);
            const mp=macroPrev;
            const dVar=(cur,prev)=>{if(!prev||!cur||prev===0)return null;return((cur-prev)/prev*100);};
            const fVar=v=>{if(v==null)return null;return`${v>=0?"+":""}${v.toFixed(1)}%`;};
            return[
              {l:"Oficial",v:`$${fmt(of1)}`,sub:"Brecha",daily:fVar(dVar(of1,mp.dolarOficial))},
              {l:"MEP",v:`$${fmt(macro.dolarMEP)}`,brecha:bMEP,daily:fVar(dVar(macro.dolarMEP,mp.dolarMEP))},
              {l:"CCL",v:`$${fmt(macro.dolarCCL)}`,brecha:bCCL,daily:fVar(dVar(macro.dolarCCL,mp.dolarCCL))},
              {l:"Blue",v:`$${fmt(macro.dolarBlue)}`,brecha:bBlue,daily:fVar(dVar(macro.dolarBlue,mp.dolarBlue))},
              {l:"Tarjeta",v:`$${fmt(macro.dolarTarjeta)}`,brecha:bTarjeta,daily:fVar(dVar(macro.dolarTarjeta,mp.dolarTarjeta))},
              {l:"Riesgo País",v:String(macro.riesgoPais)+" bp",daily:fVar(dVar(macro.riesgoPais,mp.riesgoPais))},
              {l:"Reservas",v:`USD ${fmt(macro.reservas,0)}M`,daily:fVar(dVar(macro.reservas,mp.reservas))},
              {l:"Inflación",v:`${fmt(macro.inflacion,1)}%`,sub:"mensual"},
              {l:"Infl. IA",v:`${fmt(macro.inflacionIA,1)}%`,sub:"interanual"},
              {l:"Tasa PM",v:`${fmt(macro.tasa,1)}%`,daily:fVar(dVar(macro.tasa,mp.tasa))},
              {l:"UVA",v:`$${fmt(macro.uva,2)}`,sub:macro.uvaVar30d?`30d: ${macro.uvaVar30d>0?"+":""}${macro.uvaVar30d.toFixed(1)}%`:null,daily:fVar(dVar(macro.uva,mp.uva))}
            ].map(i=><div key={i.l} style={{textAlign:"center",minWidth:48}}>
              <div style={{color:"#475569",marginBottom:1,whiteSpace:"nowrap"}}>{i.l}</div>
              <div style={{fontWeight:600,color:"#94a3b8",fontVariantNumeric:"tabular-nums",whiteSpace:"nowrap"}}>{i.v}</div>
              <div style={{fontSize:10,color:"#64748b",fontWeight:500,minHeight:14}}>{i.brecha?`${i.brecha>=0?"+":""}${i.brecha}%`:i.sub||"\u00A0"}</div>
              <div style={{fontSize:9,fontWeight:500,minHeight:13,color:i.daily?(i.daily.startsWith("+")?"#34d399":i.daily.startsWith("-")?"#f87171":"#64748b"):"transparent"}}>{i.daily||"\u00A0"}</div>
            </div>);
          })()}
        </div>
      </div>
    </header>
    <nav className="nav-bar" style={{background:"#111827",borderBottom:"1px solid #1e293b",display:"flex",gap:0,padding:"0 20px",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",gap:0}}>
        {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{background:"none",border:"none",color:tab===t.id?"#60a5fa":"#64748b",padding:"12px 16px",cursor:"pointer",fontSize:13,fontWeight:tab===t.id?600:400,borderBottom:tab===t.id?"2px solid #2563eb":"2px solid transparent",display:"flex",alignItems:"center",gap:6,transition:"all .15s",whiteSpace:"nowrap"}}>{t.emoji} {t.label}</button>)}
      </div>
      <div style={{display:"flex",gap:6,alignItems:"center",paddingRight:4}}>
        {syncStatus==="syncing"&&<span style={{fontSize:11,color:"#fbbf24",animation:"pulse 1s infinite"}}>⏳ Sincronizando...</span>}
        {syncStatus==="ok"&&<span style={{fontSize:11,color:"#34d399"}} title={lastSync?"Último sync: "+lastSync.toLocaleTimeString("es-AR"):""}>☁️ Sync OK</span>}
        {syncStatus==="error"&&<span style={{fontSize:11,color:"#f87171"}}>⚠ Error sync</span>}
        {syncStatus==="idle"&&!loadLS("gh_token","")&&<span style={{fontSize:11,color:"#64748b"}}>☁️ Sin sync</span>}
        <button onClick={()=>setShowConfig(true)} title="Configurar sincronización" style={{background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>⚙️ Sync</button>
        <button onClick={exportData} title="Backup local JSON" style={{background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>💾</button>
        <button onClick={resetData} title="Resetear datos" style={{background:"#1e293b",border:"1px solid #7f1d1d44",color:"#f87171",borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>🔄</button>
      </div>
    </nav>
    {showConfig&&<SyncConfigPanel onClose={()=>setShowConfig(false)}/>}
    <main className="main-content" style={{padding:24,maxWidth:1400,margin:"0 auto"}}>
      {tab==="resumen"&&<Resumen enriched={enriched} total={portfolioTotal} invertido={invertido} pl={pl} rend={rend} macro={macro} ops={ops} trigAlerts={trigAlerts} prices={prices} casa={casa} setCasa={setCasa} casaActual={casaActual} hipoteca={hipoteca} setHipoteca={setHipoteca} deudaUSD={deudaUSD} patrimonioNeto={patrimonioNeto} caucion={caucion} setCaucion={setCaucion} caucionUSD={caucionUSD} portfolioLiquido={portfolioLiquido} portfolioTotal={portfolioTotal} dailyPL={dailyPL} news={news} portfolioNeto={portfolioNeto} totalComVenta={totalComVenta}/>}
      {tab==="operaciones"&&<Operaciones ops={ops} setOps={setOps} macro={macro} enriched={enriched}/>}
      {tab==="trading"&&<Trading macro={macro} prices={prices} pos={pos} priceAlerts={priceAlerts} addPriceAlert={addPriceAlert} removePriceAlert={removePriceAlert} togglePriceAlert={togglePriceAlert} onOpenConfig={()=>setShowConfig(true)}/>}
      {tab==="potencial"&&<Potencial pos={pos} prices={prices} macro={macro}/>}
      {tab==="noticias"&&<Noticias pos={pos} news={news}/>}
      {tab==="caucion"&&<Caucion caucion={caucion} setCaucion={setCaucion} iolStatus={iolStatus} fetchCaucionRate={fetchCaucionRate}/>}
    </main>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
